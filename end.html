<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#03080f">
  <title>ENDORPHIN | ХОЧЕШЬ ЕЩЁ?</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=JetBrains+Mono:wght@700;900&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --bg-deep: #03080f;
      --bg-mid: #0a2540;
      --ice: #7fe3ff;
      --ice-bright: #22d3ee;
      --amber: #fbbf24;
      --text-dim: rgba(168, 230, 255, 0.7);
      --text-dimmer: rgba(168, 230, 255, 0.4);
    }

    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at 50% 0%, var(--bg-mid) 0%, var(--bg-deep) 70%);
      font-family: 'Montserrat', sans-serif;
      color: #fff;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      mix-blend-mode: overlay;
    }

    .inner {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 1.4rem;
      max-width: 640px;
      width: 100%;
    }

    /* Логотип */
    .logo-wrap {
      width: clamp(200px, 50vw, 360px);
      filter: drop-shadow(0 0 30px rgba(34, 211, 238, 0.35));
    }
    .logo-wrap svg { width: 100%; height: auto; display: block; }

    /* Заголовок */
    .title {
      font-size: clamp(2.6rem, 10vw, 5rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.02em;
      background: linear-gradient(180deg, #ffffff 0%, #a8e6ff 55%, #22d3ee 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow:
        0 0 40px rgba(34, 211, 238, 0.4),
        0 0 80px rgba(34, 211, 238, 0.15);
    }

    /* Подзаголовок */
    .subtitle {
      font-size: clamp(0.7rem, 1.6vw, 0.9rem);
      font-weight: 700;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--text-dimmer);
      padding-left: 0.42em;
    }

    /* Текст-инструкция */
    .hint {
      font-size: clamp(0.95rem, 2vw, 1.15rem);
      font-weight: 700;
      color: var(--ice);
      letter-spacing: 0.03em;
      line-height: 1.6;
      margin-top: 0.6rem;
      max-width: 420px;
    }
    .hint .big {
      display: block;
      font-size: clamp(1.1rem, 2.4vw, 1.4rem);
      font-weight: 900;
      color: #fff;
      margin-bottom: 0.6rem;
      letter-spacing: 0.06em;
    }
    .hint .amber {
      color: var(--amber);
    }

    /* Футер */
    .footer {
      font-size: 0.65rem;
      color: var(--text-dimmer);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-top: 2rem;
      opacity: 0.7;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <div class="inner">

    <div class="logo-wrap" aria-label="ENDORPHIN">
      <svg viewBox="0 0 600 120" xmlns="http://www.w3.org/2000/svg" role="img">
        <defs>
          <linearGradient id="logoGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="55%" stop-color="#a8e6ff"/>
            <stop offset="100%" stop-color="#22d3ee"/>
          </linearGradient>
          <filter id="logoGlow" x="-20%" y="-50%" width="140%" height="200%">
            <feGaussianBlur stdDeviation="5" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <text x="300" y="88"
              text-anchor="middle"
              font-family="Montserrat, sans-serif"
              font-weight="900"
              font-size="96"
              letter-spacing="-3"
              fill="url(#logoGrad)"
              stroke="rgba(127,227,255,0.35)"
              stroke-width="0.7"
              filter="url(#logoGlow)">ENDORPHIN</text>
      </svg>
    </div>

    <h1 class="title">ХОЧЕШЬ ЕЩЁ?</h1>
    <p class="subtitle">Снежный Баттл</p>

    <div class="hint">
      <span class="big">ОПЯТЬ ХОЧЕШЬ В БОЙ?</span>
      Попроси ведущего — он покажет <span class="amber">QR-код</span>.<br>
      Сканируй его и возвращайся играть!
    </div>

    <div class="footer">ENDORPHIN · СНЕЖНЫЙ БАТТЛ</div>

  </div>

</body>
</html>
