<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#03080f">
  <meta name="description" content="ЭНДОРФИН — Снежный Баттл. Хочешь ещё? Попроси QR у ведущего.">
  <title>ЭНДОРФИН | ХОЧЕШЬ ЕЩЁ?</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=JetBrains+Mono:wght@700;900&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --bg-deep: #03080f;
      --bg-mid: #0a2540;
      --ice: #7fe3ff;
      --ice-bright: #22d3ee;
      --amber: #fbbf24;
      --text-dimmer: rgba(168, 230, 255, 0.4);
    }

    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at 50% 0%, var(--bg-mid) 0%, var(--bg-deep) 70%);
      font-family: 'Montserrat', sans-serif;
      color: #fff;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      mix-blend-mode: overlay;
    }

    .inner {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 1.4rem;
      max-width: 640px;
      width: 100%;
    }

    .logo-wrap {
      width: clamp(200px, 50vw, 360px);
      filter: drop-shadow(0 0 30px rgba(34, 211, 238, 0.35));
    }
    .logo-wrap svg { width: 100%; height: auto; display: block; }

    .title {
      font-size: clamp(2.6rem, 10vw, 5rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.02em;
      background: linear-gradient(180deg, #ffffff 0%, #a8e6ff 55%, #22d3ee 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow:
        0 0 40px rgba(34, 211, 238, 0.4),
        0 0 80px rgba(34, 211, 238, 0.15);
    }

    .subtitle {
      font-size: clamp(0.7rem, 1.6vw, 0.9rem);
      font-weight: 700;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--text-dimmer);
      padding-left: 0.42em;
    }

    .hint {
      font-size: clamp(0.95rem, 2vw, 1.1rem);
      font-weight: 700;
      color: var(--ice);
      letter-spacing: 0.03em;
      line-height: 1.6;
      margin-top: 0.6rem;
      max-width: 400px;
    }
    .hint .amber { color: var(--amber); }

    /* Live-уведомление о новом QR */
    .qr-live-banner {
      display: none;
      background: rgba(34, 197, 94, 0.15);
      border: 2px solid rgba(34, 197, 94, 0.6);
      border-radius: 14px;
      padding: 12px 18px;
      max-width: 380px;
      width: 100%;
      animation: qrPulse 2s ease-in-out infinite;
    }
    .qr-live-banner.show { display: block; }
    .qr-live-banner .qr-live-title {
      font-size: 0.95rem;
      font-weight: 900;
      color: #22c55e;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
      text-shadow: 0 0 20px rgba(34, 197, 94, 0.5);
    }
    .qr-live-banner .qr-live-text {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.75);
      font-weight: 700;
    }
    @keyframes qrPulse {
      0%, 100% { box-shadow: 0 0 0 rgba(34, 197, 94, 0); }
      50% { box-shadow: 0 0 30px rgba(34, 197, 94, 0.4); }
    }

    .actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      margin-top: 1rem;
      width: 100%;
      max-width: 340px;
    }

    .action-btn {
      display: block;
      width: 100%;
      padding: 0.85rem 1rem;
      border-radius: 14px;
      font-weight: 900;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid transparent;
    }

    .action-btn.primary {
      background: linear-gradient(135deg, var(--ice-bright), #3d8bff);
      color: #000;
      box-shadow: 0 0 25px rgba(34, 211, 238, 0.4);
    }
    .action-btn.primary:hover { transform: translateY(-1px); box-shadow: 0 0 40px rgba(34, 211, 238, 0.7); }
    .action-btn.primary:active { transform: scale(0.98); }

    .action-btn.secondary {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.15);
      color: var(--ice);
    }
    .action-btn.secondary:hover { background: rgba(255,255,255,0.12); color: #fff; }
    .action-btn.secondary:active { transform: scale(0.98); }

    .footer {
      font-size: 0.65rem;
      color: var(--text-dimmer);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-top: 1.5rem;
      opacity: 0.7;
    }

    @media (max-height: 600px) {
      body { padding: 1rem; }
      .inner { gap: 0.8rem; }
      .logo-wrap { width: clamp(160px, 40vw, 240px); }
      .footer { margin-top: 0.8rem; }
      .hint { margin-top: 0.2rem; }
    }

    @media (max-height: 480px) {
      .logo-wrap { display: none; }
      .inner { gap: 0.6rem; }
      .title { font-size: clamp(2rem, 9vw, 3rem); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .qr-live-banner { animation: none; }
    }
  </style>
</head>
<body>

  <div class="inner">

    <div class="logo-wrap" aria-label="ЭНДОРФИН">
      <svg viewBox="0 0 600 120" xmlns="http://www.w3.org/2000/svg" role="img">
        <defs>
          <linearGradient id="logoGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="55%" stop-color="#a8e6ff"/>
            <stop offset="100%" stop-color="#22d3ee"/>
          </linearGradient>
          <filter id="logoGlow" x="-20%" y="-50%" width="140%" height="200%">
            <feGaussianBlur stdDeviation="5" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <text x="300" y="88"
              text-anchor="middle"
              font-family="Montserrat, sans-serif"
              font-weight="900"
              font-size="96"
              letter-spacing="-3"
              fill="url(#logoGrad)"
              stroke="rgba(127,227,255,0.35)"
              stroke-width="0.7"
              filter="url(#logoGlow)">ЭНДОРФИН</text>
      </svg>
    </div>

    <h1 class="title">ХОЧЕШЬ ЕЩЁ?</h1>
    <p class="subtitle">Снежный Баттл</p>

    <!-- Live-баннер, если ведущий уже показал QR -->
    <div class="qr-live-banner" id="qr-live-banner" role="status" aria-live="polite">
      <div class="qr-live-title">✅ Ведущий уже показывает QR!</div>
      <div class="qr-live-text">Сканируй код с экрана — и возвращайся в игру</div>
    </div>

    <p class="hint" id="hint-text">
      Попроси ведущего — он покажет <span class="amber">QR-код</span>.<br>
      Сканируй его и возвращайся играть.
    </p>

    <div class="actions">
      <a href="index.html" class="action-btn primary">🏠 НА ГЛАВНУЮ</a>
      <a href="#" id="refresh-btn" class="action-btn secondary">🔄 ОБНОВИТЬ</a>
    </div>

    <div class="footer">ЭНДОРФИН · СНЕЖНЫЙ БАТТЛ</div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCXIR5Tv8lB6ivcGRC3yt1SC66MM6T5b_M",
      authDomain: "endorphin-battle.firebaseapp.com",
      databaseURL: "https://endorphin-battle-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "endorphin-battle",
      storageBucket: "endorphin-battle.firebasestorage.app",
      messagingSenderId: "185259733030",
      appId: "1:185259733030:web:d72a89a436880973e636e7"
    };

    let app, db, gameRef;
    try {
      app = initializeApp(firebaseConfig);
      db = getDatabase(app);
      gameRef = ref(db, 'games/battle_1');
    } catch (e) {
      // Если Firebase упал — страница всё равно показывается
      console.error('Firebase init failed:', e);
    }

    const banner = document.getElementById('qr-live-banner');
    const hintText = document.getElementById('hint-text');

    // Авто-проверка: если ведущий уже показал QR (screen = 'qr' и status = 'lobby') —
    // показываем зелёный баннер, чтобы игрок не сидел в ожидании
    if (gameRef) {
      try {
        onValue(gameRef, (snap) => {
          const data = snap.val();
          if (!data) return;

          const isQRActive = data.status === 'lobby' && data.screen === 'qr';

          if (isQRActive) {
            banner.classList.add('show');
            hintText.innerHTML = 'Ведущий уже показывает <span class="amber">QR-код</span>.<br>Сканируй его с экрана TV!';
          } else {
            banner.classList.remove('show');
          }
        }, (err) => {
          // Тихо — не критично, страница работает и без live-статуса
          console.warn('QR live-check failed:', err);
        });
      } catch (e) {
        console.warn('QR live-check error:', e);
      }
    }

    // Кнопка «Обновить» — перезагружает страницу
    document.getElementById('refresh-btn').addEventListener('click', (e) => {
      e.preventDefault();
      location.reload();
    });
  </script>

</body>
</html>
