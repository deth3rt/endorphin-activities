<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ENDORPHIN | СНЕЖНЫЙ БАТТЛ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
    
    body { 
      background: radial-gradient(circle at 50% 0%, #0a2540 0%, #03080f 100%);
      font-family: 'Montserrat', sans-serif; 
      overflow: hidden; 
      user-select: none; 
      color: #fff;
    }

    /* Снежная буря */
    .snowflake { position: absolute; color: rgba(255, 255, 255, 0.8); font-size: 24px; animation: fall linear infinite; pointer-events: none; z-index: 0; filter: drop-shadow(0 0 10px #fff); }
    @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

    /* Стеклянные панели */
    .glass-panel {
      background: rgba(10, 37, 64, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(127, 227, 255, 0.3);
      box-shadow: 0 0 40px rgba(31, 143, 214, 0.2), inset 0 0 20px rgba(127, 227, 255, 0.1);
    }

    /* Снежок */
    .snowball { 
      position: absolute; width: 24px; height: 24px; border-radius: 50%; 
      background: radial-gradient(circle at 30% 30%, #fff, #7fe3ff); 
      box-shadow: 0 0 25px #7fe3ff, 0 0 50px rgba(127,227,255,0.5); 
      pointer-events: none; z-index: 20; transform: translate(-50%, -50%); 
    }
    
    /* Базы и крепости */
    .snow-fort { 
      background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(168,230,255,0.4)); 
      box-shadow: 0 10px 30px rgba(127,227,255,0.4), inset 0 -10px 20px rgba(0,0,0,0.1); 
      border-radius: 50%; position: absolute; border: 2px solid rgba(255,255,255,0.5);
    }
    
    /* Игроки */
    .player-dot { position: absolute; width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 45px; transform: translate(-50%, -50%); z-index: 10; transition: all 0.3s; }
    .player-red { background: rgba(239, 68, 68, 0.2); box-shadow: 0 0 40px #ef4444; border: 3px solid #ef4444; }
    .player-blue { background: rgba(59, 130, 246, 0.2); box-shadow: 0 0 40px #3b82f6; border: 3px solid #3b82f6; }
    
    /* Сердечки */
    .heart { filter: drop-shadow(0 0 15px #ef4444); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .heart.dead { filter: grayscale(1); opacity: 0.2; transform: scale(0.6); }
    
    /* Анимация выстрела (вспышка) */
    @keyframes flash { 0% { opacity: 0.8; } 100% { opacity: 0; } }
    .flash-effect { position: fixed; inset: 0; background: #fff; z-index: 50; pointer-events: none; animation: flash 0.4s ease-out forwards; }

    /* Текст МЕГАБРОСОК */
    @keyframes megaZoom { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } 50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; text-shadow: 0 0 100px #fbbf24, 0 0 50px #fbbf24; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
    .mega-text { 
      position: absolute; top: 50%; left: 50%; font-size: 140px; font-weight: 900; color: #fff; 
      text-shadow: 0 0 60px #fbbf24, 0 0 30px #fff; z-index: 100; pointer-events: none; 
      letter-spacing: 5px; text-transform: uppercase; animation: megaZoom 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; 
    }

    /* Кнопка старта */
    .btn-neon {
      background: linear-gradient(90deg, #3b82f6, #06b6d4);
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.6), inset 0 0 10px rgba(255,255,255,0.5);
      transition: all 0.3s ease;
    }
    .btn-neon:not(:disabled):hover { transform: scale(1.05); box-shadow: 0 0 50px rgba(59, 130, 246, 0.9), inset 0 0 20px rgba(255,255,255,0.8); }
    .btn-neon:disabled { filter: grayscale(1); cursor: not-allowed; opacity: 0.5; }
  </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center relative overflow-hidden">

  <div id="snow" class="fixed inset-0 pointer-events-none z-0"></div>

  <div id="tv-screen" class="flex-1 w-full h-full relative z-10">
    
    <!-- ЛОББИ -->
    <div id="lobby-view" class="absolute inset-0 flex flex-col items-center justify-center p-8 transition-opacity duration-500">
      
      <div class="text-center mb-12 animate-fade-in-down">
        <h1 class="text-8xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-blue-400 to-indigo-500 mb-2 drop-shadow-[0_0_30px_rgba(59,130,246,0.8)] tracking-tighter">
          ENDORPHIN
        </h1>
        <h2 class="text-4xl font-bold text-cyan-100 tracking-[0.3em] uppercase opacity-80">Снежный Баттл</h2>
      </div>
      
      <div class="flex gap-24 mb-16">
        <!-- КРАСНЫЕ -->
        <div class="glass-panel p-8 rounded-3xl flex flex-col items-center w-80 relative">
          <div class="absolute -top-6 w-full text-center">
            <span class="bg-red-500 text-white font-black px-6 py-2 rounded-full shadow-[0_0_20px_#ef4444]">КРАСНЫЕ</span>
          </div>
          <div class="bg-white p-4 rounded-2xl mt-4 shadow-[0_0_30px_rgba(255,255,255,0.3)]" id="qr-red"></div>
          <div id="players-red" class="mt-6 space-y-2 w-full text-center"></div>
        </div>
        
        <!-- VS -->
        <div class="flex flex-col items-center justify-center">
          <div class="text-5xl font-black text-white/50 italic">VS</div>
        </div>

        <!-- СИНИЕ -->
        <div class="glass-panel p-8 rounded-3xl flex flex-col items-center w-80 relative">
          <div class="absolute -top-6 w-full text-center">
            <span class="bg-blue-500 text-white font-black px-6 py-2 rounded-full shadow-[0_0_20px_#3b82f6]">СИНИЕ</span>
          </div>
          <div class="bg-white p-4 rounded-2xl mt-4 shadow-[0_0_30px_rgba(255,255,255,0.3)]" id="qr-blue"></div>
          <div id="players-blue" class="mt-6 space-y-2 w-full text-center"></div>
        </div>
      </div>

      <button id="btn-start" disabled class="btn-neon px-20 py-6 rounded-full text-3xl font-black text-white tracking-widest uppercase">
        НАЧАТЬ БОЙ
      </button>
      <p class="mt-6 text-cyan-200/50 text-lg font-semibold tracking-wider">ОЖИДАНИЕ ИГРОКОВ (МИНИМУМ 1 НА 1)</p>
    </div>

    <!-- СЦЕНА БИТВЫ -->
    <div id="battle-view" class="absolute inset-0 hidden z-10">
      
      <!-- Верхняя база -->
      <div class="absolute top-0 w-full h-[25%] bg-gradient-to-b from-[#0a2540]/80 to-transparent border-b-2 border-blue-400/30 flex justify-center">
         <div class="snow-fort w-[500px] h-[140px] top-[10px]"></div>
         <div id="blue-player-1" class="player-dot player-blue top-[60px] left-[40%]">🧍‍♂️</div>
         <div id="blue-player-2" class="player-dot player-blue top-[60px] left-[60%]">🧍‍♂️</div>
         
         <div class="absolute top-8 left-12 flex gap-4 glass-panel px-6 py-3 rounded-2xl">
           <div class="text-6xl heart" id="life-blue-1">❤️</div>
           <div class="text-6xl heart" id="life-blue-2">❤️</div>
           <div class="text-6xl heart" id="life-blue-3">❤️</div>
         </div>
      </div>

      <!-- Поле -->
      <div id="battlefield" class="absolute top-[25%] bottom-[25%] left-0 right-0 overflow-hidden"></div>

      <!-- Нижняя база -->
      <div class="absolute bottom-0 w-full h-[25%] bg-gradient-to-t from-[#0a2540]/80 to-transparent border-t-2 border-red-400/30 flex justify-center">
         <div class="snow-fort w-[500px] h-[140px] bottom-[10px]"></div>
         <div id="red-player-1" class="player-dot player-red bottom-[60px] left-[40%]">🧍‍♂️</div>
         <div id="red-player-2" class="player-dot player-red bottom-[60px] left-[60%]">🧍‍♂️</div>

         <div class="absolute bottom-8 right-12 flex gap-4 glass-panel px-6 py-3 rounded-2xl">
           <div class="text-6xl heart" id="life-red-1">❤️</div>
           <div class="text-6xl heart" id="life-red-2">❤️</div>
           <div class="text-6xl heart" id="life-red-3">❤️</div>
         </div>
      </div>
    </div>

    <!-- ПОБЕДА -->
    <div id="win-view" class="absolute inset-0 hidden flex-col items-center justify-center bg-black/80 backdrop-blur-xl z-40 transition-all duration-500">
      <h1 class="text-9xl font-black text-white mb-12 drop-shadow-[0_0_50px_rgba(255,255,255,0.5)] scale-anim" id="win-text">ПОБЕДА!</h1>
      <button onclick="resetGame()" class="px-16 py-6 rounded-full border-4 border-cyan-400 text-cyan-400 font-black text-3xl hover:bg-cyan-400 hover:text-black transition-all shadow-[0_0_30px_rgba(34,211,238,0.5)]">СЫГРАТЬ ЕЩЕ</button>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, update, remove, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCXIR5Tv8lB6ivcGRC3yt1SC66MM6T5b_M",
      authDomain: "endorphin-battle.firebaseapp.com",
      databaseURL: "https://endorphin-battle-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "endorphin-battle",
      storageBucket: "endorphin-battle.firebasestorage.app",
      messagingSenderId: "185259733030",
      appId: "1:185259733030:web:d72a89a436880973e636e7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const gameId = 'battle_1';
    const gameRef = ref(db, `games/${gameId}`);
    const currentUrl = window.location.href.split('?')[0];

    function drawQR(text, containerId) {
      const qr = qrcode(0, 'M');
      qr.addData(text);
      qr.make();
      document.getElementById(containerId).innerHTML = qr.createImgTag(6, 8);
    }
    drawQR(currentUrl + `play.html?game=${gameId}&team=red`, 'qr-red');
    drawQR(currentUrl + `play.html?game=${gameId}&team=blue`, 'qr-blue');

    set(gameRef, { status: 'lobby', lives: { red: 3, blue: 3 }, players: { red: {}, blue: {} } });

    onValue(gameRef, (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      const redPlayers = Object.values(data.players?.red || {});
      const bluePlayers = Object.values(data.players?.blue || {});
      
      document.getElementById('players-red').innerHTML = redPlayers.map(p => `<div class="text-red-300 font-bold text-xl bg-red-900/30 py-1 rounded border border-red-500/30">👤 ${p.name}</div>`).join('');
      document.getElementById('players-blue').innerHTML = bluePlayers.map(p => `<div class="text-blue-300 font-bold text-xl bg-blue-900/30 py-1 rounded border border-blue-500/30">👤 ${p.name}</div>`).join('');

      const btn = document.getElementById('btn-start');
      if (redPlayers.length >= 1 && bluePlayers.length >= 1 && data.status === 'lobby') {
        btn.disabled = false;
      } else if (data.status === 'lobby') {
        btn.disabled = true;
      }

      if (data.status === 'playing') {
        document.getElementById('lobby-view').classList.add('opacity-0', 'pointer-events-none');
        setTimeout(() => document.getElementById('lobby-view').classList.add('hidden'), 500);
        document.getElementById('battle-view').classList.remove('hidden');
      }

      if (data.status === 'finished') {
        const winView = document.getElementById('win-view');
        winView.classList.remove('hidden');
        winView.classList.add('flex');
        const winText = document.getElementById('win-text');
        if (data.winner === 'red') {
          winText.innerText = 'КРАСНЫЕ ПОБЕДИЛИ!';
          winText.className = 'text-9xl font-black text-red-500 mb-12 drop-shadow-[0_0_60px_#ef4444] scale-anim';
        } else if (data.winner === 'blue') {
          winText.innerText = 'СИНИЕ ПОБЕДИЛИ!';
          winText.className = 'text-9xl font-black text-blue-500 mb-12 drop-shadow-[0_0_60px_#3b82f6] scale-anim';
        } else {
          winText.innerText = 'НИЧЬЯ!';
          winText.className = 'text-9xl font-black text-white mb-12 drop-shadow-[0_0_60px_#fff] scale-anim';
        }
      }

      if (data.lives) {
        for (let i = 1; i <= 3; i++) {
          const heartRed = document.getElementById(`life-red-${i}`);
          const heartBlue = document.getElementById(`life-blue-${i}`);
          if (heartRed) heartRed.className = `text-6xl heart ${i > data.lives.red ? 'dead' : ''}`;
          if (heartBlue) heartBlue.className = `text-6xl heart ${i > data.lives.blue ? 'dead' : ''}`;
        }
      }
    });

    document.getElementById('btn-start').onclick = () => {
      update(gameRef, { status: 'playing' });
    };

    onValue(ref(db, `games/${gameId}/shots`), (snapshot) => {
      const shots = snapshot.val();
      if (!shots) return;
      
      Object.keys(shots).forEach(key => {
        const shot = shots[key];
        if (shot.animated) return;
        
        animateShot(shot.team, shot.power, shot.angle);
        update(ref(db, `games/${gameId}/shots/${key}`), { animated: true });
        setTimeout(() => remove(ref(db, `games/${gameId}/shots/${key}`)), 2000);
      });
    });

    function animateShot(team, power, angle) {
      const battlefield = document.getElementById('battlefield');
      const ball = document.createElement('div');
      ball.className = 'snowball';
      battlefield.appendChild(ball);

      const startX = window.innerWidth / 2;
      const startY = team === 'red' ? battlefield.offsetHeight : 0;
      const endY = team === 'red' ? 0 : battlefield.offsetHeight;
      
      const isMega = power > 90;
      const isHit = power >= 50 && power <= 90;
      const endX = (isMega || isHit) ? (window.innerWidth / 2) : (Math.random() > 0.5 ? window.innerWidth + 200 : -200);

      ball.style.left = startX + 'px';
      ball.style.top = startY + 'px';

      // Параболическая траектория через Web Animations API
      ball.animate([
        { left: startX + 'px', top: startY + 'px', transform: 'translate(-50%, -50%) scale(1)' },
        { left: (startX + endX) / 2 + 'px', top: (startY + endY) / 2 - 150 + 'px', transform: 'translate(-50%, -50%) scale(1.5)' }, // Высшая точка дуги
        { left: endX + 'px', top: endY + 'px', transform: 'translate(-50%, -50%) scale(1)' }
      ], { duration: 800, easing: 'cubic-bezier(0.25, 0.1, 0.25, 1)', fill: 'forwards' }).onfinish = () => {
        
        if ((isHit || isMega) && db) {
          // Эффект вспышки при попадании
          const flash = document.createElement('div');
          flash.className = 'flash-effect';
          document.body.appendChild(flash);
          setTimeout(() => flash.remove(), 400);

          onValue(gameRef, (snap) => {
            const data = snap.val();
            if (!data || data.status !== 'playing') return;
            
            const currentLives = { ...data.lives };
            if (team === 'red') currentLives.blue = Math.max(0, currentLives.blue - 1);
            else currentLives.red = Math.max(0, currentLives.red - 1);

            let winner = null;
            if (isMega) {
               winner = team;
               const megaDiv = document.createElement('div');
               megaDiv.className = 'mega-text';
               megaDiv.innerText = 'МЕГАБРОСОК!';
               document.body.appendChild(megaDiv);
               setTimeout(() => megaDiv.remove(), 2000);
            } else {
               if (currentLives.red <= 0) winner = 'blue';
               if (currentLives.blue <= 0) winner = 'red';
            }

            update(gameRef, { lives: currentLives, ...(winner ? { status: 'finished', winner } : {}) });
          }, { onlyOnce: true });
        }
        ball.remove();
      };
    }

    window.resetGame = () => {
      set(gameRef, { status: 'lobby', lives: { red: 3, blue: 3 }, players: { red: {}, blue: {} } });
      window.location.reload();
    };

    const snowBox = document.getElementById('snow');
    for (let i = 0; i < 60; i++) {
      const s = document.createElement('div');
      s.className = 'snowflake';
      s.innerText = '❄';
      s.style.left = Math.random() * 100 + '%';
      s.style.fontSize = (10 + Math.random() * 30) + 'px';
      s.style.animationDuration = (4 + Math.random() * 8) + 's';
      s.style.animationDelay = (-Math.random() * 10) + 's';
      s.style.opacity = Math.random() * 0.7 + 0.3;
      snowBox.appendChild(s);
    }
  </script>
</body>
</html>
