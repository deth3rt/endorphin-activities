<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#03080f">
    <meta name="description" content="ENDORPHIN — Снежный Баттл. Мультиплеерная игра для вечеринок.">
    <title>ENDORPHIN | ГЛАВНОЕ МЕНЮ</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=JetBrains+Mono:wght@700;900&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --bg-deep: #03080f;
            --bg-mid: #0a2540;
            --ice: #7fe3ff;
            --ice-bright: #22d3ee;
            --amber: #fbbf24;
            --red-team: #ff3b5c;
            --blue-team: #3d8bff;
            --text-dim: rgba(168, 230, 255, 0.7);
            --text-dimmer: rgba(168, 230, 255, 0.45);
            --glass-bg: rgba(10, 37, 64, 0.55);
            --glass-border: rgba(127, 227, 255, 0.28);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            background: radial-gradient(circle at 50% 0%, var(--bg-mid) 0%, var(--bg-deep) 70%);
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: 1rem;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            mix-blend-mode: overlay;
        }

        #snow-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .menu-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 1rem;
            width: 100%;
            max-width: 1100px;
        }

        .logo-wrap {
            width: clamp(280px, 62vw, 560px);
            margin-bottom: 0.4rem;
            filter: drop-shadow(0 0 30px rgba(34, 211, 238, 0.35))
                    drop-shadow(0 0 70px rgba(34, 211, 238, 0.15));
            animation: logoFloat 5s ease-in-out infinite;
        }
        .logo-wrap svg { width: 100%; height: auto; display: block; }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-7px); }
        }

        .subtitle {
            font-size: clamp(0.8rem, 2.2vw, 1.15rem);
            font-weight: 700;
            letter-spacing: 0.42em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: clamp(1.8rem, 5vh, 3rem);
            padding-left: 0.42em;
        }

        .cards-grid {
            display: flex;
            gap: 1.2rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 2rem;
            width: 100%;
        }

        .card-btn {
            position: relative;
            width: 260px;
            padding: 1.8rem 1.3rem 1.7rem;
            background: var(--glass-bg);
            border: 1.5px solid var(--glass-border);
            border-radius: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                        border-color 0.3s,
                        box-shadow 0.3s;
            overflow: hidden;
            text-decoration: none;
            color: #fff;
            display: block;
            outline: none;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
        }

        .card-btn::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(34, 211, 238, 0.14), transparent 30%);
            animation: rotate 8s linear infinite;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s;
        }

        @keyframes rotate { to { transform: rotate(360deg); } }

        .card-btn:hover,
        .card-btn:focus-visible {
            transform: translateY(-8px) scale(1.03);
            border-color: rgba(34, 211, 238, 0.85);
            box-shadow:
                0 20px 40px rgba(34, 211, 238, 0.18),
                0 0 60px rgba(34, 211, 238, 0.22),
                inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .card-btn:hover::before,
        .card-btn:focus-visible::before { opacity: 1; }

        .card-btn:active { transform: translateY(-2px) scale(0.98); }

        .card-btn:focus-visible {
            outline: 2px solid var(--ice-bright);
            outline-offset: 4px;
        }

        .card-btn.admin::before {
            background: conic-gradient(from 0deg, transparent, rgba(251, 191, 36, 0.18), transparent 30%);
        }
        .card-btn.admin:hover,
        .card-btn.admin:focus-visible {
            border-color: rgba(251, 191, 36, 0.85);
            box-shadow:
                0 20px 40px rgba(251, 191, 36, 0.15),
                0 0 60px rgba(251, 191, 36, 0.2),
                inset 0 1px 0 rgba(255,255,255,0.1);
        }
        .card-btn.admin .card-icon-wrap {
            background: rgba(251, 191, 36, 0.08);
            border-color: rgba(251, 191, 36, 0.25);
        }
        .card-btn.admin:hover .card-icon-wrap,
        .card-btn.admin:focus-visible .card-icon-wrap {
            background: rgba(251, 191, 36, 0.18);
        }

        .card-icon-wrap {
            width: 60px;
            height: 60px;
            margin: 0 auto 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: rgba(34, 211, 238, 0.08);
            border: 1px solid rgba(127, 227, 255, 0.2);
            transition: transform 0.4s, background 0.3s;
        }

        .card-icon-wrap svg { width: 32px; height: 32px; }

        .card-btn:hover .card-icon-wrap,
        .card-btn:focus-visible .card-icon-wrap {
            transform: scale(1.1) rotate(-4deg);
            background: rgba(34, 211, 238, 0.16);
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            margin-bottom: 0.35rem;
            position: relative;
            z-index: 2;
        }

        .card-desc {
            font-size: 0.75rem;
            color: var(--text-dimmer);
            position: relative;
            z-index: 2;
            letter-spacing: 0.04em;
        }

        .footer-links {
            display: flex;
            gap: 0.6rem 1.2rem;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            margin-top: 0.5rem;
        }

        .footer-link {
            font-size: 0.68rem;
            color: var(--text-dimmer);
            letter-spacing: 0.16em;
            text-transform: uppercase;
            transition: color 0.25s, background 0.25s;
            text-decoration: none;
            padding: 0.5rem 0.9rem;
            border-radius: 999px;
            font-weight: 700;
        }

        .footer-link:hover,
        .footer-link:focus-visible {
            color: var(--ice-bright);
            background: rgba(34, 211, 238, 0.1);
            outline: none;
        }

        .footer-link.red:hover,
        .footer-link.red:focus-visible { color: var(--red-team); background: rgba(255, 59, 92, 0.1); }
        .footer-link.blue:hover,
        .footer-link.blue:focus-visible { color: var(--blue-team); background: rgba(61, 139, 255, 0.1); }

        .status-indicator {
            position: fixed;
            bottom: 12px;
            right: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.62rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            color: var(--text-dimmer);
            letter-spacing: 0.1em;
            z-index: 20;
            padding: 6px 12px;
            background: rgba(0,0,0,0.55);
            border-radius: 999px;
            border: 1px solid rgba(127, 227, 255, 0.15);
            max-width: calc(100vw - 24px);
            white-space: nowrap;
            overflow: hidden;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--ice-bright);
            box-shadow: 0 0 8px var(--ice-bright);
            animation: pulseDot 2s ease-in-out infinite;
            flex-shrink: 0;
        }

        .status-dot.error {
            background: #ef4444;
            box-shadow: 0 0 8px #ef4444;
            animation: none;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .status-meta {
            color: var(--text-dimmer);
            font-weight: 900;
            margin-left: 4px;
        }

        .file-protocol-warn {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(239, 68, 68, 0.95);
            color: #fff;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 10px;
            z-index: 50;
            max-width: calc(100vw - 24px);
            text-align: center;
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.5);
            letter-spacing: 0.03em;
            line-height: 1.4;
        }
        .file-protocol-warn.hidden { display: none; }

        @media (max-width: 720px) {
            .cards-grid {
                gap: 0.85rem;
                flex-direction: column;
                align-items: center;
            }
            .card-btn {
                width: 100%;
                max-width: 340px;
                padding: 1.3rem 1.2rem;
            }
            .card-icon-wrap { width: 48px; height: 48px; margin-bottom: 0.7rem; }
            .card-icon-wrap svg { width: 26px; height: 26px; }
            .card-title { font-size: 0.98rem; }
            .card-desc { font-size: 0.7rem; }
            .status-indicator { font-size: 0.56rem; padding: 5px 10px; }
        }

        @media (max-height: 720px) {
            .logo-wrap { width: clamp(240px, 50vw, 420px); }
            .subtitle { margin-bottom: 1.2rem; }
            .cards-grid { margin-bottom: 1rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .logo-wrap { animation: none; }
        }
    </style>
</head>
<body>

    <canvas id="snow-canvas"></canvas>

    <div class="file-protocol-warn hidden" id="file-protocol-warn">
        ⚠️ Открыто через <code>file://</code> — QR-коды не будут работать.<br>
        Откройте через <b>http://</b> или <b>https://</b> (хостинг / локальный сервер).
    </div>

    <div class="menu-container">

        <div class="logo-wrap" aria-label="ENDORPHIN">
            <svg viewBox="0 0 600 120" xmlns="http://www.w3.org/2000/svg" role="img">
                <defs>
                    <linearGradient id="logoGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#ffffff"/>
                        <stop offset="55%" stop-color="#a8e6ff"/>
                        <stop offset="100%" stop-color="#22d3ee"/>
                    </linearGradient>
                    <filter id="logoGlow" x="-20%" y="-50%" width="140%" height="200%">
                        <feGaussianBlur stdDeviation="6" result="blur"/>
                        <feMerge>
                            <feMergeNode in="blur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>
                <text x="300" y="88"
                      text-anchor="middle"
                      font-family="Montserrat, sans-serif"
                      font-weight="900"
                      font-size="96"
                      letter-spacing="-3"
                      fill="url(#logoGrad)"
                      stroke="rgba(127,227,255,0.35)"
                      stroke-width="0.7"
                      filter="url(#logoGlow)">ENDORPHIN</text>
            </svg>
        </div>

        <p class="subtitle">Снежный Баттл</p>

        <div class="cards-grid">
            <a href="mod.html" class="card-btn" aria-label="Открыть пульт ведущего">
                <div class="card-icon-wrap">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="6" y1="12" x2="10" y2="12"/>
                        <line x1="8" y1="10" x2="8" y2="14"/>
                        <line x1="15" y1="13" x2="15.01" y2="13"/>
                        <line x1="18" y1="11" x2="18.01" y2="11"/>
                        <rect x="2" y="6" width="20" height="12" rx="2"/>
                    </svg>
                </div>
                <div class="card-title" style="color: #22d3ee;">ПУЛЬТ ВЕДУЩЕГО</div>
                <div class="card-desc">Управление игрой</div>
            </a>

            <a href="tv.html" class="card-btn" aria-label="Открыть экран для проектора">
                <div class="card-icon-wrap">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#3d8bff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="7" width="20" height="13" rx="2"/>

            <a href="admin.html" class="card-btn admin" aria-label="Открыть админ-панель">
                <div class="card-icon-wrap">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </div>
                <div class="card-title" style="color: #fbbf24;">АДМИН-ПАНЕЛЬ</div>
                <div class="card-desc">Реклама · строка · сброс</div>
            </a>
        </div>

        <div class="footer-links">
            <a href="play.html?team=red" class="footer-link red" title="Для теста: войти за красных без QR">🔴 Играть за красных</a>
            <a href="play.html?team=blue" class="footer-link blue" title="Для теста: войти за синих без QR">🔵 Играть за синих</a>
        </div>

    </div>

    <div class="status-indicator" id="status-indicator" role="status" aria-live="polite">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">ONLINE</span>
        <span class="status-meta" id="status-meta"></span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCXIR5Tv8lB6ivcGRC3yt1SC66MM6T5b_M",
            authDomain: "endorphin-battle.firebaseapp.com",
            databaseURL: "https://endorphin-battle-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "endorphin-battle",
            storageBucket: "endorphin-battle.firebasestorage.app",
            messagingSenderId: "185259733030",
            appId: "1:185259733030:web:d72a89a436880973e636e7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const gameRef = ref(db, 'games/battle_1');

        // ============================================================
        // FILE:// ПРЕДУПРЕЖДЕНИЕ (QR не будет работать)
        // ============================================================
        if (location.protocol === 'file:') {
            document.getElementById('file-protocol-warn').classList.remove('hidden');
        }

        // ============================================================
        // СНЕГОПАД
        // ============================================================
        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d', { alpha: true });
        let width = 0, height = 0, dpr = 1;
        let snowflakes = [];
        let crystals = [];
        let animationId = null;
        let lastFrameTime = 0;
        const FRAME_INTERVAL = 1000 / 60;

        const reducedMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
        let prefersReducedMotion = reducedMotionQuery.matches;

        function initParticles() {
            snowflakes = [];
            crystals = [];

            if (prefersReducedMotion) return;

            // Меньше снежинок на мобильных — экономим CPU
            const area = width * height;
            const flakeCount = Math.min(
                width < 600 ? 50 : 90,
                Math.floor(area / 18000)
            );
            const crystalCount = Math.min(
                width < 600 ? 10 : 18,
                Math.floor(area / 70000)
            );

            for (let i = 0; i < flakeCount; i++) {
                snowflakes.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 2.4 + 0.7,
                    speedY: Math.random() * 0.8 + 0.35,
                    speedX: Math.random() * 0.4 - 0.2,
                    opacity: Math.random() * 0.5 + 0.35,
                    wobble: Math.random() * Math.PI * 2,
                    wobbleSpeed: Math.random() * 0.02 + 0.008
                });
            }

            for (let i = 0; i < crystalCount; i++) {
                crystals.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 11 + 5,
                    speedY: Math.random() * 0.3 + 0.1,
                    opacity: Math.random() * 0.22 + 0.08,
                    rotation: Math.random() * Math.PI,
                    rotationSpeed: (Math.random() - 0.5) * 0.01
                });
            }
        }

        function resize() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = Math.floor(width * dpr);
            canvas.height = Math.floor(height * dpr);
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            initParticles();
        }

        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(resize, 250);
        });

        function drawFrame(timestamp) {
            if (!animationId) return;
            animationId = requestAnimationFrame(drawFrame);

            if (timestamp - lastFrameTime < FRAME_INTERVAL) return;
            lastFrameTime = timestamp;

            ctx.clearRect(0, 0, width, height);

            // Снежинки
            ctx.shadowColor = 'rgba(34, 211, 238, 0.9)';
            ctx.shadowBlur = 5;
            for (const flake of snowflakes) {
                flake.y += flake.speedY;
                flake.x += flake.speedX + Math.sin(flake.wobble) * 0.3;
                flake.wobble += flake.wobbleSpeed;

                if (flake.y > height + 5) {
                    flake.y = -5;
                    flake.x = Math.random() * width;
                }
                if (flake.x > width + 5) flake.x = -5;
                if (flake.x < -5) flake.x = width + 5;

                ctx.beginPath();
                ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${flake.opacity})`;
                ctx.fill();
            }
            ctx.shadowBlur = 0;

            // Кристаллы
            for (const crystal of crystals) {
                crystal.y += crystal.speedY;
                crystal.rotation += crystal.rotationSpeed;

                if (crystal.y > height + 20) {
                    crystal.y = -20;
                    crystal.x = Math.random() * width;
                }

                ctx.save();
                ctx.translate(crystal.x, crystal.y);
                ctx.rotate(crystal.rotation);
                ctx.fillStyle = `rgba(127, 227, 255, ${crystal.opacity})`;
                ctx.shadowColor = 'rgba(34, 211, 238, 0.7)';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.moveTo(0, -crystal.size);
                ctx.lineTo(crystal.size / 2, 0);
                ctx.lineTo(0, crystal.size);
                ctx.lineTo(-crystal.size / 2, 0);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
            ctx.shadowBlur = 0;
        }

        function startSnow() {
            if (animationId) return;
            if (prefersReducedMotion) return;
            lastFrameTime = 0;
            animationId = requestAnimationFrame(drawFrame);
        }

        function stopSnow() {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
        }

        // Live-обновление prefers-reduced-motion
        if (reducedMotionQuery.addEventListener) {
            reducedMotionQuery.addEventListener('change', (e) => {
                prefersReducedMotion = e.matches;
                if (prefersReducedMotion) {
                    stopSnow();
                    snowflakes = [];
                    crystals = [];
                    ctx.clearRect(0, 0, width, height);
                } else {
                    initParticles();
                    startSnow();
                }
            });
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopSnow();
            } else {
                startSnow();
            }
        });

        resize();
        startSnow();

        // ============================================================
        // СТАТУС ЧЕРЕЗ FIREBASE SDK
        // ============================================================
        const dot = document.getElementById('status-dot');
        const textEl = document.getElementById('status-text');
        const metaEl = document.getElementById('status-meta');

        let firstStatusAt = 0;
        let pingMeasured = false;
        const startTime = performance.now();

        function renderStatus(data) {
            const status = data?.status || 'lobby';
            const screen = data?.screen || 'attract';
            const redP = Object.keys(data?.players?.red || {}).length;
            const blueP = Object.keys(data?.players?.blue || {}).length;
            const redR = Object.keys(data?.room?.red || {}).length;
            const blueR = Object.keys(data?.room?.blue || {}).length;
            const totalP = redP + blueP;
            const totalR = redR + blueR;

            dot.classList.remove('error');

            const ping = pingMeasured
                ? ` · ${Math.round(firstStatusAt - startTime)}ms`
                : '';
            textEl.innerText = `ONLINE · ${String(status).toUpperCase()} · ${String(screen).toUpperCase()}${ping}`;
            metaEl.innerText = `👥 ${totalP} · 🚪 ${totalR}`;
        }

        function renderOffline() {
            dot.classList.add('error');
            textEl.innerText = 'OFFLINE';
            metaEl.innerText = '';
        }

        // onValue — точный статус, с теми же правами, что и остальные файлы
        try {
            onValue(gameRef, (snap) => {
                if (!pingMeasured) {
                    firstStatusAt = performance.now();
                    pingMeasured = true;
                }
                const data = snap.val();
                if (!data) {
                    renderStatus({});
                    return;
                }
                renderStatus(data);
            }, (error) => {
                console.error('Firebase onValue error:', error);
                renderOffline();
            });
        } catch (e) {
            console.error('Firebase init error:', e);
            renderOffline();
        }

        // ============================================================
        // PREFETCH
        // ============================================================
        ['mod.html', 'tv.html', 'play.html', 'admin.html'].forEach(href => {
            const link = document.createElement('link');
            link.rel = 'prefetch';
            link.href = href;
            document.head.appendChild(link);
        });
    </script>

</body>
</html>
