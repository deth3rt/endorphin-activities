<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ENDORPHIN | ЛЕДЯНОЙ БОЙ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Библиотека для QR с улучшенной совместимостью -->
  <script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
  <style>
    body { background: #03080f; color: #eaffff; font-family: system-ui, sans-serif; overflow: hidden; user-select: none; }
    
    /* Снежинки */
    .snowflake { position: absolute; color: rgba(180, 235, 255, 0.6); font-size: 14px; animation: fall linear infinite; pointer-events: none; z-index: 0; }
    @keyframes fall { to { transform: translateY(100vh) rotate(360deg); } }

    /* Мобильный интерфейс */
    .phone-mockup { width: 100vw; height: 100vh; background: #03080f; position: fixed; inset: 0; overflow: hidden; touch-action: none; z-index: 9999; display: none; }
    
    /* Ползунки */
    input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 30px; width: 30px; border-radius: 50%; background: #fff; box-shadow: 0 0 15px #fff; cursor: pointer; margin-top: -12px; }
    input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 8px; cursor: pointer; background: #1f8fd6; border-radius: 4px; }

    /* Поле боя на ТВ */
    .snowball { position: absolute; width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fff, #7fe3ff); box-shadow: 0 0 25px #7fe3ff; pointer-events: none; z-index: 20; transform: translate(-50%, -50%); }
    .snow-fort { background: linear-gradient(180deg, #ffffff, #a8e6ff); box-shadow: 0 10px 20px rgba(127,227,255,0.3); border-radius: 50%; position: absolute; }
    .player-dot { position: absolute; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 35px; transform: translate(-50%, -50%); transition: all 0.1s; z-index: 10; }
    .player-red { background: #ef4444; box-shadow: 0 0 20px #ef4444; border: 2px solid #fff; }
    .player-blue { background: #3b82f6; box-shadow: 0 0 20px #3b82f6; border: 2px solid #fff; }
    
    .heart { filter: drop-shadow(0 0 10px #ef4444); transition: all 0.3s; }
    .heart.dead { filter: grayscale(1); opacity: 0.3; transform: scale(0.8); }
  </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center">

  <div id="error-banner" class="hidden fixed top-0 left-0 right-0 bg-red-600 text-white text-center py-2 z-[99999] font-bold text-lg"></div>
  <div id="snow" class="fixed inset-0 pointer-events-none z-0"></div>

  <!-- ТВ ЭКРАН -->
  <div id="tv-screen" class="flex-1 w-full h-full bg-[#e0f2fe] relative overflow-hidden hidden">
    
    <!-- ЛОББИ -->
    <div id="lobby-view" class="absolute inset-0 flex flex-col items-center justify-center p-8 bg-gradient-to-br from-[#0a2540] to-[#03080f] z-30">
      <h1 class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-cyan-300 to-red-400 mb-8 text-center drop-shadow-[0_0_20px_rgba(127,227,255,0.5)]">
        ENDORPHIN<br><span class="text-3xl">ЛЕДЯНОЙ БОЙ</span>
      </h1>
      
      <div class="flex gap-20 mb-12">
        <div class="flex flex-col items-center">
          <h2 class="text-4xl font-bold text-red-500 mb-4 drop-shadow-[0_0_10px_rgba(239,68,68,0.5)]">🔴 КРАСНЫЕ</h2>
          <div class="bg-white p-4 rounded-xl shadow-xl overflow-hidden" id="qr-red"></div>
          <p class="mt-6 text-2xl font-bold">Игроков: <span id="count-red" class="text-red-500 text-4xl">0</span></p>
        </div>
        
        <div class="flex flex-col items-center">
          <h2 class="text-4xl font-bold text-blue-500 mb-4 drop-shadow-[0_0_10px_rgba(59,130,246,0.5)]">🔵 СИНИЕ</h2>
          <div class="bg-white p-4 rounded-xl shadow-xl overflow-hidden" id="qr-blue"></div>
          <p class="mt-6 text-2xl font-bold">Игроков: <span id="count-blue" class="text-blue-500 text-4xl">0</span></p>
        </div>
      </div>

      <button id="btn-start" class="opacity-50 cursor-not-allowed px-16 py-6 rounded-full text-4xl font-black bg-gradient-to-r from-blue-500 to-cyan-400 text-black shadow-[0_0_30px_rgba(127,227,255,0.4)] transition hover:scale-105">
        НАЧАТЬ БОЙ
      </button>
      <p class="mt-6 text-gray-400 text-xl">Для старта нужно по 1 игроку с каждой стороны</p>
    </div>

    <!-- СЦЕНА БИТВЫ -->
    <div id="battle-view" class="absolute inset-0 hidden z-10 bg-[#e0f2fe]">
      <!-- Верхняя база -->
      <div class="absolute top-0 w-full h-[25%] bg-[#bae6fd] flex justify-center border-b-4 border-[#7fe3ff]">
         <div class="snow-fort w-[300px] h-[100px] top-[10px]"></div>
         <div id="blue-player" class="player-dot player-blue top-[50px]">🧍‍♂️</div>
         <div class="absolute top-4 left-6 flex gap-2">
           <div class="text-5xl heart" id="life-blue-1">❤️</div>
           <div class="text-5xl heart" id="life-blue-2">❤️</div>
           <div class="text-5xl heart" id="life-blue-3">❤️</div>
         </div>
      </div>

      <!-- Поле боя -->
      <div id="battlefield" class="absolute top-[25%] bottom-[25%] left-0 right-0 overflow-hidden"></div>

      <!-- Нижняя база -->
      <div class="absolute bottom-0 w-full h-[25%] bg-[#fecaca] flex justify-center border-t-4 border-[#f87171]">
         <div class="snow-fort w-[300px] h-[100px] bottom-[10px]"></div>
         <div id="red-player" class="player-dot player-red bottom-[50px]">🧍‍♂️</div>
         <div class="absolute bottom-4 right-6 flex gap-2">
           <div class="text-5xl heart" id="life-red-1">❤️</div>
           <div class="text-5xl heart" id="life-red-2">❤️</div>
           <div class="text-5xl heart" id="life-red-3">❤️</div>
         </div>
      </div>
    </div>

    <!-- ЭКРАН ПОБЕДЫ -->
    <div id="win-view" class="absolute inset-0 hidden flex-col items-center justify-center bg-black/90 backdrop-blur-md z-40">
      <h1 class="text-8xl font-black text-white mb-8" id="win-text">ПОБЕДА!</h1>
      <button onclick="resetGame()" class="px-10 py-4 rounded-full border-2 border-cyan-400 text-cyan-400 font-bold text-2xl hover:bg-cyan-400 hover:text-black transition">Сыграть ещё</button>
    </div>

  </div>

  <!-- МОБИЛЬНЫЙ ИНТЕРФЕЙС (ТЕЛЕФОНЫ) -->
  <div id="phone-screen" class="phone-mockup flex-col bg-[#03080f]">
    <!-- Ввод имени -->
    <div id="join-step" class="flex flex-col items-center justify-center h-full p-6 text-center">
      <div class="w-24 h-24 rounded-full flex items-center justify-center mb-6 border-2" id="team-icon-join"><span class="text-5xl" id="team-emoji-join">🔴</span></div>
      <h2 class="text-3xl font-bold mb-8" id="team-name-join">Красные</h2>
      <input type="text" id="input-name" placeholder="Твоё имя" class="w-full bg-black/50 border-2 rounded-xl px-4 py-4 text-center text-2xl text-white mb-6 outline-none transition" id="input-style">
      <button id="join-btn" class="w-full py-4 text-white font-bold text-2xl rounded-xl active:scale-95 transition shadow-lg">В БОЙ</button>
    </div>
    
    <!-- Экран прицеливания и силы -->
    <div id="play-step" class="hidden w-full h-full flex flex-col relative">
      <!-- Мини-поле для наглядности -->
      <div class="absolute inset-0 bg-[#0a2540] pointer-events-none">
        <div class="absolute top-0 w-full h-1/4 bg-blue-900/30 flex justify-center items-center"><span class="text-6xl opacity-30">🛡️</span></div>
        <div class="absolute bottom-0 w-full h-1/4 bg-red-900/30 flex justify-center items-center"><span class="text-6xl">🧍‍♂️</span></div>
      </div>
      
      <!-- Панель управления -->
      <div class="absolute bottom-0 w-full p-6 bg-black/80 backdrop-blur-md rounded-t-3xl border-t border-gray-700">
        
        <!-- Угол -->
        <div class="mb-6">
          <div class="flex justify-between text-sm text-gray-300 mb-2"><span>УГОЛ ТРАЕКТОРИИ</span><span id="angle-display">45°</span></div>
          <input type="range" id="angle-slider" min="10" max="80" value="45" oninput="updateAngle()">
        </div>

        <!-- Сила -->
        <div class="mb-6">
          <div class="flex justify-between text-sm text-gray-300 mb-2"><span>СИЛА БРОСКА</span><span id="power-display">50</span></div>
          <!-- Полоса с зоной попадания -->
          <div class="w-full h-4 bg-gray-800 rounded-full relative overflow-hidden mb-2">
            <div class="absolute h-full w-[10%] bg-red-500/50 left-0"></div>
            <div class="absolute h-full w-[20%] bg-green-500/50 left-[50%]"></div>
            <div class="absolute h-full w-[30%] bg-red-500/50 right-0"></div>
            <div id="power-bar" class="absolute h-full w-[2px] bg-white shadow-[0_0_10px_#fff]" style="left: 50%"></div>
          </div>
        </div>

        <!-- Кнопка -->
        <button id="action-btn" class="w-full py-5 text-white font-black text-2xl rounded-2xl active:scale-95 transition shadow-[0_10px_30px_rgba(0,0,0,0.5)] bg-blue-600">
          ЗАМЕР СИЛЫ
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    // Глобальные переменные для доступа из HTML
    window.joinTeam = null;
    window.updateAngle = null;
    window.firePhone = null;
    window.resetGame = null;

    // Вывод ошибок на экран
    window.addEventListener('error', function(e) {
      const banner = document.getElementById('error-banner');
      if (banner) {
        banner.innerText = 'ОШИБКА: ' + e.message;
        banner.classList.remove('hidden');
      }
    });

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, update, remove, push, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCXIR5Tv8lB6ivcGRC3yt1SC66MM6T5b_M",
      authDomain: "endorphin-battle.firebaseapp.com",
      databaseURL: "https://endorphin-battle-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "endorphin-battle",
      storageBucket: "endorphin-battle.firebasestorage.app",
      messagingSenderId: "185259733030",
      appId: "1:185259733030:web:d72a89a436880973e636e7"
    };

    let app, db, gameRef;
    try {
      app = initializeApp(firebaseConfig);
      db = getDatabase(app);
    } catch (err) {
      document.getElementById('error-banner').innerText = 'ОШИБКА Firebase: ' + err.message;
      document.getElementById('error-banner').classList.remove('hidden');
    }

    // Парсим URL параметры
    const currentUrl = window.location.href.split('?')[0];
    const urlParams = new URLSearchParams(window.location.search);
    const gameId = urlParams.get('game') || 'battle_1';
    const team = urlParams.get('team'); // 'red', 'blue' или null
    const playerId = 'player_' + Math.random().toString(36).substr(2, 9);

    // Снежинки
    const snowBox = document.getElementById('snow');
    if (snowBox) {
      for (let i = 0; i < 40; i++) {
        const s = document.createElement('div');
        s.className = 'snowflake';
        s.innerText = '❄';
        s.style.left = Math.random() * 100 + '%';
        s.style.fontSize = (10 + Math.random() * 20) + 'px';
        s.style.animationDuration = (5 + Math.random() * 10) + 's';
        s.style.animationDelay = (-Math.random() * 10) + 's';
        snowBox.appendChild(s);
      }
    }

    // ================= ТВ ЛОГИКА (ЕСЛИ НЕТ ТИМА) =================
    if (!team) {
      document.getElementById('tv-screen').classList.remove('hidden');
      
      // Функция генерации QR без внешних библиотек (рисует через Canvas)
      function drawQR(text, containerId) {
        const qr = qrcode(0, 'M');
        qr.addData(text);
        qr.make();
        document.getElementById(containerId).innerHTML = qr.createImgTag(6, 8);
      }

      setTimeout(() => {
        drawQR(currentUrl + `?game=${gameId}&team=red`, 'qr-red');
        drawQR(currentUrl + `?game=${gameId}&team=blue`, 'qr-blue');
      }, 100);

      if (db) {
        gameRef = ref(db, `games/${gameId}`);
        set(gameRef, {
          status: 'lobby',
          lives: { red: 3, blue: 3 },
          players: { red: 0, blue: 0 }
        });

        onValue(gameRef, (snapshot) => {
          const data = snapshot.val();
          if (!data) return;

          const redCount = Object.keys(data.players?.red || {}).length;
          const blueCount = Object.keys(data.players?.blue || {}).length;
          document.getElementById('count-red').innerText = redCount;
          document.getElementById('count-blue').innerText = blueCount;

          const btn = document.getElementById('btn-start');
          if (redCount >= 1 && blueCount >= 1 && data.status === 'lobby') {
            btn.disabled = false;
            btn.classList.remove('opacity-50', 'cursor-not-allowed');
            btn.classList.add('hover:scale-105', 'shadow-[0_0_50px_rgba(127,227,255,0.8)]');
          } else if (data.status === 'lobby') {
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
          }

          if (data.status === 'playing') {
            document.getElementById('lobby-view').classList.add('hidden');
            document.getElementById('battle-view').classList.remove('hidden');
          }

          if (data.status === 'finished') {
            document.getElementById('win-view').classList.remove('hidden');
            document.getElementById('win-view').classList.add('flex');
            const winText = document.getElementById('win-text');
            if (data.winner === 'red') {
              winText.innerText = '🔴 КРАСНЫЕ ПОБЕДИЛИ!';
              winText.className = 'text-8xl font-black text-red-500 mb-8 drop-shadow-[0_0_30px_rgba(239,68,68,0.8)]';
            } else if (data.winner === 'blue') {
              winText.innerText = '🔵 СИНИЕ ПОБЕДИЛИ!';
              winText.className = 'text-8xl font-black text-blue-500 mb-8 drop-shadow-[0_0_30px_rgba(59,130,246,0.8)]';
            } else {
              winText.innerText = '🤝 НИЧЬЯ!';
              winText.className = 'text-8xl font-black text-white mb-8';
            }
          }

          if (data.lives) {
            for (let i = 1; i <= 3; i++) {
              const heartRed = document.getElementById(`life-red-${i}`);
              const heartBlue = document.getElementById(`life-blue-${i}`);
              if (heartRed) heartRed.className = `text-5xl heart ${i > data.lives.red ? 'dead' : ''}`;
              if (heartBlue) heartBlue.className = `text-5xl heart ${i > data.lives.blue ? 'dead' : ''}`;
            }
          }
        });

        document.getElementById('btn-start').onclick = () => {
          update(gameRef, { status: 'playing' });
        };

        // Слушаем выстрелы
        onValue(ref(db, `games/${gameId}/shots`), (snapshot) => {
          const shots = snapshot.val();
          if (!shots) return;
          
          Object.keys(shots).forEach(key => {
            const shot = shots[key];
            if (shot.animated) return;
            
            animateShot(shot.team, shot.power, shot.angle);
            update(ref(db, `games/${gameId}/shots/${key}`), { animated: true });
            setTimeout(() => remove(ref(db, `games/${gameId}/shots/${key}`)), 2000);
          });
        });
      }

      function animateShot(team, power, angle) {
        const battlefield = document.getElementById('battlefield');
        const ball = document.createElement('div');
        ball.className = 'snowball';
        battlefield.appendChild(ball);

        const startX = window.innerWidth / 2;
        const startY = team === 'red' ? battlefield.offsetHeight : 0;
        const endY = team === 'red' ? 0 : battlefield.offsetHeight;
        
        // Расчет попадания: если сила от 50 до 70 - попал, иначе мимо (пролетел по Х)
        const isHit = power >= 50 && power <= 70;
        const targetX = isHit ? (window.innerWidth / 2) : (Math.random() > 0.5 ? window.innerWidth + 100 : -100);

        ball.style.left = startX + 'px';
        ball.style.top = startY + 'px';

        ball.animate([
          { left: startX + 'px', top: startY + 'px' },
          { left: targetX + 'px', top: endY + 'px' }
        ], { duration: 600, easing: 'ease-in', fill: 'forwards' }).onfinish = () => {
          if (isHit && db) {
            onValue(gameRef, (snap) => {
              const data = snap.val();
              if (!data || data.status !== 'playing') return;
              
              const currentLives = { ...data.lives };
              if (team === 'red') currentLives.blue = Math.max(0, currentLives.blue - 1);
              else currentLives.red = Math.max(0, currentLives.red - 1);

              let winner = null;
              if (currentLives.red <= 0) winner = 'blue';
              if (currentLives.blue <= 0) winner = 'red';

              update(gameRef, {
                lives: currentLives,
                ...(winner ? { status: 'finished', winner } : {})
              });
            }, { onlyOnce: true });
          }
          ball.remove();
        };
      }
    }

    // ================= ТЕЛЕФОН ЛОГИКА (ЕСЛИ ЕСТЬ ТИМА) =================
    if (team) {
      document.getElementById('phone-screen').classList.remove('hidden');
      document.getElementById('phone-screen').classList.add('flex');
      document.getElementById('phone-screen').style.display = 'flex';

      // Настраиваем цвета под команду
      const isRed = team === 'red';
      document.getElementById('team-icon-join').style.borderColor = isRed ? '#ef4444' : '#3b82f6';
      document.getElementById('team-emoji-join').innerText = isRed ? '🔴' : '🔵';
      document.getElementById('team-name-join').innerText = isRed ? 'Красные' : 'Синие';
      document.getElementById('team-name-join').style.color = isRed ? '#ef4444' : '#3b82f6';
      
      const input = document.getElementById('input-name');
      input.style.borderColor = isRed ? '#ef4444' : '#3b82f6';
      
      const joinBtn = document.getElementById('join-btn');
      joinBtn.style.backgroundColor = isRed ? '#dc2626' : '#2563eb';

      const actionBtn = document.getElementById('action-btn');
      actionBtn.style.backgroundColor = isRed ? '#dc2626' : '#2563eb';

      if (db) {
        const playerRef = ref(db, `games/${gameId}/players/${team}/${playerId}`);
        onDisconnect(playerRef).remove();

        // Глобальная функция входа
        window.joinTeam = () => {
          const name = input.value.trim() || 'Игрок';
          set(playerRef, { name });
          document.getElementById('join-step').classList.add('hidden');
          document.getElementById('play-step').classList.remove('hidden');
        };

        onValue(gameRef, (snapshot) => {
          const data = snapshot.val();
          if (data.status === 'finished') {
            document.getElementById('play-step').classList.add('hidden');
          }
        });

        // Ползунок угла
        const angleSlider = document.getElementById('angle-slider');
        window.updateAngle = () => {
          document.getElementById('angle-display').innerText = angleSlider.value + '°';
        };

        // Механика "Гольфа" (остановка бегущего ползунка)
        let isAiming = false;
        let currentPower = 50;
        let powerDirection = 1;
        let powerInterval = null;

        actionBtn.onclick = () => {
          if (!isAiming) {
            // Старт замера
            isAiming = true;
            actionBtn.innerText = 'БРОСОК!';
            powerInterval = setInterval(() => {
              currentPower += powerDirection * 2;
              if (currentPower >= 100) powerDirection = -1;
              if (currentPower <= 0) powerDirection = 1;
              document.getElementById('power-bar').style.left = currentPower + '%';
              document.getElementById('power-display').innerText = Math.round(currentPower);
            }, 20);
          } else {
            // Бросок
            isAiming = false;
            clearInterval(powerInterval);
            actionBtn.innerText = 'ЖДЕМ...';
            actionBtn.disabled = true;

            // Отправляем в Firebase
            const shotsRef = ref(db, `games/${gameId}/shots`);
            push(shotsRef, { 
              team: team, 
              power: currentPower, 
              angle: parseInt(angleSlider.value), 
              time: Date.now() 
            });

            // Разблокируем кнопку через 1 секунду
            setTimeout(() => {
              actionBtn.innerText = 'ЗАМЕР СИЛЫ';
              actionBtn.disabled = false;
            }, 1000);
          }
        };
      }
    }

    // Глобальная функция сброса
    window.resetGame = () => {
      if (db) {
        set(gameRef, {
          status: 'lobby',
          lives: { red: 3, blue: 3 },
          players: { red: 0, blue: 0 }
        });
      }
      window.location.reload();
    };

  </script>
</body>
</html>
