<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ENDORPHIN | МЕНЮ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
    body { background: radial-gradient(circle at 50% 0%, #0a2540 0%, #03080f 100%); font-family: 'Montserrat', sans-serif; color: #fff; overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; }
    .glass-panel { background: rgba(10, 37, 64, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(127, 227, 255, 0.3); box-shadow: 0 0 40px rgba(31, 143, 214, 0.2); }
    .btn-neon { transition: all 0.3s ease; }
    .btn-neon:hover { transform: scale(1.05); box-shadow: 0 0 40px rgba(34, 211, 238, 0.6); }
    .btn-red { background: linear-gradient(135deg, #ef4444, #7f1d1d); }
  </style>
</head>
<body>
  <div id="main-menu" class="flex flex-col items-center">
    <div class="text-center mb-16">
      <h1 class="text-8xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-blue-400 to-indigo-500 mb-2 drop-shadow-[0_0_30px_rgba(59,130,246,0.8)] tracking-tighter">ENDORPHIN</h1>
      <h2 class="text-3xl font-bold text-cyan-100 tracking-[0.3em] uppercase opacity-80">Снежный Баттл</h2>
    </div>

    <div class="flex gap-8">
      <a href="mod.html" class="glass-panel btn-neon px-12 py-8 rounded-3xl flex flex-col items-center w-64">
        <span class="text-5xl mb-4">🎮</span>
        <span class="text-2xl font-black text-cyan-300">ПУЛЬТ ВЕДУЩЕГО</span>
      </a>
      <a href="tv.html" class="glass-panel btn-neon px-12 py-8 rounded-3xl flex flex-col items-center w-64">
        <span class="text-5xl mb-4">📺</span>
        <span class="text-2xl font-black text-blue-400">ЭКРАН ТВ</span>
      </a>
    </div>
    
    <p class="mt-12 text-gray-500 text-sm tracking-widest">ВХОД ДЛЯ АДМИНИСТРАТОРА: <a href="admin.html" class="hover:text-cyan-400 underline transition">admin.html</a></p>
  </div>

  <div id="blocked-menu" class="hidden flex-col items-center glass-panel p-10 rounded-3xl">
    <div class="text-6xl mb-6">❄️</div>
    <h2 class="text-4xl font-black mb-4 uppercase text-center text-red-500">ИГРА УЖЕ ИДЕТ!</h2>
    <p class="text-cyan-300 font-bold text-center mb-8">Дождитесь окончания боя или сбросьте игру.</p>
    <button onclick="forceReset()" class="w-full py-4 bg-red-600 rounded-xl font-black text-lg hover:bg-red-500 transition shadow-[0_0_20px_rgba(239,68,68,0.5)]">ПРИНУДИТЕЛЬНЫЙ СБРОС</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    
    const firebaseConfig = { apiKey: "AIzaSyCXIR5Tv8lB6ivcGRC3yt1SC66MM6T5b_M", authDomain: "endorphin-battle.firebaseapp.com", databaseURL: "https://endorphin-battle-default-rtdb.europe-west1.firebasedatabase.app", projectId: "endorphin-battle", storageBucket: "endorphin-battle.firebasestorage.app", messagingSenderId: "185259733030", appId: "1:185259733030:web:d72a89a436880973e636e7" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const gameRef = ref(db, 'games/battle_1');

    let isBlocked = false;

    onValue(gameRef, (snap) => {
      const data = snap.val();
      if (data && data.status === 'playing' && !isBlocked) {
        isBlocked = true;
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('blocked-menu').classList.remove('hidden');
        document.getElementById('blocked-menu').classList.add('flex');
      } else if (data && data.status !== 'playing' && isBlocked) {
        isBlocked = false;
        document.getElementById('main-menu').classList.remove('hidden');
        document.getElementById('blocked-menu').classList.add('hidden');
        document.getElementById('blocked-menu').classList.remove('flex');
      }
    });

    window.forceReset = () => {
      if (confirm('Сбросить игру принудительно? Все игроки отключатся.')) {
        set(gameRef, { 
          status: 'lobby', 
          mode: '1v1', 
          lives: { red: 3, blue: 3 }, 
          players: { red: {}, blue: {} },
          turn: { team: 'red', name: '...' },
          activePlayerId: null,
          timer: null
        });
        alert('Игра сброшена');
      }
    };
  </script>
</body>
</html>
