<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#03080f">
    <title>ENDORPHIN | ТВ ЭКРАН</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=JetBrains+Mono:wght@700;900&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>

    <style>
        :root {
            --bg-deep: #03080f;
            --bg-mid: #0a2540;
            --ice: #7fe3ff;
            --ice-bright: #22d3ee;
            --amber: #fbbf24;
            --red-team: #ff3b5c;
            --blue-team: #3d8bff;
            --glass-bg: rgba(10, 37, 64, 0.65);
            --glass-border: rgba(127, 227, 255, 0.3);
            --text-dim: rgba(168, 230, 255, 0.7);
            --text-dimmer: rgba(168, 230, 255, 0.45);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            background: radial-gradient(circle at 50% 0%, var(--bg-mid) 0%, var(--bg-deep) 70%);
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            user-select: none;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            mix-blend-mode: overlay;
        }

        .mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }

        /* ============================================================
           СНЕЖИНКИ (CSS)
           ============================================================ */
        .snowflake {
            position: absolute;
            color: rgba(255, 255, 255, 0.6);
            font-size: 20px;
            animation: fall linear infinite;
            pointer-events: none;
            z-index: 5;
            filter: drop-shadow(0 0 8px #fff);
            top: -10vh;
            will-change: transform;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        .glass-panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 0 40px rgba(31, 143, 214, 0.15);
            border-radius: 1.5rem;
        }

        @keyframes screenShake {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-5px, 2px); }
            40% { transform: translate(5px, -2px); }
            60% { transform: translate(-8px, 4px); }
            80% { transform: translate(8px, -4px); }
        }
        .screen-shake { animation: screenShake 0.4s cubic-bezier(.36,.07,.19,.97) both; }

        #game-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            display: block;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            z-index: 20;
            pointer-events: none;
        }

        .full-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: radial-gradient(circle at 50% 0%, var(--bg-mid) 0%, var(--bg-deep) 70%);
            z-index: 30;
            transition: opacity 0.4s;
        }
        .full-screen.hidden { display: none; }

        /* ============================================================
           ATTRACT
           ============================================================ */
        #attract-view {
            background: transparent;
            justify-content: space-between;
            padding: 2.5rem 2rem 1.5rem;
        }

        .attract-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: auto;
            margin-bottom: auto;
            z-index: 10;
            pointer-events: none;
        }

        .attract-logo-wrap {
            width: clamp(300px, 55vw, 720px);
            margin-bottom: 0.5rem;
            filter: drop-shadow(0 0 40px rgba(34, 211, 238, 0.5))
                    drop-shadow(0 0 100px rgba(34, 211, 238, 0.2));
            animation: titleFloat 5s ease-in-out infinite;
        }
        .attract-logo-wrap svg { width: 100%; height: auto; display: block; }
        @keyframes titleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .attract-subtitle {
            font-size: clamp(0.9rem, 2.2vw, 1.6rem);
            font-weight: 700;
            letter-spacing: 0.42em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 2rem;
            text-align: center;
            padding-left: 0.42em;
        }

        .attract-phrase {
            font-size: clamp(1.2rem, 3vw, 2.2rem);
            font-weight: 900;
            color: #fff;
            text-align: center;
            text-shadow: 0 0 30px rgba(34, 211, 238, 0.9), 0 2px 15px rgba(0,0,0,0.8);
            min-height: 2.8rem;
            transition: opacity 0.4s;
            margin-bottom: 1.5rem;
            letter-spacing: 0.05em;
            padding: 0 1rem;
        }

        .attract-cta {
            font-size: clamp(1rem, 2.4vw, 1.6rem);
            font-weight: 900;
            color: var(--ice-bright);
            text-shadow: 0 0 30px rgba(34, 211, 238, 0.9), 0 2px 15px rgba(0,0,0,0.8);
            text-align: center;
            animation: ctaPulse 2s ease-in-out infinite;
            letter-spacing: 0.1em;
        }
        @keyframes ctaPulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .attract-hint {
            font-size: clamp(0.7rem, 1.4vw, 1rem);
            color: var(--text-dimmer);
            letter-spacing: 0.2em;
            margin-top: 0.6rem;
            text-align: center;
            text-shadow: 0 1px 8px rgba(0,0,0,0.8);
        }

        .attract-bottom {
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 10;
        }

        .ad-block {
            width: 100%;
            max-width: 560px;
            height: 76px;
            background: rgba(10, 37, 64, 0.75);
            border: 1px solid rgba(127, 227, 255, 0.35);
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-decoration: none;
        }
        .ad-block.hidden { display: none; }
        .ad-block img { width: 100%; height: 100%; object-fit: contain; }
        .ad-block span {
            color: var(--text-dimmer);
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.2em;
        }

        /* ============================================================
           QR
           ============================================================ */
        .qr-container {
            display: flex;
            gap: clamp(2rem, 6vw, 6rem);
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .qr-team {
            position: relative;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: clamp(300px, 26vw, 380px);
        }

        .qr-team-badge {
            position: absolute;
            top: -1.2rem;
            padding: 0.5rem 1.6rem;
            border-radius: 999px;
            font-weight: 900;
            font-size: clamp(0.95rem, 2vw, 1.25rem);
            letter-spacing: 0.1em;
            color: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .qr-team-badge.red { background: var(--red-team); box-shadow: 0 4px 25px rgba(255, 59, 92, 0.5); }
        .qr-team-badge.blue { background: var(--blue-team); box-shadow: 0 4px 25px rgba(61, 139, 255, 0.5); }

        .qr-box {
            background: #fff;
            padding: 14px;
            border-radius: 18px;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }
        .qr-box img { display: block; }

        .qr-players {
            margin-top: 1rem;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .qr-player {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .qr-player.red { border-color: rgba(255, 59, 92, 0.4); }
        .qr-player.blue { border-color: rgba(61, 139, 255, 0.4); }
        .qr-player .name { flex: 1; }

        .qr-vs {
            font-size: clamp(3rem, 6vw, 5rem);
            font-weight: 900;
            color: rgba(255,255,255,0.2);
            font-style: italic;
        }

        .avatar {
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
            flex-shrink: 0;
            border: 2px solid rgba(255,255,255,0.3);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .avatar-xs { width: 24px; height: 24px; font-size: 0.75rem; }
        .avatar-sm { width: 34px; height: 34px; font-size: 0.95rem; }

        /* ============================================================
           PRELOAD / WINNER
           ============================================================ */
        .preload-title {
            font-size: clamp(2rem, 5vw, 4.5rem);
            font-weight: 900;
            text-align: center;
            line-height: 1.15;
            margin-bottom: 2rem;
            animation: preloadPulse 2s ease-in-out infinite;
            letter-spacing: 0.02em;
        }
        @keyframes preloadPulse {
            0%, 100% { transform: scale(1); text-shadow: 0 0 30px rgba(34, 211, 238, 0.4); }
            50% { transform: scale(1.02); text-shadow: 0 0 60px rgba(34, 211, 238, 0.8); }
        }
        .preload-timer {
            font-size: clamp(5rem, 12vw, 9rem);
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 40px rgba(34, 211, 238, 0.6);
            margin: 1rem 0;
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
        }

        @keyframes megaZoom {
            0% { transform: translate(-50%, -50%) scale(0.1); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        .mega-text {
            position: absolute;
            top: 50%;
            left: 50%;
            font-size: clamp(3rem, 8vw, 8rem);
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 80px var(--amber);
            z-index: 100;
            letter-spacing: 5px;
            text-transform: uppercase;
            animation: megaZoom 0.8s forwards;
            pointer-events: none;
            text-align: center;
        }

        @keyframes superZoom {
            0% { transform: translate(-50%, -50%) scale(0.1) rotate(-10deg); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.3) rotate(3deg); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
        }
        .super-text {
            position: absolute;
            top: 50%;
            left: 50%;
            font-size: clamp(3rem, 7vw, 7rem);
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 80px var(--amber), 0 0 120px #f59e0b;
            z-index: 100;
            letter-spacing: 5px;
            text-transform: uppercase;
            animation: superZoom 1s forwards;
            pointer-events: none;
            text-align: center;
            line-height: 1;
        }
        .super-text .super-emoji {
            display: block;
            font-size: clamp(4rem, 9vw, 9rem);
            margin-bottom: 10px;
        }

        /* ============================================================
           ТИКЕР
           ============================================================ */
        .ticker-wrap {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 64px;
            background: rgba(0, 0, 0, 0.92);
            overflow: hidden;
            border-top: 2px solid var(--ice-bright);
            z-index: 100;
            display: flex;
            align-items: center;
        }
        .ticker {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: tickerMove 18s linear infinite;
            font-size: 26px;
            font-weight: 700;
            color: var(--ice-bright);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        @keyframes tickerMove {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* ============================================================
           HP-ДИСПЛЕЙ (КРУПНО, для проектора)
           ============================================================ */
        .hp-display {
            position: absolute;
            top: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 22px;
            border-radius: 999px;
            background: rgba(0,0,0,0.55);
            border: 2px solid;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            z-index: 22;
        }
        .hp-display.hp-red { left: 20px; border-color: rgba(255, 59, 92, 0.6); color: var(--red-team); }
        .hp-display.hp-blue { right: 20px; border-color: rgba(61, 139, 255, 0.6); color: var(--blue-team); }
        .hp-display .hp-icon { font-size: clamp(1.4rem, 2.2vw, 2rem); }
        .hp-display .hp-value {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 900;
            font-size: clamp(1.6rem, 3vw, 2.6rem);
            color: #fff;
            text-shadow: 0 0 20px currentColor;
        }
        .hp-display .hp-label {
            font-size: clamp(0.7rem, 1.2vw, 0.9rem);
            font-weight: 900;
            letter-spacing: 0.15em;
            color: rgba(255,255,255,0.7);
            text-transform: uppercase;
        }

        /* ============================================================
           ИНДИКАТОР ХОДА
           ============================================================ */
        #turn-indicator {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 32px;
            border-radius: 999px;
            background: rgba(0,0,0,0.65);
            border: 1.5px solid rgba(127, 227, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            font-weight: 900;
            letter-spacing: 0.1em;
            z-index: 22;
            white-space: nowrap;
            text-transform: uppercase;
        }

        /* ============================================================
           ТАЙМЕР НАД ИГРОКОМ
           ============================================================ */
        .tv-turn-timer {
            position: absolute;
            z-index: 25;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .tv-turn-timer.active { opacity: 1; }

        .tv-turn-timer-ring {
            position: relative;
            width: clamp(80px, 6vw, 120px);
            height: clamp(80px, 6vw, 120px);
        }

        .tv-turn-timer-ring svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .tv-turn-timer-ring .bg {
            fill: none;
            stroke: rgba(255,255,255,0.15);
            stroke-width: 7;
        }

        .tv-turn-timer-ring .progress {
            fill: none;
            stroke-width: 7;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.1s linear;
        }

        .tv-turn-timer-ring.red .progress {
            stroke: var(--red-team);
            filter: drop-shadow(0 0 12px var(--red-team));
        }
        .tv-turn-timer-ring.blue .progress {
            stroke: var(--blue-team);
            filter: drop-shadow(0 0 12px var(--blue-team));
        }

        .tv-turn-timer-ring.danger .progress {
            stroke: var(--amber);
            filter: drop-shadow(0 0 18px var(--amber));
        }

        .tv-turn-timer-value {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(1.8rem, 2.6vw, 2.6rem);
            font-weight: 900;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 20px currentColor;
        }

        .tv-turn-timer-name {
            position: absolute;
            bottom: -32px;
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(0.85rem, 1.3vw, 1.1rem);
            font-weight: 900;
            letter-spacing: 0.15em;
            white-space: nowrap;
            text-shadow: 0 0 12px currentColor;
            text-transform: uppercase;
        }

        .attract-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(10, 37, 64, 0.3) 40%, rgba(3, 8, 15, 0.85) 100%);
            z-index: 25;
            pointer-events: none;
        }

        /* ============================================================
           CONFETTI
           ============================================================ */
        @keyframes confettiFall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        .confetti {
            position: fixed;
            top: 0;
            width: 10px; height: 10px;
            z-index: 150;
            pointer-events: none;
            animation: confettiFall linear forwards;
        }

        @keyframes winPop {
            0% { transform: scale(0.3); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body class="h-screen w-screen relative overflow-hidden" id="main-body">

    <div id="snow-container" class="fixed inset-0 pointer-events-none z-0"></div>
    <canvas id="game-canvas"></canvas>

    <div class="ui-layer">
        <div class="hp-display hp-red" id="heart-red" style="display: none;">
            <span class="hp-icon">🔴</span>
            <div>
                <div class="hp-label">Красные</div>
                <div class="hp-value" id="heart-red-value">0</div>
            </div>
        </div>
        <div class="hp-display hp-blue" id="heart-blue" style="display: none;">
            <div>
                <div class="hp-label">Синие</div>
                <div class="hp-value" id="heart-blue-value">0</div>
            </div>
            <span class="hp-icon">🔵</span>
        </div>

        <div id="turn-indicator" style="display: none;">ХОД: ...</div>

        <div class="tv-turn-timer" id="tv-turn-timer">
            <div class="tv-turn-timer-ring" id="tv-turn-timer-ring">
                <svg viewBox="0 0 90 90">
                    <circle class="bg" cx="45" cy="45" r="38"></circle>
                    <circle class="progress" cx="45" cy="45" r="38" id="tv-turn-timer-progress"></circle>
                </svg>
                <div class="tv-turn-timer-value" id="tv-turn-timer-value">15</div>
            </div>
            <div class="tv-turn-timer-name" id="tv-turn-timer-name"></div>
        </div>
    </div>

    <!-- ATTRACT -->
    <div id="attract-view" class="full-screen hidden">
        <div class="attract-overlay"></div>

        <div class="attract-top">
            <div class="attract-logo-wrap" aria-label="ENDORPHIN">
                <svg viewBox="0 0 600 120" xmlns="http://www.w3.org/2000/svg" role="img">
                    <defs>
                        <linearGradient id="tvLogoGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#ffffff"/>
                            <stop offset="55%" stop-color="#a8e6ff"/>
                            <stop offset="100%" stop-color="#22d3ee"/>
                        </linearGradient>
                        <filter id="tvLogoGlow" x="-20%" y="-50%" width="140%" height="200%">
                            <feGaussianBlur stdDeviation="5" result="blur"/>
                            <feMerge>
                                <feMergeNode in="blur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    <text x="300" y="88" text-anchor="middle"
                          font-family="Montserrat, sans-serif"
                          font-weight="900" font-size="96"
                          letter-spacing="-3"
                          fill="url(#tvLogoGrad)"
                          stroke="rgba(127,227,255,0.35)"
                          stroke-width="0.7"
                          filter="url(#tvLogoGlow)">ENDORPHIN</text>
                </svg>
            </div>
            <p class="attract-subtitle">Снежный Баттл</p>

            <div class="attract-phrase" id="attract-phrase">ИГРАЙ С ДРУЗЬЯМИ</div>

            <div class="attract-cta">ХОЧЕШЬ ПОИГРАТЬ?</div>
            <div class="attract-hint">ПОДХОДИ К ВЕДУЩЕМУ</div>
        </div>

        <div class="attract-bottom">
            <a id="lobby-ad" class="ad-block hidden" href="#" target="_blank" rel="noopener">
                <img id="lobby-ad-img" src="" alt="Реклама" class="hidden">
                <span id="lobby-ad-text">РЕКЛАМА</span>
            </a>
        </div>
    </div>

    <!-- QR -->
    <div id="qr-view" class="full-screen hidden">
        <h1 class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-blue-400 to-indigo-500 mb-6 tracking-tighter">ENDORPHIN</h1>
        <p class="text-2xl font-bold text-cyan-100/70 tracking-[0.25em] mb-8">СКАНИРУЙ И ИГРАЙ</p>

        <div id="qr-container" class="qr-container">
            <div class="qr-team glass-panel">
                <div class="qr-team-badge red">🔴 КРАСНЫЕ</div>
                <div class="qr-box" id="qr-red"></div>
                <div class="qr-players" id="qr-players-red"></div>
            </div>

            <div class="qr-vs">VS</div>

            <div class="qr-team glass-panel">
                <div class="qr-team-badge blue">🔵 СИНИЕ</div>

        const firebaseConfig = {

        // ============================================================

        const TURN_TIME = 15;

        // ============================================================
        // СОСТОЯНИЕ

        let currentData = null;

        const players = new Map();
        let snowballs = [];

        let isPreloading = false;

        let formingShots = [];

        let displayedAimPower = null;

        let winnerCountdownInterval = null;
        let superTextTimeout = null;

        // ============================================================
        // ATTRACT DEMO
        // ============================================================
        const DEMO_ACTS = [
            {
                id: 'act1', duration: 8000, phrase: 'ИГРАЙ С ДРУЗЬЯМИ',
                players: [
                    { id: 'r1', team: 'red', name: 'Игрок' },
                    { id: 'b1', team: 'blue', name: 'Соперник' }
                ]
            },
            {
                id: 'act2', duration: 10000, phrase: 'ПРОВЕРЬ, КАКОЙ ТЫ СНАЙПЕР',
                players: [
                    { id: 'r1', team: 'red', name: 'Аня' },
                    { id: 'r2', team: 'red', name: 'Дима' },
                    { id: 'r3', team: 'red', name: 'Макс' },
                    { id: 'b1', team: 'blue', name: 'Оля' },
                    { id: 'b2', team: 'blue', name: 'Костя' },
                    { id: 'b3', team: 'blue', name: 'Женя' }
                ]
            },
            {
                id: 'act3', duration: 12000, phrase: 'ИГРАЙ НЕЧЕСТНО · ИСПОЛЬЗУЙ СУПЕРБРОСКИ',
                players: [
                    { id: 'r1', team: 'red', name: 'Герой' },
                    { id: 'b1', team: 'blue', name: 'Син' },
                    { id: 'b2', team: 'blue', name: 'Син' },
                    { id: 'b3', team: 'blue', name: 'Син' },
                    { id: 'b4', team: 'blue', name: 'Син' }

        let demoActIndex = 0;
        let demoActStartTime = 0;
        let demoState = 'idle';
        let demoNextActionAt = 0;
        let demoPlayers = [];
        let demoSnowballs = [];
        let demoParticles = [];
        let demoActiveId = null;
        let demoSuperTexts = [];

        function getDemoGradient(name) {
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
                hash |= 0;
            }
            const hue1 = Math.abs(hash) % 360;
            const hue2 = (hue1 + 60) % 360;
            return [`hsl(${hue1}, 70%, 60%)`, `hsl(${hue2}, 70%, 40%)`];
        }

        function initDemoAct(index) {
            const act = DEMO_ACTS[index];
            if (!act) return;

            demoActIndex = index;
            demoActStartTime = Date.now();
            demoState = 'aiming';
            demoNextActionAt = Date.now() + 1000;
            demoSnowballs = [];
            demoParticles = [];
            demoSuperTexts = [];

            demoPlayers = act.players.map((p) => {
                const teamPlayers = act.players.filter(x => x.team === p.team);
                const teamIndex = teamPlayers.findIndex(x => x.id === p.id);
                const teamCount = teamPlayers.length;

                const baseX = p.team === 'red' ? 0.15 : 0.85;
                const yOffset = teamCount > 1
                    ? (teamIndex - (teamCount - 1) / 2) / Math.max(1, teamCount - 1) * 0.55
                    : 0;

                return {
                    id: p.id, name: p.name, team: p.team,
                    x: width * (baseX + (Math.random() - 0.5) * 0.02),
                    y: height * (0.5 + yOffset + (Math.random() - 0.5) * 0.04),
                    radius: teamCount > 3 ? 26 : 34,
                    lives: 3, alive: true,
                    aimAngle: 45 + (Math.random() - 0.5) * 30,
                    aimPower: 60 + Math.random() * 30
                };
            });

            const aliveAll = demoPlayers.filter(p => p.alive);
            if (aliveAll.length > 0) demoActiveId = aliveAll[Math.floor(Math.random() * aliveAll.length)].id;

            const phraseEl = document.getElementById('attract-phrase');
            phraseEl.style.opacity = '0';
            setTimeout(() => {
                phraseEl.innerText = act.phrase;
                phraseEl.style.opacity = '1';
            }, 300);
        }

        function drawDemoPlayer(p, isActive) {
            const teamColor = p.team === 'red' ? '#ff3b5c' : '#3d8bff';
            const [c1, c2] = getDemoGradient(p.name);

            if (isActive && p.alive) {
                const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 200);
                ctx.save();
                ctx.strokeStyle = teamColor;
                ctx.lineWidth = 3;
                ctx.shadowColor = teamColor;
                ctx.shadowBlur = 30 * pulse;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius + 10 + pulse * 8, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }

            if (!p.alive) {
                ctx.save();
                ctx.globalAlpha = 0.3;
                ctx.font = `${p.radius}px Montserrat`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('💀', p.x, p.y);
                ctx.restore();
                return;
            }

            ctx.save();
            ctx.shadowColor = teamColor;
            ctx.shadowBlur = 20;
            const g = ctx.createRadialGradient(p.x - 8, p.y - 8, 4, p.x, p.y, p.radius);
            g.addColorStop(0, c1);
            g.addColorStop(1, c2);
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = teamColor;
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.restore();

            ctx.save();
            ctx.font = `bold ${p.radius * 0.85}px Montserrat`;
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0,0,0,0.6)';
            ctx.shadowBlur = 4;
            ctx.fillText(p.name.charAt(0).toUpperCase(), p.x, p.y);
            ctx.restore();

            if (p.radius >= 32) {
                ctx.save();
                ctx.font = 'bold 13px Montserrat';
                ctx.fillStyle = '#fff';
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(0,0,0,0.9)';
                ctx.shadowBlur = 6;
                ctx.fillText(p.name, p.x, p.y + p.radius + 16);
                ctx.restore();
            }

            ctx.save();
            ctx.font = `${p.radius >= 32 ? 16 : 12}px Montserrat`;
            ctx.textAlign = 'center';
            const hearts = p.lives <= 5 ? '❤️'.repeat(Math.max(0, p.lives)) : `❤️×${p.lives}`;
            ctx.fillText(hearts, p.x, p.y - p.radius - 10);
            ctx.restore();
        }

        function drawDemoAim(p) {
            const direction = p.team === 'red' ? 1 : -1;
            const rad = p.aimAngle * Math.PI / 180;
            const teamColor = p.team === 'red' ? '#ff3b5c' : '#3d8bff';

            const lineLength = 30 + p.aimPower * 0.3;
            const endX = p.x + Math.cos(rad) * lineLength * direction;
            const endY = p.y - Math.sin(rad) * lineLength;

            ctx.save();
            ctx.setLineDash([10, 8]);
            ctx.lineDashOffset = -(Date.now() / 50) % 18;
            ctx.strokeStyle = teamColor;
            ctx.lineWidth = 4;
            ctx.globalAlpha = 0.8;
            ctx.shadowColor = teamColor;
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(endX, endY);
            ctx.stroke();
            ctx.restore();

            const headAngle = Math.atan2(endY - p.y, endX - p.x);
            ctx.save();
            ctx.translate(endX, endY);
            ctx.rotate(headAngle);
            ctx.fillStyle = teamColor;
            ctx.shadowColor = teamColor;
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-16, -8);
            ctx.lineTo(-16, 8);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function demoShoot(shooter, target, isSuper = false, superType = null) {
            if (!target) return;

            const direction = shooter.team === 'red' ? 1 : -1;
            const dx = target.x - shooter.x;
            const dy = target.y - shooter.y;
            const baseAngle = Math.atan2(-dy, dx * direction) * 180 / Math.PI;
            const power = isSuper ? 70 + Math.random() * 30 : shooter.aimPower;

            if (isSuper) {
                const shots = [];
                if (superType === 'fan') {
                    for (let i = 0; i < 6; i++) shots.push({ angle: baseAngle + (Math.random() - 0.5) * 60, power: power + (Math.random() - 0.5) * 40 });
                } else if (superType === 'shotgun') {
                    for (let i = 0; i < 8; i++) shots.push({ angle: baseAngle + (Math.random() - 0.5) * 20, power: power + (Math.random() - 0.5) * 10 });
                } else if (superType === 'nuke') {
                    shots.push({ angle: baseAngle, power: power, damage: 3 });
                }

                shots.forEach(s => {
                    demoSnowballs.push({
                        x: shooter.x, y: shooter.y,
                        vx: Math.cos(s.angle * Math.PI / 180) * (s.power * 0.4) * direction,
                        vy: -Math.sin(s.angle * Math.PI / 180) * (s.power * 0.4),
                        gravity: 0.3, team: shooter.team, radius: 12,
                        isSuper: true, damage: s.damage || 1
                    });
                });

                const superNames = { fan: { emoji: '🌪', name: 'ВЕЕР' }, shotgun: { emoji: '💥', name: 'ДРОБОВИК' }, nuke: { emoji: '☄️', name: 'ЯДЕРКА' } };
                const sn = superNames[superType] || { emoji: '⚡', name: 'СУПЕР' };
                demoSuperTexts.push({ text: sn.name, emoji: sn.emoji, x: shooter.x, y: shooter.y - 60, life: 1 });
            } else {
                demoSnowballs.push({
                    x: shooter.x, y: shooter.y,
                    vx: Math.cos(baseAngle * Math.PI / 180) * (power * 0.4) * direction,
                    vy: -Math.sin(baseAngle * Math.PI / 180) * (power * 0.4),
                    gravity: 0.3, team: shooter.team, radius: 11,
                    isSuper: false, damage: 1
                });
            }

            for (let i = 0; i < 10; i++) {
                demoParticles.push({
                    x: shooter.x, y: shooter.y,
                    vx: (Math.random() - 0.5) * 8 * direction,
                    vy: (Math.random() - 0.5) * 8,
                    life: 0.6,
                    color: isSuper ? '#fbbf24' : (shooter.team === 'red' ? '#ff3b5c' : '#3d8bff'),
                    size: Math.random() * 4 + 2
                });
            }
        }

        function updateDemo() {
            if (lastScreen !== 'attract') return;
            const now = Date.now();
            const act = DEMO_ACTS[demoActIndex];
            if (!act) return;

            if (now - demoActStartTime > act.duration) {
                let nextIndex = demoActIndex + 1;
                if (nextIndex >= DEMO_ACTS.length) nextIndex = 0;
                initDemoAct(nextIndex);
                return;
            }

            let alivePlayers = demoPlayers.filter(p => p.alive);
            if (alivePlayers.length === 0) {
                demoPlayers.forEach(p => { p.lives = 3; p.alive = true; });
                alivePlayers = demoPlayers.filter(p => p.alive);
            }

            let currentActive = demoPlayers.find(p => p.id === demoActiveId);
            if (!currentActive || !currentActive.alive) {
                if (alivePlayers.length > 0) {
                    demoActiveId = alivePlayers[Math.floor(Math.random() * alivePlayers.length)].id;
                    currentActive = demoPlayers.find(p => p.id === demoActiveId);
                }
            }
            if (!currentActive || !currentActive.alive) return;

            if (demoState === 'aiming') {
                currentActive.aimAngle += (Math.random() - 0.5) * 4;
                currentActive.aimAngle = Math.max(10, Math.min(170, currentActive.aimAngle));
                currentActive.aimPower = 50 + Math.sin(now / 400) * 30 + 20;

                if (now >= demoNextActionAt) {
                    const enemies = demoPlayers.filter(p => p.team !== currentActive.team && p.alive);
                    if (enemies.length > 0) {
                        const target = enemies[Math.floor(Math.random() * enemies.length)];
                        const useSuper = act.id === 'act3' && Math.random() < 0.45;
                        if (useSuper) {
                            const supers = ['fan', 'shotgun', 'nuke'];
                            const type = supers[Math.floor(Math.random() * supers.length)];
                            demoShoot(currentActive, target, true, type);
                        } else {
                            demoShoot(currentActive, target, false);
                        }
                    }
                    demoState = 'shooting';
                    demoNextActionAt = now + 1000 + Math.random() * 800;
                }
            } else if (demoState === 'shooting' && now >= demoNextActionAt) {
                demoState = 'aiming';
                demoNextActionAt = now + 1000;

                demoPlayers.forEach(p => {
                    if (!p.alive) return;
                    if (p.id !== demoActiveId && Math.random() < 0.3) {
                        p.lives--;
                        if (p.lives <= 0) {
                            p.alive = false;
                            setTimeout(() => {
                                if (lastScreen === 'attract') { p.lives = 3; p.alive = true; }
                            }, 2500);
                        }
                    }
                });

                const aliveList = demoPlayers.filter(p => p.alive);
                if (aliveList.length > 0) demoActiveId = aliveList[Math.floor(Math.random() * aliveList.length)].id;
            }

            for (let i = demoSnowballs.length - 1; i >= 0; i--) {
                const b = demoSnowballs[i];
                b.x += b.vx; b.y += b.vy; b.vy += b.gravity;
                if (b.x < -50 || b.x > width + 50 || b.y > height + 50) demoSnowballs.splice(i, 1);
            }
            for (let i = demoParticles.length - 1; i >= 0; i--) {
                const p = demoParticles[i];
                p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= 0.02;
                if (p.life <= 0) demoParticles.splice(i, 1);
            }
            for (let i = demoSuperTexts.length - 1; i >= 0; i--) {
                const t = demoSuperTexts[i];
                t.y -= 0.8; t.life -= 0.015;
                if (t.life <= 0) demoSuperTexts.splice(i, 1);
            }
        }

        function drawDemo() {
            if (lastScreen !== 'attract') return;
            ctx.clearRect(0, 0, width, height);

            ctx.fillStyle = 'rgba(10, 37, 64, 0.3)';
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = 'rgba(255, 59, 92, 0.03)';
            ctx.fillRect(0, 0, width * 0.4, height);
            ctx.fillStyle = 'rgba(61, 139, 255, 0.03)';
            ctx.fillRect(width * 0.6, 0, width * 0.4, height);

            demoPlayers.forEach(p => {
                if (p.id === demoActiveId && p.alive) drawDemoAim(p);
                drawDemoPlayer(p, p.id === demoActiveId);
            });

            demoSnowballs.forEach(b => {
                ctx.save();
                ctx.shadowColor = b.isSuper ? '#fbbf24' : (b.team === 'red' ? '#ff3b5c' : '#3d8bff');
                ctx.shadowBlur = b.isSuper ? 30 : 20;
                const radius = b.isSuper ? 14 : 11;
                const g = ctx.createRadialGradient(b.x - 3, b.y - 3, 1, b.x, b.y, radius);
                g.addColorStop(0, '#fff');
                g.addColorStop(1, b.isSuper ? '#fbbf24' : (b.team === 'red' ? '#f87171' : '#60a5fa'));
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(b.x, b.y, radius, 0, Math.PI * 2);
                ctx.fill();
                if (b.isSuper) {
                    ctx.strokeStyle = '#fbbf24';
                    ctx.lineWidth = 2;
                    ctx.globalAlpha = 0.6;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, radius + 5, 0, Math.PI * 2);
                    ctx.stroke();
                }
                ctx.restore();
            });

            demoParticles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            });

            demoSuperTexts.forEach(t => {
                ctx.save();
                ctx.globalAlpha = t.life;
                ctx.font = 'bold 28px Montserrat';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#fbbf24';
                ctx.shadowColor = '#fbbf24';
                ctx.shadowBlur = 20;
                ctx.fillText(`${t.emoji} ${t.text}`, t.x, t.y);
                ctx.restore();
            });
        }

        // ============================================================
        // УТИЛИТЫ
        // ============================================================
        function getBaseUrl() {
            const url = new URL(window.location.href);
            return url.origin + url.pathname.substring(0, url.pathname.lastIndexOf('/') + 1);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function getNameGradient(name) {
            let hash = 0;
            const s = name || '?';
            for (let i = 0; i < s.length; i++) {
                hash = s.charCodeAt(i) + ((hash << 5) - hash);
                hash |= 0;
            }
            const hue1 = Math.abs(hash) % 360;
            const hue2 = (hue1 + 60 + Math.abs(hash >> 8) % 60) % 360;
            return `linear-gradient(135deg, hsl(${hue1}, 70%, 55%), hsl(${hue2}, 70%, 45%))`;
        }

        function getInitial(name) { return (name || '?').trim().charAt(0).toUpperCase() || '?'; }

        function applyAvatar(el, name, size = 'sm') {
            el.style.background = getNameGradient(name);
            el.innerText = getInitial(name);
            el.className = `avatar avatar-${size}`;
        }

        function renderHeartsCompact(lives) {
            if (lives <= 0) return '💀';
            if (lives <= 5) return '❤️'.repeat(lives);
            return `❤️×${lives}`;
        }

        // ============================================================
        // PLAYER CLASS
        // ============================================================
        class Player {
            constructor(id, data, team) {
                this.id = id;
                this.name = data.name || 'Игрок';
                this.lives = data.lives ?? 3;
                this.alive = data.alive ?? true;
                this.team = team;
                if (data.posX !== undefined && data.posY !== undefined) {
                    this.x = (data.posX / 100) * width;
                    this.y = (data.posY / 100) * height;
                } else {
                    this.x = team === 'red' ? width * 0.1 : width * 0.9;
                    this.y = height * 0.5;
                }
                this.radius = 40;
            }
            update(data) {
                this.name = data.name || this.name;
                this.lives = data.lives ?? this.lives;
                this.alive = data.alive ?? this.alive;
                if (data.posX !== undefined) this.x = (data.posX / 100) * width;
                if (data.posY !== undefined) this.y = (data.posY / 100) * height;
            }
            draw(ctx, isActive) {
                const teamColor = this.team === 'red' ? '#ff3b5c' : '#3d8bff';

                if (!this.alive) {
                    ctx.save();
                    ctx.globalAlpha = 0.4;
                    ctx.font = '48px Montserrat';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('💀', this.x, this.y);
                    ctx.restore();
                    return;
                }

                if (isActive) {
                    ctx.save();
                    const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 200);
                    ctx.strokeStyle = teamColor;
                    ctx.lineWidth = 4;
                    ctx.shadowColor = teamColor;
                    ctx.shadowBlur = 30 * pulse;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius + 12 + pulse * 10, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                ctx.save();
                ctx.shadowColor = teamColor;
                ctx.shadowBlur = 25;
                const gradient = ctx.createRadialGradient(this.x - 10, this.y - 10, 5, this.x, this.y, this.radius);
                let hash = 0;
                for (let i = 0; i < this.name.length; i++) {
                    hash = this.name.charCodeAt(i) + ((hash << 5) - hash);
                    hash |= 0;
                }
                const hue1 = Math.abs(hash) % 360;
                const hue2 = (hue1 + 60) % 360;
                gradient.addColorStop(0, `hsl(${hue1}, 70%, 60%)`);
                gradient.addColorStop(1, `hsl(${hue2}, 70%, 40%)`);
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = teamColor;
                ctx.lineWidth = 4;
                ctx.stroke();
                ctx.restore();

                ctx.save();
                ctx.font = 'bold 36px Montserrat';
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.6)';
                ctx.shadowBlur = 6;
                ctx.fillText(getInitial(this.name), this.x, this.y);
                ctx.restore();

                ctx.save();
                ctx.font = 'bold 18px Montserrat';
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(0,0,0,0.9)';
                ctx.shadowBlur = 8;
                ctx.fillText(this.name, this.x, this.y + this.radius + 26);
                ctx.restore();

                ctx.save();
                ctx.font = '20px Montserrat';
                ctx.textAlign = 'center';
                ctx.fillText(renderHeartsCompact(this.lives), this.x, this.y - this.radius - 15);
                ctx.restore();
            }
        }

        function spawnParticles(x, y, color, count = 30) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 25,
                    vy: (Math.random() - 0.5) * 25,
                    life: 1,
                    color: color || '#ffffff',
                    size: Math.random() * 8 + 2
                });
            }
        }

        class Snowball {
            constructor(shooter, power, angle, damage = 1, isSuper = false) {
                this.x = shooter.x;
                this.y = shooter.y;
                const direction = shooter.team === 'red' ? 1 : -1;
                const rad = angle * Math.PI / 180;
                const speed = power * 0.4;
                this.vx = Math.cos(rad) * speed * direction;
                this.vy = -Math.sin(rad) * speed;
                this.gravity = 0.3;
                this.isMega = (power > 90);
                this.isSuper = isSuper;
                this.damage = damage;
                this.team = shooter.team;
                this.trailCooldown = 0;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.trailCooldown--;
                if (this.trailCooldown <= 0 && Math.random() > 0.3) {
                    const color = this.isSuper ? 'rgba(251, 191, 36, 0.8)' : 'rgba(127, 227, 255, 0.6)';
                    particles.push({
                        x: this.x, y: this.y,
                        vx: (Math.random() - 0.5) * 2,
                        vy: (Math.random() - 0.5) * 2,
                        life: 0.8, color,
                        size: Math.random() * 4 + 2
                    });
                    this.trailCooldown = 2;
                }
            }
            draw(ctx) {
                const radius = this.isSuper ? 18 : 15;
                const color2 = this.isSuper ? '#fbbf24' : '#7fe3ff';
                ctx.shadowColor = this.isSuper ? '#fbbf24' : '#7fe3ff';
                ctx.shadowBlur = this.isSuper ? 40 : 25;
                const gradient = ctx.createRadialGradient(this.x - 5, this.y - 5, 2, this.x, this.y, radius);
                gradient.addColorStop(0, '#ffffff');
                gradient.addColorStop(1, color2);
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
                ctx.fill();
                if (this.isSuper) {
                    ctx.strokeStyle = '#fbbf24';
                    ctx.lineWidth = 2;
                    ctx.globalAlpha = 0.6;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, radius + 6, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.globalAlpha = 1;
                }
                ctx.shadowBlur = 0;
            }
        }

        function drawLiveAim(aimer, angle, power) {
            const direction = aimer.team === 'red' ? 1 : -1;
            const rad = angle * Math.PI / 180;
            const speed = power * 0.4;
            const vx = Math.cos(rad) * speed * direction;
            const vy = -Math.sin(rad) * speed;
            const gravity = 0.3;
            const teamColor = aimer.team === 'red' ? '#ff3b5c' : '#3d8bff';

            let x = aimer.x, y = aimer.y;
            const lineLength = 30 + power * 0.3;
            const lineEndX = x + Math.cos(rad) * lineLength * direction;
            const lineEndY = y - Math.sin(rad) * lineLength;

            ctx.save();
            ctx.setLineDash([14, 10]);
            ctx.lineDashOffset = -(Date.now() / 50) % 24;
            ctx.strokeStyle = teamColor;
            ctx.lineWidth = 5;
            ctx.globalAlpha = 0.85;
            ctx.shadowColor = teamColor;
            ctx.shadowBlur = 25;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(lineEndX, lineEndY);
            ctx.stroke();
            ctx.restore();

            let sx = x, sy = y, svx = vx, svy = vy;
            ctx.save();
            ctx.setLineDash([10, 10]);
            ctx.strokeStyle = teamColor;
            ctx.lineWidth = 3;
            ctx.globalAlpha = 0.4;
            ctx.shadowColor = teamColor;
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            for (let i = 0; i < 25; i++) {
                sx += svx; sy += svy; svy += gravity;
                ctx.lineTo(sx, sy);
                if (sx < -50 || sx > width + 50 || sy > height + 50) break;
            }
            ctx.stroke();
            ctx.restore();

            const headAngle = Math.atan2(lineEndY - y, lineEndX - x);
            ctx.save();
            ctx.translate(lineEndX, lineEndY);
            ctx.rotate(headAngle);
            ctx.fillStyle = teamColor;
            ctx.shadowColor = teamColor;
            ctx.shadowBlur = 30;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-22, -10);
            ctx.lineTo(-22, 10);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            ctx.save();
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.strokeStyle = teamColor;
            ctx.lineWidth = 2;
            ctx.shadowColor = teamColor;
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(lineEndX, lineEndY, 26, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.font = 'bold 16px JetBrains Mono, monospace';
            ctx.fillStyle = teamColor;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(Math.round(power) + '%', lineEndX, lineEndY);
            ctx.restore();
        }

        function drawFormingShots(now) {
            formingShots.forEach(fs => {
                const elapsed = now - fs.startTime;
                const progress = Math.min(1, elapsed / FORM_TIME);
                const teamColor = fs.team === 'red' ? '#ff3b5c' : '#3d8bff';
                const baseRadius = 5 + progress * (fs.isSuper ? 25 : 20);
                const bx = fs.x, by = fs.y + 20;

                ctx.save();
                ctx.shadowColor = fs.isSuper ? '#fbbf24' : '#7fe3ff';
                ctx.shadowBlur = (fs.isSuper ? 50 : 30) * progress;
                const gradient = ctx.createRadialGradient(bx - baseRadius * 0.3, by - baseRadius * 0.3, 2, bx, by, baseRadius);
                gradient.addColorStop(0, '#ffffff');
                gradient.addColorStop(1, fs.isSuper ? '#fbbf24' : '#a8e6ff');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(bx, by, baseRadius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                ctx.save();
                ctx.strokeStyle = fs.isSuper ? '#fbbf24' : teamColor;
                ctx.lineWidth = 4;
                ctx.shadowColor = ctx.strokeStyle;
                ctx.shadowBlur = 15;
                ctx.globalAlpha = 0.8;
                ctx.beginPath();
                ctx.arc(bx, by, baseRadius + 15, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * progress);
                ctx.stroke();
                ctx.restore();
            });
        }

        // ============================================================
        // GAME LOOP
        // ============================================================
        function gameLoop() {
            const now = performance.now();

            if (lastScreen === 'attract') {
                updateDemo();
                drawDemo();
            } else if (lastScreen === 'game' && currentData?.preloadDone && currentData?.status === 'playing') {
                ctx.clearRect(0, 0, width, height);

                ctx.fillStyle = 'rgba(10, 37, 64, 0.2)';
                ctx.fillRect(0, 0, width, height);
                ctx.fillStyle = 'rgba(255, 59, 92, 0.05)';
                ctx.fillRect(0, 0, width * 0.25, height);
                ctx.fillStyle = 'rgba(61, 139, 255, 0.05)';
                ctx.fillRect(width * 0.75, 0, width * 0.25, height);

                ctx.strokeStyle = 'rgba(127, 227, 255, 0.05)';
                ctx.lineWidth = 1;
                for (let x = 0; x < width; x += 50) {
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
                }
                for (let y = 0; y < height; y += 50) {
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
                }

                const activeId = currentData?.activePlayerId;
                players.forEach(p => p.draw(ctx, p.id === activeId));

                if (currentAim && formingShots.length === 0) {
                    const aimer = players.get(currentAim.playerId);
                    if (aimer && aimer.alive) {
                        if (displayedAimAngle === null) {
                            displayedAimAngle = currentAim.angle;
                            displayedAimPower = currentAim.power;
                        } else {
                            displayedAimAngle += (currentAim.angle - displayedAimAngle) * 0.25;
                            displayedAimPower += (currentAim.power - displayedAimPower) * 0.25;
                        }
                        drawLiveAim(aimer, displayedAimAngle, displayedAimPower);
                    }
                } else if (!currentAim) {
                    displayedAimAngle = null;
                    displayedAimPower = null;
                }

                if (formingShots.length > 0) drawFormingShots(now);

                for (let i = snowballs.length - 1; i >= 0; i--) {
                    const ball = snowballs[i];
                    ball.update();
                    ball.draw(ctx);
                    let hit = false;
                    players.forEach(p => {
                        if (hit) return;
                        if (p.team !== ball.team && p.alive) {
                            const dx = Math.abs(ball.x - p.x);
                            const dy = Math.abs(ball.y - p.y);
                            if (dx < p.radius && dy < p.radius) {
                                hit = true;
                                handleHit(ball, p);
                            }
                        }
                    });
                    if (hit || ball.x < -100 || ball.x > width + 100 || ball.y > height + 100 || ball.y < -200) {
                        snowballs.splice(i, 1);
                    }
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= 0.02;
                    if (p.life <= 0) { particles.splice(i, 1); continue; }
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }

                updateTurnTimerPosition(now);
            } else {
                ctx.clearRect(0, 0, width, height);
            }

            requestAnimationFrame(gameLoop);
        }

        function updateTurnTimerPosition(now) {
            const timerEl = document.getElementById('tv-turn-timer');
            if (!turnTimerActive || !turnTimerPlayerId) {
                timerEl.classList.remove('active');
                return;
            }
            const player = players.get(turnTimerPlayerId);
            if (!player || !player.alive) {
                timerEl.classList.remove('active');
                return;
            }
            timerEl.style.left = `${player.x}px`;
            timerEl.style.top = `${player.y - 110}px`;
            timerEl.style.transform = 'translateX(-50%)';
            timerEl.classList.add('active');

            const elapsed = (Date.now() - turnTimerStart) / 1000;
            const remaining = Math.max(0, TURN_TIME - elapsed);
            const ratio = remaining / TURN_TIME;

            const progressEl = document.getElementById('tv-turn-timer-progress');
            const valueEl = document.getElementById('tv-turn-timer-value');
            const ringEl = document.getElementById('tv-turn-timer-ring');

            const CIRCUMFERENCE = 2 * Math.PI * 38;
            progressEl.style.strokeDasharray = CIRCUMFERENCE;
            progressEl.style.strokeDashoffset = CIRCUMFERENCE * (1 - ratio);

            valueEl.innerText = Math.ceil(remaining);

            ringEl.classList.remove('red', 'blue', 'danger');
            if (remaining <= 3) ringEl.classList.add('danger');
            else ringEl.classList.add(player.team);
        }

        // ============================================================
        // HIT + GAME OVER
        // ============================================================
        async function handleHit(ball, p) {
            const damage = ball.damage || 1;
            const newLives = Math.max(0, p.lives - damage);
            const newAlive = newLives > 0;

            p.lives = newLives;
            p.alive = newAlive;

            try {
                await update(ref(db, `games/${gameId}/players/${p.team}/${p.id}`), {
                    lives: newLives,
                    alive: newAlive
                });
            } catch (e) {
                console.error('handleHit update failed:', e);
            }

            spawnParticles(ball.x, ball.y, p.team === 'red' ? '#ff3b5c' : '#3d8bff', 20 + damage * 15);
            document.getElementById('main-body').classList.add('screen-shake');
            setTimeout(() => document.getElementById('main-body').classList.remove('screen-shake'), 400);

            if (ball.isSuper) {
                const superDiv = document.createElement('div');
                superDiv.className = 'mega-text';
                superDiv.innerText = damage > 1 ? `☄️ ЯДЕРКА! -${damage}❤️` : '⚡ СУПЕРБРОСОК!';
                superDiv.style.textShadow = '0 0 80px #fbbf24';
                document.body.appendChild(superDiv);
                setTimeout(() => superDiv.remove(), 2000);
            } else if (ball.isMega) {
                const megaDiv = document.createElement('div');
                megaDiv.className = 'mega-text';
                megaDiv.innerText = 'МЕГАБРОСОК!';
                document.body.appendChild(megaDiv);
                setTimeout(() => megaDiv.remove(), 2000);
            }

            await checkGameOver();
        }

        let checkingGameOver = false;
        async function checkGameOver() {
            if (checkingGameOver) return;
            checkingGameOver = true;
            try {
                const snap = await get(ref(db, `games/${gameId}/players`));
                const playersData = snap.val() || {};

                const teamLives = (team) => {
                    const teamPlayers = playersData[team] || {};
                    return Object.values(teamPlayers).reduce((sum, p) =>
                        sum + (p.alive && p.lives > 0 ? p.lives : 0), 0
                    );
                };

                const redLives = teamLives('red');
                const blueLives = teamLives('blue');

                updateHeartsUI();

                if (redLives <= 0 && blueLives <= 0) {
                    await update(gameRef, { status: 'finished', screen: 'winner', winner: 'none' });
                } else if (redLives <= 0) {
                    await update(gameRef, { status: 'finished', screen: 'winner', winner: 'blue' });
                } else if (blueLives <= 0) {
                    await update(gameRef, { status: 'finished', screen: 'winner', winner: 'red' });
                }
            } catch (e) {
                console.error('checkGameOver failed:', e);
            } finally {
                checkingGameOver = false;
            }
        }

        // ============================================================
        // QR
        // ============================================================
        function generateQRs() {
            document.getElementById('qr-red').innerHTML = '';
            document.getElementById('qr-blue').innerHTML = '';

            const redUrl = `${currentBaseUrl}play.html?game=${gameId}&team=red`;
            const blueUrl = `${currentBaseUrl}play.html?game=${gameId}&team=blue`;

            try {
                const qrRed = qrcode(0, 'M'); qrRed.addData(redUrl); qrRed.make();
                document.getElementById('qr-red').innerHTML = qrRed.createImgTag(5, 10);

                const qrBlue = qrcode(0, 'M'); qrBlue.addData(blueUrl); qrBlue.make();
                document.getElementById('qr-blue').innerHTML = qrBlue.createImgTag(5, 10);
            } catch (e) {
                console.error('QR generation failed:', e);
            }

            hasGeneratedQR = true;
        }

        function updateQRPlayersList(data) {
            const renderList = (containerId, team) => {
                const container = document.getElementById(containerId);
                const roomPlayers = Object.entries(data.room?.[team] || {})
                    .sort((a, b) => (a[1].joinedAt || 0) - (b[1].joinedAt || 0));
                const activePlayers = Object.values(data.players?.[team] || {});

                const all = [
                    ...activePlayers.map(p => ({ ...p, _status: 'playing' })),
                    ...roomPlayers.map(([id, p]) => ({ ...p, _status: 'waiting' }))
                ];

                if (all.length === 0) {
                    container.innerHTML = `<div class="text-white/30 italic text-center py-2 text-sm">Нет игроков</div>`;
                    return;
                }

                container.innerHTML = all.map(p => `
                    <div class="qr-player ${team}">
                        <div class="avatar avatar-sm" data-name="${escapeHtml(p.name)}"></div>
                        <span class="name">${escapeHtml(p.name)}</span>
                        ${p._status === 'playing' ? '<span class="text-xs text-cyan-300 font-bold">ИГРАЕТ</span>' : ''}
                    </div>
                `).join('');

                container.querySelectorAll('.avatar[data-name]').forEach(el => {
                    applyAvatar(el, el.dataset.name);
                });
            };

            renderList('qr-players-red', 'red');
            renderList('qr-players-blue', 'blue');

            const redMax = parseInt((data.mode || '1v1').split('v')[0]) || 1;
            const blueMax = parseInt((data.mode || '1v1').split('v')[1]) || 1;
            const redCount = Object.keys(data.room?.red || {}).length + Object.keys(data.players?.red || {}).length;
            const blueCount = Object.keys(data.room?.blue || {}).length + Object.keys(data.players?.blue || {}).length;

            const isReady = redCount >= redMax && blueCount >= blueMax;
            const statusEl = document.getElementById('qr-status');
            if (isReady) {
                statusEl.innerText = '✅ ВСЕ ГОТОВЫ!';
                statusEl.className = 'mt-8 text-xl font-black text-green-400 tracking-wider';
            } else {
                statusEl.innerText = `ОЖИДАНИЕ: ${redCount}/${redMax} vs ${blueCount}/${blueMax}`;
                statusEl.className = 'mt-8 text-xl font-black text-white/60 tracking-wider';
            }
        }

        // ============================================================
        // SCREENS
        // ============================================================
        function hideAllScreens() {
            document.getElementById('attract-view').classList.add('hidden');
            document.getElementById('qr-view').classList.add('hidden');
            document.getElementById('preload-view').classList.add('hidden');
            document.getElementById('win-view').classList.add('hidden');
        }

        function hideGameUI() {
            document.getElementById('turn-indicator').style.display = 'none';
            document.getElementById('tv-turn-timer').classList.remove('active');
            document.getElementById('heart-red').style.display = 'none';
            document.getElementById('heart-blue').style.display = 'none';
        }

        function showAttract() {
            hideAllScreens();
            hideGameUI();
            document.getElementById('attract-view').classList.remove('hidden');

            demoPlayers = [];
            demoSnowballs = [];
            demoParticles = [];
            demoSuperTexts = [];
            demoActIndex = 0;
            initDemoAct(0);
        }

        function showQR(data) {
            demoPlayers = [];
            demoSnowballs = [];
            demoParticles = [];
            demoSuperTexts = [];

            hideAllScreens();
            hideGameUI();
            document.getElementById('qr-view').classList.remove('hidden');

        function showGame() {
            demoPlayers = [];
            demoSnowballs = [];
            demoParticles = [];
            demoSuperTexts = [];

            hideAllScreens();
            document.getElementById('heart-red').style.display = 'flex';
            document.getElementById('heart-blue').style.display = 'flex';
        }

        function showWinner(data) {
            demoPlayers = [];
            demoSnowballs = [];
            demoParticles = [];
            demoSuperTexts = [];

            hideAllScreens();
            hideGameUI();
            document.getElementById('win-view').classList.remove('hidden');

            if (winnerShown) return;
            winnerShown = true;

            const winText = document.getElementById('win-text');
            const winEmoji = document.getElementById('win-emoji');
            const winSubtitle = document.getElementById('win-subtitle');

            if (data.winner === 'red') {
                winText.innerText = 'КРАСНЫЕ ПОБЕДИЛИ!';
                winText.className = 'text-7xl font-black text-red-500 mb-10';
                winEmoji.innerText = '🔴';
                winSubtitle.innerText = 'ТАКТИКА, СИЛА, ПОБЕДА';
                launchConfetti(['#ff3b5c', '#f87171', '#fca5a5']);
            } else if (data.winner === 'blue') {
                winText.innerText = 'СИНИЕ ПОБЕДИЛИ!';
                winText.className = 'text-7xl font-black text-blue-500 mb-10';
                winEmoji.innerText = '🔵';
                winSubtitle.innerText = 'ЛЁД, СКОРОСТЬ, ТОЧНОСТЬ';
                launchConfetti(['#3d8bff', '#60a5fa', '#93c5fd']);
            } else {
                winText.innerText = 'ИГРА ОКОНЧЕНА';

                winEmoji.innerText = '🏁';
                winSubtitle.innerText = 'СПАСИБО ЗА ИГРУ';
