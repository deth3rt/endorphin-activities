<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ENDORPHIN | ТВ ЭКРАН</title>
    
    <!-- Внешние библиотеки -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
    
    <!-- Подключение стилей -->
    <link rel="stylesheet" href="tv.css">
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center relative overflow-hidden" id="main-body">

    <!-- ==================== ФОН (СНЕЖИНКИ) ==================== -->
    <div id="snow-container" class="fixed inset-0 pointer-events-none z-0"></div>

    <!-- ==================== ОСНОВНОЙ ЭКРАН ==================== -->
    <div id="tv-screen" class="flex-1 w-full h-full relative z-10 pb-16">
        
        <!-- ==================== ЭКРАН ЛОББИ ==================== -->
        <div id="lobby-view" class="absolute inset-0 flex flex-col items-center justify-center p-8 transition-opacity duration-500">
            <div class="text-center mb-8">
                <h1 class="text-8xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-blue-400 to-indigo-500 mb-2 drop-shadow-[0_0_30px_rgba(59,130,246,0.8)] tracking-tighter">
                    ENDORPHIN
                </h1>
                <h2 class="text-4xl font-bold text-cyan-100 tracking-[0.3em] uppercase opacity-80">
                    Снежный Баттл
                </h2>
                <div id="tv-mode" class="mt-4 inline-block bg-cyan-900/50 px-8 py-2 rounded-full border border-cyan-500/50 text-2xl font-black text-cyan-300">
                    РЕЖИМ: ОЖИДАНИЕ
                </div>
            </div>

            <div id="qr-container" class="hidden flex gap-24 mb-8">
                <div class="glass-panel p-6 rounded-3xl flex flex-col items-center w-80 relative">
                    <div class="absolute -top-6 w-full text-center">
                        <span class="bg-red-500 text-white font-black px-6 py-2 rounded-full shadow-[0_0_20px_#ef4444]">КРАСНЫЕ</span>
                    </div>
                    <div class="bg-white p-3 rounded-xl mt-4 shadow-lg" id="qr-red"></div>
                    <div id="tv-players-red" class="mt-4 space-y-2 w-full text-center text-sm"></div>
                </div>
                
                <div class="flex flex-col items-center justify-center">
                    <div class="text-6xl font-black text-white/30 italic">VS</div>
                </div>

                <div class="glass-panel p-6 rounded-3xl flex flex-col items-center w-80 relative">
                    <div class="absolute -top-6 w-full text-center">
                        <span class="bg-blue-500 text-white font-black px-6 py-2 rounded-full shadow-[0_0_20px_#3b82f6]">СИНИЕ</span>
                    </div>
                    <div class="bg-white p-3 rounded-xl mt-4 shadow-lg" id="qr-blue"></div>
                    <div id="tv-players-blue" class="mt-4 space-y-2 w-full text-center text-sm"></div>
                </div>
            </div>
            
            <div id="tv-status" class="text-4xl font-black text-white tracking-widest drop-shadow-[0_0_20px_#fff] hidden">
                ОЖИДАНИЕ ИГРОКОВ...
            </div>
        </div>

        <!-- ==================== ЭКРАН БИТВЫ ==================== -->
        <div id="battle-view" class="absolute inset-0 hidden z-10 bg-[#0a2540]">
            <div class="grid-overlay"></div>
            
            <div class="absolute left-0 top-0 bottom-0 w-[20%] bg-gradient-to-r from-red-900/40 to-transparent border-r-4 border-red-500/50"></div>
            <div class="absolute right-0 top-0 bottom-0 w-[20%] bg-gradient-to-l from-blue-900/40 to-transparent border-l-4 border-blue-500/50"></div>
            
            <div id="battlefield" class="absolute left-0 right-0 top-0 bottom-0"></div>
            
            <div class="absolute top-4 left-4 flex flex-col gap-1 glass-panel p-2 rounded-xl z-30 text-3xl">
                <div id="heart-red">❤️❤️❤️</div>
            </div>
            
            <div class="absolute bottom-4 right-4 flex flex-col gap-1 glass-panel p-2 rounded-xl z-30 text-3xl">
                <div id="heart-blue">❤️❤️❤️</div>
            </div>
            
            <div class="absolute top-4 left-1/2 -translate-x-1/2 glass-panel px-8 py-3 rounded-full z-30 text-2xl font-black tracking-widest" id="turn-indicator">
                ХОД: ...
            </div>
            
            <div class="absolute top-20 left-1/2 -translate-x-1/2 text-6xl font-black text-white drop-shadow-[0_0_20px_#fff]" id="tv-timer"></div>
        </div>

        <!-- ==================== ЭКРАН ПОБЕДЫ ==================== -->
        <div id="win-view" class="absolute inset-0 hidden flex-col items-center justify-center bg-black/80 backdrop-blur-2xl z-40">
            <h1 class="text-9xl font-black text-white mb-12 drop-shadow-[0_0_80px_rgba(255,255,255,0.8)]" id="win-text">
                ПОБЕДА!
            </h1>
        </div>
    </div>

    <!-- ==================== БЕГУЩАЯ СТРОКА ==================== -->
    <div class="ticker-wrap">
        <div class="ticker" id="ticker-text">ДОБРО ПОЖАЛОВАТЬ НА ВЕЧЕРИНКУ ENDORPHIN!</div>
    </div>

    <!-- Подключение скриптов -->
    <script type="module" src="tv.js"></script>
</body>
</html>
