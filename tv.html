<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ENDORPHIN | ТВ ЭКРАН</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
        
        :root {
            --bg-gradient: radial-gradient(circle at 50% 0%, #0a2540 0%, #03080f 100%);
            --glass-bg: rgba(10, 37, 64, 0.6);
            --glass-border: rgba(127, 227, 255, 0.3);
            --red-team: #ef4444;
            --blue-team: #3b82f6;
            --cyan-glow: #22d3ee;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            background: var(--bg-gradient);
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            user-select: none;
        }

        /* СНЕЖИНКИ */
        .snowflake {
            position: absolute;
            color: rgba(255, 255, 255, 0.6);
            font-size: 20px;
            animation: fall linear infinite;
            pointer-events: none;
            z-index: 5;
            filter: drop-shadow(0 0 8px #fff);
            top: -10vh;
            will-change: transform;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* СТЕКЛО */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 0 40px rgba(31, 143, 214, 0.2), inset 0 0 20px rgba(127, 227, 255, 0.1);
            border-radius: 1.5rem;
        }

        /* SHAKE */
        @keyframes screenShake {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-5px, 2px); }
            40% { transform: translate(5px, -2px); }
            60% { transform: translate(-8px, 4px); }
            80% { transform: translate(8px, -4px); }
        }
        .screen-shake { animation: screenShake 0.4s cubic-bezier(.36,.07,.19,.97) both; }

        /* CANVAS */
        #game-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            display: block;
        }

        /* UI СЛОЙ */
        .ui-layer {
            position: absolute;
            inset: 0;
            z-index: 20;
            pointer-events: none;
        }

        /* ЛОББИ */
        #lobby-view {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: var(--bg-gradient);
            transition: opacity 0.5s;
        }

        /* ПРЕЛОУДИНГ */
        #preload-view {
            position: absolute;
            inset: 0;
            z-index: 35;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-gradient);
            transition: opacity 0.5s;
        }
        #preload-view.active { display: flex; }

        .preload-title {
            font-size: 4rem;
            font-weight: 900;
            text-align: center;
            line-height: 1.2;
            margin-bottom: 2rem;
            animation: preloadPulse 2s ease-in-out infinite;
        }
        @keyframes preloadPulse {
            0%, 100% { transform: scale(1); text-shadow: 0 0 30px rgba(34, 211, 238, 0.4); }
            50% { transform: scale(1.02); text-shadow: 0 0 60px rgba(34, 211, 238, 0.8); }
        }
        .preload-timer {
            font-size: 8rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 40px rgba(34, 211, 238, 0.6);
            margin: 1rem 0;
            font-variant-numeric: tabular-nums;
        }

        /* РЕКЛАМА */
        .ad-block {
            width: 100%;
            max-width: 600px;
            height: 150px;
            background: rgba(10, 37, 64, 0.6);
            border: 2px dashed rgba(127, 227, 255, 0.4);
            border-radius: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-top: 2rem;
            text-decoration: none;
        }
        .ad-block img { width: 100%; height: 100%; object-fit: contain; }
        .ad-block span {
            color: rgba(168, 230, 255, 0.4);
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.2em;
        }

        /* МЕГАБРОСОК */
        @keyframes megaZoom {
            0% { transform: translate(-50%, -50%) scale(0.1); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        .mega-text {
            position: absolute;
            top: 50%;
            left: 50%;
            font-size: 120px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 80px #fbbf24;
            z-index: 100;
            letter-spacing: 5px;
            text-transform: uppercase;
            animation: megaZoom 0.8s forwards;
            pointer-events: none;
        }

        /* БЕГУЩАЯ СТРОКА */
        .ticker-wrap {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(0, 0, 0, 0.9);
            overflow: hidden;
            border-top: 2px solid var(--cyan-glow);
            z-index: 100;
            display: flex;
            align-items: center;
        }
        .ticker {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: tickerMove 15s linear infinite;
            font-size: 24px;
            font-weight: 700;
            color: var(--cyan-glow);
            text-transform: uppercase;
        }
        @keyframes tickerMove {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* СЕРДЕЧКИ */
        .hp-display {
            position: absolute;
            font-size: 3rem;
            filter: drop-shadow(0 0 10px currentColor);
        }
        .hp-red { top: 20px; left: 20px; color: var(--red-team); }
        .hp-blue { bottom: 80px; right: 20px; color: var(--blue-team); }

        /* ВЫБОР КОМАНДЫ */
        .team-select {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            z-index: 50;
        }
        .team-btn {
            padding: 15px 40px;
            border-radius: 15px;
            font-weight: 900;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid transparent;
        }
        .team-btn.red {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.3);
        }
        .team-btn.red.active {
            background: rgba(239, 68, 68, 0.5);
            border-color: #ef4444;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.6);
        }
        .team-btn.blue {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
            border-color: rgba(59, 130, 246, 0.3);
        }
        .team-btn.blue.active {
            background: rgba(59, 130, 246, 0.5);
            border-color: #3b82f6;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.6);
        }

        /* ФИНИШ */
        @keyframes winPop {
            0% { transform: scale(0.3); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes confettiFall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        .confetti {
            position: fixed;
            top: 0;
            width: 10px; height: 10px;
            z-index: 150;
            pointer-events: none;
            animation: confettiFall linear forwards;
        }

        /* ТАЙМЕР ХОДА (TV) */
        .tv-turn-timer {
            position: absolute;
            z-index: 25;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .tv-turn-timer.active { opacity: 1; }

        .tv-turn-timer-ring {
            position: relative;
            width: 90px;
            height: 90px;
        }

        .tv-turn-timer-ring svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .tv-turn-timer-ring .bg {
            fill: none;
            stroke: rgba(255,255,255,0.15);
            stroke-width: 6;
        }

        .tv-turn-timer-ring .progress {
            fill: none;
            stroke-width: 6;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.1s linear;
        }

        .tv-turn-timer-ring.red .progress {
            stroke: #ef4444;
            filter: drop-shadow(0 0 10px #ef4444);
        }
        .tv-turn-timer-ring.blue .progress {
            stroke: #3b82f6;
            filter: drop-shadow(0 0 10px #3b82f6);
        }

        .tv-turn-timer-ring.danger .progress {
            stroke: #fbbf24;
            filter: drop-shadow(0 0 15px #fbbf24);
        }

        .tv-turn-timer-value {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.2rem;
            font-weight: 900;
            color: #fff;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 20px currentColor;
        }

        .tv-turn-timer-name {
            position: absolute;
            bottom: -28px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.85rem;
            font-weight: 900;
            letter-spacing: 0.15em;
            white-space: nowrap;
            text-shadow: 0 0 10px currentColor;
        }

        /* АНИМАЦИЯ ФОРМИРОВАНИЯ СНЕЖКА */
        @keyframes formingPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
            50% { transform: translate(-50%, -50%) scale(1.4); opacity: 1; }
        }
        @keyframes formingSpin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .forming-label {
            position: absolute;
            transform: translate(-50%, -50%);
            font-size: 0.9rem;
            font-weight: 900;
            letter-spacing: 0.15em;
            white-space: nowrap;
            pointer-events: none;
            z-index: 15;
            animation: formingPulse 0.6s ease-in-out infinite;
            text-shadow: 0 0 20px currentColor;
        }
    </style>
</head>
<body class="h-screen w-screen relative overflow-hidden" id="main-body">

    <div id="snow-container" class="fixed inset-0 pointer-events-none z-0"></div>
    <canvas id="game-canvas"></canvas>

    <div class="ui-layer">
        <div class="hp-display hp-red" id="heart-red">❤️❤️❤️</div>
        <div class="hp-display hp-blue" id="heart-blue">❤️❤️❤️</div>
        
        <div class="absolute top-4 left-1/2 -translate-x-1/2 glass-panel px-8 py-2 rounded-full text-2xl font-black" id="turn-indicator" style="display: none;">ХОД: ...</div>
        <div class="absolute top-20 left-1/2 -translate-x-1/2 text-6xl font-black text-white" id="tv-timer" style="display: none;"></div>

        <!-- Таймер хода (рядом с активным игроком) -->
        <div class="tv-turn-timer" id="tv-turn-timer">
            <div class="tv-turn-timer-ring" id="tv-turn-timer-ring">
                <svg viewBox="0 0 90 90">

    <div id="lobby-view">

        <div id="tv-status" class="text-4xl font-black text-white tracking-widest hidden">ОЖИДАНИЕ ИГРОКОВ...</div>

    <div id="preload-view">

        <div class="preload-timer" id="preload-timer">10</div>
        
        <a id="preload-ad" class="ad-block" href="#" target="_blank">

    <div id="win-view" class="absolute inset-0 hidden flex-col items-center justify-center bg-black/80 backdrop-blur-2xl z-40">

    <div id="confetti-container"></div>

    <div class="ticker-wrap">
        <div class="ticker" id="ticker-text">ДОБРО ПОЖАЛОВАТЬ НА ВЕЧЕРИНКУ ENDORPHIN!</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, set, get, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyCXIR5Tv8lB6ivcGRC3yt1SC66MM6T5b_M", authDomain: "endorphin-battle.firebaseapp.com", databaseURL: "https://endorphin-battle-default-rtdb.europe-west1.firebasedatabase.app", projectId: "endorphin-battle", storageBucket: "endorphin-battle.firebasestorage.app", messagingSenderId: "185259733030", appId: "1:185259733030:web:d72a89a436880973e636e7" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const gameId = 'battle_1';
        const gameRef = ref(db, `games/${gameId}`);

        // ============================================================
        // CANVAS
        // ============================================================
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ============================================================
        // КОНСТАНТЫ
        // ============================================================
        const TURN_TIME = 10;           // сек
        const FORM_TIME = 1500;         // мс — совпадает с play.html

        // ============================================================
        // СОСТОЯНИЕ
        // ============================================================
        let currentData = null;
        let currentBaseUrl = getBaseUrl();
        
        const players = new Map();
        let snowballs = []; 
        let particles = [];
        let lastShotTime = 0;
        let lastShotState = null;

        let preloadInterval = null;
        let isPreloading = false;
        let hasGeneratedQR = false;
        let lastTickerText = '';
        let finishedHandled = false;

        // Прицел (live)
        let currentAim = null;          // { angle, power, team, name, playerId }
        let currentAimPlayerId = null;
        let displayedAimAngle = null;   // для интерполяции
        let displayedAimPower = null;

        // Таймер хода
        let turnTimerStart = 0;
        let turnTimerPlayerId = null;
        let turnTimerActive = false;

        // Формирование снежка
        let formingBall = null;         // { shooterId, x, y, angle, power, team, startTime }

        function getBaseUrl() {
            const url = new URL(window.location.href);
            return url.origin + url.pathname.substring(0, url.pathname.lastIndexOf('/') + 1);
        }

        // ============================================================
        // PLAYER
        // ============================================================
        class Player {
            constructor(id, data, team) {
                this.id = id;
                this.name = data.name || 'Игрок';
                this.lives = data.lives ?? 3;
                this.alive = data.alive ?? true;
                this.team = team;
                
                if (data.posX !== undefined && data.posY !== undefined) {
                    this.x = (data.posX / 100) * width;
                    this.y = (data.posY / 100) * height;
                } else {
                    this.x = team === 'red' ? width * 0.1 : width * 0.9;
                    this.y = height * 0.5;
                }
                
                this.width = 60;
                this.height = 100;
            }

            update(data) {
                this.name = data.name || this.name;
                this.lives = data.lives ?? this.lives;
                this.alive = data.alive ?? this.alive;
                if (data.posX !== undefined) this.x = (data.posX / 100) * width;
                if (data.posY !== undefined) this.y = (data.posY / 100) * height;
            }

            draw(ctx, isActive) {
                if (!this.alive) {
                    ctx.font = '40px Montserrat';
                    ctx.fillStyle = 'rgba(100, 100, 100, 0.5)';
                    ctx.textAlign = 'center';
                    ctx.fillText('💀', this.x, this.y);
                    return;
                }

                const teamColor = this.team === 'red' ? '#ef4444' : '#3b82f6';

                // Подсветка активного игрока
                if (isActive) {
                    ctx.save();
                    const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 200);
                    ctx.strokeStyle = teamColor;
                    ctx.lineWidth = 4;
                    ctx.shadowColor = teamColor;
                    ctx.shadowBlur = 30 * pulse;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.width * 0.9 + pulse * 10, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                ctx.shadowColor = teamColor;
                ctx.shadowBlur = 30;

                ctx.fillStyle = this.team === 'red' ? 'rgba(239, 68, 68, 0.3)' : 'rgba(59, 130, 246, 0.3)';
                ctx.strokeStyle = teamColor;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.roundRect(this.x - this.width/2, this.y - this.height/2, this.width, this.height, 15);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.beginPath();
                ctx.roundRect(this.x - this.width/2 + 5, this.y - this.height/2 + 5, this.width - 10, this.height/3, 10);
                ctx.fill();

                ctx.shadowBlur = 0;

                ctx.font = 'bold 14px Montserrat';
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.fillText(this.name, this.x, this.y + this.height/2 + 20);

                ctx.font = '20px Montserrat';
                ctx.fillText('❤️'.repeat(Math.max(0, this.lives)), this.x, this.y - this.height/2 - 15);
            }
        }

        // ============================================================
        // ЧАСТИЦЫ
        // ============================================================
        function spawnParticles(x, y, color) {
            for (let i = 0; i < 30; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 25,
                    vy: (Math.random() - 0.5) * 25,
                    life: 1,
                    color: color || '#ffffff',
                    size: Math.random() * 8 + 2
                });
            }
        }

        // ============================================================
        // СНЕЖОК
        // ============================================================
        class Snowball {
            constructor(shooter, power, angle) {
                this.x = shooter.x;
                this.y = shooter.y;
                
                const direction = shooter.team === 'red' ? 1 : -1;
                const rad = angle * Math.PI / 180;
                
                const speed = power * 0.4;
                this.vx = Math.cos(rad) * speed * direction;
                this.vy = -Math.sin(rad) * speed;
                
                this.gravity = 0.3;
                this.isMega = (power > 90);
                this.team = shooter.team;
                this.dead = false;
                this.trailCooldown = 0;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;

                this.trailCooldown--;
                if (this.trailCooldown <= 0 && Math.random() > 0.3) {
                    particles.push({
                        x: this.x, y: this.y,
                        vx: (Math.random() - 0.5) * 2,
                        vy: (Math.random() - 0.5) * 2,
                        life: 0.8,
                        color: 'rgba(127, 227, 255, 0.6)',
                        size: Math.random() * 4 + 2
                    });
                    this.trailCooldown = 2;
                }
            }

            draw(ctx) {
                ctx.shadowColor = '#7fe3ff';
                ctx.shadowBlur = 25;

                const gradient = ctx.createRadialGradient(this.x - 5, this.y - 5, 2, this.x, this.y, 15);
                gradient.addColorStop(0, '#ffffff');
                gradient.addColorStop(1, '#7fe3ff');
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 15, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.shadowBlur = 0;
            }
        }

        // ============================================================
        // РАССТАНОВКА
        // ============================================================
        async function ensurePlayerPositions(data, force = false) {
            const redPlayers = data.players?.red || {};
            const bluePlayers = data.players?.blue || {};
            
            const needsPositions = (teamPlayers) => {
                const entries = Object.entries(teamPlayers);
                if (entries.length === 0) return false;
                return entries.some(([id, p]) => 
                    force || p.posX === undefined || p.posY === undefined
                );
            };

            const updates = [];

            if (needsPositions(redPlayers)) {
                const keys = Object.keys(redPlayers);
                const usedY = [];
                keys.forEach((id) => {
                    let posX, posY, attempts = 0;
                    do {
                        posX = 5 + Math.random() * 15;
                        posY = 20 + Math.random() * 60;
                        attempts++;
                    } while (usedY.some(y => Math.abs(y - posY) < 10) && attempts < 50);
                    usedY.push(posY);
                    updates.push(update(ref(db, `games/${gameId}/players/red/${id}`), { posX, posY }));
                });
            }
            
            if (needsPositions(bluePlayers)) {
                const keys = Object.keys(bluePlayers);
                const usedY = [];
                keys.forEach((id) => {
                    let posX, posY, attempts = 0;
                    do {
                        posX = 80 + Math.random() * 15;
                        posY = 20 + Math.random() * 60;
                        attempts++;
                    } while (usedY.some(y => Math.abs(y - posY) < 10) && attempts < 50);
                    usedY.push(posY);
                    updates.push(update(ref(db, `games/${gameId}/players/blue/${id}`), { posX, posY }));
                });
            }

            if (updates.length > 0) await Promise.all(updates);
        }

        // ============================================================
        // ПРИЦЕЛ (LIVE)
        // ============================================================
        function drawAimIndicator(targetX, targetY, angle, power, team) {
            // Экранный угол: для красных 0 = вправо, для синих 0 = влево
            const screenAngle = team === 'red' ? -angle : -(180 - angle);
            const rad = screenAngle * Math.PI / 180;

            const teamColor = team === 'red' ? '#ef4444' : '#3b82f6';
            const aimLength = 140 + power * 0.8;

            // Пунктирная линия (траектория)
            const endX = targetX + Math.cos(rad) * aimLength;
            const endY = targetY + Math.sin(rad) * aimLength;

            // Начало — от игрока, конец — по направлению
            ctx.save();
            ctx.setLineDash([12, 8]);
            ctx.strokeStyle = teamColor;
            ctx.lineWidth = 4;
            ctx.shadowColor = teamColor;
            ctx.shadowBlur = 20;
            ctx.globalAlpha = 0.7;
            ctx.beginPath();
            ctx.moveTo(targetX, targetY);
            ctx.lineTo(endX, endY);
            ctx.stroke();
            ctx.restore();

            // Параболическая дуга (симуляция)
            const powerNorm = power / 100;
            const speed = 5 + powerNorm * 15;
            const vx = Math.cos(rad) * speed;
            const vy = Math.sin(rad) * speed;
            const gravity = 0.4;

            let sx = targetX;
            let sy = targetY;
            let svx = vx;
            let svy = vy;

            ctx.save();
            ctx.setLineDash([6, 6]);
            ctx.strokeStyle = teamColor;
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.4;
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            for (let i = 0; i < 30; i++) {
                sx += svx;
                sy += svy;
                svy += gravity;
                ctx.lineTo(sx, sy);
                if (sx < 0 || sx > width || sy > height) break;
            }
            ctx.stroke();
            ctx.restore();

            // Стрелка на конце
            ctx.save();
            ctx.fillStyle = teamColor;
            ctx.shadowColor = teamColor;
            ctx.shadowBlur = 25;
            ctx.beginPath();
            ctx.arc(endX, endY, 8, 0, Math.PI * 2);
            ctx.fill();

            // Треугольный наконечник
            ctx.translate(endX, endY);
            ctx.rotate(rad);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-18, -8);
            ctx.lineTo(-18, 8);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        // ============================================================
        // ФОРМИРОВАНИЕ СНЕЖКА (визуал)
        // ============================================================
        function drawFormingBall(now) {
            if (!formingBall) return;

            const elapsed = now - formingBall.startTime;
            const progress = Math.min(1, elapsed / FORM_TIME);
            const shooter = players.get(formingBall.shooterId);
            if (!shooter) return;

            const teamColor = formingBall.team === 'red' ? '#ef4444' : '#3b82f6';
            const baseRadius = 5 + progress * 20;

            // Снежок у ног игрока
            const bx = shooter.x;
            const by = shooter.y + 20;

            // Основной шар
            ctx.save();
            ctx.shadowColor = '#7fe3ff';
            ctx.shadowBlur = 30 * progress;

            const gradient = ctx.createRadialGradient(bx - baseRadius * 0.3, by - baseRadius * 0.3, 2, bx, by, baseRadius);
            gradient.addColorStop(0, '#ffffff');
            gradient.addColorStop(1, '#a8e6ff');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(bx, by, baseRadius, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            // Вращающиеся частицы вокруг
            const particleCount = Math.floor(progress * 8);
            for (let i = 0; i < particleCount; i++) {
                const angle = (now / 200 + i * Math.PI * 2 / particleCount) % (Math.PI * 2);
                const dist = baseRadius + 10 + Math.sin(now / 100 + i) * 5;
                const px = bx + Math.cos(angle) * dist;
                const py = by + Math.sin(angle) * dist;

                ctx.save();
                ctx.fillStyle = '#ffffff';
                ctx.globalAlpha = 0.6 + 0.4 * Math.sin(now / 100 + i);
                ctx.shadowColor = teamColor;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(px, py, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Кольцо прогресса
            ctx.save();
            ctx.strokeStyle = teamColor;
            ctx.lineWidth = 4;
            ctx.shadowColor = teamColor;
            ctx.shadowBlur = 15;
            ctx.globalAlpha = 0.8;
            ctx.beginPath();
            ctx.arc(bx, by, baseRadius + 15, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * progress);
            ctx.stroke();
            ctx.restore();
        }

        // ============================================================
        // ИГРОВОЙ ЦИКЛ
        // ============================================================
        function gameLoop() {
            const now = performance.now();

            ctx.clearRect(0, 0, width, height);

            // Фон
            ctx.fillStyle = 'rgba(10, 37, 64, 0.2)';
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = 'rgba(239, 68, 68, 0.05)';
            ctx.fillRect(0, 0, width * 0.25, height);
            ctx.fillStyle = 'rgba(59, 130, 246, 0.05)';
            ctx.fillRect(width * 0.75, 0, width * 0.25, height);

            // Сетка
            ctx.strokeStyle = 'rgba(127, 227, 255, 0.05)';
            ctx.lineWidth = 1;
            for (let x = 0; x < width; x += 50) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
            }
            for (let y = 0; y < height; y += 50) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
            }

            // Активный игрок
            const activeId = currentData?.activePlayerId;

            // Игроки
            players.forEach(p => p.draw(ctx, p.id === activeId));

            // Живой прицел
            if (currentAim && currentData?.status === 'playing' && currentData?.preloadDone && !formingBall) {
                const aimer = players.get(currentAim.playerId);
                if (aimer && aimer.alive) {
                    // Интерполяция
                    if (displayedAimAngle === null) {
                        displayedAimAngle = currentAim.angle;
                        displayedAimPower = currentAim.power;
                    } else {
                        displayedAimAngle += (currentAim.angle - displayedAimAngle) * 0.3;
                        displayedAimPower += (currentAim.power - displayedAimPower) * 0.3;
                    }
                    drawAimIndicator(aimer.x, aimer.y - 20, displayedAimAngle, displayedAimPower, aimer.team);
                }
            } else if (!currentAim) {
                displayedAimAngle = null;
                displayedAimPower = null;
            }

            // Формирование снежка
            if (formingBall) {
                drawFormingBall(now);
                if (now - formingBall.startTime > FORM_TIME) {
                    // Формирование завершено — снежок полетит
                    // (сам полёт управляется через last_shot state)
                }
            }

            // Снежки
            for (let i = snowballs.length - 1; i >= 0; i--) {
                const ball = snowballs[i];
                ball.update();
                ball.draw(ctx);

                let hit = false;
                players.forEach(p => {
                    if (hit) return;
                    if (p.team !== ball.team && p.alive) {
                        const dx = Math.abs(ball.x - p.x);
                        const dy = Math.abs(ball.y - p.y);
                        if (dx < p.width/2 && dy < p.height/2) {
                            hit = true;
                            handleHit(ball, p);
                        }
                    }
                });

                if (hit || ball.x < -100 || ball.x > width + 100 || ball.y > height + 100 || ball.y < -200) {
                    snowballs.splice(i, 1);
                }
            }

            // Частицы
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.15;
                p.life -= 0.02;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }

            // Таймер хода — позиция у активного игрока
            updateTurnTimerPosition(now);

            requestAnimationFrame(gameLoop);
        }

        // ============================================================
        // ТАЙМЕР ХОДА — ПОЗИЦИЯ И ОБНОВЛЕНИЕ
        // ============================================================
        function updateTurnTimerPosition(now) {
            const timerEl = document.getElementById('tv-turn-timer');
            
            if (!turnTimerActive || !turnTimerPlayerId) {
                timerEl.classList.remove('active');
                return;
            }

            const player = players.get(turnTimerPlayerId);
            if (!player || !player.alive) {
                timerEl.classList.remove('active');
                return;
            }

            // Позиция над игроком
            timerEl.style.left = `${player.x}px`;
            timerEl.style.top = `${player.y - 120}px`;
            timerEl.style.transform = 'translateX(-50%)';
            timerEl.classList.add('active');

            // Прогресс
            const elapsed = (Date.now() - turnTimerStart) / 1000;
            const remaining = Math.max(0, TURN_TIME - elapsed);
            const ratio = remaining / TURN_TIME;

            const progressEl = document.getElementById('tv-turn-timer-progress');
            const valueEl = document.getElementById('tv-turn-timer-value');
            const ringEl = document.getElementById('tv-turn-timer-ring');

            const CIRCUMFERENCE = 2 * Math.PI * 38;
            progressEl.style.strokeDasharray = CIRCUMFERENCE;
            progressEl.style.strokeDashoffset = CIRCUMFERENCE * (1 - ratio);

            valueEl.innerText = Math.ceil(remaining);

            // Цвет
            ringEl.classList.remove('red', 'blue', 'danger');
            if (remaining <= 3) {
                ringEl.classList.add('danger');
            } else {
                ringEl.classList.add(player.team);
            }
        }

        // ============================================================
        // ПОПАДАНИЕ
        // ============================================================
        async function handleHit(ball, p) {
            const newLives = Math.max(0, p.lives - 1);
            const newAlive = newLives > 0;

            p.lives = newLives;
            p.alive = newAlive;

            await update(ref(db, `games/${gameId}/players/${p.team}/${p.id}`), {
                lives: newLives,
                alive: newAlive
            });

            spawnParticles(ball.x, ball.y, p.team === 'red' ? '#ef4444' : '#3b82f6');
            document.getElementById('main-body').classList.add('screen-shake');
            setTimeout(() => document.getElementById('main-body').classList.remove('screen-shake'), 400);

            if (ball.isMega) {
                const megaDiv = document.createElement('div');
                megaDiv.className = 'mega-text';
                megaDiv.innerText = 'МЕГАБРОСОК!';
                document.body.appendChild(megaDiv);
                setTimeout(() => megaDiv.remove(), 2000);
            }

            await checkGameOver();
        }

        let checkingGameOver = false;
        async function checkGameOver() {
            if (checkingGameOver) return;
            checkingGameOver = true;

            try {
                const snap = await get(ref(db, `games/${gameId}/players`));
                const playersData = snap.val() || {};
                
                const teamLives = (team) => {
                    const teamPlayers = playersData[team] || {};
                    return Object.values(teamPlayers).reduce((sum, p) => 
                        sum + (p.alive && p.lives > 0 ? p.lives : 0), 0
                    );
                };

                const redLives = teamLives('red');
                const blueLives = teamLives('blue');

                document.getElementById('heart-red').innerText = redLives > 0 ? '❤️'.repeat(redLives) : '💀';
                document.getElementById('heart-blue').innerText = blueLives > 0 ? '❤️'.repeat(blueLives) : '💀';

                if (redLives <= 0 && blueLives <= 0) {
                    await update(gameRef, { status: 'finished', winner: 'none' });
                } else if (redLives <= 0) {
                    await update(gameRef, { status: 'finished', winner: 'blue' });
                } else if (blueLives <= 0) {
                    await update(gameRef, { status: 'finished', winner: 'red' });
                }
            } finally {
                checkingGameOver = false;
            }
        }

        // ============================================================
        // QR

        // ============================================================
        // ПЕРВАЯ КОМАНДА
        // ============================================================
        window.selectFirstTeam = (team) => {
            update(ref(db, `games/${gameId}`), { firstTeam: team });
            document.getElementById('btn-red-start').classList.toggle('active', team === 'red');
            document.getElementById('btn-blue-start').classList.toggle('active', team === 'blue');
        };

        // ============================================================
        // ПРЕЛОУДИНГ
        // ============================================================
        function startPreload(data) {
            if (isPreloading) return;
            isPreloading = true;

            const preloadView = document.getElementById('preload-view');
            const preloadTitle = document.getElementById('preload-title');
            const preloadTimer = document.getElementById('preload-timer');

            const redPlayers = Object.values(data.players?.red || {});
            const bluePlayers = Object.values(data.players?.blue || {});
            
            if (redPlayers.length === 1 && bluePlayers.length === 1) {
                preloadTitle.innerText = `${redPlayers[0].name.toUpperCase()} VS ${bluePlayers[0].name.toUpperCase()}`;
            } else {
                preloadTitle.innerText = `КОМАНДА КРАСНЫХ VS КОМАНДА СИНИХ`;
            }

            preloadView.classList.add('active');
            preloadTimer.innerText = '10';

            let seconds = 10;
            if (preloadInterval) clearInterval(preloadInterval);
            preloadInterval = setInterval(() => {
                seconds--;
                preloadTimer.innerText = seconds;

                if (seconds <= 0) {
                    clearInterval(preloadInterval);
                    preloadView.classList.remove('active');
                    isPreloading = false;
                    update(gameRef, { status: 'playing', timer: null, preloadDone: true });
                }
            }, 1000);
        }

        // ============================================================
        // БЕГУЩАЯ СТРОКА
        // ============================================================
        onValue(ref(db, `games/${gameId}/ticker_messages`), (snap) => {
            const messages = snap.val() || {};
            const keys = Object.keys(messages).sort((a, b) => messages[a].time - messages[b].time);
            const text = keys.length > 0 
                ? keys.map(key => messages[key].text).join('  •  ') 
                : 'ДОБРО ПОЖАЛОВАТЬ НА ВЕЧЕРИНКУ ENDORPHIN!';
            
            if (text !== lastTickerText) {
                lastTickerText = text;
                const ticker = document.getElementById('ticker-text');
                ticker.innerText = text;
                ticker.style.animation = 'none';
                void ticker.offsetWidth;
                ticker.style.animation = '';
            }
        });

        // ============================================================
        // РЕКЛАМА
        // ============================================================
        onValue(ref(db, `games/${gameId}/ad_settings`), (snap) => {
            const data = snap.val();
            if (!data) return;

            if (data.preload) {
                const img = document.getElementById('preload-ad-img');
                const text = document.getElementById('preload-ad-text');
                const link = document.getElementById('preload-ad');
                if (data.preload.img) {
                    img.src = data.preload.img;
                    img.classList.remove('hidden');
                    text.classList.add('hidden');
                } else if (data.preload.text) {
                    text.innerText = data.preload.text;
                    img.classList.add('hidden');
                    text.classList.remove('hidden');
                }
                if (data.preload.link) link.href = data.preload.link;
            }

            if (data.lobby) {
                const container = document.getElementById('lobby-ad');
                const img = document.getElementById('lobby-ad-img');
                const text = document.getElementById('lobby-ad-text');
                container.classList.remove('hidden');
                if (data.lobby.img) {
                    img.src = data.lobby.img;
                    img.classList.remove('hidden');
                    text.classList.add('hidden');
                } else if (data.lobby.text) {
                    text.innerText = data.lobby.text;
                    img.classList.add('hidden');
                    text.classList.remove('hidden');
                }
                if (data.lobby.link) container.href = data.lobby.link;
            }
        });

        // ============================================================
        // LIVE ПРИЦЕЛ (СЛУШАТЕЛЬ)
        // ============================================================
        onValue(ref(db, `games/${gameId}/aim`), (snap) => {
            const aimData = snap.val();
            
            if (!aimData || Object.keys(aimData).length === 0) {
                currentAim = null;
                return;
            }

            // Берём первый (должен быть только один активный)
            const [playerId, data] = Object.entries(aimData)[0];
            
            // Проверяем, что это активный игрок
            if (currentData?.activePlayerId === playerId && currentData?.status === 'playing') {
                currentAim = { ...data, playerId };
            } else {
                currentAim = null;
            }
        });

        // ============================================================
        // ВЫСТРЕЛ (С ФОРМИРОВАНИЕМ)
        // ============================================================
        onValue(ref(db, `games/${gameId}/last_shot`), (snap) => {
            const shot = snap.val();
            if (!shot || !shot.time) return;
            
            // Новый выстрел?
            if (shot.time === lastShotTime && shot.state === lastShotState) return;
            
            const isNewShot = shot.time !== lastShotTime;
            lastShotTime = shot.time;
            lastShotState = shot.state;

            if (isNewShot) {
                // Начало формирования
                const shooter = players.get(shot.shooterId);
                if (shooter && shooter.alive) {
                    formingBall = {
                        shooterId: shot.shooterId,
                        x: shooter.x,
                        y: shooter.y,
                        angle: shot.angle,
                        power: shot.power,
                        team: shot.team,
                        startTime: performance.now()
                    };
                    // Прицел убираем при формировании
                    currentAim = null;
                    displayedAimAngle = null;
                    displayedAimPower = null;
                }
            }

            // Переход к полёту
            if (shot.state === 'flying' && formingBall) {
                const shooter = players.get(shot.shooterId);
                if (shooter) {
                    const ball = new Snowball(shooter, shot.power, shot.angle);
                    snowballs.push(ball);
                }
                formingBall = null;
            }
        });

        // ============================================================
        // ТАЙМЕР (глобальный)
        // ============================================================
        onValue(ref(db, `games/${gameId}/timer`), (snap) => {
            const val = snap.val();
            const tvTimer = document.getElementById('tv-timer');
            if (val !== null && val !== undefined) {
                tvTimer.innerText = val;
                tvTimer.style.display = 'block';
            } else {
                tvTimer.style.display = 'none';
            }
        });

        // ============================================================
        // ОСНОВНОЙ СЛУШАТЕЛЬ
        // ============================================================
        onValue(gameRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            currentData = data;

            if (data.mode) {
                document.getElementById('tv-mode').innerText = `РЕЖИМ: ${data.mode.toUpperCase()}`;
            }

            syncPlayers(data);
            updateHeartsUI();

            // ---------- ЛОББИ ----------
            if (data.status === 'lobby') {
                handleLobby(data);
                return;
            }

            // ---------- ПРЕЛОУДИНГ ----------
            if (data.status === 'playing' && !data.preloadDone && !isPreloading) {
                startPreload(data);
            }

            // ---------- ИГРА ----------
            if (data.status === 'playing') {
                handlePlaying(data);
            }

            // ---------- ФИНИШ ----------
            if (data.status === 'finished') {
                handleFinished(data);
            }
        });

        // ============================================================
        // СИНХРОНИЗАЦИЯ ИГРОКОВ
        // ============================================================
        function syncPlayers(data) {
            const redPlayers = data.players?.red || {};
            const bluePlayers = data.players?.blue || {};

            const allIds = new Set([
                ...Object.keys(redPlayers),
                ...Object.keys(bluePlayers)
            ]);
            for (const [id] of players) {
                if (!allIds.has(id)) players.delete(id);
            }

            Object.entries(redPlayers).forEach(([id, p]) => {
                if (players.has(id)) players.get(id).update(p);
                else players.set(id, new Player(id, p, 'red'));
            });
            Object.entries(bluePlayers).forEach(([id, p]) => {
                if (players.has(id)) players.get(id).update(p);
                else players.set(id, new Player(id, p, 'blue'));
            });
        }

        // ============================================================
        // СЕРДЕЧКИ
        // ============================================================
        function updateHeartsUI() {
            let red = 0, blue = 0;
            players.forEach(p => {
                if (p.alive && p.lives > 0) {
                    if (p.team === 'red') red += p.lives;
                    else blue += p.lives;
                }
            });
            document.getElementById('heart-red').innerText = red > 0 ? '❤️'.repeat(red) : '💀';
            document.getElementById('heart-blue').innerText = blue > 0 ? '❤️'.repeat(blue) : '💀';
        }

        // ============================================================
        // ЛОББИ
        // ============================================================
        function handleLobby(data) {
            const lobbyView = document.getElementById('lobby-view');
            lobbyView.style.opacity = '1';
            lobbyView.style.pointerEvents = 'auto';

            document.getElementById('win-view').classList.add('hidden');
            document.getElementById('win-view').classList.remove('flex');
            document.getElementById('preload-view').classList.remove('active');
            document.getElementById('turn-indicator').style.display = 'none';
            document.getElementById('tv-timer').style.display = 'none';
            document.getElementById('tv-turn-timer').classList.remove('active');

            finishedHandled = false;
            document.getElementById('confetti-container').innerHTML = '';
            
            // Сброс состояния
            formingBall = null;
            snowballs = [];
            currentAim = null;
            turnTimerActive = false;

            if (data.mode) {
                generateQRs();
                
                const maxP = parseInt(data.mode?.charAt(0) || 1);
                const redCount = Object.keys(data.players?.red || {}).length;
                const blueCount = Object.keys(data.players?.blue || {}).length;
                const isReady = redCount >= maxP && blueCount >= maxP;

                document.getElementById('tv-players-red').innerHTML = 
                    Object.values(data.players?.red || {}).map(p => 
                        `<div class="text-red-300 font-bold bg-red-900/40 py-1 rounded border border-red-500/50">👤 ${escapeHtml(p.name)}</div>`
                    ).join('');
                document.getElementById('tv-players-blue').innerHTML = 
                    Object.values(data.players?.blue || {}).map(p => 
                        `<div class="text-blue-300 font-bold bg-blue-900/40 py-1 rounded border border-blue-500/50">👤 ${escapeHtml(p.name)}</div>`
                    ).join('');

                if (isReady) {
                    document.getElementById('team-select').classList.remove('hidden');
                    document.getElementById('tv-status').innerText = "ВСЕ ГОТОВЫ! ВЫБЕРИТЕ ПЕРВУЮ КОМАНДУ.";
                    document.getElementById('tv-status').classList.add('text-green-400');
                } else {
                    document.getElementById('team-select').classList.add('hidden');
                    document.getElementById('tv-status').innerText = "ОЖИДАНИЕ ИГРОКОВ...";
                    document.getElementById('tv-status').classList.remove('text-green-400');
                }

                if (data.firstTeam) {
                    document.getElementById('btn-red-start').classList.toggle('active', data.firstTeam === 'red');
                    document.getElementById('btn-blue-start').classList.toggle('active', data.firstTeam === 'blue');
                }
            }
        }

        // ============================================================
        // ИГРА
        // ============================================================
        function handlePlaying(data) {
            const lobbyView = document.getElementById('lobby-view');
            lobbyView.style.opacity = '0';
            lobbyView.style.pointerEvents = 'none';
            document.getElementById('team-select').classList.add('hidden');

            // Таймер прелоада
            const tvTimer = document.getElementById('tv-timer');
            if (data.timer !== null && data.timer !== undefined) {
                tvTimer.style.display = 'block';
                tvTimer.innerText = data.timer;
            } else {
                tvTimer.style.display = 'none';
            }

            // Ход
            const turnIndicator = document.getElementById('turn-indicator');
            if (data.turn && data.preloadDone) {
                turnIndicator.style.display = 'block';
                turnIndicator.innerText = `ХОД: ${data.turn.name.toUpperCase()}`;
                turnIndicator.style.color = data.turn.team === 'red' ? '#ef4444' : '#3b82f6';
            } else {
                turnIndicator.style.display = 'none';
            }

            // Координаты
            if (data.preloadDone && data.players) {
                ensurePlayerPositions(data);
            }

            // ТАЙМЕР ХОДА — определяем старт
            if (data.preloadDone && data.activePlayerId && !data.timer) {
                // Сменился активный игрок — новый таймер
                if (turnTimerPlayerId !== data.activePlayerId) {
                    turnTimerPlayerId = data.activePlayerId;
                    turnTimerStart = Date.now();
                    turnTimerActive = true;
                }
            } else {
                turnTimerActive = false;
                turnTimerPlayerId = null;
            }
        }

        // ============================================================
        // ФИНИШ
        // ============================================================
        function handleFinished(data) {
            if (finishedHandled) return;
            finishedHandled = true;

            const lobbyView = document.getElementById('lobby-view');
            lobbyView.style.opacity = '0';
            lobbyView.style.pointerEvents = 'none';
            document.getElementById('preload-view').classList.remove('active');
            document.getElementById('turn-indicator').style.display = 'none';
            document.getElementById('tv-timer').style.display = 'none';
            document.getElementById('tv-turn-timer').classList.remove('active');

            turnTimerActive = false;
            formingBall = null;

            const winView = document.getElementById('win-view');
            winView.classList.remove('hidden');
            winView.classList.add('flex');

            const winText = document.getElementById('win-text');
            const winEmoji = document.getElementById('win-emoji');
            const winSubtitle = document.getElementById('win-subtitle');

            if (data.winner === 'red') {
                winText.innerText = 'КРАСНЫЕ ПОБЕДИЛИ!';
                winText.className = 'text-9xl font-black text-red-500 mb-12';
                winEmoji.innerText = '🔴';
                winSubtitle.innerText = 'ТАКТИКА, СИЛА, ПОБЕДА';
                launchConfetti(['#ef4444', '#f87171', '#fca5a5']);
            } else if (data.winner === 'blue') {
                winText.innerText = 'СИНИЕ ПОБЕДИЛИ!';
                winText.className = 'text-9xl font-black text-blue-500 mb-12';
                winEmoji.innerText = '🔵';
                winSubtitle.innerText = 'ЛЁД, СКОРОСТЬ, ТОЧНОСТЬ';
                launchConfetti(['#3b82f6', '#60a5fa', '#93c5fd']);
            } else {
                winText.innerText = 'ИГРА ОКОНЧЕНА';
                winText.className = 'text-9xl font-black text-white mb-12';
                winEmoji.innerText = '🏁';
                winSubtitle.innerText = 'СПАСИБО ЗА ИГРУ';
            }
        }

        // ============================================================
        // КОНФЕТТИ
        // ============================================================
        function launchConfetti(colors) {
            const container = document.getElementById('confetti-container');
            const defaultColors = ['#fbbf24', '#f59e0b', '#22d3ee', '#3b82f6', '#ef4444', '#a855f7', '#22c55e'];
            const palette = colors || defaultColors;

            for (let i = 0; i < 80; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.background = palette[Math.floor(Math.random() * palette.length)];
                c.style.width = (Math.random() * 8 + 6) + 'px';
                c.style.height = (Math.random() * 8 + 6) + 'px';
                c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                c.style.animationDuration = (Math.random() * 2 + 2) + 's';
                c.style.animationDelay = (Math.random() * 0.5) + 's';
                container.appendChild(c);
            }

            setTimeout(() => {
                container.innerHTML = '';
            }, 6000);
        }

        // ============================================================
        // ЭКРАНИРОВАНИЕ
        // ============================================================
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // ============================================================
        // СНЕЖИНКИ
        // ============================================================
        const snowContainer = document.getElementById('snow-container');
        for (let i = 0; i < 40; i++) {
            const s = document.createElement('div');
            s.className = 'snowflake';
            s.innerText = '❄';
            s.style.left = Math.random() * 100 + '%';
            s.style.fontSize = (10 + Math.random() * 20) + 'px';
            s.style.animationDuration = (4 + Math.random() * 8) + 's';
            s.style.animationDelay = (-Math.random() * 10) + 's';
            s.style.opacity = Math.random() * 0.7 + 0.3;
            snowContainer.appendChild(s);
        }

        // ============================================================
        // СТАРТ
        // ============================================================
        gameLoop();
    </script>
</body>
</html>
