<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ENDORPHIN | ТВ ЭКРАН</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
        
        :root {
            --bg-gradient: radial-gradient(circle at 50% 0%, #0a2540 0%, #03080f 100%);
            --glass-bg: rgba(10, 37, 64, 0.6);
            --glass-border: rgba(127, 227, 255, 0.3);
            --red-team: #ef4444;
            --blue-team: #3b82f6;
            --cyan-glow: #22d3ee;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            background: var(--bg-gradient);
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            user-select: none;
        }

        .snowflake {
            position: absolute;
            color: rgba(255, 255, 255, 0.6);
            font-size: 20px;
            animation: fall linear infinite;
            pointer-events: none;
            z-index: 5;
            filter: drop-shadow(0 0 8px #fff);
            top: -10vh;
            will-change: transform;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 0 40px rgba(31, 143, 214, 0.2), inset 0 0 20px rgba(127, 227, 255, 0.1);
            border-radius: 1.5rem;
        }

        @keyframes screenShake {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-5px, 2px); }
            40% { transform: translate(5px, -2px); }
            60% { transform: translate(-8px, 4px); }
            80% { transform: translate(8px, -4px); }
        }
        .screen-shake { animation: screenShake 0.4s cubic-bezier(.36,.07,.19,.97) both; }

        #game-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            display: block;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            z-index: 20;
            pointer-events: none;
        }

        .full-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: var(--bg-gradient);
            z-index: 30;
            transition: opacity 0.5s;
        }
        .full-screen.hidden { display: none; }

        .attract-title {
            font-size: clamp(3rem, 12vw, 9rem);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.03em;
            background: linear-gradient(180deg, #ffffff 0%, #a8e6ff 50%, #22d3ee 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-align: center;
            text-shadow: 
                0 0 40px rgba(34, 211, 238, 0.4),
                0 0 80px rgba(34, 211, 238, 0.2);
            animation: titleFloat 4s ease-in-out infinite;
            margin-bottom: 1rem;
        }
        @keyframes titleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .attract-subtitle {
            font-size: clamp(1rem, 3vw, 2rem);
            font-weight: 700;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(168, 230, 255, 0.7);
            margin-bottom: 3rem;
            text-align: center;
        }

        .attract-cta {
            font-size: clamp(1rem, 2.5vw, 1.8rem);
            font-weight: 900;
            color: #22d3ee;
            text-shadow: 0 0 30px rgba(34, 211, 238, 0.8);
            text-align: center;
            animation: ctaPulse 2s ease-in-out infinite;
            margin-top: 2rem;
        }
        @keyframes ctaPulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .attract-hint {
            font-size: clamp(0.7rem, 1.5vw, 1rem);
            color: rgba(168, 230, 255, 0.4);
            letter-spacing: 0.2em;
            margin-top: 1rem;
            text-align: center;
        }

        .ad-block {
            width: 100%;
            max-width: 700px;
            height: clamp(100px, 20vh, 180px);
            background: rgba(10, 37, 64, 0.6);
            border: 2px dashed rgba(127, 227, 255, 0.4);
            border-radius: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-decoration: none;
        }
        .ad-block.hidden { display: none; }
        .ad-block img { width: 100%; height: 100%; object-fit: contain; }
        .ad-block span {
            color: rgba(168, 230, 255, 0.4);
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            font-weight: 700;
            letter-spacing: 0.2em;
        }

        .qr-container {
            display: flex;
            gap: clamp(2rem, 6vw, 6rem);
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .qr-team {
            position: relative;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: clamp(280px, 25vw, 360px);
        }

        .qr-team-badge {
            position: absolute;
            top: -1.2rem;
            padding: 0.5rem 1.5rem;
            border-radius: 999px;
            font-weight: 900;
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            letter-spacing: 0.1em;
            color: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .qr-team-badge.red { background: #ef4444; }
        .qr-team-badge.blue { background: #3b82f6; }

        .qr-box {
            background: #fff;
            padding: 12px;
            border-radius: 16px;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qr-box img { display: block; }

        .qr-players {
            margin-top: 1rem;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .qr-player {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .qr-player.red { border-color: rgba(239, 68, 68, 0.4); }
        .qr-player.blue { border-color: rgba(59, 130, 246, 0.4); }
        .qr-player .name { flex: 1; }

        .qr-vs {
            font-size: clamp(3rem, 6vw, 5rem);
            font-weight: 900;
            color: rgba(255,255,255,0.2);
            font-style: italic;
        }

        .avatar {
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
            flex-shrink: 0;
            border: 2px solid rgba(255,255,255,0.3);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .avatar-xs { width: 24px; height: 24px; font-size: 0.75rem; }
        .avatar-sm { width: 32px; height: 32px; font-size: 0.9rem; }

        .preload-title {
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 900;
            text-align: center;
            line-height: 1.2;
            margin-bottom: 2rem;
            animation: preloadPulse 2s ease-in-out infinite;
        }
        @keyframes preloadPulse {
            0%, 100% { transform: scale(1); text-shadow: 0 0 30px rgba(34, 211, 238, 0.4); }
            50% { transform: scale(1.02); text-shadow: 0 0 60px rgba(34, 211, 238, 0.8); }
        }
        .preload-timer {
            font-size: clamp(5rem, 12vw, 8rem);
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 40px rgba(34, 211, 238, 0.6);
            margin: 1rem 0;
            font-variant-numeric: tabular-nums;
        }

        @keyframes megaZoom {
            0% { transform: translate(-50%, -50%) scale(0.1); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        .mega-text {
            position: absolute;
            top: 50%;
            left: 50%;
            font-size: clamp(3rem, 8vw, 8rem);
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 80px #fbbf24;
            z-index: 100;
            letter-spacing: 5px;
            text-transform: uppercase;
            animation: megaZoom 0.8s forwards;
            pointer-events: none;
            text-align: center;
        }

        @keyframes superZoom {
            0% { transform: translate(-50%, -50%) scale(0.1) rotate(-10deg); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.3) rotate(3deg); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
        }
        .super-text {
            position: absolute;
            top: 50%;
            left: 50%;
            font-size: clamp(3rem, 7vw, 7rem);
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 80px #fbbf24, 0 0 120px #f59e0b;
            z-index: 100;
            letter-spacing: 5px;
            text-transform: uppercase;
            animation: superZoom 1s forwards;
            pointer-events: none;
            text-align: center;
            line-height: 1;
        }
        .super-text .super-emoji {
            display: block;
            font-size: clamp(4rem, 9vw, 9rem);
            margin-bottom: 10px;
        }

        .ticker-wrap {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(0, 0, 0, 0.9);
            overflow: hidden;
            border-top: 2px solid var(--cyan-glow);
            z-index: 100;
            display: flex;
            align-items: center;
        }
        .ticker {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: tickerMove 15s linear infinite;
            font-size: 24px;
            font-weight: 700;
            color: var(--cyan-glow);
            text-transform: uppercase;
        }
        @keyframes tickerMove {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        .hp-display {
            position: absolute;
            font-size: clamp(1.5rem, 3vw, 3rem);
            filter: drop-shadow(0 0 10px currentColor);
        }
        .hp-red { top: 20px; left: 20px; color: var(--red-team); }
        .hp-blue { bottom: 80px; right: 20px; color: var(--blue-team); }

        @keyframes winPop {
            0% { transform: scale(0.3); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes confettiFall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        .confetti {
            position: fixed;
            top: 0;
            width: 10px; height: 10px;
            z-index: 150;
            pointer-events: none;
            animation: confettiFall linear forwards;
        }

        .tv-turn-timer {
            position: absolute;
            z-index: 25;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .tv-turn-timer.active { opacity: 1; }

        .tv-turn-timer-ring {
            position: relative;
            width: 90px;
            height: 90px;
        }

        .tv-turn-timer-ring svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .tv-turn-timer-ring .bg {
            fill: none;
            stroke: rgba(255,255,255,0.15);
            stroke-width: 6;
        }

        .tv-turn-timer-ring .progress {
            fill: none;
            stroke-width: 6;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.1s linear;
        }

        .tv-turn-timer-ring.red .progress {
            stroke: #ef4444;
            filter: drop-shadow(0 0 10px #ef4444);
        }
        .tv-turn-timer-ring.blue .progress {
            stroke: #3b82f6;
            filter: drop-shadow(0 0 10px #3b82f6);
        }

        .tv-turn-timer-ring.danger .progress {
            stroke: #fbbf24;
            filter: drop-shadow(0 0 15px #fbbf24);
        }

        .tv-turn-timer-value {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.2rem;
            font-weight: 900;
            color: #fff;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 20px currentColor;
        }

        .tv-turn-timer-name {
            position: absolute;
            bottom: -28px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.85rem;
            font-weight: 900;
            letter-spacing: 0.15em;
            white-space: nowrap;
            text-shadow: 0 0 10px currentColor;
        }
    </style>
</head>
<body class="h-screen w-screen relative overflow-hidden" id="main-body">

    <div id="snow-container" class="fixed inset-0 pointer-events-none z-0"></div>
    <canvas id="game-canvas"></canvas>

    <div class="ui-layer">
        <div class="hp-display hp-red" id="heart-red" style="display: none;">❤️❤️❤️</div>
        <div class="hp-display hp-blue" id="heart-blue" style="display: none;">❤️❤️❤️</div>
        
        <div class="absolute top-4 left-1/2 -translate-x-1/2 glass-panel px-8 py-2 rounded-full text-2xl font-black" id="turn-indicator" style="display: none;">ХОД: ...</div>
        <div class="absolute top-20 left-1/2 -translate-x-1/2 text-6xl font-black text-white" id="tv-timer" style="display: none;"></div>

            </div>
            <div class="tv-turn-timer-name" id="tv-turn-timer-name"></div>

    </div>

    <div id="attract-view" class="full-screen hidden">

        <a id="lobby-ad" class="ad-block hidden" href="#" target="_blank">

        <div class="attract-cta">ХОЧЕШЬ ПОИГРАТЬ?</div>

    <div id="qr-view" class="full-screen hidden">
        <h1 class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-blue-400 to-indigo-500 mb-8 tracking-tighter">ENDORPHIN</h1>
        <p class="text-2xl font-bold text-cyan-100/70 tracking-[0.2em] mb-8">СКАНИРУЙ И ИГРАЙ</p>

        <div id="qr-container" class="qr-container">
            <div class="qr-team glass-panel">
                <div class="qr-team-badge red">🔴 КРАСНЫЕ</div>
                <div class="qr-box" id="qr-red"></div>

            </div>

            <div class="qr-vs">VS</div>

            <div class="qr-team glass-panel">
                <div class="qr-team-badge blue">🔵 СИНИЕ</div>

        <div class="mt-8 text-xl font-black text-white/50 tracking-wider" id="qr-status">ОЖИДАНИЕ ИГРОКОВ...</div>

    <div id="preload-view" class="full-screen hidden">

    <div id="win-view" class="full-screen hidden">
        <div class="text-8xl mb-6" id="win-emoji">🏆</div>
        <h1 class="text-9xl font-black text-white mb-12" id="win-text">ПОБЕДА!</h1>
        <p class="text-2xl text-cyan-300/70 font-bold tracking-widest" id="win-subtitle"></p>

    <div id="confetti-container"></div>

    <div class="ticker-wrap">
        <div class="ticker" id="ticker-text">ДОБРО ПОЖАЛОВАТЬ НА ВЕЧЕРИНКУ ENDORPHIN!</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, set, get, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyCXIR5Tv8lB6ivcGRC3yt1SC66MM6T5b_M", authDomain: "endorphin-battle.firebaseapp.com", databaseURL: "https://endorphin-battle-default-rtdb.europe-west1.firebasedatabase.app", projectId: "endorphin-battle", storageBucket: "endorphin-battle.firebasestorage.app", messagingSenderId: "185259733030", appId: "1:185259733030:web:d72a89a436880973e636e7" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const gameId = 'battle_1';
        const gameRef = ref(db, `games/${gameId}`);

        // ============================================================
        // CANVAS
        // ============================================================
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ============================================================
        // КОНСТАНТЫ
        // ============================================================
        const TURN_TIME = 15;
        const FORM_TIME = 1500;
        const WINNER_AUTO_HIDE = 30;

        // ============================================================
        // СОСТОЯНИЕ
        // ============================================================
        let currentData = null;
        let currentBaseUrl = getBaseUrl();
        
        const players = new Map();
        let snowballs = []; 
        let particles = [];
        let lastShotTime = 0;
        let lastShotState = null;

        let isPreloading = false;
        let hasGeneratedQR = false;
        let lastTickerText = '';
        let lastScreen = 'attract';
        let lastMode = null;

        // Таймер хода
        let turnTimerStart = 0;
        let turnTimerPlayerId = null;
        let turnTimerActive = false;

        // Формирование снежков
        let formingShots = [];

        // Live-прицел
        let currentAim = null;
        let displayedAimAngle = null;
        let displayedAimPower = null;

        // Winner таймер
        let winnerCountdownInterval = null;

        // Супер
        let superTextTimeout = null;

        function getBaseUrl() {
            const url = new URL(window.location.href);
            return url.origin + url.pathname.substring(0, url.pathname.lastIndexOf('/') + 1);
        }

        // ============================================================
        // УТИЛИТЫ
        // ============================================================
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function getNameGradient(name) {
            let hash = 0;
            const s = name || '?';
            for (let i = 0; i < s.length; i++) {
                hash = s.charCodeAt(i) + ((hash << 5) - hash);
                hash |= 0;
            }
            const hue1 = Math.abs(hash) % 360;
            const hue2 = (hue1 + 60 + Math.abs(hash >> 8) % 60) % 360;
            return `linear-gradient(135deg, hsl(${hue1}, 70%, 55%), hsl(${hue2}, 70%, 45%))`;
        }

        function getInitial(name) {
            return (name || '?').trim().charAt(0).toUpperCase() || '?';
        }

        function applyAvatar(el, name, size = 'sm') {
            el.style.background = getNameGradient(name);
            el.innerText = getInitial(name);
            el.className = `avatar avatar-${size}`;
        }

        // ============================================================
        // PLAYER (круглый, с аватаром)
        // ============================================================
        class Player {
            constructor(id, data, team) {
                this.id = id;
                this.name = data.name || 'Игрок';
                this.lives = data.lives ?? 3;
                this.alive = data.alive ?? true;
                this.team = team;
                
                if (data.posX !== undefined && data.posY !== undefined) {
                    this.x = (data.posX / 100) * width;
                    this.y = (data.posY / 100) * height;
                } else {
                    this.x = team === 'red' ? width * 0.1 : width * 0.9;
                    this.y = height * 0.5;
                }
                
                this.radius = 40;
            }

            update(data) {
                this.name = data.name || this.name;
                this.lives = data.lives ?? this.lives;
                this.alive = data.alive ?? this.alive;
                if (data.posX !== undefined) this.x = (data.posX / 100) * width;
                if (data.posY !== undefined) this.y = (data.posY / 100) * height;
            }

            draw(ctx, isActive) {
                const teamColor = this.team === 'red' ? '#ef4444' : '#3b82f6';

                if (!this.alive) {
                    ctx.save();
                    ctx.globalAlpha = 0.4;
                    ctx.font = '48px Montserrat';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('💀', this.x, this.y);
                    ctx.restore();
                    return;
                }

                if (isActive) {
                    ctx.save();
                    const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 200);
                    ctx.strokeStyle = teamColor;
                    ctx.lineWidth = 4;
                    ctx.shadowColor = teamColor;
                    ctx.shadowBlur = 30 * pulse;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius + 12 + pulse * 10, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                // Круг с градиентом
                ctx.save();
                ctx.shadowColor = teamColor;
                ctx.shadowBlur = 25;

                const gradient = ctx.createRadialGradient(this.x - 10, this.y - 10, 5, this.x, this.y, this.radius);
                let hash = 0;
                for (let i = 0; i < this.name.length; i++) {
                    hash = this.name.charCodeAt(i) + ((hash << 5) - hash);
                    hash |= 0;
                }
                const hue1 = Math.abs(hash) % 360;
                const hue2 = (hue1 + 60) % 360;
                gradient.addColorStop(0, `hsl(${hue1}, 70%, 60%)`);
                gradient.addColorStop(1, `hsl(${hue2}, 70%, 40%)`);

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = teamColor;
                ctx.lineWidth = 4;
                ctx.stroke();
                ctx.restore();

                // Инициал
                ctx.save();
                ctx.font = 'bold 36px Montserrat';
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.6)';
                ctx.shadowBlur = 6;
                ctx.fillText(getInitial(this.name), this.x, this.y);
                ctx.restore();

                // Имя под
                ctx.save();
                ctx.font = 'bold 18px Montserrat';
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(0,0,0,0.9)';
                ctx.shadowBlur = 8;
                ctx.fillText(this.name, this.x, this.y + this.radius + 26);
                ctx.restore();

                // Сердечки над
                ctx.save();
                ctx.font = '20px Montserrat';
                ctx.textAlign = 'center';
                ctx.fillText('❤️'.repeat(Math.max(0, this.lives)), this.x, this.y - this.radius - 15);
                ctx.restore();
            }
        }

        // ============================================================
        // ЧАСТИЦЫ
        // ============================================================
        function spawnParticles(x, y, color, count = 30) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 25,
                    vy: (Math.random() - 0.5) * 25,
                    life: 1,
                    color: color || '#ffffff',
                    size: Math.random() * 8 + 2
                });
            }
        }

        // ============================================================
        // СНЕЖОК
        // ============================================================
        class Snowball {
            constructor(shooter, power, angle, damage = 1, isSuper = false) {
                this.x = shooter.x;
                this.y = shooter.y;
                
                const direction = shooter.team === 'red' ? 1 : -1;
                const rad = angle * Math.PI / 180;
                
                const speed = power * 0.4;
                this.vx = Math.cos(rad) * speed * direction;
                this.vy = -Math.sin(rad) * speed;
                
                this.gravity = 0.3;
                this.isMega = (power > 90);
                this.isSuper = isSuper;
                this.damage = damage;
                this.team = shooter.team;
                this.trailCooldown = 0;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;

                this.trailCooldown--;
                if (this.trailCooldown <= 0 && Math.random() > 0.3) {
                    const color = this.isSuper 
                        ? 'rgba(251, 191, 36, 0.8)' 
                        : 'rgba(127, 227, 255, 0.6)';
                    particles.push({
                        x: this.x, y: this.y,
                        vx: (Math.random() - 0.5) * 2,
                        vy: (Math.random() - 0.5) * 2,
                        life: 0.8,
                        color,
                        size: Math.random() * 4 + 2
                    });
                    this.trailCooldown = 2;
                }
            }

            draw(ctx) {
                const radius = this.isSuper ? 18 : 15;
                const color2 = this.isSuper ? '#fbbf24' : '#7fe3ff';
                
                ctx.shadowColor = this.isSuper ? '#fbbf24' : '#7fe3ff';
                ctx.shadowBlur = this.isSuper ? 40 : 25;

                const gradient = ctx.createRadialGradient(this.x - 5, this.y - 5, 2, this.x, this.y, radius);
                gradient.addColorStop(0, '#ffffff');
                gradient.addColorStop(1, color2);
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
                ctx.fill();

                if (this.isSuper) {
                    ctx.strokeStyle = '#fbbf24';
                    ctx.lineWidth = 2;
                    ctx.globalAlpha = 0.6;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, radius + 6, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.globalAlpha = 1;
                }
                
                ctx.shadowBlur = 0;
            }
        }

        // ============================================================
        // LIVE-ПРИЦЕЛ (короче)
        // ============================================================
        function drawLiveAim(aimer, angle, power) {
            const direction = aimer.team === 'red' ? 1 : -1;
            const rad = angle * Math.PI / 180;
            
            const speed = power * 0.4;
            const vx = Math.cos(rad) * speed * direction;
            const vy = -Math.sin(rad) * speed;
            const gravity = 0.3;

            const teamColor = aimer.team === 'red' ? '#ef4444' : '#3b82f6';

            let x = aimer.x;
            let y = aimer.y;

            const lineLength = 60 + power * 0.6;
            const lineEndX = x + Math.cos(rad) * lineLength * direction;
            const lineEndY = y - Math.sin(rad) * lineLength;

            ctx.save();
            ctx.setLineDash([14, 10]);
            ctx.lineDashOffset = -(Date.now() / 50) % 24;
            ctx.strokeStyle = teamColor;
            ctx.lineWidth = 5;
            ctx.globalAlpha = 0.85;
            ctx.shadowColor = teamColor;
            ctx.shadowBlur = 25;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(lineEndX, lineEndY);
            ctx.stroke();
            ctx.restore();

            let sx = x;
            let sy = y;
            let svx = vx;
            let svy = vy;

            ctx.save();
            ctx.setLineDash([10, 10]);
            ctx.strokeStyle = teamColor;
            ctx.lineWidth = 3;
            ctx.globalAlpha = 0.4;
            ctx.shadowColor = teamColor;
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            for (let i = 0; i < 50; i++) {
                sx += svx;
                sy += svy;
                svy += gravity;
                ctx.lineTo(sx, sy);
                if (sx < -50 || sx > width + 50 || sy > height + 50) break;
            }
            ctx.stroke();
            ctx.restore();

            const headAngle = Math.atan2(lineEndY - y, lineEndX - x);
            ctx.save();
            ctx.translate(lineEndX, lineEndY);
            ctx.rotate(headAngle);
            ctx.fillStyle = teamColor;
            ctx.shadowColor = teamColor;
            ctx.shadowBlur = 30;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-22, -10);
            ctx.lineTo(-22, 10);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            ctx.save();
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.strokeStyle = teamColor;
            ctx.lineWidth = 2;
            ctx.shadowColor = teamColor;
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(lineEndX, lineEndY, 26, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.font = 'bold 16px Montserrat';
            ctx.fillStyle = teamColor;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(Math.round(power) + '%', lineEndX, lineEndY);
            ctx.restore();
        }

        // ============================================================
        // ФОРМИРОВАНИЕ СНЕЖКОВ
        // ============================================================
        function drawFormingShots(now) {
            formingShots.forEach(fs => {
                const elapsed = now - fs.startTime;
                const progress = Math.min(1, elapsed / FORM_TIME);
                const teamColor = fs.team === 'red' ? '#ef4444' : '#3b82f6';
                const baseRadius = 5 + progress * (fs.isSuper ? 25 : 20);

                const bx = fs.x;
                const by = fs.y + 20;

                ctx.save();
                ctx.shadowColor = fs.isSuper ? '#fbbf24' : '#7fe3ff';
                ctx.shadowBlur = (fs.isSuper ? 50 : 30) * progress;

                const gradient = ctx.createRadialGradient(bx - baseRadius * 0.3, by - baseRadius * 0.3, 2, bx, by, baseRadius);
                gradient.addColorStop(0, '#ffffff');
                gradient.addColorStop(1, fs.isSuper ? '#fbbf24' : '#a8e6ff');

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(bx, by, baseRadius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                ctx.save();
                ctx.strokeStyle = fs.isSuper ? '#fbbf24' : teamColor;
                ctx.lineWidth = 4;
                ctx.shadowColor = ctx.strokeStyle;
                ctx.shadowBlur = 15;
                ctx.globalAlpha = 0.8;
                ctx.beginPath();
                ctx.arc(bx, by, baseRadius + 15, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * progress);
                ctx.stroke();
                ctx.restore();
            });
        }

        // ============================================================
        // ИГРОВОЙ ЦИКЛ
        // ============================================================
        function gameLoop() {
            const now = performance.now();

            ctx.clearRect(0, 0, width, height);

            if (lastScreen === 'game' && currentData?.preloadDone && currentData?.status === 'playing') {
                ctx.fillStyle = 'rgba(10, 37, 64, 0.2)';
                ctx.fillRect(0, 0, width, height);
                ctx.fillStyle = 'rgba(239, 68, 68, 0.05)';
                ctx.fillRect(0, 0, width * 0.25, height);
                ctx.fillStyle = 'rgba(59, 130, 246, 0.05)';
                ctx.fillRect(width * 0.75, 0, width * 0.25, height);

                ctx.strokeStyle = 'rgba(127, 227, 255, 0.05)';
                ctx.lineWidth = 1;
                for (let x = 0; x < width; x += 50) {
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
                }
                for (let y = 0; y < height; y += 50) {
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
                }

                const activeId = currentData?.activePlayerId;
                players.forEach(p => p.draw(ctx, p.id === activeId));

                if (currentAim && formingShots.length === 0) {
                    const aimer = players.get(currentAim.playerId);
                    if (aimer && aimer.alive) {
                        if (displayedAimAngle === null) {
                            displayedAimAngle = currentAim.angle;
                            displayedAimPower = currentAim.power;
                        } else {
                            displayedAimAngle += (currentAim.angle - displayedAimAngle) * 0.25;
                            displayedAimPower += (currentAim.power - displayedAimPower) * 0.25;
                        }
                        drawLiveAim(aimer, displayedAimAngle, displayedAimPower);
                    }
                } else if (!currentAim) {
                    displayedAimAngle = null;
                    displayedAimPower = null;
                }

                if (formingShots.length > 0) {
                    drawFormingShots(now);
                }

                for (let i = snowballs.length - 1; i >= 0; i--) {
                    const ball = snowballs[i];
                    ball.update();
                    ball.draw(ctx);

                    let hit = false;
                    players.forEach(p => {
                        if (hit) return;
                        if (p.team !== ball.team && p.alive) {
                            const dx = Math.abs(ball.x - p.x);
                            const dy = Math.abs(ball.y - p.y);
                            if (dx < p.radius && dy < p.radius) {
                                hit = true;
                                handleHit(ball, p);
                            }
                        }
                    });

                    if (hit || ball.x < -100 || ball.x > width + 100 || ball.y > height + 100 || ball.y < -200) {
                        snowballs.splice(i, 1);
                    }
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.15;
                    p.life -= 0.02;
                    if (p.life <= 0) {
                        particles.splice(i, 1);
                        continue;
                    }
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }

                updateTurnTimerPosition(now);
            }

            requestAnimationFrame(gameLoop);
        }

        // ============================================================
        // ТАЙМЕР ХОДА
        // ============================================================
        function updateTurnTimerPosition(now) {
            const timerEl = document.getElementById('tv-turn-timer');
            
            if (!turnTimerActive || !turnTimerPlayerId) {
                timerEl.classList.remove('active');
                return;
            }

            const player = players.get(turnTimerPlayerId);
            if (!player || !player.alive) {
                timerEl.classList.remove('active');
                return;
            }

            timerEl.style.left = `${player.x}px`;
            timerEl.style.top = `${player.y - 100}px`;
            timerEl.style.transform = 'translateX(-50%)';
            timerEl.classList.add('active');

            const elapsed = (Date.now() - turnTimerStart) / 1000;
            const remaining = Math.max(0, TURN_TIME - elapsed);
            const ratio = remaining / TURN_TIME;

            const progressEl = document.getElementById('tv-turn-timer-progress');
            const valueEl = document.getElementById('tv-turn-timer-value');
            const ringEl = document.getElementById('tv-turn-timer-ring');

            const CIRCUMFERENCE = 2 * Math.PI * 38;
            progressEl.style.strokeDasharray = CIRCUMFERENCE;
            progressEl.style.strokeDashoffset = CIRCUMFERENCE * (1 - ratio);

            valueEl.innerText = Math.ceil(remaining);

            ringEl.classList.remove('red', 'blue', 'danger');
            if (remaining <= 3) {
                ringEl.classList.add('danger');
            } else {
                ringEl.classList.add(player.team);
            }
        }

        // ============================================================
        // ПОПАДАНИЕ
        // ============================================================
        async function handleHit(ball, p) {
            const damage = ball.damage || 1;
            const newLives = Math.max(0, p.lives - damage);
            const newAlive = newLives > 0;

            p.lives = newLives;
            p.alive = newAlive;

            await update(ref(db, `games/${gameId}/players/${p.team}/${p.id}`), {
                lives: newLives,
                alive: newAlive
            });

            spawnParticles(ball.x, ball.y, p.team === 'red' ? '#ef4444' : '#3b82f6', 20 + damage * 15);
            document.getElementById('main-body').classList.add('screen-shake');
            setTimeout(() => document.getElementById('main-body').classList.remove('screen-shake'), 400);

            if (ball.isSuper) {
                const superDiv = document.createElement('div');
                superDiv.className = 'mega-text';
                superDiv.innerText = damage > 1 ? `☄️ ЯДЕРКА! -${damage}❤️` : '⚡ СУПЕРБРОСОК!';
                superDiv.style.textShadow = '0 0 80px #fbbf24';
                document.body.appendChild(superDiv);
                setTimeout(() => superDiv.remove(), 2000);
            } else if (ball.isMega) {
                const megaDiv = document.createElement('div');
                megaDiv.className = 'mega-text';
                megaDiv.innerText = 'МЕГАБРОСОК!';
                document.body.appendChild(megaDiv);
                setTimeout(() => megaDiv.remove(), 2000);
            }

            await checkGameOver();
        }

        let checkingGameOver = false;
        async function checkGameOver() {
            if (checkingGameOver) return;
            checkingGameOver = true;

            try {
                const snap = await get(ref(db, `games/${gameId}/players`));
                const playersData = snap.val() || {};
                
                const teamLives = (team) => {
                    const teamPlayers = playersData[team] || {};
                    return Object.values(teamPlayers).reduce((sum, p) => 
                        sum + (p.alive && p.lives > 0 ? p.lives : 0), 0
                    );
                };

                const redLives = teamLives('red');
                const blueLives = teamLives('blue');

                document.getElementById('heart-red').innerText = redLives > 0 ? '❤️'.repeat(redLives) : '💀';
                document.getElementById('heart-blue').innerText = blueLives > 0 ? '❤️'.repeat(blueLives) : '💀';

                if (redLives <= 0 && blueLives <= 0) {
                    await update(gameRef, { status: 'finished', screen: 'winner', winner: 'none' });
                } else if (redLives <= 0) {
                    await update(gameRef, { status: 'finished', screen: 'winner', winner: 'blue' });
                } else if (blueLives <= 0) {
                    await update(gameRef, { status: 'finished', screen: 'winner', winner: 'red' });
                }
            } finally {
                checkingGameOver = false;
            }
        }

        // ============================================================
        // QR
        // ============================================================
        function generateQRs() {
            document.getElementById('qr-red').innerHTML = '';
            document.getElementById('qr-blue').innerHTML = '';
            
            const redUrl = `${currentBaseUrl}play.html?game=${gameId}&team=red`;
            const blueUrl = `${currentBaseUrl}play.html?game=${gameId}&team=blue`;
            
            const qrRed = qrcode(0, 'M'); qrRed.addData(redUrl); qrRed.make();
            document.getElementById('qr-red').innerHTML = qrRed.createImgTag(5, 10);
            
            const qrBlue = qrcode(0, 'M'); qrBlue.addData(blueUrl); qrBlue.make();
            document.getElementById('qr-blue').innerHTML = qrBlue.createImgTag(5, 10);
            
            hasGeneratedQR = true;
        }

        function updateQRPlayersList(data) {
            const renderList = (containerId, team) => {
                const container = document.getElementById(containerId);
                const players = Object.entries(data.room?.[team] || {})
                    .sort((a, b) => (a[1].joinedAt || 0) - (b[1].joinedAt || 0));
                const activePlayers = Object.values(data.players?.[team] || {});
                
                const all = [
                    ...activePlayers.map(p => ({ ...p, _status: 'playing' })),
                    ...players.map(([id, p]) => ({ ...p, _status: 'waiting' }))
                ];
                
                if (all.length === 0) {
                    container.innerHTML = `<div class="text-white/30 italic text-center py-2 text-sm">Нет игроков</div>`;
                    return;
                }
                
                container.innerHTML = all.map(p => `
                    <div class="qr-player ${team}">
                        <div class="avatar avatar-sm" data-name="${escapeHtml(p.name)}"></div>
                        <span class="name">${escapeHtml(p.name)}</span>
                        ${p._status === 'playing' ? '<span class="text-xs text-cyan-300 font-bold">ИГРАЕТ</span>' : ''}
                    </div>
                `).join('');
                
                container.querySelectorAll('.avatar[data-name]').forEach(el => {
                    applyAvatar(el, el.dataset.name);
                });
            };
            
            renderList('qr-players-red', 'red');
            renderList('qr-players-blue', 'blue');
            
            // Статус
            const redMax = parseInt((data.mode || '1v1').split('v')[0]) || 1;
            const blueMax = parseInt((data.mode || '1v1').split('v')[1]) || 1;
            const redCount = Object.keys(data.room?.red || {}).length + Object.keys(data.players?.red || {}).length;
            const blueCount = Object.keys(data.room?.blue || {}).length + Object.keys(data.players?.blue || {}).length;
            
            const isReady = redCount >= redMax && blueCount >= blueMax;
            const statusEl = document.getElementById('qr-status');
            if (isReady) {
                statusEl.innerText = '✅ ВСЕ ГОТОВЫ!';
                statusEl.className = 'mt-8 text-xl font-black text-green-400 tracking-wider';
            } else {
                statusEl.innerText = `ОЖИДАНИЕ: ${redCount}/${redMax} vs ${blueCount}/${blueMax}`;
                statusEl.className = 'mt-8 text-xl font-black text-white/50 tracking-wider';
            }
        }

        function startWinnerCountdown() {
            clearWinnerTimers();
            
            let countdown = WINNER_AUTO_HIDE;
            const countdownEl = document.getElementById('win-countdown');
            
            const tick = () => {
                countdownEl.innerText = `ЗАСТАВКА ЧЕРЕЗ ${countdown} СЕК`;
                if (countdown <= 0) {
                    clearWinnerTimers();
                    update(gameRef, { screen: 'attract' }).catch(() => {});
                    return;
                }
                countdown--;
            };
            
            tick();
            winnerCountdownInterval = setInterval(tick, 1000);
        }

        function clearWinnerTimers() {
            if (winnerCountdownInterval) {
                clearInterval(winnerCountdownInterval);
                winnerCountdownInterval = null;
            }
            const countdownEl = document.getElementById('win-countdown');
            if (countdownEl) countdownEl.innerText = '';
        }

        // ============================================================
        // БЕГУЩАЯ СТРОКА
        // ============================================================
        onValue(ref(db, `games/${gameId}/ticker_messages`), (snap) => {
            const messages = snap.val() || {};
            const keys = Object.keys(messages).sort((a, b) => messages[a].time - messages[b].time);
            const text = keys.length > 0 
                ? keys.map(key => messages[key].text).join('  •  ') 
                : 'ДОБРО ПОЖАЛОВАТЬ НА ВЕЧЕРИНКУ ENDORPHIN!';
            
            if (text !== lastTickerText) {
                lastTickerText = text;
                const ticker = document.getElementById('ticker-text');
                ticker.innerText = text;
                ticker.style.animation = 'none';
                void ticker.offsetWidth;
                ticker.style.animation = '';
            }
        });

        // ============================================================
        // РЕКЛАМА
        // ============================================================
        onValue(ref(db, `games/${gameId}/ad_settings`), (snap) => {
            const data = snap.val();
            if (!data) return;

            if (data.lobby) {
                const container = document.getElementById('lobby-ad');
                const img = document.getElementById('lobby-ad-img');
                const text = document.getElementById('lobby-ad-text');
                container.classList.remove('hidden');
                if (data.lobby.img) {
                    img.src = data.lobby.img;
                    img.classList.remove('hidden');
                    text.classList.add('hidden');
                } else if (data.lobby.text) {
                    text.innerText = data.lobby.text;
                    img.classList.add('hidden');
                    text.classList.remove('hidden');
                }
                if (data.lobby.link) container.href = data.lobby.link;
            }
        });

        // ============================================================
        // LIVE-ПРИЦЕЛ
        // ============================================================
        onValue(ref(db, `games/${gameId}/aim`), (snap) => {
            const aimData = snap.val();
            
            if (!aimData || Object.keys(aimData).length === 0) {
                currentAim = null;
                return;
            }

            const [playerId, data] = Object.entries(aimData)[0];
            
            if (currentData?.activePlayerId === playerId && currentData?.status === 'playing' && currentData?.preloadDone) {
                currentAim = { ...data, playerId };
            } else {
                currentAim = null;
            }
        });

        // ============================================================
        // ВЫСТРЕЛ
        // ============================================================
        onValue(ref(db, `games/${gameId}/last_shot`), (snap) => {
            const shot = snap.val();
            if (!shot || !shot.time) return;
            
            if (shot.time === lastShotTime && shot.state === lastShotState) return;
            
            const isNewShot = shot.time !== lastShotTime;
            lastShotTime = shot.time;
            lastShotState = shot.state;

            let shotsArray = shot.shots;
            if (!shotsArray) {
                shotsArray = [{ angle: shot.angle, power: shot.power, damage: 1 }];
            }

            if (isNewShot) {
                const shooter = players.get(shot.shooterId);
                if (shooter && shooter.alive) {
                    formingShots = shotsArray.map(s => ({
                        shooterId: shot.shooterId,
                        x: shooter.x + (Math.random() - 0.5) * 30,
                        y: shooter.y,
                        angle: s.angle,
                        power: s.power,
                        damage: s.damage || 1,
                        isSuper: shot.isSuper || false,
                        team: shot.team,
                        startTime: performance.now()
                    }));

                    currentAim = null;
                    displayedAimAngle = null;
                    displayedAimPower = null;

                    if (shot.isSuper && shot.superType) {
                        showSuperTitle(shot.superType);
                    }
                }
            }

            if (shot.state === 'flying' && formingShots.length > 0) {
                const shooter = players.get(shot.shooterId);
                if (shooter) {
                    formingShots.forEach(fs => {
                        const ball = new Snowball(
                            { x: fs.x, y: fs.y, team: fs.team },
                            fs.power,
                            fs.angle,
                            fs.damage,
                            fs.isSuper
                        );
                        snowballs.push(ball);
                    });
                }
                formingShots = [];
            }
        });

        function showSuperTitle(type) {
            if (superTextTimeout) clearTimeout(superTextTimeout);

            const titles = {
                fan: { emoji: '🌪', name: 'ВЕЕР' },
                shotgun: { emoji: '💥', name: 'ДРОБОВИК' },
                chaos: { emoji: '🎲', name: 'ХАОС' },
                nuke: { emoji: '☄️', name: 'ЯДЕРКА' }
            };

            const t = titles[type] || { emoji: '⚡', name: 'СУПЕР' };

            const div = document.createElement('div');
            div.className = 'super-text';
            div.innerHTML = `<span class="super-emoji">${t.emoji}</span>${t.name}`;
            document.body.appendChild(div);

            superTextTimeout = setTimeout(() => {
                div.remove();
                superTextTimeout = null;
            }, 1800);
        }

        // ============================================================
        // ТАЙМЕР (глобальный)
        // ============================================================
        onValue(ref(db, `games/${gameId}/timer`), (snap) => {
            const val = snap.val();
            const tvTimer = document.getElementById('tv-timer');
            const preloadTimer = document.getElementById('preload-timer');
            
            if (val !== null && val !== undefined) {
                tvTimer.innerText = val;
                tvTimer.style.display = 'block';
                if (preloadTimer) preloadTimer.innerText = val;
            } else {
                tvTimer.style.display = 'none';
            }
        });

        // ============================================================
        // ОСНОВНОЙ СЛУШАТЕЛЬ
        // ============================================================
        onValue(gameRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            currentData = data;
            const screen = data.screen || 'attract';
            const prevScreen = lastScreen;

            // Смена режима → пересоздать QR
            if (data.mode && lastMode !== data.mode) {
                lastMode = data.mode;
                hasGeneratedQR = false;
            }

            syncPlayers(data);
            updateHeartsUI();

            // Обработка экранов
            if (screen !== prevScreen) {
                lastScreen = screen;
                
                // Сброс таймеров победителя при смене экрана
                if (screen !== 'winner') {
                    clearWinnerTimers();
                }
            }

            switch (screen) {
                case 'attract':
                    showAttract();
                    // Сброс игрового состояния
                    formingShots = [];
                    snowballs = [];
                    particles = [];
                    currentAim = null;
                    turnTimerActive = false;
                    break;
                
                case 'qr':
                    showQR(data);
                    break;
                
                case 'game':
                    if (data.status === 'playing' && !data.preloadDone) {
                        // Прелоадинг
                        if (isPreloading) {
                            // Уже идёт
                        } else {
                            startPreload(data);
                        }
                    } else {
                        isPreloading = false;
                        document.getElementById('preload-view').classList.add('hidden');
                        showGame();
                        
                        // Обновить индикаторы
                        const turnIndicator = document.getElementById('turn-indicator');
                        if (data.turn && data.preloadDone) {
                            turnIndicator.style.display = 'block';
                            turnIndicator.innerText = `ХОД: ${data.turn.name.toUpperCase()}`;
                            turnIndicator.style.color = data.turn.team === 'red' ? '#ef4444' : '#3b82f6';
                        } else {
                            turnIndicator.style.display = 'none';
                        }

                        // Таймер хода
                        if (data.preloadDone && data.activePlayerId && !data.timer) {
                            if (turnTimerPlayerId !== data.activePlayerId) {
                                turnTimerPlayerId = data.activePlayerId;
                                turnTimerStart = Date.now();
                                turnTimerActive = true;
                            }
                        } else {
                            turnTimerActive = false;
                            turnTimerPlayerId = null;
                        }
                    }
                    break;
                
                case 'winner':
                    showWinner(data);
                    break;
            }
        });

        // ============================================================
        // ПРЕЛОУДИНГ
        // ============================================================
        function startPreload(data) {
            if (isPreloading) return;
            isPreloading = true;

            const preloadView = document.getElementById('preload-view');
            const preloadTitle = document.getElementById('preload-title');
            const preloadTimer = document.getElementById('preload-timer');

            const redPlayers = Object.values(data.players?.red || {});
            const bluePlayers = Object.values(data.players?.blue || {});

            if (redPlayers.length === 1 && bluePlayers.length === 1) {
                preloadTitle.innerText = `${redPlayers[0].name.toUpperCase()} VS ${bluePlayers[0].name.toUpperCase()}`;
            } else {
                const redCount = redPlayers.length;
                const blueCount = bluePlayers.length;
                const isUnfair = redCount !== blueCount;
                preloadTitle.innerText = isUnfair 
                    ? `⚔️ ${redCount} vs ${blueCount}` 
                    : `${redCount} vs ${blueCount}`;
            }

            preloadView.classList.remove('hidden');
            preloadTimer.innerText = data.timer || '10';
        }

        // ============================================================
        // СИНХРОНИЗАЦИЯ ИГРОКОВ
        // ============================================================
        function syncPlayers(data) {
            const redPlayers = data.players?.red || {};
            const bluePlayers = data.players?.blue || {};

            const allIds = new Set([
                ...Object.keys(redPlayers),
                ...Object.keys(bluePlayers)
            ]);
            for (const [id] of players) {
                if (!allIds.has(id)) players.delete(id);
            }

            Object.entries(redPlayers).forEach(([id, p]) => {
                if (players.has(id)) players.get(id).update(p);
                else players.set(id, new Player(id, p, 'red'));
            });
            Object.entries(bluePlayers).forEach(([id, p]) => {
                if (players.has(id)) players.get(id).update(p);
                else players.set(id, new Player(id, p, 'blue'));
            });
        }

        // ============================================================
        // СЕРДЕЧКИ
        // ============================================================
        function updateHeartsUI() {
            let red = 0, blue = 0;
            players.forEach(p => {
                if (p.alive && p.lives > 0) {
                    if (p.team === 'red') red += p.lives;
                    else blue += p.lives;
                }
            });
            document.getElementById('heart-red').innerText = red > 0 ? '❤️'.repeat(red) : '💀';
            document.getElementById('heart-blue').innerText = blue > 0 ? '❤️'.repeat(blue) : '💀';
        }

        // ============================================================
        // КОНФЕТТИ
        // ============================================================
        function launchConfetti(colors) {
            const container = document.getElementById('confetti-container');
            const defaultColors = ['#fbbf24', '#f59e0b', '#22d3ee', '#3b82f6', '#ef4444', '#a855f7', '#22c55e'];
            const palette = colors || defaultColors;

            container.innerHTML = '';

            for (let i = 0; i < 80; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.background = palette[Math.floor(Math.random() * palette.length)];
                c.style.width = (Math.random() * 8 + 6) + 'px';
                c.style.height = (Math.random() * 8 + 6) + 'px';
                c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                c.style.animationDuration = (Math.random() * 2 + 2) + 's';
                c.style.animationDelay = (Math.random() * 0.5) + 's';
                container.appendChild(c);
            }

            setTimeout(() => {
                container.innerHTML = '';
            }, 6000);
        }

        // ============================================================
        // СНЕЖИНКИ
        // ============================================================
        const snowContainer = document.getElementById('snow-container');
        for (let i = 0; i < 40; i++) {
            const s = document.createElement('div');
            s.className = 'snowflake';
            s.innerText = '❄';
            s.style.left = Math.random() * 100 + '%';
            s.style.fontSize = (10 + Math.random() * 20) + 'px';
            s.style.animationDuration = (4 + Math.random() * 8) + 's';
            s.style.animationDelay = (-Math.random() * 10) + 's';
            s.style.opacity = Math.random() * 0.7 + 0.3;
            snowContainer.appendChild(s);
        }

        // ============================================================
        // СТАРТ
        // ============================================================
        gameLoop();
    </script>
</body>
</html>
