<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#03080f">
    <title>ENDORPHIN | ТВ ЭКРАН</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=JetBrains+Mono:wght@700;900&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>

    <style>
        :root {
            --bg-deep: #03080f;
            --bg-mid: #0a2540;
            --ice: #7fe3ff;
            --ice-bright: #22d3ee;
            --amber: #fbbf24;
            --red-team: #ff3b5c;
            --blue-team: #3d8bff;
            --glass-bg: rgba(10, 37, 64, 0.65);
            --glass-border: rgba(127, 227, 255, 0.3);
            --text-dim: rgba(168, 230, 255, 0.7);
            --text-dimmer: rgba(168, 230, 255, 0.45);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            background: radial-gradient(circle at 50% 0%, var(--bg-mid) 0%, var(--bg-deep) 70%);
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            user-select: none;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            mix-blend-mode: overlay;
        }

        .mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }

        .snowflake {
            position: absolute;
            color: rgba(255, 255, 255, 0.6);
            font-size: 20px;
            animation: fall linear infinite;
            pointer-events: none;
            z-index: 5;
            filter: drop-shadow(0 0 8px #fff);
            top: -10vh;
            will-change: transform;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        .glass-panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 0 40px rgba(31, 143, 214, 0.15);
            border-radius: 1.5rem;
        }

        @keyframes screenShake {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-5px, 2px); }
            40% { transform: translate(5px, -2px); }
            60% { transform: translate(-8px, 4px); }
            80% { transform: translate(8px, -4px); }
        }
        .screen-shake { animation: screenShake 0.4s cubic-bezier(.36,.07,.19,.97) both; }

        #game-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            display: block;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            z-index: 20;
            pointer-events: none;
        }

        .full-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: radial-gradient(circle at 50% 0%, var(--bg-mid) 0%, var(--bg-deep) 70%);
            z-index: 30;
            transition: opacity 0.4s;
        }
        .full-screen.hidden { display: none; }

        /* ATTRACT */
        #attract-view {
            background: transparent;
            justify-content: space-between;
            padding: 2.5rem 2rem 5.5rem;
        }

        .attract-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: auto;
            margin-bottom: auto;
            z-index: 10;
            pointer-events: none;
        }

        .attract-logo-wrap {
            width: clamp(300px, 55vw, 720px);
            margin-bottom: 0.5rem;
            filter: drop-shadow(0 0 40px rgba(34, 211, 238, 0.5))
                    drop-shadow(0 0 100px rgba(34, 211, 238, 0.2));
            animation: titleFloat 5s ease-in-out infinite;
        }
        .attract-logo-wrap svg { width: 100%; height: auto; display: block; }
        @keyframes titleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .attract-subtitle {
            font-size: clamp(0.9rem, 2.2vw, 1.6rem);
            font-weight: 700;
            letter-spacing: 0.42em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 2rem;
            text-align: center;
            padding-left: 0.42em;
        }

        .attract-phrase {
            font-size: clamp(1.2rem, 3vw, 2.2rem);
            font-weight: 900;
            color: #fff;
            text-align: center;
            text-shadow: 0 0 30px rgba(34, 211, 238, 0.9), 0 2px 15px rgba(0,0,0,0.8);
            min-height: 2.8rem;
            transition: opacity 0.4s;
            margin-bottom: 1.5rem;
            letter-spacing: 0.05em;
            padding: 0 1rem;
        }

        .attract-cta {
            font-size: clamp(1rem, 2.4vw, 1.6rem);
            font-weight: 900;
            color: var(--ice-bright);
            text-shadow: 0 0 30px rgba(34, 211, 238, 0.9), 0 2px 15px rgba(0,0,0,0.8);
            text-align: center;
            animation: ctaPulse 2s ease-in-out infinite;
            letter-spacing: 0.1em;
        }
        @keyframes ctaPulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .attract-hint {
            font-size: clamp(0.7rem, 1.4vw, 1rem);
            color: var(--text-dimmer);
            letter-spacing: 0.2em;
            margin-top: 0.6rem;
            text-align: center;
            text-shadow: 0 1px 8px rgba(0,0,0,0.8);
        }

        .attract-bottom {
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 10;
            margin-bottom: 0.5rem;
        }

        .ad-block {
            width: 100%;
            max-width: 560px;
            height: 76px;
            background: rgba(10, 37, 64, 0.75);
            border: 1px solid rgba(127, 227, 255, 0.35);
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-decoration: none;
        }
        .ad-block.hidden { display: none; }
        .ad-block img { width: 100%; height: 100%; object-fit: contain; }
        .ad-block span {
            color: var(--text-dimmer);
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.2em;
        }

        /* QR */
        .qr-container {
            display: flex;
            gap: clamp(2rem, 6vw, 6rem);
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .qr-team {
            position: relative;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: clamp(300px, 26vw, 380px);
        }

        .qr-team-badge {
            position: absolute;
            top: -1.2rem;
            padding: 0.5rem 1.6rem;
            border-radius: 999px;
            font-weight: 900;
            font-size: clamp(0.95rem, 2vw, 1.25rem);
            letter-spacing: 0.1em;
            color: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .qr-team-badge.red { background: var(--red-team); box-shadow: 0 4px 25px rgba(255, 59, 92, 0.5); }
        .qr-team-badge.blue { background: var(--blue-team); box-shadow: 0 4px 25px rgba(61, 139, 255, 0.5); }

        .qr-box {
            background: #fff;
            padding: 14px;
            border-radius: 18px;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }
        .qr-box img { display: block; }

        .qr-players {
            margin-top: 1rem;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .qr-player {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .qr-player.red { border-color: rgba(255, 59, 92, 0.4); }
        .qr-player.blue { border-color: rgba(61, 139, 255, 0.4); }
        .qr-player .name { flex: 1; }

        .qr-vs {
            font-size: clamp(3rem, 6vw, 5rem);
            font-weight: 900;
            color: rgba(255,255,255,0.2);
            font-style: italic;
        }

        .avatar {
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #fff;
            flex-shrink: 0;
            border: 2px solid rgba(255,255,255,0.3);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            background: rgba(0,0,0,0.4);
            line-height: 1;
        }
        .avatar-xs { width: 24px; height: 24px; font-size: 0.9rem; }
        .avatar-sm { width: 34px; height: 34px; font-size: 1.2rem; }

        /* PRELOAD */
        #preload-view {
            background: radial-gradient(ellipse at 50% 40%, #0a2540 0%, #03080f 80%);
            overflow: hidden;
        }
        #preload-view::before,
        #preload-view::after {
            content: '';
            position: absolute;
            top: 0; bottom: 0;
            width: 38%;
            pointer-events: none;
            z-index: 0;
            filter: blur(60px);
            opacity: 0.35;
        }
        #preload-view::before {
            left: -10%;
            background: radial-gradient(ellipse at center, var(--red-team) 0%, transparent 70%);
            animation: preloadSideRed 3s ease-in-out infinite;
        }
        #preload-view::after {
            right: -10%;
            background: radial-gradient(ellipse at center, var(--blue-team) 0%, transparent 70%);
            animation: preloadSideBlue 3s ease-in-out infinite;
        }
        @keyframes preloadSideRed {
            0%, 100% { opacity: 0.25; transform: scale(1); }
            50% { opacity: 0.45; transform: scale(1.05); }
        }
        @keyframes preloadSideBlue {
            0%, 100% { opacity: 0.25; transform: scale(1); }
            50% { opacity: 0.45; transform: scale(1.05); }
        }

        #preload-view .preload-rays {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                conic-gradient(from 0deg at 50% 45%,
                    transparent 0deg,
                    rgba(255,255,255,0.04) 30deg,
                    transparent 60deg,
                    rgba(255,255,255,0.04) 120deg,
                    transparent 150deg,
                    rgba(255,255,255,0.04) 210deg,
                    transparent 240deg,
                    rgba(255,255,255,0.04) 300deg,
                    transparent 330deg);
            animation: raysRotate 24s linear infinite;
        }
        @keyframes raysRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .preload-scene {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(1.5rem, 4vw, 4rem);
            width: 100%;
            max-width: 1500px;
            padding: 0 2rem;
        }

        .preload-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: clamp(0.5rem, 1.5vh, 1rem);
            min-width: 0;
        }
        .preload-side.red { align-items: flex-end; text-align: right; }
        .preload-side.blue { align-items: flex-start; text-align: left; }

        .preload-name {
            font-size: clamp(2rem, 5.5vw, 4.5rem);
            font-weight: 900;
            line-height: 1.05;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            opacity: 0;
            animation-fill-mode: forwards;
            animation-duration: 0.7s;
            animation-timing-function: cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation-delay: 0.15s;
        }
        .preload-side.red .preload-name {
            color: var(--red-team);
            text-shadow: 0 0 40px rgba(255, 59, 92, 0.8), 0 0 80px rgba(255, 59, 92, 0.4);
            animation-name: nameInLeft;
        }
        .preload-side.blue .preload-name {
            color: var(--blue-team);
            text-shadow: 0 0 40px rgba(61, 139, 255, 0.8), 0 0 80px rgba(61, 139, 255, 0.4);
            animation-name: nameInRight;
        }
        @keyframes nameInLeft {
            from { transform: translateX(-120px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes nameInRight {
            from { transform: translateX(120px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .preload-list-item {
            font-size: clamp(1.2rem, 2.6vw, 2.2rem);
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0;
            animation-fill-mode: forwards;
            animation-duration: 0.55s;
            animation-timing-function: cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 0.7rem;
            max-width: 100%;
        }
        .preload-side.red .preload-list-item {
            color: var(--red-team);
            text-shadow: 0 0 25px rgba(255, 59, 92, 0.6);
            animation-name: itemInLeft;
            flex-direction: row-reverse;
        }
        .preload-side.blue .preload-list-item {
            color: var(--blue-team);
            text-shadow: 0 0 25px rgba(61, 139, 255, 0.6);
            animation-name: itemInRight;
        }
        @keyframes itemInLeft {
            from { transform: translateX(-80px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes itemInRight {
            from { transform: translateX(80px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .preload-list-item .dot {
            width: clamp(8px, 1vw, 14px);
            height: clamp(8px, 1vw, 14px);
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 0 12px currentColor;
        }
        .preload-side.red .preload-list-item .dot { background: var(--red-team); }
        .preload-side.blue .preload-list-item .dot { background: var(--blue-team); }

        .preload-vs-wrap {
            position: relative;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: clamp(80px, 10vw, 160px);
            height: clamp(80px, 10vw, 160px);
        }
        .preload-vs {
            font-size: clamp(3rem, 7vw, 6rem);
            font-weight: 900;
            font-style: italic;
            letter-spacing: -0.05em;
            color: #fff;
            text-shadow:
                0 0 30px var(--amber),
                0 0 60px var(--amber),
                0 0 100px rgba(245, 158, 11, 0.6);
            position: relative;
            z-index: 3;
            animation: vsPulse 1.6s ease-in-out infinite;
        }
        @keyframes vsPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.12); }
        }
        .preload-vs-glow {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(251, 191, 36, 0.5) 0%, transparent 65%);
            animation: vsGlowPulse 1.6s ease-in-out infinite;
            z-index: 1;
            filter: blur(10px);
        }
        @keyframes vsGlowPulse {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.25); opacity: 1; }
        }

        .preload-timer-wrap {
            position: absolute;
            bottom: clamp(2rem, 6vh, 4rem);
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            text-align: center;
        }
        .preload-timer {
            font-size: clamp(4rem, 10vw, 7rem);
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 40px rgba(34, 211, 238, 0.7), 0 0 80px rgba(34, 211, 238, 0.4);
            font-family: 'Montserrat', sans-serif;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
            line-height: 1;
            animation: timerPulse 1s ease-in-out infinite;
        }
        @keyframes timerPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }
        .preload-timer-label {
            font-size: clamp(0.7rem, 1.4vw, 1rem);
            font-weight: 900;
            letter-spacing: 0.3em;
            color: rgba(168, 230, 255, 0.6);
            text-transform: uppercase;
            margin-top: 0.5rem;
        }

        .preload-ready {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            text-shadow: 0 0 40px var(--amber), 0 0 80px var(--amber);
            z-index: 10;
            opacity: 0;
            pointer-events: none;
        }
        .preload-ready.show {
            animation: readyFlash 1s ease-out forwards;
        }
        @keyframes readyFlash {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
            40% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.6); }
        }

        /* MEGA / SUPER TEXT */
        @keyframes megaZoom {
            0% { transform: translate(-50%, -50%) scale(0.1); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        .mega-text {
            position: absolute;
            top: 50%;
            left: 50%;
            font-size: clamp(3rem, 8vw, 8rem);
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 80px var(--amber);
            z-index: 100;
            letter-spacing: 5px;
            text-transform: uppercase;
            animation: megaZoom 0.8s forwards;
            pointer-events: none;
            text-align: center;
        }

        @keyframes superZoom {
            0% { transform: translate(-50%, -50%) scale(0.1) rotate(-10deg); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.3) rotate(3deg); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
        }
        .super-text {
            position: absolute;
            top: 50%;
            left: 50%;
            font-size: clamp(3rem, 7vw, 7rem);
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 80px var(--amber), 0 0 120px #f59e0b;
            z-index: 100;
            letter-spacing: 5px;
            text-transform: uppercase;
            animation: superZoom 1s forwards;
            pointer-events: none;
            text-align: center;
            line-height: 1;
        }
        .super-text .super-emoji {
            display: block;
            font-size: clamp(4rem, 9vw, 9rem);
            margin-bottom: 10px;
        }

        @keyframes shockwave {
            0% { transform: translate(-50%, -50%) scale(0.2); opacity: 1; border-width: 6px; }
            100% { transform: translate(-50%, -50%) scale(3); opacity: 0; border-width: 1px; }
        }
        .shockwave {
            position: fixed;
            border-radius: 50%;
            border: 6px solid var(--amber);
            pointer-events: none;
            z-index: 99;
            animation: shockwave 0.6s ease-out forwards;
            box-shadow: 0 0 40px var(--amber);
        }

        @keyframes damageFloat {
            0% { transform: translate(-50%, 0); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translate(-50%, -80px); opacity: 0; }
        }
        .damage-float {
            position: fixed;
            font-size: clamp(1.5rem, 3vw, 2.5rem);
            font-weight: 900;
            color: var(--red-team);
            text-shadow: 0 0 20px var(--red-team), 0 2px 10px rgba(0,0,0,0.8);
            z-index: 100;
            pointer-events: none;
            animation: damageFloat 1.2s ease-out forwards;
        }

        /* ТИКЕР */
        .ticker-wrap {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 64px;
            background: rgba(0, 0, 0, 0.92);
            overflow: hidden;
            border-top: 2px solid var(--ice-bright);
            z-index: 100;
            display: flex;
            align-items: center;
        }
        .ticker {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: tickerMove 18s linear infinite;
            font-size: 26px;
            font-weight: 700;
            color: var(--ice-bright);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        @keyframes tickerMove {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* HP */
        .hp-display {
            position: absolute;
            top: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 22px;
            border-radius: 999px;
            background: rgba(0,0,0,0.55);
            border: 2px solid;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            z-index: 22;
        }
        .hp-display.hp-red { left: 20px; border-color: rgba(255, 59, 92, 0.6); color: var(--red-team); }
        .hp-display.hp-blue { right: 20px; border-color: rgba(61, 139, 255, 0.6); color: var(--blue-team); }
        .hp-display .hp-icon { font-size: clamp(1.4rem, 2.2vw, 2rem); }
        .hp-display .hp-value {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: clamp(1.4rem, 2.6vw, 2.2rem);
            color: #fff;
            text-shadow: 0 0 20px currentColor;

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, set, get, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCXIR5Tv8lB6ivcGRC3yt1SC66MM6T5b_M",
            authDomain: "endorphin-battle.firebaseapp.com",
            databaseURL: "https://endorphin-battle-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "endorphin-battle",
            storageBucket: "endorphin-battle.firebasestorage.app",
            messagingSenderId: "185259733030",
            appId: "1:185259733030:web:d72a89a436880973e636e7"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const gameId = 'battle_1';
        const gameRef = ref(db, `games/${gameId}`);

        let currentData = null;
        let currentBaseUrl = '';
        const players = new Map();
        let snowballs = [];
        let particles = [];
        let lastShotTime = 0;
        let lastShotState = null;

        let isPreloading = false;
        let hasGeneratedQR = false;
        let lastTickerText = '';
        let lastScreen = 'attract';
        let lastMode = null;
        let winnerShown = false;

        let turnTimerStart = 0;
        let turnTimerPlayerId = null;
        let turnTimerActive = false;

        let formingShots = [];

        let currentAim = null;
        let displayedAimAngle = null;
        let displayedAimPower = null;

        let winnerCountdownInterval = null;
        let superTextTimeout = null;

        // Фон: предрасчитанные деревья, сугробы, лёд, звёзды, озеро
        let bgTrees = [];
        let bgMounds = [];
        let bgIce = [];
        let bgStars = [];
        let bgLake = null;

        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        let width = 0, height = 0, dpr = 1;

        const CHAR_RADIUS = 52;
        const EMOJI_FONT = 46;

        function generateBackground() {
            bgTrees = [];
            bgMounds = [];
            bgIce = [];
            bgStars = [];
            bgLake = null;

            // Озеро в центре-низу
            bgLake = {
                cx: width * 0.5,
                cy: height * 0.82,
                rx: width * 0.32,
                ry: height * 0.14
            };

            // Ёлки — 3 слоя по глубине
            const treeLayers = 3;
            for (let layer = 0; layer < treeLayers; layer++) {
                const count = 5 + layer * 3;
                const depth = (layer + 1) / treeLayers;
                for (let i = 0; i < count; i++) {
                    bgTrees.push({
                        x: Math.random() * width,
                        y: height * (0.6 + Math.random() * 0.24),
                        size: (20 + Math.random() * 26) * (0.5 + depth * 0.5),
                        alpha: 0.12 + depth * 0.18,
                        swayOffset: Math.random() * Math.PI * 2,
                        layer
                    });
                }
            }
            bgTrees.sort((a, b) => a.y - b.y);

            // Сугробы на земле
            for (let i = 0; i < 16; i++) {
                bgMounds.push({
                    x: Math.random() * width,
                    y: height * (0.7 + Math.random() * 0.22),
                    w: 70 + Math.random() * 200,
                    h: 14 + Math.random() * 26,
                    alpha: 0.12 + Math.random() * 0.18
                });
            }

            // Лёд — трещины
            for (let i = 0; i < 10; i++) {
                const x1 = Math.random() * width;
                const y1 = height * (0.78 + Math.random() * 0.16);
                const segments = 3 + Math.floor(Math.random() * 4);
                const path = [{ x: x1, y: y1 }];
                let curX = x1, curY = y1;
                for (let s = 0; s < segments; s++) {
                    curX += (Math.random() - 0.5) * 100;
                    curY += (Math.random() - 0.3) * 34;
                    path.push({ x: curX, y: curY });
                }
                bgIce.push({ path, alpha: 0.08 + Math.random() * 0.12 });
            }

            // Звёзды
            for (let i = 0; i < 90; i++) {
                bgStars.push({
                    x: Math.random() * width,
                    y: Math.random() * height * 0.55,
                    size: Math.random() * 1.8 + 0.4,
                    phase: Math.random() * Math.PI * 2,
                    speed: 0.4 + Math.random() * 1.2
                });
            }
        }

        function resizeCanvas() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = Math.floor(width * dpr);
            canvas.height = Math.floor(height * dpr);
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            generateBackground();

            if (currentData) {
                players.forEach((p, id) => {
                    const raw = currentData.players?.[p.team]?.[id];
                    if (raw && raw.posX !== undefined) {
                        p.x = (raw.posX / 100) * width;
                        p.y = (raw.posY / 100) * height;
                    }
                });
            }
        }

        const TURN_TIME = 15;
        const FORM_TIME = 1500;
        const WINNER_AUTO_HIDE = 30;

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        currentBaseUrl = getBaseUrl();

        // ============================================================
        // ФОН БОЯ — многослойное зимнее поле
        // ============================================================
        function drawBattleBackground() {
            const now = Date.now() / 1000;
            const groundY = height * 0.66;

            // 1. Небо
            const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
            skyGrad.addColorStop(0, 'rgba(10, 37, 64, 0.4)');
            skyGrad.addColorStop(0.45, 'rgba(5, 20, 40, 0.5)');
            skyGrad.addColorStop(1, 'rgba(2, 8, 18, 0.65)');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, width, height);

            // 2. Луна
            const moonX = width * 0.82;
            const moonY = height * 0.14;
            const moonR = 64;
            const moonGrad = ctx.createRadialGradient(moonX, moonY, 0, moonX, moonY, moonR * 2.4);
            moonGrad.addColorStop(0, 'rgba(255, 255, 235, 0.32)');
            moonGrad.addColorStop(0.4, 'rgba(255, 255, 235, 0.1)');
            moonGrad.addColorStop(1, 'rgba(255, 255, 235, 0)');
            ctx.fillStyle = moonGrad;
            ctx.beginPath();
            ctx.arc(moonX, moonY, moonR * 2.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255, 255, 245, 0.42)';
            ctx.beginPath();
            ctx.arc(moonX, moonY, moonR * 0.52, 0, Math.PI * 2);
            ctx.fill();

            // 3. Звёзды
            bgStars.forEach(s => {
                const twinkle = 0.4 + 0.6 * Math.sin(now * s.speed + s.phase);
                ctx.fillStyle = `rgba(255, 255, 255, ${0.15 + twinkle * 0.3})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // 4. Дальние холмы (силуэты)
            ctx.fillStyle = 'rgba(20, 45, 80, 0.35)';
            ctx.beginPath();
            ctx.moveTo(0, groundY + 30);
            ctx.bezierCurveTo(width * 0.2, groundY - 60, width * 0.4, groundY + 10, width * 0.55, groundY - 30);
            ctx.bezierCurveTo(width * 0.7, groundY - 70, width * 0.85, groundY + 20, width, groundY - 10);
            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            ctx.closePath();
            ctx.fill();

            // 5. Земля — снежная заливка
            const groundGrad = ctx.createLinearGradient(0, groundY, 0, height);
            groundGrad.addColorStop(0, 'rgba(180, 210, 240, 0.05)');
            groundGrad.addColorStop(0.3, 'rgba(200, 230, 255, 0.09)');
            groundGrad.addColorStop(1, 'rgba(220, 240, 255, 0.14)');
            ctx.fillStyle = groundGrad;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.bezierCurveTo(width * 0.25, groundY - 24, width * 0.5, groundY + 12, width * 0.75, groundY - 6);
            ctx.bezierCurveTo(width * 0.85, groundY - 14, width * 0.95, groundY + 6, width, groundY);
            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            ctx.closePath();
            ctx.fill();

            // 6. Замёрзшее озеро
            if (bgLake) {
                const lake = bgLake;
                const lakeGrad = ctx.createRadialGradient(lake.cx, lake.cy, 0, lake.cx, lake.cy, Math.max(lake.rx, lake.ry));
                lakeGrad.addColorStop(0, 'rgba(100, 180, 230, 0.16)');
                lakeGrad.addColorStop(0.6, 'rgba(70, 150, 210, 0.11)');
                lakeGrad.addColorStop(1, 'rgba(40, 100, 160, 0.04)');
                ctx.fillStyle = lakeGrad;
                ctx.beginPath();
                ctx.ellipse(lake.cx, lake.cy, lake.rx, lake.ry, 0, 0, Math.PI * 2);
                ctx.fill();

                // Блик на льду
                ctx.save();
                const shineGrad = ctx.createLinearGradient(lake.cx - lake.rx, lake.cy, lake.cx + lake.rx, lake.cy);
                shineGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
                shineGrad.addColorStop(0.5, `rgba(255, 255, 255, ${0.06 + 0.03 * Math.sin(now * 0.8)})`);
                shineGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = shineGrad;
                ctx.beginPath();
                ctx.ellipse(lake.cx, lake.cy - lake.ry * 0.2, lake.rx * 0.85, lake.ry * 0.35, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // Трещины на озере
                ctx.save();
                ctx.strokeStyle = 'rgba(220, 245, 255, 0.18)';
                ctx.lineWidth = 1.2;
                ctx.shadowColor = 'rgba(180, 230, 255, 0.3)';
                ctx.shadowBlur = 4;
                for (let i = 0; i < 5; i++) {
                    const a = (i / 5) * Math.PI * 2 + 0.3;
                    const r1 = Math.random() * lake.rx * 0.3;
                    const r2 = lake.rx * (0.4 + Math.random() * 0.5);
                    ctx.beginPath();
                    ctx.moveTo(lake.cx + Math.cos(a) * r1, lake.cy + Math.sin(a) * r1 * (lake.ry / lake.rx));
                    ctx.lineTo(lake.cx + Math.cos(a + 0.4) * r2, lake.cy + Math.sin(a + 0.4) * r2 * (lake.ry / lake.rx));
                    ctx.stroke();
                }
                ctx.restore();

                // Обводка озера (берег)
                ctx.save();
                ctx.strokeStyle = 'rgba(220, 240, 255, 0.14)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(lake.cx, lake.cy, lake.rx, lake.ry, 0, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }

            // 7. Сугробы
            bgMounds.forEach(m => {
                ctx.save();
                const moundGrad = ctx.createRadialGradient(m.x, m.y - m.h * 0.3, 0, m.x, m.y, m.w / 2);
                moundGrad.addColorStop(0, `rgba(240, 250, 255, ${m.alpha + 0.08})`);
                moundGrad.addColorStop(0.7, `rgba(200, 230, 255, ${m.alpha})`);
                moundGrad.addColorStop(1, 'rgba(160, 200, 240, 0)');
                ctx.fillStyle = moundGrad;
                ctx.beginPath();
                ctx.ellipse(m.x, m.y, m.w / 2, m.h / 2, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // 8. Лёд — трещины на земле
            bgIce.forEach(ice => {
                ctx.save();
                ctx.strokeStyle = `rgba(127, 227, 255, ${ice.alpha})`;
                ctx.lineWidth = 1.5;
                ctx.shadowColor = 'rgba(127, 227, 255, 0.3)';
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ice.path.forEach((p, i) => {
                    if (i === 0) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                });
                ctx.stroke();
                ctx.restore();
            });

            // 9. Утоптанная дорожка между командами
            ctx.save();
            const pathGrad = ctx.createLinearGradient(width * 0.2, groundY, width * 0.8, groundY);
            pathGrad.addColorStop(0, 'rgba(200, 230, 255, 0.03)');
            pathGrad.addColorStop(0.5, 'rgba(220, 240, 255, 0.09)');
            pathGrad.addColorStop(1, 'rgba(200, 230, 255, 0.03)');
            ctx.fillStyle = pathGrad;
            ctx.beginPath();
            ctx.ellipse(width * 0.5, height * 0.72, width * 0.32, height * 0.06, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // 10. Ёлки (по слоям, сзади вперёд)
            bgTrees.forEach(t => {
                const sway = Math.sin(now * 0.8 + t.swayOffset) * (2 + t.layer);
                const baseY = t.y;
                const topY = baseY - t.size * 2.4;
                const halfW = t.size * 0.55;

                ctx.save();
                ctx.fillStyle = `rgba(15, 45, 75, ${t.alpha})`;
                ctx.shadowColor = 'rgba(34, 211, 238, 0.12)';
                ctx.shadowBlur = 6;

                for (let layer = 0; layer < 3; layer++) {
                    const layerY = topY + t.size * 0.75 * layer;
                    const layerW = halfW * (0.55 + layer * 0.25);
                    ctx.beginPath();
                    ctx.moveTo(t.x + sway, layerY);
                    ctx.lineTo(t.x - layerW, layerY + t.size * 0.95);
                    ctx.lineTo(t.x + layerW, layerY + t.size * 0.95);
                    ctx.closePath();
                    ctx.fill();
                }

                // Снег на ёлке
                ctx.fillStyle = `rgba(240, 250, 255, ${t.alpha * 0.6})`;
                for (let layer = 0; layer < 3; layer++) {
                    const layerY = topY + t.size * 0.75 * layer;
                    const layerW = halfW * (0.55 + layer * 0.25);
                    ctx.beginPath();
                    ctx.ellipse(t.x + sway, layerY + t.size * 0.95, layerW * 0.7, t.size * 0.18, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            });

            // 11. Снег на земле — точки
            for (let i = 0; i < 120; i++) {
                const sx = (i * 73.7) % width;
                const sy = groundY + ((i * 41.3) % (height - groundY));
                ctx.fillStyle = `rgba(255, 255, 255, ${0.12 + Math.random() * 0.18})`;
                ctx.beginPath();
                ctx.arc(sx, sy, Math.random() * 1.6 + 0.4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ============================================================
        // ATTRACT DEMO
        // ============================================================
        const DEMO_ACTS = [
            { id: 'act1', duration: 8000, phrase: 'ИГРАЙ С ДРУЗЬЯМИ', players: [
                { id: 'r1', team: 'red', name: 'Игрок', emoji: '😎' },

            ]},

        let demoActIndex = 0;
        let demoActStartTime = 0;
        let demoState = 'idle';
        let demoNextActionAt = 0;
        let demoPlayers = [];
        let demoSnowballs = [];
        let demoParticles = [];
        let demoActiveId = null;
        let demoSuperTexts = [];

        function initDemoAct(index) {
            const act = DEMO_ACTS[index];
            if (!act) return;

            demoActIndex = index;
            demoActStartTime = Date.now();
            demoState = 'aiming';
            demoNextActionAt = Date.now() + 1000;
            demoSnowballs = [];
            demoParticles = [];
            demoSuperTexts = [];

            demoPlayers = act.players.map((p) => {
                const teamPlayers = act.players.filter(x => x.team === p.team);
                const teamIndex = teamPlayers.findIndex(x => x.id === p.id);
                const teamCount = teamPlayers.length;

                const baseX = p.team === 'red' ? 0.14 : 0.86;
                const yOffset = teamCount > 1
                    ? (teamIndex - (teamCount - 1) / 2) / Math.max(1, teamCount - 1) * 0.5
                    : 0;

                return {
                    id: p.id, name: p.name, emoji: p.emoji, team: p.team,
                    x: width * (baseX + (Math.random() - 0.5) * 0.03),
                    y: height * (0.42 + yOffset + (Math.random() - 0.5) * 0.05),
                    lives: 3, alive: true,
                    aimAngle: 45 + (Math.random() - 0.5) * 90,
                    aimPower: 60 + Math.random() * 30
                };
            });

            const aliveAll = demoPlayers.filter(p => p.alive);
            if (aliveAll.length > 0) demoActiveId = aliveAll[Math.floor(Math.random() * aliveAll.length)].id;

            const phraseEl = document.getElementById('attract-phrase');
            phraseEl.style.opacity = '0';
            setTimeout(() => {
                phraseEl.innerText = act.phrase;
                phraseEl.style.opacity = '1';
            }, 300);
        }

        // ============================================================
        // ПЕРСОНАЖ — HP выше, без мигающей тени у эмодзи
        // ============================================================
        function drawEmojiCharacter(c, data) {
            const { x, y, name, emoji, team, lives, alive, isActive, scale = 1 } = data;
            const teamColor = team === 'red' ? '#ff3b5c' : '#3d8bff';
            const time = Date.now();
            const r = CHAR_RADIUS * scale;

            // 1. Ореол активного
            if (isActive && alive) {
                const pulse = 0.5 + 0.5 * Math.sin(time / 200);
                c.save();
                c.strokeStyle = teamColor;
                c.lineWidth = 4 * scale;
                c.shadowColor = teamColor;
                c.shadowBlur = 35 * pulse;
                c.beginPath();
                c.arc(x, y, r + 10 * scale + pulse * 8 * scale, 0, Math.PI * 2);
                c.stroke();
                c.restore();
            }

            // 2. Мёртвый
            if (!alive) {
                c.save();
                c.globalAlpha = 0.35;
                c.font = `${Math.round(48 * scale)}px Montserrat`;
                c.textAlign = 'center';
                c.textBaseline = 'middle';
                c.fillText('💀', x, y);
                c.restore();
                return;
            }

            // 3. Тень под кругом
            c.save();
            c.fillStyle = 'rgba(0,0,0,0.55)';
            c.beginPath();
            c.ellipse(x, y + r + 4 * scale, r * 0.85, 10 * scale, 0, 0, Math.PI * 2);
            c.fill();
            c.restore();

            // 4. Круг-подложка
            c.save();
            c.shadowColor = teamColor;
            c.shadowBlur = 25 * scale;
            const grad = c.createRadialGradient(x - r * 0.25, y - r * 0.25, r * 0.1, x, y, r);
            grad.addColorStop(0, 'rgba(70, 120, 175, 0.96)');
            grad.addColorStop(0.5, 'rgba(35, 75, 125, 0.96)');
            grad.addColorStop(1, 'rgba(12, 30, 55, 0.97)');
            c.fillStyle = grad;
            c.beginPath();
            c.arc(x, y, r, 0, Math.PI * 2);
            c.fill();
            c.restore();

            // 5. Светлый блик
            c.save();
            const glowGrad = c.createRadialGradient(x, y - r * 0.1, 0, x, y, r * 0.85);
            glowGrad.addColorStop(0, 'rgba(255, 255, 255, 0.25)');
            glowGrad.addColorStop(0.6, 'rgba(255, 255, 255, 0.07)');
            glowGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            c.fillStyle = glowGrad;
            c.beginPath();
            c.arc(x, y, r * 0.85, 0, Math.PI * 2);
            c.fill();
            c.restore();

            // 6. Рамка команды
            c.save();
            c.strokeStyle = teamColor;
            c.lineWidth = 4 * scale;
            c.beginPath();
            c.arc(x, y, r, 0, Math.PI * 2);
            c.stroke();
            c.restore();

            // 7. Внутреннее кольцо
            c.save();
            c.strokeStyle = 'rgba(255,255,255,0.18)';
            c.lineWidth = 1.5 * scale;
            c.beginPath();
            c.arc(x, y, r - 6 * scale, 0, Math.PI * 2);
            c.stroke();
            c.restore();

            // 8. ЭМОДЗИ — без тени, без мигания
            c.save();
            c.shadowBlur = 0;
            c.shadowColor = 'transparent';
            c.globalAlpha = 1;
            c.font = `${Math.round(EMOJI_FONT * scale)}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
            c.textAlign = 'center';
            c.textBaseline = 'middle';
            c.fillText(emoji || '😀', x, y + 2 * scale);
            c.restore();

            // 9. Имя под кругом
            c.save();
            c.font = `bold ${Math.round(16 * scale)}px Montserrat, sans-serif`;
            c.fillStyle = '#ffffff';
            c.textAlign = 'center';
            c.textBaseline = 'top';
            c.shadowColor = 'rgba(0,0,0,0.95)';
            c.shadowBlur = 8 * scale;
            c.fillText(name, x, y + r + 14 * scale);
            c.restore();

            // 10. HP-бейдж — ВЫШЕ круга, БЕЗ тени (убрано мигание)
            c.save();
            c.font = `${Math.round(20 * scale)}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
            c.textAlign = 'center';
            c.textBaseline = 'middle';
            const hearts = lives <= 5 ? '❤️'.repeat(Math.max(0, lives)) : `❤️×${lives}`;
            const badgeY = y - r - 30 * scale;   // подняли выше
            const textWidth = c.measureText(hearts).width;
            const padX = 10 * scale;
            const padY = 5 * scale;
            const bW = textWidth + padX * 2;
            const bH = 24 * scale;
            const bX = x - bW / 2;
            const bY = badgeY - bH / 2;
            c.fillStyle = 'rgba(0,0,0,0.7)';
            c.beginPath();
            if (c.roundRect) {
                c.roundRect(bX, bY, bW, bH, 8 * scale);
            } else {
                c.rect(bX, bY, bW, bH);
            }
            c.fill();
            c.shadowBlur = 0;
            c.fillStyle = '#fff';
            c.fillText(hearts, x, badgeY);
            c.restore();
        }

        function drawDemoPlayer(p, isActive) {
            drawEmojiCharacter(ctx, {
                x: p.x, y: p.y, name: p.name, emoji: p.emoji, team: p.team,
                lives: p.lives, alive: p.alive, isActive, scale: 0.75
            });
        }

        // ============================================================
        // ПРИЦЕЛ — поддерживает угол 0..360
        // ============================================================
        function drawAimArc(aimer, angle, power) {
            const direction = aimer.team === 'red' ? 1 : -1;
            const teamColor = aimer.team === 'red' ? '#ff3b5c' : '#3d8bff';
            const rad = (angle * Math.PI) / 180;
            const speed = power * 0.4;
            const vx = Math.cos(rad) * speed * direction;
            const vy = -Math.sin(rad) * speed;
            const gravity = 0.3;

            let x = aimer.x;
            let y = aimer.y - CHAR_RADIUS * 0.7;

            // Короткая дуга
            let sx = x, sy = y, svx = vx, svy = vy;
            ctx.save();
            ctx.setLineDash([6, 8]);
            ctx.lineDashOffset = -(Date.now() / 50) % 14;
            ctx.strokeStyle = teamColor;
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.45;
            ctx.shadowColor = teamColor;
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            for (let i = 0; i < 22; i++) {
                sx += svx; sy += svy; svy += gravity;
                ctx.lineTo(sx, sy);
                if (sx < -80 || sx > width + 80 || sy > height + 80) break;
            }
            ctx.stroke();
            ctx.restore();

            // Стрелка направления (для любого угла 0..360)
            const lineLength = 25 + power * 0.18;
            const endX = x + Math.cos(rad) * lineLength * direction;
            const endY = y - Math.sin(rad) * lineLength;

            ctx.save();
            ctx.strokeStyle = teamColor;
            ctx.lineWidth = 4;
            ctx.globalAlpha = 0.9;
            ctx.shadowColor = teamColor;
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(endX, endY);
            ctx.stroke();
            ctx.restore();

            // Наконечник
            const headAngle = Math.atan2(endY - y, endX - x);
            ctx.save();
            ctx.translate(endX, endY);
            ctx.rotate(headAngle);
            ctx.fillStyle = teamColor;
            ctx.shadowColor = teamColor;
            ctx.shadowBlur = 25;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-16, -7);
            ctx.lineTo(-16, 7);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            // Бейдж %
            ctx.save();
            ctx.fillStyle = 'rgba(0,0,0,0.75)';
            ctx.strokeStyle = teamColor;
            ctx.lineWidth = 2;
            ctx.shadowColor = teamColor;
            ctx.shadowBlur = 14;
            ctx.beginPath();
            ctx.arc(endX, endY, 20, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.font = 'bold 13px JetBrains Mono, monospace';
            ctx.fillStyle = teamColor;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(Math.round(power) + '%', endX, endY);
            ctx.restore();
        }

        function drawDemoAim(p) {
            drawAimArc(p, p.aimAngle, p.aimPower);
        }

        function demoShoot(shooter, target, isSuper = false, superType = null) {
            if (!target) return;

            const direction = shooter.team === 'red' ? 1 : -1;
            const dx = target.x - shooter.x;
            const dy = target.y - shooter.y;
            let baseAngle = Math.atan2(-dy, dx * direction) * 180 / Math.PI;
            const power = isSuper ? 70 + Math.random() * 30 : shooter.aimPower;

            if (isSuper) {
                const shots = [];
                if (superType === 'fan') {
                    for (let i = 0; i < 6; i++) shots.push({ angle: baseAngle + (Math.random() - 0.5) * 60, power: power + (Math.random() - 0.5) * 40 });
                } else if (superType === 'shotgun') {
                    for (let i = 0; i < 8; i++) shots.push({ angle: baseAngle + (Math.random() - 0.5) * 20, power: power + (Math.random() - 0.5) * 10 });
                } else if (superType === 'nuke') {
                    shots.push({ angle: baseAngle, power: power, damage: 3 });
                }

                shots.forEach(s => {
                    demoSnowballs.push({
                        x: shooter.x, y: shooter.y - 20,
                        vx: Math.cos(s.angle * Math.PI / 180) * (s.power * 0.4) * direction,
                        vy: -Math.sin(s.angle * Math.PI / 180) * (s.power * 0.4),
                        gravity: 0.3, team: shooter.team, radius: 12,
                        isSuper: true, damage: s.damage || 1
                    });
                });

                const superNames = { fan: { emoji: '🌪', name: 'ВЕЕР' }, shotgun: { emoji: '💥', name: 'ДРОБОВИК' }, nuke: { emoji: '☄️', name: 'ЯДЕРКА' } };
                const sn = superNames[superType] || { emoji: '⚡', name: 'СУПЕР' };
                demoSuperTexts.push({ text: sn.name, emoji: sn.emoji, x: shooter.x, y: shooter.y - 90, life: 1 });
            } else {
                demoSnowballs.push({
                    x: shooter.x, y: shooter.y - 20,
                    vx: Math.cos(baseAngle * Math.PI / 180) * (power * 0.4) * direction,
                    vy: -Math.sin(baseAngle * Math.PI / 180) * (power * 0.4),
                    gravity: 0.3, team: shooter.team, radius: 11,
                    isSuper: false, damage: 1
                });
            }

            for (let i = 0; i < 14; i++) {
                demoParticles.push({
                    x: shooter.x, y: shooter.y - 20,
                    vx: (Math.random() - 0.5) * 10 * direction,
                    vy: (Math.random() - 0.5) * 10,
                    life: 0.7,
                    color: isSuper ? '#fbbf24' : (shooter.team === 'red' ? '#ff3b5c' : '#3d8bff'),
                    size: Math.random() * 5 + 2
                });
            }
        }

        function updateDemo() {
            if (lastScreen !== 'attract') return;
            const now = Date.now();
            const act = DEMO_ACTS[demoActIndex];
            if (!act) return;

            if (now - demoActStartTime > act.duration) {
                let nextIndex = demoActIndex + 1;
                if (nextIndex >= DEMO_ACTS.length) nextIndex = 0;
                initDemoAct(nextIndex);
                return;
            }

            let alivePlayers = demoPlayers.filter(p => p.alive);
            if (alivePlayers.length === 0) {
                demoPlayers.forEach(p => { p.lives = 3; p.alive = true; });
                alivePlayers = demoPlayers.filter(p => p.alive);
            }

            let currentActive = demoPlayers.find(p => p.id === demoActiveId);
            if (!currentActive || !currentActive.alive) {
                if (alivePlayers.length > 0) {
                    demoActiveId = alivePlayers[Math.floor(Math.random() * alivePlayers.length)].id;
                    currentActive = demoPlayers.find(p => p.id === demoActiveId);
                }
            }
            if (!currentActive || !currentActive.alive) return;

            if (demoState === 'aiming') {
                // Демо: крутим угол в диапазоне 0..180 (красные) или 0..180 (синие), но с разбросом
                currentActive.aimAngle += (Math.random() - 0.5) * 5;
                currentActive.aimAngle = Math.max(5, Math.min(175, currentActive.aimAngle));
                currentActive.aimPower = 50 + Math.sin(now / 400) * 30 + 20;

                if (now >= demoNextActionAt) {
                    const enemies = demoPlayers.filter(p => p.team !== currentActive.team && p.alive);
                    if (enemies.length > 0) {
                        const target = enemies[Math.floor(Math.random() * enemies.length)];
                        const useSuper = act.id === 'act3' && Math.random() < 0.45;
                        if (useSuper) {
                            const supers = ['fan', 'shotgun', 'nuke'];
                            const type = supers[Math.floor(Math.random() * supers.length)];
                            demoShoot(currentActive, target, true, type);
                        } else {
                            demoShoot(currentActive, target, false);
                        }
                    }
                    demoState = 'shooting';
                    demoNextActionAt = now + 1000 + Math.random() * 800;
                }
            } else if (demoState === 'shooting' && now >= demoNextActionAt) {
                demoState = 'aiming';
                demoNextActionAt = now + 1000;

                demoPlayers.forEach(p => {
                    if (!p.alive) return;
                    if (p.id !== demoActiveId && Math.random() < 0.3) {
                        p.lives--;
                        if (p.lives <= 0) {
                            p.alive = false;
                            setTimeout(() => {
                                if (lastScreen === 'attract') { p.lives = 3; p.alive = true; }
                            }, 2500);
                        }
                    }
                });

                const aliveList = demoPlayers.filter(p => p.alive);
                if (aliveList.length > 0) demoActiveId = aliveList[Math.floor(Math.random() * aliveList.length)].id;
            }

            for (let i = demoSnowballs.length - 1; i >= 0; i--) {
                const b = demoSnowballs[i];
                b.x += b.vx; b.y += b.vy; b.vy += b.gravity;
                if (b.x < -80 || b.x > width + 80 || b.y > height + 80) demoSnowballs.splice(i, 1);
            }
            for (let i = demoParticles.length - 1; i >= 0; i--) {
                const p = demoParticles[i];
                p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= 0.02;
                if (p.life <= 0) demoParticles.splice(i, 1);
            }
            for (let i = demoSuperTexts.length - 1; i >= 0; i--) {
                const t = demoSuperTexts[i];
                t.y -= 0.8; t.life -= 0.015;
                if (t.life <= 0) demoSuperTexts.splice(i, 1);
            }
        }

        function drawDemo() {
            if (lastScreen !== 'attract') return;
            ctx.clearRect(0, 0, width, height);

            // Лёгкий фон attract
            ctx.fillStyle = 'rgba(255, 59, 92, 0.03)';
            ctx.fillRect(0, 0, width * 0.4, height);
            ctx.fillStyle = 'rgba(61, 139, 255, 0.03)';
            ctx.fillRect(width * 0.6, 0, width * 0.4, height);

            demoPlayers.forEach(p => {
                if (p.id === demoActiveId && p.alive) drawDemoAim(p);
                drawDemoPlayer(p, p.id === demoActiveId);
            });

            demoSnowballs.forEach(b => {
                ctx.save();
                ctx.shadowColor = b.isSuper ? '#fbbf24' : (b.team === 'red' ? '#ff3b5c' : '#3d8bff');
                ctx.shadowBlur = b.isSuper ? 30 : 20;
                const radius = b.isSuper ? 14 : 11;
                const g = ctx.createRadialGradient(b.x - 3, b.y - 3, 1, b.x, b.y, radius);
                g.addColorStop(0, '#fff');
                g.addColorStop(1, b.isSuper ? '#fbbf24' : (b.team === 'red' ? '#f87171' : '#60a5fa'));
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(b.x, b.y, radius, 0, Math.PI * 2);
                ctx.fill();
                if (b.isSuper) {
                    ctx.strokeStyle = '#fbbf24';
                    ctx.lineWidth = 2;
                    ctx.globalAlpha = 0.6;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, radius + 5, 0, Math.PI * 2);
                    ctx.stroke();
                }
                ctx.restore();
            });

            demoParticles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            });

            demoSuperTexts.forEach(t => {
                ctx.save();
                ctx.globalAlpha = t.life;
                ctx.font = 'bold 28px Montserrat';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#fbbf24';
                ctx.shadowColor = '#fbbf24';
                ctx.shadowBlur = 20;
                ctx.fillText(`${t.emoji} ${t.text}`, t.x, t.y);
                ctx.restore();
            });
        }

        // ============================================================
        // УТИЛИТЫ
        // ============================================================
        function getBaseUrl() {
            const url = new URL(window.location.href);
            return url.origin + url.pathname.substring(0, url.pathname.lastIndexOf('/') + 1);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function renderHeartsCompact(lives) {
            if (lives <= 0) return '💀';
            if (lives <= 5) return '❤️'.repeat(lives);
            return `❤️×${lives}`;
        }

        // ============================================================
        // PLAYER CLASS
        // ============================================================
        class Player {
            constructor(id, data, team) {
                this.id = id;
                this.name = data.name || 'Игрок';
                this.emoji = data.emoji || '😀';
                this.lives = data.lives ?? 3;
                this.alive = data.alive ?? true;
                this.team = team;
                if (data.posX !== undefined && data.posY !== undefined) {
                    this.x = (data.posX / 100) * width;
                    this.y = (data.posY / 100) * height;
                } else {
                    this.x = team === 'red' ? width * 0.1 : width * 0.9;
                    this.y = height * 0.5;
                }
                this.hitFlash = 0;
            }
            update(data) {
                const prevLives = this.lives;
                this.name = data.name || this.name;
                this.emoji = data.emoji || this.emoji;
                this.lives = data.lives ?? this.lives;
                this.alive = data.alive ?? this.alive;
                if (data.posX !== undefined) this.x = (data.posX / 100) * width;
                if (data.posY !== undefined) this.y = (data.posY / 100) * height;
                if (this.lives < prevLives) this.hitFlash = Date.now();
            }
            draw(ctx, isActive) {
                const elapsedHit = (Date.now() - this.hitFlash) / 1000;
                const flash = elapsedHit < 0.3 ? 0.5 + 0.5 * Math.sin(elapsedHit * 40) : 0;

                if (flash > 0) {
                    ctx.save();
                    ctx.globalAlpha = flash * 0.9;
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 4;
                    ctx.shadowColor = '#ffffff';
                    ctx.shadowBlur = 20;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, CHAR_RADIUS + 6, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                drawEmojiCharacter(ctx, {
                    x: this.x, y: this.y, name: this.name, emoji: this.emoji, team: this.team,
                    lives: this.lives, alive: this.alive, isActive, scale: 1
                });
            }
        }

        function spawnParticles(x, y, color, count = 30) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 28,
                    vy: (Math.random() - 0.5) * 28,
                    life: 1,
                    color: color || '#ffffff',
                    size: Math.random() * 9 + 2
                });
            }
        }

        function spawnShockwave(x, y, color) {
            const el = document.createElement('div');
            el.className = 'shockwave';
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.width = '40px';
            el.style.height = '40px';
            el.style.borderColor = color;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 600);
        }

        function spawnDamageFloat(x, y, text, color) {
            const el = document.createElement('div');
            el.className = 'damage-float';
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.color = color;
            el.style.textShadow = `0 0 20px ${color}, 0 2px 10px rgba(0,0,0,0.8)`;
            el.innerText = text;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1200);
        }

        class Snowball {
            constructor(shooter, power, angle, damage = 1, isSuper = false) {
                this.x = shooter.x;
                this.y = shooter.y;
                const direction = shooter.team === 'red' ? 1 : -1;
                const rad = angle * Math.PI / 180;
                const speed = power * 0.4;
                this.vx = Math.cos(rad) * speed * direction;
                this.vy = -Math.sin(rad) * speed;
                this.gravity = 0.3;
                this.isMega = (power > 90);
                this.isSuper = isSuper;
                this.damage = damage;
                this.team = shooter.team;
                this.trailCooldown = 0;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.trailCooldown--;
                if (this.trailCooldown <= 0 && Math.random() > 0.3) {
                    const color = this.isSuper ? 'rgba(251, 191, 36, 0.85)' : 'rgba(127, 227, 255, 0.7)';
                    particles.push({
                        x: this.x, y: this.y,
                        vx: (Math.random() - 0.5) * 2,
                        vy: (Math.random() - 0.5) * 2,
                        life: 0.9, color,
                        size: Math.random() * 5 + 2
                    });
                    this.trailCooldown = 2;
                }
            }
            draw(ctx) {
                const radius = this.isSuper ? 18 : 15;
                const color2 = this.isSuper ? '#fbbf24' : '#7fe3ff';
                ctx.shadowColor = this.isSuper ? '#fbbf24' : '#7fe3ff';
                ctx.shadowBlur = this.isSuper ? 45 : 30;
                const gradient = ctx.createRadialGradient(this.x - 5, this.y - 5, 2, this.x, this.y, radius);
                gradient.addColorStop(0, '#ffffff');
                gradient.addColorStop(1, color2);
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
                ctx.fill();
                if (this.isSuper) {
                    ctx.strokeStyle = '#fbbf24';
                    ctx.lineWidth = 2;
                    ctx.globalAlpha = 0.7;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, radius + 7, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.globalAlpha = 1;
                }
                ctx.shadowBlur = 0;
            }
        }

        // ============================================================
        // GAME LOOP
        // ============================================================
        function gameLoop() {
            const now = performance.now();

            if (lastScreen === 'attract') {
                updateDemo();
                drawDemo();
            } else if (lastScreen === 'game' && currentData?.preloadDone && currentData?.status === 'playing') {
                ctx.clearRect(0, 0, width, height);

                drawBattleBackground();

                // Сетка
                ctx.strokeStyle = 'rgba(127, 227, 255, 0.035)';
                ctx.lineWidth = 1;
                for (let x = 0; x < width; x += 60) {
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
                }
                for (let y = 0; y < height; y += 60) {
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
                }

                const activeId = currentData?.activePlayerId;
                players.forEach(p => p.draw(ctx, p.id === activeId));

                if (currentAim && formingShots.length === 0) {
                    const aimer = players.get(currentAim.playerId);
                    if (aimer && aimer.alive) {
                        if (displayedAimAngle === null) {
                            displayedAimAngle = currentAim.angle;
                            displayedAimPower = currentAim.power;
                        } else {
                            displayedAimAngle += (currentAim.angle - displayedAimAngle) * 0.25;
                            displayedAimPower += (currentAim.power - displayedAimPower) * 0.25;
                        }
                        drawAimArc(aimer, displayedAimAngle, displayedAimPower);
                    }
                } else if (!currentAim) {
                    displayedAimAngle = null;
                    displayedAimPower = null;
                }

                if (formingShots.length > 0) drawFormingShots(now);

                for (let i = snowballs.length - 1; i >= 0; i--) {
                    const ball = snowballs[i];
                    ball.update();
                    ball.draw(ctx);
                    let hit = false;
                    players.forEach(p => {
                        if (hit) return;
                        if (p.team !== ball.team && p.alive) {
                            const dx = ball.x - p.x;
                            const dy = ball.y - p.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < CHAR_RADIUS) {
                                hit = true;
                                handleHit(ball, p);
                            }
                        }
                    });
                    if (hit || ball.x < -120 || ball.x > width + 120 || ball.y > height + 120 || ball.y < -300) {
                        snowballs.splice(i, 1);
                    }
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= 0.02;
                    if (p.life <= 0) { particles.splice(i, 1); continue; }
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }

                updateTurnTimerPosition(now);
            } else {
                ctx.clearRect(0, 0, width, height);
            }

            requestAnimationFrame(gameLoop);
        }

        function drawFormingShots(now) {
            formingShots.forEach(fs => {
                const elapsed = now - fs.startTime;
                const progress = Math.min(1, elapsed / FORM_TIME);
                const teamColor = fs.team === 'red' ? '#ff3b5c' : '#3d8bff';
                const baseRadius = 5 + progress * (fs.isSuper ? 25 : 20);
                const bx = fs.x, by = fs.y + 20;

                ctx.save();
                ctx.shadowColor = fs.isSuper ? '#fbbf24' : '#7fe3ff';
                ctx.shadowBlur = (fs.isSuper ? 50 : 30) * progress;
                const gradient = ctx.createRadialGradient(bx - baseRadius * 0.3, by - baseRadius * 0.3, 2, bx, by, baseRadius);
                gradient.addColorStop(0, '#ffffff');
                gradient.addColorStop(1, fs.isSuper ? '#fbbf24' : '#a8e6ff');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(bx, by, baseRadius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                ctx.save();
                ctx.strokeStyle = fs.isSuper ? '#fbbf24' : teamColor;
                ctx.lineWidth = 4;
                ctx.shadowColor = ctx.strokeStyle;
                ctx.shadowBlur = 15;
                ctx.globalAlpha = 0.8;
                ctx.beginPath();
                ctx.arc(bx, by, baseRadius + 15, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * progress);
                ctx.stroke();
                ctx.restore();
            });
        }

        function updateTurnTimerPosition(now) {
            const timerEl = document.getElementById('tv-turn-timer');
            if (!turnTimerActive || !turnTimerPlayerId) {
                timerEl.classList.remove('active');
                return;
            }
            const player = players.get(turnTimerPlayerId);
            if (!player || !player.alive) {
                timerEl.classList.remove('active');
                return;
            }
            timerEl.style.left = `${player.x}px`;
            timerEl.style.top = `${player.y - CHAR_RADIUS - 110}px`;
            timerEl.style.transform = 'translateX(-50%)';
            timerEl.classList.add('active');

            const elapsed = (Date.now() - turnTimerStart) / 1000;
            const remaining = Math.max(0, TURN_TIME - elapsed);
            const ratio = remaining / TURN_TIME;

            const progressEl = document.getElementById('tv-turn-timer-progress');
            const valueEl = document.getElementById('tv-turn-timer-value');
            const ringEl = document.getElementById('tv-turn-timer-ring');

            const CIRCUMFERENCE = 2 * Math.PI * 38;
            progressEl.style.strokeDasharray = CIRCUMFERENCE;
            progressEl.style.strokeDashoffset = CIRCUMFERENCE * (1 - ratio);

            valueEl.innerText = Math.ceil(remaining);

            ringEl.classList.remove('red', 'blue', 'danger');
            if (remaining <= 3) ringEl.classList.add('danger');
            else ringEl.classList.add(player.team);
        }

        // ============================================================
        // HIT + GAME OVER
        // ============================================================
        async function handleHit(ball, p) {
            const damage = ball.damage || 1;
            const newLives = Math.max(0, p.lives - damage);
            const newAlive = newLives > 0;

            p.lives = newLives;
            p.alive = newAlive;
            p.hitFlash = Date.now();

            try {
                await update(ref(db, `games/${gameId}/players/${p.team}/${p.id}`), {
                    lives: newLives,
                    alive: newAlive
                });
            } catch (e) {
                console.error('handleHit update failed:', e);
            }

            spawnParticles(ball.x, ball.y, p.team === 'red' ? '#ff3b5c' : '#3d8bff', 30 + damage * 20);
            spawnShockwave(ball.x, ball.y, p.team === 'red' ? '#ff3b5c' : '#3d8bff');
            spawnDamageFloat(p.x, p.y - CHAR_RADIUS, `-${damage}❤️`, p.team === 'red' ? '#ff3b5c' : '#3d8bff');

            document.getElementById('main-body').classList.add('screen-shake');
            setTimeout(() => document.getElementById('main-body').classList.remove('screen-shake'), 400);

            if (ball.isSuper) {
                const superDiv = document.createElement('div');
                superDiv.className = 'mega-text';
                superDiv.innerText = damage > 1 ? `☄️ ЯДЕРКА! -${damage}❤️` : '⚡ СУПЕРБРОСОК!';
                superDiv.style.textShadow = '0 0 80px #fbbf24';
                document.body.appendChild(superDiv);
                setTimeout(() => superDiv.remove(), 2000);
            } else if (ball.isMega) {
                const megaDiv = document.createElement('div');
                megaDiv.className = 'mega-text';
                megaDiv.innerText = 'МЕГАБРОСОК!';
                document.body.appendChild(megaDiv);
                setTimeout(() => megaDiv.remove(), 2000);
            }

            await checkGameOver();
        }

        let checkingGameOver = false;
        async function checkGameOver() {
            if (checkingGameOver) return;
            checkingGameOver = true;
            try {
                const snap = await get(ref(db, `games/${gameId}/players`));
                const playersData = snap.val() || {};

                const teamLives = (team) => {
                    const teamPlayers = playersData[team] || {};
                    return Object.values(teamPlayers).reduce((sum, p) =>
                        sum + (p.alive && p.lives > 0 ? p.lives : 0), 0
                    );
                };

                const redLives = teamLives('red');
                const blueLives = teamLives('blue');

                updateHeartsUI();

                if (redLives <= 0 && blueLives <= 0) {
                    await update(gameRef, { status: 'finished', screen: 'winner', winner: 'none' });
                } else if (redLives <= 0) {
                    await update(gameRef, { status: 'finished', screen: 'winner', winner: 'blue' });
                } else if (blueLives <= 0) {
                    await update(gameRef, { status: 'finished', screen: 'winner', winner: 'red' });
                }
            } catch (e) {
                console.error('checkGameOver failed:', e);
            } finally {
                checkingGameOver = false;
            }
        }
