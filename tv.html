<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ENDORPHIN | ТВ ЭКРАН</title>
    
    <!-- Внешние библиотеки -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
    
    <style>
        /* ============================================================
           ГЛОБАЛЬНЫЕ СТИЛИ И ШРИФТЫ
           ============================================================ */
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
        
        :root {
            --bg-gradient: radial-gradient(circle at 50% 0%, #0a2540 0%, #03080f 100%);
            --glass-bg: rgba(10, 37, 64, 0.6);
            --glass-border: rgba(127, 227, 255, 0.3);
            --red-team: #ef4444;
            --blue-team: #3b82f6;
            --cyan-glow: #22d3ee;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            background: var(--bg-gradient);
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            user-select: none;
        }

        /* ============================================================
           СНЕЖИНКИ
           ============================================================ */
        .snowflake {
            position: absolute;
            color: rgba(255, 255, 255, 0.6);
            font-size: 20px;
            animation: fall linear infinite;
            pointer-events: none;
            z-index: 5;
            filter: drop-shadow(0 0 8px #fff);
            top: -10vh;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* ============================================================
           СТЕКЛО
           ============================================================ */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 0 40px rgba(31, 143, 214, 0.2), inset 0 0 20px rgba(127, 227, 255, 0.1);
            border-radius: 1.5rem;
        }

        /* ============================================================
           ЭФФЕКТЫ
           ============================================================ */
        @keyframes screenShake {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-5px, 2px); }
            40% { transform: translate(5px, -2px); }
            60% { transform: translate(-8px, 4px); }
            80% { transform: translate(8px, -4px); }
        }
        .screen-shake { animation: screenShake 0.4s cubic-bezier(.36,.07,.19,.97) both; }

        /* ============================================================
           CANVAS
           ============================================================ */
        #game-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            display: block;
        }

        /* ============================================================
           UI СЛОЙ
           ============================================================ */
        .ui-layer {
            position: absolute;
            inset: 0;
            z-index: 20;
            pointer-events: none;
        }

        /* ============================================================
           ЛОББИ
           ============================================================ */
        #lobby-view {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: var(--bg-gradient);
            transition: opacity 0.5s;
        }

        .qr-slot {
            background: #ffffff;
            padding: 6px;
            border-radius: 12px;
            border: 4px solid var(--cyan-glow);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ============================================================
           ТЕКСТ МЕГАБРОСОК
           ============================================================ */
        @keyframes megaZoom {
            0% { transform: translate(-50%, -50%) scale(0.1); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        .mega-text {
            position: absolute;
            top: 50%;
            left: 50%;
            font-size: 120px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 80px #fbbf24;
            z-index: 100;
            letter-spacing: 5px;
            text-transform: uppercase;
            animation: megaZoom 0.8s forwards;
            pointer-events: none;
        }

        /* ============================================================
           БЕГУЩАЯ СТРОКА
           ============================================================ */
        .ticker-wrap {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(0, 0, 0, 0.9);
            overflow: hidden;
            border-top: 2px solid var(--cyan-glow);
            z-index: 100;
            display: flex;
            align-items: center;
        }
        .ticker {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: tickerMove 15s linear infinite;
            font-size: 24px;
            font-weight: 700;
            color: var(--cyan-glow);
            text-transform: uppercase;
        }
        @keyframes tickerMove {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* ============================================================
           СЕРДЕЧКИ
           ============================================================ */
        .hp-display {
            position: absolute;
            font-size: 3rem;
            filter: drop-shadow(0 0 10px currentColor);
        }
        .hp-red { top: 20px; left: 20px; color: var(--red-team); }
        .hp-blue { bottom: 80px; right: 20px; color: var(--blue-team); }

        /* ============================================================
           ВЫБОР КОМАНДЫ (для модератора)
           ============================================================ */
        .team-select {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            z-index: 50;
        }
        .team-btn {
            padding: 15px 40px;
            border-radius: 15px;
            font-weight: 900;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid transparent;
        }
        .team-btn.red {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.3);
        }
        .team-btn.red.active {
            background: rgba(239, 68, 68, 0.5);
            border-color: #ef4444;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.6);
        }
        .team-btn.blue {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
            border-color: rgba(59, 130, 246, 0.3);
        }
        .team-btn.blue.active {
            background: rgba(59, 130, 246, 0.5);
            border-color: #3b82f6;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.6);
        }
    </style>
</head>
<body class="h-screen w-screen relative overflow-hidden" id="main-body">

    <!-- Фон (снежинки) -->
    <div id="snow-container" class="fixed inset-0 pointer-events-none z-0"></div>

    <!-- Игровое поле (Canvas) -->
    <canvas id="game-canvas"></canvas>

    <!-- UI поверх Canvas -->
    <div class="ui-layer">
        <div class="hp-display hp-red" id="heart-red">❤️❤️❤️</div>
        <div class="hp-display hp-blue" id="heart-blue">❤️❤️❤️</div>
        
        <div class="absolute top-4 left-1/2 -translate-x-1/2 glass-panel px-8 py-2 rounded-full text-2xl font-black" id="turn-indicator" style="display: none;">ХОД: ...</div>
        <div class="absolute top-20 left-1/2 -translate-x-1/2 text-6xl font-black text-white" id="tv-timer" style="display: none;"></div>
    </div>

    <!-- Экран Лобби -->
    <div id="lobby-view">
        <div class="text-center mb-8">
            <h1 class="text-8xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-blue-400 to-indigo-500 mb-2 tracking-tighter">ENDORPHIN</h1>
            <h2 class="text-4xl font-bold text-cyan-100 tracking-[0.3em] uppercase opacity-80">Снежный Баттл</h2>
            <div id="tv-mode" class="mt-4 inline-block bg-cyan-900/50 px-8 py-2 rounded-full border border-cyan-500/50 text-2xl font-black text-cyan-300">РЕЖИМ: ОЖИДАНИЕ</div>
        </div>

        <div id="qr-container" class="hidden flex gap-24 mb-8">
            <div class="glass-panel p-6 rounded-3xl flex flex-col items-center w-80 relative">
                <div class="absolute -top-6 w-full text-center"><span class="bg-red-500 text-white font-black px-6 py-2 rounded-full">КРАСНЫЕ</span></div>
                <div class="bg-white p-3 rounded-xl mt-4" id="qr-red"></div>
                <div id="tv-players-red" class="mt-4 space-y-2 w-full text-center text-sm"></div>
            </div>
            <div class="flex flex-col items-center justify-center"><div class="text-6xl font-black text-white/30 italic">VS</div></div>
            <div class="glass-panel p-6 rounded-3xl flex flex-col items-center w-80 relative">
                <div class="absolute -top-6 w-full text-center"><span class="bg-blue-500 text-white font-black px-6 py-2 rounded-full">СИНИЕ</span></div>
                <div class="bg-white p-3 rounded-xl mt-4" id="qr-blue"></div>
                <div id="tv-players-blue" class="mt-4 space-y-2 w-full text-center text-sm"></div>
            </div>
        </div>
        
        <!-- Выбор первой команды (управляется с модератора) -->
        <div class="team-select hidden" id="team-select">
            <button class="team-btn red" onclick="selectFirstTeam('red')" id="btn-red-start">КРАСНЫЕ</button>
            <button class="team-btn blue" onclick="selectFirstTeam('blue')" id="btn-blue-start">СИНИЕ</button>
        </div>

        <div id="tv-status" class="text-4xl font-black text-white tracking-widest hidden">ОЖИДАНИЕ ИГРОКОВ...</div>
    </div>

    <!-- Экран Победы -->
    <div id="win-view" class="absolute inset-0 hidden flex-col items-center justify-center bg-black/80 backdrop-blur-2xl z-40">
        <h1 class="text-9xl font-black text-white mb-12" id="win-text">ПОБЕДА!</h1>
    </div>

    <!-- Бегущая строка -->
    <div class="ticker-wrap">
        <div class="ticker" id="ticker-text">ДОБРО ПОЖАЛОВАТЬ НА ВЕЧЕРИНКУ ENDORPHIN!</div>
    </div>

    <!-- ============================================================
         СКРИПТ (Canvas Engine & Firebase)
         ============================================================ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ============================================================
        // КОНФИГУРАЦИЯ
        // ============================================================
        const firebaseConfig = { apiKey: "AIzaSyCXIR5Tv8lB6ivcGRC3yt1SC66MM6T5b_M", authDomain: "endorphin-battle.firebaseapp.com", databaseURL: "https://endorphin-battle-default-rtdb.europe-west1.firebasedatabase.app", projectId: "endorphin-battle", storageBucket: "endorphin-battle.firebasestorage.app", messagingSenderId: "185259733030", appId: "1:185259733030:web:d72a89a436880973e636e7" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const gameId = 'battle_1';
        const gameRef = ref(db, `games/${gameId}`);

        // ============================================================
        // CANVAS SETUP
        // ============================================================
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ============================================================
        // ИГРОВЫЕ ПЕРЕМЕННЫЕ
        // ============================================================
        let currentData = null;
        let currentMode = null;
        let currentBaseUrl = getBaseUrl();
        
        let players = []; 
        let snowballs = []; 
        let particles = []; 
        let iceCrystals = []; // Для визуализации

        function getBaseUrl() {
            const url = new URL(window.location.href);
            return url.origin + url.pathname.substring(0, url.pathname.lastIndexOf('/') + 1);
        }

        // ============================================================
        // КЛАСС ИГРОКА
        // ============================================================
        class Player {
            constructor(id, data, team) {
                this.id = id;
                this.name = data.name || 'Игрок';
                this.lives = data.lives !== undefined ? data.lives : 3;
                this.alive = data.alive !== undefined ? data.alive : true;
                this.team = team;
                
                if (data.posX !== undefined) {
                    this.x = (data.posX / 100) * width;
                    this.y = (data.posY / 100) * height;
                } else {
                    if (team === 'red') {
                        this.x = width * (0.05 + Math.random() * 0.15);
                    } else {
                        this.x = width * (0.80 + Math.random() * 0.15);
                    }
                    this.y = height * (0.2 + Math.random() * 0.6);
                }
                
                this.width = 60;
                this.height = 100;
            }

            draw(ctx) {
                if (!this.alive) {
                    ctx.font = '40px Montserrat';
                    ctx.fillStyle = 'rgba(100, 100, 100, 0.5)';
                    ctx.textAlign = 'center';
                    ctx.fillText('💀', this.x, this.y);
                    return;
                }

                ctx.shadowColor = this.team === 'red' ? '#ef4444' : '#3b82f6';
                ctx.shadowBlur = 30;

                ctx.fillStyle = this.team === 'red' ? 'rgba(239, 68, 68, 0.3)' : 'rgba(59, 130, 246, 0.3)';
                ctx.strokeStyle = this.team === 'red' ? '#ef4444' : '#3b82f6';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.roundRect(this.x - this.width/2, this.y - this.height/2, this.width, this.height, 15);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.beginPath();
                ctx.roundRect(this.x - this.width/2 + 5, this.y - this.height/2 + 5, this.width - 10, this.height/3, 10);
                ctx.fill();

                ctx.shadowBlur = 0;

                ctx.font = 'bold 14px Montserrat';
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.fillText(this.name, this.x, this.y + this.height/2 + 20);

                ctx.font = '20px Montserrat';
                ctx.fillText('❤️'.repeat(this.lives), this.x, this.y - this.height/2 - 15);
            }
        }

        // ============================================================
        // СИСТЕМА ЧАСТИЦ
        // ============================================================
        function spawnParticles(x, y, color) {
            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 25,
                    vy: (Math.random() - 0.5) * 25,
                    life: 1, color: color || '#ffffff',
                    size: Math.random() * 8 + 2
                });
            }
        }

        // ============================================================
        // СНЕЖОК (ФИЗИКА С ГРАВИТАЦИЕЙ)
        // ============================================================
        class Snowball {
            constructor(shooter, power, angle) {
                this.x = shooter.x;
                this.y = shooter.y;
                
                const direction = shooter.team === 'red' ? 1 : -1;
                const rad = angle * Math.PI / 180;
                
                const speed = power * 0.4;
                this.vx = Math.cos(rad) * speed * direction;
                this.vy = -Math.sin(rad) * speed;
                
                this.gravity = 0.3; 
                
                this.isMega = (power > 90);
                this.team = shooter.team;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
            }

            draw(ctx) {
                ctx.shadowColor = '#7fe3ff';
                ctx.shadowBlur = 25;

                const gradient = ctx.createRadialGradient(this.x - 5, this.y - 5, 2, this.x, this.y, 15);
                gradient.addColorStop(0, '#ffffff');
                gradient.addColorStop(1, '#7fe3ff');
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 15, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.shadowBlur = 0;

                if (Math.random() > 0.3) {
                    particles.push({
                        x: this.x, y: this.y,
                        vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2,
                        life: 0.8, color: 'rgba(127, 227, 255, 0.6)',
                        size: Math.random() * 4 + 2
                    });
                }
            }
        }

        // ============================================================
        // ИГРОВОЙ ЦИКЛ
        // ============================================================
        function gameLoop() {
            ctx.clearRect(0, 0, width, height);

            ctx.fillStyle = 'rgba(10, 37, 64, 0.2)';
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = 'rgba(239, 68, 68, 0.05)';
            ctx.fillRect(0, 0, width * 0.25, height);
            ctx.fillStyle = 'rgba(59, 130, 246, 0.05)';
            ctx.fillRect(width * 0.75, 0, width * 0.25, height);

            ctx.strokeStyle = 'rgba(127, 227, 255, 0.05)';
            ctx.lineWidth = 1;
            for (let x = 0; x < width; x += 50) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
            }
            for (let y = 0; y < height; y += 50) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
            }

            players.forEach(p => p.draw(ctx));

            snowballs.forEach((ball, index) => {
                ball.update();
                ball.draw(ctx);

                let hit = false;
                for (let p of players) {
                    if (p.team !== ball.team && p.alive) {
                        const dx = Math.abs(ball.x - p.x);
                        const dy = Math.abs(ball.y - p.y);
                        if (dx < p.width/2 && dy < p.height/2) {
                            hit = true;
                            
                            const newLives = Math.max(0, p.lives - 1);
                            p.lives = newLives;
                            if (newLives <= 0) p.alive = false;
                            
                            update(ref(db, `games/${gameId}/players/${p.team}/${p.id}`), {
                                lives: p.lives, alive: p.alive
                            });

                            spawnParticles(ball.x, ball.y, p.team === 'red' ? '#ef4444' : '#3b82f6');
                            document.getElementById('main-body').classList.add('screen-shake');
                            setTimeout(() => document.getElementById('main-body').classList.remove('screen-shake'), 400);

                            if (ball.isMega) {
                                const megaDiv = document.createElement('div');
                                megaDiv.className = 'mega-text'; 
                                megaDiv.innerText = 'МЕГАБРОСОК!';
                                document.body.appendChild(megaDiv);
                                setTimeout(() => megaDiv.remove(), 2000);
                            }

                            const redLives = players.filter(pl => pl.team === 'red').reduce((sum, pl) => sum + pl.lives, 0);
                            const blueLives = players.filter(pl => pl.team === 'blue').reduce((sum, pl) => sum + pl.lives, 0);
                            
                            if (redLives <= 0) {
                                update(gameRef, { status: 'finished', winner: 'blue' });
                            } else if (blueLives <= 0) {
                                update(gameRef, { status: 'finished', winner: 'red' });
                            }

                            break;
                        }
                    }
                }

                if (hit || ball.x < -50 || ball.x > width + 50 || ball.y > height + 50) {
                    snowballs.splice(index, 1);
                }
            });

            particles.forEach((p, index) => {
                p.x += p.vx; p.y += p.vy; p.life -= 0.02;
                if (p.life <= 0) { particles.splice(index, 1); return; }
                ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
            });

            requestAnimationFrame(gameLoop);
        }

        // ============================================================
        // QR ГЕНЕРАЦИЯ
        // ============================================================
        function generateQRs() {
            document.getElementById('qr-container').classList.remove('hidden');
            document.getElementById('tv-status').classList.remove('hidden');
            const redUrl = `${currentBaseUrl}play.html?game=${gameId}&team=red`;
            const blueUrl = `${currentBaseUrl}play.html?game=${gameId}&team=blue`;
            document.getElementById('qr-red').innerHTML = '';
            document.getElementById('qr-blue').innerHTML = '';
            const qrRed = qrcode(0, 'M'); qrRed.addData(redUrl); qrRed.make();
            document.getElementById('qr-red').innerHTML = qrRed.createImgTag(4, 8);
            const qrBlue = qrcode(0, 'M'); qrBlue.addData(blueUrl); qrBlue.make();
            document.getElementById('qr-blue').innerHTML = qrBlue.createImgTag(4, 8);
        }

        // ============================================================
        // ВЫБОР ПЕРВОЙ КОМАНДЫ
        // ============================================================
        window.selectFirstTeam = (team) => {
            update(ref(db, `games/${gameId}`), { firstTeam: team });
            document.getElementById('btn-red-start').classList.toggle('active', team === 'red');
            document.getElementById('btn-blue-start').classList.toggle('active', team === 'blue');
        };

        // ============================================================
        // FIREBASE СЛУШАТЕЛИ
        // ============================================================
        onValue(ref(db, `games/${gameId}/ticker_messages`), (snap) => {
    const messages = snap.val() || {};
    const keys = Object.keys(messages).sort((a, b) => messages[a].time - messages[b].time);
    if (keys.length > 0) {
        // Склеиваем ВСЕ сообщения через разделитель
        const allTexts = keys.map(key => messages[key].text).join('  •  ');
        document.getElementById('ticker-text').innerText = allTexts;
    } else {
        document.getElementById('ticker-text').innerText = 'ДОБРО ПОЖАЛОВАТЬ НА ВЕЧЕРИНКУ ENDORPHIN!';
    }
});

        onValue(gameRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            if (data.mode) {
                document.getElementById('tv-mode').innerText = `РЕЖИМ: ${data.mode.toUpperCase()}`;
                if (data.status === 'lobby') generateQRs();
            }

            const redPlayers = Object.entries(data.players?.red || {}).map(([id, p]) => new Player(id, p, 'red'));
            const bluePlayers = Object.entries(data.players?.blue || {}).map(([id, p]) => new Player(id, p, 'blue'));
            
            if (players.length === 0) {
                players = [...redPlayers, ...bluePlayers];
            } else {
                players.forEach(p => {
                    const updated = [...redPlayers, ...bluePlayers].find(up => up.id === p.id);
                    if (updated) {
                        p.lives = updated.lives;
                        p.alive = updated.alive;
                    }
                });
            }

            document.getElementById('tv-players-red').innerHTML = redPlayers.map(p => `<div class="text-red-300 font-bold bg-red-900/40 py-1 rounded border border-red-500/50">👤 ${p.name}</div>`).join('');
            document.getElementById('tv-players-blue').innerHTML = bluePlayers.map(p => `<div class="text-blue-300 font-bold bg-blue-900/40 py-1 rounded border border-blue-500/50">👤 ${p.name}</div>`).join('');

            const maxP = parseInt(data.mode?.charAt(0) || 1);
            const isReady = redPlayers.length >= maxP && bluePlayers.length >= maxP;

            if (data.status === 'lobby') {
                document.getElementById('lobby-view').style.opacity = '1';
                document.getElementById('lobby-view').style.pointerEvents = 'auto';
                document.getElementById('win-view').classList.add('hidden');
                document.getElementById('win-view').classList.remove('flex');
                
                if (data.mode) {
                    document.getElementById('qr-container').classList.remove('hidden');
                    if (isReady) {
                        document.getElementById('team-select').classList.remove('hidden');
                        document.getElementById('tv-status').innerText = "ВСЕ ГОТОВЫ! ВЫБЕРИТЕ ПЕРВУЮ КОМАНДУ.";
                        document.getElementById('tv-status').classList.add('text-green-400');
                    } else {
                        document.getElementById('team-select').classList.add('hidden');
                        document.getElementById('tv-status').innerText = "ОЖИДАНИЕ ИГРОКОВ...";
                        document.getElementById('tv-status').classList.remove('text-green-400');
                    }
                }
            }

            if (data.status === 'playing') {
                document.getElementById('lobby-view').style.opacity = '0';
                document.getElementById('lobby-view').style.pointerEvents = 'none';
                document.getElementById('team-select').classList.add('hidden');
                document.getElementById('turn-indicator').style.display = 'block';
                
                if (data.turn) {
                    document.getElementById('turn-indicator').innerText = `ХОД: ${data.turn.name.toUpperCase()}`;
                    document.getElementById('turn-indicator').style.color = data.turn.team === 'red' ? '#ef4444' : '#3b82f6';
                }
            }

            if (data.status === 'finished') {
                const winView = document.getElementById('win-view');
                winView.classList.remove('hidden');
                winView.classList.add('flex');
                const winText = document.getElementById('win-text');
                if (data.winner === 'red') { winText.innerText = 'КРАСНЫЕ ПОБЕДИЛИ!'; winText.className = 'text-9xl font-black text-red-500 mb-12'; }
                else if (data.winner === 'blue') { winText.innerText = 'СИНИЕ ПОБЕДИЛИ!'; winText.className = 'text-9xl font-black text-blue-500 mb-12'; }
            }

            document.getElementById('heart-red').innerText = '❤️'.repeat(redPlayers.reduce((a, b) => a + b.lives, 0)) || '💀';
            document.getElementById('heart-blue').innerText = '❤️'.repeat(bluePlayers.reduce((a, b) => a + b.lives, 0)) || '💀';
        });

        onValue(ref(db, `games/${gameId}/timer`), (snap) => {
            const val = snap.val();
            document.getElementById('tv-timer').innerText = (val !== null && val !== undefined) ? val : '';
            document.getElementById('tv-timer').style.display = (val !== null) ? 'block' : 'none';
        });

        onValue(ref(db, `games/${gameId}/last_shot`), (snap) => {
            const shot = snap.val();
            if (!shot || shot.animated) return;
            shot.animated = true;

            const shooter = players.find(p => p.id === shot.shooterId);
            if (shooter) {
                const ball = new Snowball(shooter, shot.power, shot.angle);
                snowballs.push(ball);
            }
        });

        gameLoop();

        const snowContainer = document.getElementById('snow-container');
        for (let i = 0; i < 50; i++) {
            const s = document.createElement('div'); s.className = 'snowflake'; s.innerText = '❄';
            s.style.left = Math.random() * 100 + '%'; s.style.fontSize = (10 + Math.random() * 20) + 'px';
            s.style.animationDuration = (4 + Math.random() * 8) + 's'; s.style.animationDelay = (-Math.random() * 10) + 's';
            s.style.opacity = Math.random() * 0.7 + 0.3;
            snowContainer.appendChild(s);
        }
    </script>
</body>
</html>
