<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#03080f">
  <title>ENDORPHIN | ПУЛЬТ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');

    :root {
      --red-team: #ef4444;
      --blue-team: #3b82f6;
      --cyan-glow: #22d3ee;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --team-color: #22d3ee;
    }

    * { -webkit-tap-highlight-color: transparent; }

    body {
      background: radial-gradient(circle at 50% 0%, #0a2540 0%, #03080f 100%);
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
      user-select: none;
      touch-action: none;
      overscroll-behavior: none;
      height: 100dvh;
    }

    body.team-red { --team-color: var(--red-team); }
    body.team-blue { --team-color: var(--blue-team); }

    .glass-panel {
      background: rgba(10, 37, 64, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(127, 227, 255, 0.25);
      box-shadow: 0 0 40px rgba(31, 143, 214, 0.2), inset 0 0 20px rgba(127, 227, 255, 0.05);
    }

    /* ============================================================
       АНИМАЦИИ
       ============================================================ */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 20px rgba(34, 211, 238, 0.3); }
      50% { box-shadow: 0 0 50px rgba(34, 211, 238, 0.8); }
    }
    @keyframes floatHeart {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.1); }
    }
    @keyframes winPop {
      0% { transform: scale(0.3); opacity: 0; }
      60% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes confettiFall {
      0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
    @keyframes shake {
      0%, 100% { transform: translate(0,0); }
      25% { transform: translate(-4px, 2px); }
      50% { transform: translate(4px, -2px); }
      75% { transform: translate(-2px, 1px); }
    }
    .animate-shake { animation: shake 0.4s ease-in-out; }

    /* ============================================================
       ПРИЦЕЛ (СТРЕЛОЧНЫЙ ДЖОЙСТИК)
       ============================================================ */
    .aim-wrapper {
      position: relative;
      width: min(78vw, 300px);
      height: min(78vw, 300px);
      margin: 0 auto;
    }

    .aim-circle {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, rgba(34, 211, 238, 0.08) 0%, transparent 70%);
      border: 2px solid rgba(127, 227, 255, 0.25);
      box-shadow: inset 0 0 40px rgba(34, 211, 238, 0.08), 0 0 30px rgba(34, 211, 238, 0.15);
      transition: box-shadow 0.3s, border-color 0.3s;
    }

    .aim-wrapper.my-turn .aim-circle {
      animation: pulseGlow 1.5s ease-in-out infinite;
      border-color: rgba(34, 211, 238, 0.8);
    }

    /* Деления градусов */
    .aim-ticks {
      position: absolute;
      inset: 8%;
      border-radius: 50%;
      pointer-events: none;
    }

    .aim-tick {
      position: absolute;
      left: 50%;
      top: 0;
      width: 2px;
      height: 8px;
      background: rgba(127, 227, 255, 0.25);
      transform-origin: 0 calc(min(78vw, 300px) * 0.42);
      transform: translateX(-50%) rotate(var(--angle));
    }

    .aim-tick.major {
      height: 14px;
      background: rgba(127, 227, 255, 0.5);
    }

    .aim-tick-label {
      position: absolute;
      left: 50%;
      top: -4px;
      font-size: 9px;
      font-weight: 900;
      color: rgba(168, 230, 255, 0.45);
      transform: translateX(-50%);
      transform-origin: 0 calc(min(78vw, 300px) * 0.45);
      pointer-events: none;
      letter-spacing: 0.05em;
    }

    /* Центр */
    .aim-center {
      position: absolute;
      top: 50%; left: 50%;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffffff, #a8e6ff);
      transform: translate(-50%, -50%);
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.9);
      z-index: 4;
      pointer-events: none;
    }

    /* Стрелка направления */
    .aim-arrow {
      position: absolute;
      top: 50%; left: 50%;
      width: 0; height: 0;
      transform-origin: 0 0;
      pointer-events: none;
      z-index: 5;
      transition: transform 0.05s linear;
    }

    .aim-arrow-shaft {
      position: absolute;
      top: -3px;
      left: 0;
      width: calc(min(78vw, 300px) * 0.42);
      height: 6px;
      background: linear-gradient(90deg, transparent 0%, var(--team-color) 30%, var(--team-color) 100%);
      border-radius: 3px;
      box-shadow: 0 0 15px var(--team-color), 0 0 30px var(--team-color);
    }

    .aim-arrow-head {
      position: absolute;
      top: -12px;
      left: calc(min(78vw, 300px) * 0.42 - 4px);
      width: 0; height: 0;
      border-left: 18px solid var(--team-color);
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      filter: drop-shadow(0 0 10px var(--team-color));
    }

    .aim-arrow-shaft::after {
      content: '';
      position: absolute;
      top: 50%; left: 30%;
      width: 70%; height: 100%;
      background: rgba(255, 255, 255, 0.4);
      transform: translateY(-50%);
      border-radius: 3px;
      filter: blur(2px);
    }

    /* Ручка для перетаскивания (невидимая зона) */
    .aim-touch-area {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      touch-action: none;
      cursor: crosshair;
      z-index: 6;
    }

    /* Индикатор угла */
    .angle-display {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 7;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .aim-wrapper.my-turn .angle-display {
      opacity: 1;
    }

    .angle-value {
      font-size: 2.4rem;
      font-weight: 900;
      color: var(--team-color);
      text-shadow: 0 0 20px var(--team-color);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .angle-unit {
      font-size: 0.8rem;
      font-weight: 700;
      color: rgba(168, 230, 255, 0.6);
      letter-spacing: 0.2em;
    }

    /* Направление-подсказка */
    .aim-direction-label {
      position: absolute;
      bottom: -30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      color: var(--team-color);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s;
      text-shadow: 0 0 10px var(--team-color);
    }

    .aim-wrapper.my-turn .aim-direction-label {
      opacity: 1;
    }

    /* ============================================================
       МИНИ-КАРТА ТРАЕКТОРИЙ
       ============================================================ */
    .trajectory-map {
      position: relative;
      width: 100%;
      max-width: 340px;
      height: 70px;
      margin: 0 auto;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(127, 227, 255, 0.15);
      border-radius: 12px;
      overflow: hidden;
      margin-top: 8px;
    }

    .trajectory-map svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .trajectory-map-label {
      position: absolute;
      top: 4px; left: 8px;
      font-size: 8px;
      font-weight: 900;
      letter-spacing: 0.15em;
      color: rgba(168, 230, 255, 0.4);
      pointer-events: none;
    }

    /* ============================================================
       ШКАЛА СИЛЫ
       ============================================================ */
    .power-track {
      position: relative;
      width: 100%;
      height: 36px;
      background: linear-gradient(90deg, #22c55e 0%, #fbbf24 50%, #ef4444 100%);
      border-radius: 18px;
      border: 3px solid rgba(255, 255, 255, 0.35);
      box-shadow: inset 0 0 12px rgba(0,0,0,0.6), 0 0 20px rgba(34, 211, 238, 0.3);
      overflow: hidden;
    }
    .power-thumb {
      position: absolute;
      top: 50%; left: 10%;
      width: 48px; height: 48px;
      background: radial-gradient(circle at 35% 35%, #ffffff, #e0f7ff 70%);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 25px rgba(255,255,255,0.9), inset 0 0 10px rgba(0,0,0,0.2);
      border: 2px solid #22d3ee;
      transition: left 0.05s linear;
      pointer-events: none;
    }

    /* ============================================================
       КНОПКА БРОСОК
       ============================================================ */
    .shoot-btn {
      width: min(52vw, 200px);
      height: min(52vw, 200px);
      border-radius: 50%;
      font-size: 1.6rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 35% 35%, var(--team-color), rgba(0,0,0,0.6) 120%);
      border: 8px solid rgba(255,255,255,0.2);
      color: #fff;
      box-shadow: 0 0 40px var(--team-color), inset 0 0 20px rgba(0,0,0,0.3);
      position: relative;
      overflow: hidden;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    .shoot-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.4), transparent 60%);
      opacity: 0.6;
    }
    .shoot-btn:active:not(:disabled) {
      transform: scale(0.93);
      box-shadow: 0 0 70px var(--team-color), inset 0 0 30px rgba(0,0,0,0.5);
    }
    .shoot-btn:disabled {
      filter: grayscale(1);
      opacity: 0.25;
      transform: scale(0.85);
      box-shadow: none;
    }

    /* ============================================================
       ОВЕРЛЕИ
       ============================================================ */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: opacity 0.4s ease;
    }
    .overlay.hidden { display: none; }

    .wait-overlay {
      background: rgba(0,0,0,0.88);
    }
    .wait-overlay .pulse-dot {
      width: 20px; height: 20px;
      border-radius: 50%;
      background: #22d3ee;
      box-shadow: 0 0 20px #22d3ee;
      animation: pulseGlow 1.2s ease-in-out infinite;
      margin: 0 4px;
    }

    .result-overlay {
      background: rgba(0,0,0,0.92);
      z-index: 200;
    }
    .result-title {
      font-size: clamp(2.5rem, 12vw, 5rem);
      font-weight: 900;
      letter-spacing: 0.05em;
      animation: winPop 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-align: center;
      line-height: 1.1;
    }
    .result-title.win {
      background: linear-gradient(180deg, #fbbf24, #f59e0b);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 30px rgba(251, 191, 36, 0.8));
    }
    .result-title.lose {
      background: linear-gradient(180deg, #94a3b8, #475569);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 20px rgba(148, 163, 184, 0.4));
    }
    .result-subtitle {
      font-size: 1.1rem;
      color: rgba(168, 230, 255, 0.7);
      margin-top: 1rem;
      animation: slideUp 0.6s 0.3s both;
    }
    .result-emoji {
      font-size: 5rem;
      margin-bottom: 1rem;
      animation: winPop 0.8s 0.1s both;
      filter: drop-shadow(0 0 40px rgba(251, 191, 36, 0.6));
    }

    .confetti {
      position: fixed;
      top: 0;
      width: 10px; height: 10px;
      z-index: 150;
      pointer-events: none;
      animation: confettiFall linear forwards;
    }

    /* ============================================================
       ИНФО-ПАНЕЛЬ
       ============================================================ */
    .player-info {
      position: fixed;
      top: calc(var(--safe-top) + 12px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.65);
      padding: 10px 22px;
      border-radius: 20px;
      border: 1px solid rgba(127, 227, 255, 0.35);
      text-align: center;
      z-index: 50;
      backdrop-filter: blur(12px);
      min-width: 160px;
    }
    .player-info .name {
      font-size: 1.1rem;
      font-weight: 900;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }
    .player-info .lives {
      font-size: 1.4rem;
      margin-top: 4px;
      letter-spacing: 4px;
    }
    .heart { display: inline-block; animation: floatHeart 2s ease-in-out infinite; }
    .heart:nth-child(2) { animation-delay: 0.3s; }
    .heart:nth-child(3) { animation-delay: 0.6s; }

    .tv-timer {
      position: fixed;
      top: calc(var(--safe-top) + 12px);
      right: 16px;
      font-size: 3rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 30px rgba(34, 211, 238, 0.8);
      z-index: 50;
      font-variant-numeric: tabular-nums;
    }

    .game-screen-inner {
      padding-top: calc(var(--safe-top) + 70px);
      padding-bottom: calc(var(--safe-bottom) + 16px);
    }

    /* ============================================================
       ВХОД
       ============================================================ */
    .join-card {
      animation: slideUp 0.5s ease-out;
    }
    .join-input {
      background: rgba(0,0,0,0.5);
      border: 2px solid rgba(34, 211, 238, 0.5);
      transition: all 0.2s;
    }
    .join-input:focus {
      border-color: #22d3ee;
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.4);
      outline: none;
    }

    /* ============================================================
       КОМПАКТНЫЙ ЛЭЙАУТ ДЛЯ ТЕЛЕФОНА
       ============================================================ */
    @media (max-height: 720px) {
      .aim-wrapper { width: min(70vw, 260px); height: min(70vw, 260px); }
      .trajectory-map { height: 56px; }
      .shoot-btn { width: min(46vw, 170px); height: min(46vw, 170px); font-size: 1.3rem; }
      .game-screen-inner { padding-top: calc(var(--safe-top) + 60px); }
    }
  </style>
</head>
<body class="relative" id="main-body">

  <!-- ============================================================
       ЭКРАН ВХОДА
       ============================================================ -->
  <div id="join-screen" class="fixed inset-0 flex flex-col items-center justify-center p-6 z-10">
    <div class="glass-panel join-card p-8 rounded-3xl w-full max-w-sm flex flex-col items-center">
      <div class="text-5xl mb-4">❄️</div>
      <h1 class="text-3xl font-black text-cyan-300 mb-1 tracking-widest">ENDORPHIN</h1>
      <p class="text-cyan-100/50 text-xs tracking-[0.3em] mb-6">СНЕЖНЫЙ БАТТЛ</p>
      
      <div class="w-full mb-6">
        <label class="block text-xs font-bold text-cyan-300/70 mb-2 tracking-wider">ТВОЁ ИМЯ</label>
        <input 
          type="text" 
          id="input-name" 
          placeholder="ВВЕДИ ИМЯ" 
          maxlength="16"
          class="join-input w-full rounded-xl px-4 py-4 text-center text-xl font-bold text-white placeholder:text-white/30"
        >
      </div>

      <div id="team-badge" class="mb-6 px-6 py-2 rounded-full font-black text-sm tracking-wider"></div>

      <button 
        id="join-btn" 
        class="w-full py-5 text-white font-black text-xl rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 shadow-lg active:scale-95 transition-all"
      >
        ПОДКЛЮЧИТЬСЯ
      </button>
      <p id="join-error" class="text-red-400 text-xs mt-3 hidden"></p>
    </div>
  </div>

  <!-- ============================================================
       ЭКРАН ИГРЫ
       ============================================================ -->
  <div id="game-screen" class="hidden fixed inset-0 flex flex-col items-center z-10 game-screen-inner">

    <div class="tv-timer hidden" id="tv-timer"></div>

    <div class="player-info hidden" id="player-info">
      <div class="name" id="info-name">Игрок</div>
      <div class="lives" id="info-lives">❤️❤️❤️</div>
    </div>

    <div id="game-team-badge" class="mb-3 px-5 py-2 rounded-full font-black text-xs tracking-widest"></div>

    <!-- ========================================================
         ПРИЦЕЛ
         ======================================================== -->
    <div class="text-center mb-4 w-full">
      <p class="text-cyan-300/70 mb-2 font-bold tracking-[0.25em] text-xs">ПРИЦЕЛ</p>
      
      <div class="aim-wrapper" id="aim-wrapper">
        <div class="aim-circle"></div>
        
        <!-- Деления -->
        <div class="aim-ticks" id="aim-ticks"></div>
        
        <!-- Центр -->
        <div class="aim-center"></div>
        
        <!-- Стрелка -->
        <div class="aim-arrow" id="aim-arrow">
          <div class="aim-arrow-shaft"></div>
          <div class="aim-arrow-head"></div>
        </div>
        
        <!-- Индикатор угла -->
        <div class="angle-display">
          <div class="angle-value" id="angle-value">45°</div>
          <div class="angle-unit" id="angle-unit">ВПЕРЁД</div>
        </div>
        
        <!-- Подсказка направления -->
        <div class="aim-direction-label" id="aim-direction-label">Тяни вправо</div>
        
        <!-- Зона касания -->
        <div class="aim-touch-area" id="aim-touch-area"></div>
      </div>
    </div>

    <!-- ========================================================
         МИНИ-КАРТА ТРАЕКТОРИЙ
         ======================================================== -->
    <div class="trajectory-map" id="trajectory-map">
      <div class="trajectory-map-label">ТРАЕКТОРИИ</div>
      <svg id="trajectory-svg" viewBox="0 0 340 70" preserveAspectRatio="none"></svg>
    </div>

    <!-- ========================================================
         ШКАЛА СИЛЫ
         ======================================================== -->
    <div class="w-[85%] max-w-sm mt-4 mb-5 glass-panel p-5 rounded-2xl">
      <div class="flex justify-between text-xs font-bold text-white/60 mb-3">
        <span>СИЛА БРОСКА</span>
        <span id="power-display" class="text-white text-lg">10%</span>
      </div>
      <div class="power-track" id="power-track">
        <div class="power-thumb" id="power-thumb"></div>
      </div>
      <p class="text-center text-[10px] text-cyan-300/50 mt-2 tracking-wider">ЖМИ БРОСОК, ЧТОБЫ ЗАФИКСИРОВАТЬ СИЛУ</p>
    </div>

    <!-- ========================================================
         КНОПКА БРОСОК
         ======================================================== -->
    <button id="shoot-btn" class="shoot-btn" disabled>БРОСОК</button>
  </div>

  <!-- ============================================================
       ОВЕРЛЕИ
       ============================================================ -->
  <div id="wait-overlay" class="overlay wait-overlay hidden">
    <div class="text-6xl mb-6">⏳</div>
    <h1 class="text-3xl font-black text-white mb-3 text-center">ХОД СОПЕРНИКА</h1>
    <p class="text-base text-gray-400 text-center px-8">ЖДИ СВОЕГО ЧАСА...</p>
    <div class="flex mt-6">
      <div class="pulse-dot"></div>
      <div class="pulse-dot" style="animation-delay:0.2s"></div>
      <div class="pulse-dot" style="animation-delay:0.4s"></div>
    </div>
  </div>

  <div id="preload-overlay" class="overlay wait-overlay hidden">
    <p class="text-cyan-300 font-bold tracking-[0.3em] text-sm mb-4">ПРИГОТОВЬСЯ</p>
    <div class="text-8xl font-black text-white" id="preload-count" style="text-shadow: 0 0 40px rgba(34,211,238,0.8); font-variant-numeric: tabular-nums;">10</div>
    <p class="text-gray-400 text-sm mt-4">ИГРА НАЧНЁТСЯ СЕЙЧАС</p>
  </div>

  <div id="result-overlay" class="overlay result-overlay hidden">
    <div class="result-emoji" id="result-emoji">🏆</div>
    <h1 class="result-title win" id="result-title">ПОБЕДА!</h1>
    <p class="result-subtitle" id="result-subtitle">Твоя команда победила</p>
    
    <div class="mt-10 px-8 text-center">
      <p class="text-white/40 text-xs tracking-wider mb-6">ИГРА ЗАВЕРШЕНА</p>
      <button 
        id="result-close-btn"
        class="px-10 py-4 rounded-xl bg-white/10 border border-white/20 font-bold text-white hover:bg-white/20 transition active:scale-95"
      >
        ЗАКРЫТЬ
      </button>
    </div>
  </div>

  <div id="confetti-container"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, onDisconnect, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { apiKey: "AIzaSyCXIR5Tv8lB6ivcGRC3yt1SC66MM6T5b_M", authDomain: "endorphin-battle.firebaseapp.com", databaseURL: "https://endorphin-battle-default-rtdb.europe-west1.firebasedatabase.app", projectId: "endorphin-battle", storageBucket: "endorphin-battle.firebasestorage.app", messagingSenderId: "185259733030", appId: "1:185259733030:web:d72a89a436880973e636e7" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const gameRef = ref(db, 'games/battle_1');

    // ============================================================
    // КОНТЕКСТ
    // ============================================================
    const urlParams = new URLSearchParams(window.location.search);
    const team = urlParams.get('team') || 'red';
    const isRed = team === 'red';

    document.body.classList.add(isRed ? 'team-red' : 'team-blue');

    const storageKey = `endorphin_playerId_${team}`;
    let playerId = localStorage.getItem(storageKey) || 'p_' + Math.random().toString(36).substr(2, 9);
    localStorage.setItem(storageKey, playerId);

    const playerRef = ref(db, `games/battle_1/players/${team}/${playerId}`);

    // ============================================================
    // СОСТОЯНИЕ
    // ============================================================
    let isMyTurn = false;
    let currentAngle = 45;       // 0..180 (внутренний угол полёта)
    let currentPower = 10;
    let powerDirection = 1;
    let powerInterval = null;
    let isShooting = false;
    let hasJoined = false;
    let gameStatus = 'lobby';
    let lastPreloadValue = null;

    // История траекторий (для мини-карты)
    let trajectoryHistory = [];

    // ============================================================
    // УТИЛИТЫ
    // ============================================================
    const vibrate = (pattern) => {
      if (navigator.vibrate) navigator.vibrate(pattern);
    };
    const showOverlay = (id) => document.getElementById(id).classList.remove('hidden');
    const hideOverlay = (id) => document.getElementById(id).classList.add('hidden');

    // ============================================================
    // ИНИЦИАЛИЗАЦИЯ ДЕЛЕНИЙ
    // ============================================================
    (function initTicks() {
      const ticksContainer = document.getElementById('aim-ticks');
      const size = Math.min(window.innerWidth * 0.78, 300);
      const radius = size * 0.42;
      
      // Деления каждые 15° по верхней полуокружности
      // Для красных: 0° = вправо, 180° = влево (углы по часовой от «вправо»)
      // Для синих: 0° = влево, 180° = вправо
      for (let deg = 0; deg <= 180; deg += 15) {
        const isMajor = deg % 45 === 0;
        
        // Позиция: для красных 0° = 0° экрана (вправо), 90° = -90° (вверх), 180° = 180° (влево)
        // Для синих зеркалим: 0° = 180° экрана (влево), 90° = -90° (вверх), 180° = 0° (вправо)
        let screenAngle;
        if (isRed) {
          screenAngle = deg; // 0 = вправо, 90 = вверх, 180 = влево
        } else {
          screenAngle = 180 - deg; // 0 = влево, 90 = вверх, 180 = вправо
        }
        
        // CSS transform rotate: 0 = вверх (12 часов). 
        // Нам нужно: screenAngle=0 (вправо) → rotate(90deg), 90 (вверх) → rotate(0), 180 (влево) → rotate(-90)
        const rotate = 90 - screenAngle;
        
        const tick = document.createElement('div');
        tick.className = 'aim-tick' + (isMajor ? ' major' : '');
        tick.style.setProperty('--angle', `${rotate}deg`);
        ticksContainer.appendChild(tick);
        
        if (isMajor) {
          const label = document.createElement('div');
          label.className = 'aim-tick-label';
          label.innerText = deg + '°';
          label.style.setProperty('--angle', `${rotate}deg`);
          label.style.transform = `translateX(-50%) rotate(${rotate}deg) translateY(-${radius + 18}px)`;
          // Проще: пересчитаем позицию вручную
          label.style.transform = 'none';
          label.style.left = '50%';
          label.style.top = '50%';
          
          // Позиция на окружности
          const rad = (screenAngle - 90) * Math.PI / 180; // -90 чтобы 0° был вправо
          const lx = Math.cos(rad) * (radius + 16);
          const ly = Math.sin(rad) * (radius + 16);
          label.style.transform = `translate(calc(-50% + ${lx}px), calc(-50% + ${ly}px))`;
          
          // Убираем вращение для читаемости
          label.style.transform += ' rotate(0deg)';
          
          ticksContainer.appendChild(label);
        }
      }
    })();

    // ============================================================
    // ВХОД
    // ============================================================
    async function joinGame() {
      const nameInput = document.getElementById('input-name');
      const name = nameInput.value.trim() || 'Игрок';
      const errorEl = document.getElementById('join-error');
      
      if (name.length < 2) {
        errorEl.innerText = 'Имя должно быть не короче 2 символов';
        errorEl.classList.remove('hidden');
        return;
      }

      const snapshot = await get(playerRef);
      const existing = snapshot.val();

      if (existing) {
        await update(playerRef, { name, connected: true });
      } else {
        await set(playerRef, { 
          name, lives: 3, alive: true, connected: true, joinedAt: Date.now()
        });
      }

      onDisconnect(playerRef).remove();

      hasJoined = true;
      vibrate(50);

      document.getElementById('join-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');
      document.getElementById('player-info').classList.remove('hidden');
      document.getElementById('info-name').innerText = name;

      updateTeamBadges();
      startPowerAnimation();
      updateAimVisual(currentAngle);
    }

    document.getElementById('join-btn').onclick = joinGame;
    document.getElementById('input-name').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') joinGame();
    });

    function updateTeamBadges() {
      const color = isRed ? 'bg-red-500/20 text-red-300 border-red-500/50' : 'bg-blue-500/20 text-blue-300 border-blue-500/50';
      const label = isRed ? '🔴 КРАСНЫЕ' : '🔵 СИНИЕ';
      
      const joinBadge = document.getElementById('team-badge');
      joinBadge.className = `mb-6 px-6 py-2 rounded-full font-black text-sm tracking-wider border-2 ${color}`;
      joinBadge.innerText = label;

      const gameBadge = document.getElementById('game-team-badge');
      gameBadge.className = `mb-3 px-5 py-2 rounded-full font-black text-xs tracking-widest border-2 ${color}`;
      gameBadge.innerText = label;
    }
    updateTeamBadges();

    // ============================================================
    // АНИМАЦИЯ СИЛЫ
    // ============================================================
    function startPowerAnimation() {
      if (powerInterval) clearInterval(powerInterval);
      powerInterval = setInterval(() => {
        if (!isMyTurn || isShooting || gameStatus !== 'playing') return;

        currentPower += powerDirection * 2;
        if (currentPower >= 100) { currentPower = 100; powerDirection = -1; }
        if (currentPower <= 10) { currentPower = 10; powerDirection = 1; }

        updatePowerUI();
      }, 30);
    }

    function updatePowerUI() {
      const thumb = document.getElementById('power-thumb');
      const display = document.getElementById('power-display');
      thumb.style.left = currentPower + '%';
      display.innerText = currentPower + '%';
      
      if (currentPower > 80) display.style.color = '#ef4444';
      else if (currentPower > 50) display.style.color = '#fbbf24';
      else display.style.color = '#22c55e';
    }

    // ============================================================
    // ПРИЦЕЛ — ОБНОВЛЕНИЕ ВИЗУАЛА
    // ============================================================
    const aimWrapper = document.getElementById('aim-wrapper');
    const aimArrow = document.getElementById('aim-arrow');
    const aimTouchArea = document.getElementById('aim-touch-area');
    const angleValue = document.getElementById('angle-value');
    const angleUnit = document.getElementById('angle-unit');
    const aimDirectionLabel = document.getElementById('aim-direction-label');

    // Внутренний угол 0..180 → экранный угол для стрелки
    // Для красных: 0 = вправо (0° экрана), 90 = вверх (-90°), 180 = влево (180°)
    // Для синих: 0 = влево (180°), 90 = вверх (-90°), 180 = вправо (0°)
    function fireAngleToScreenAngle(fireAngle) {
      if (isRed) {
        return -fireAngle; // 0 → 0, 90 → -90, 180 → -180 (= 180)
      } else {
        return -(180 - fireAngle); // 0 → -180 (= 180), 90 → -90, 180 → 0
      }
    }

    // Экранный угол → внутренний fire angle (0..180)
    function screenAngleToFireAngle(screenAngle) {
      // screenAngle: -180..180 от оси X (вправо = 0)
      // Для красных: 0 → 0, -90 → 90, 180 → 180
      // Для синих: 180 → 0, -90 → 90, 0 → 180
      
      let deg = screenAngle;
      
      if (isRed) {
        // Красные смотрят вправо: 
        // Если тянут вправо-вверх (screenAngle = -45) → fireAngle = 45
        // Если тянут влево-вверх (screenAngle = -135) → fireAngle = 135
        if (deg < 0) {
          // верхняя половина
          deg = -deg; // -45 → 45, -135 → 135
        } else {
          // нижняя половина (screenAngle > 0)
          // screenAngle = 45 (вправо-вниз) → fireAngle = 45 (тоже вниз-вперёд)
          // screenAngle = 135 (влево-вниз) → fireAngle = 135
          // Оставляем как есть
        }
        return Math.max(0, Math.min(180, deg));
      } else {
        // Синие смотрят влево:
        // Тянут влево-вверх (screenAngle = -135) → fireAngle = 45
        // Тянут вправо-вверх (screenAngle = -45) → fireAngle = 135
        // Тянут влево-вниз (screenAngle = 135) → fireAngle = 45
        // Тянут вправо-вниз (screenAngle = 45) → fireAngle = 135
        
        // Нормализуем в 0..360
        let a = deg < 0 ? deg + 360 : deg;
        // a: 0 = вправо, 90 = вниз, 180 = влево, 270 = вверх
        
        // fireAngle 0 = влево (180), 90 = вверх (270), 180 = вправо (0)
        // Формула: fireAngle = (270 - a + 360) % 360, но ограничим 0..180
        // Проще: если a в верхней половине (180..360), отражаем
        if (a >= 180 && a <= 360) {
          // верхняя половина
          // a = 270 (вверх) → fireAngle = 90
          // a = 180 (влево) → fireAngle = 0
          // a = 360 (вправо) → fireAngle = 180
          return Math.max(0, Math.min(180, 270 - a + 180));
        } else {
          // нижняя половина (0..180)
          // a = 0 (вправо) → fireAngle = 180
          // a = 90 (вниз) → fireAngle = 90
          // a = 180 (влево) → fireAngle = 0
          return Math.max(0, Math.min(180, 180 - a));
        }
      }
    }

    function updateAimVisual(fireAngle) {
      const screenAngle = fireAngleToScreenAngle(fireAngle);
      
      // Стрелка
      aimArrow.style.transform = `rotate(${screenAngle}deg)`;
      
      // Угол
      angleValue.innerText = Math.round(fireAngle) + '°';
      
      // Подпись
      let label;
      if (fireAngle < 22) label = isRed ? '→ ПРЯМО' : '← ПРЯМО';
      else if (fireAngle < 67) label = isRed ? '↗ ВВЕРХ' : '↖ ВВЕРХ';
      else if (fireAngle < 112) label = '↑ ВЫСОКО';
      else if (fireAngle < 157) label = isRed ? '↘ ВНИЗ' : '↙ ВНИЗ';
      else label = isRed ? '→ НАЗАД' : '← НАЗАД';
      
      angleUnit.innerText = label;
      
      // Подсказка внизу
      aimDirectionLabel.innerText = isRed 
        ? 'Тяни вправо → вперёд' 
        : 'Тяни влево → вперёд';
    }

    // ============================================================
    // ПРИЦЕЛ — ПЕРЕТАСКИВАНИЕ
    // ============================================================
    let isDragging = false;

    function handleAimMove(e) {
      if (!isMyTurn || isShooting || !isDragging || gameStatus !== 'playing') return;
      if (e.touches) e.preventDefault();

      const rect = aimWrapper.getBoundingClientRect();
      const clientX = e.clientX ?? e.touches[0].clientX;
      const clientY = e.clientY ?? e.touches[0].clientY;

      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      const dx = clientX - centerX;
      const dy = clientY - centerY;

      // Экранный угол
      const screenAngle = Math.atan2(dy, dx) * 180 / Math.PI;
      
      // В fireAngle
      const fireAngle = screenAngleToFireAngle(screenAngle);
      currentAngle = fireAngle;
      
      updateAimVisual(currentAngle);
    }

    aimTouchArea.addEventListener('mousedown', (e) => { isDragging = true; handleAimMove(e); });
    aimTouchArea.addEventListener('mousemove', handleAimMove);
    aimTouchArea.addEventListener('mouseup', () => { isDragging = false; });
    aimTouchArea.addEventListener('mouseleave', () => { isDragging = false; });
    aimTouchArea.addEventListener('touchstart', (e) => { isDragging = true; handleAimMove(e); }, { passive: false });
    aimTouchArea.addEventListener('touchmove', handleAimMove, { passive: false });
    aimTouchArea.addEventListener('touchend', () => { isDragging = false; });

    // ============================================================
    // МИНИ-КАРТА ТРАЕКТОРИЙ
    // ============================================================
    const trajectorySvg = document.getElementById('trajectory-svg');
    const MAP_W = 340;
    const MAP_H = 70;

    // Стартовая позиция игрока на мини-карте (слева для красных, справа для синих)
    const START_X = isRed ? 20 : MAP_W - 20;
    const START_Y = MAP_H - 10;

    // Симуляция полёта для отрисовки
    function simulateTrajectory(power, angle) {
      const points = [];
      const direction = isRed ? 1 : -1;
      const rad = angle * Math.PI / 180;
      const speed = power * 0.4;
      
      let vx = Math.cos(rad) * speed * direction;
      let vy = -Math.sin(rad) * speed;
      const gravity = 0.3;
      
      let x = START_X;
      let y = START_Y;
      const scale = 0.4; // масштаб скорости для мини-карты
      
      points.push({ x, y });
      
      for (let i = 0; i < 60; i++) {
        x += vx * scale * 0.15;
        y += vy * scale * 0.15;
        vy += gravity * 0.15;
        
        points.push({ x, y });
        
        if (y > MAP_H || x < 0 || x > MAP_W) break;
      }
      
      return points;
    }

    function addTrajectoryToMap(power, angle) {
      const points = simulateTrajectory(power, angle);
      
      // Уникальный id
      const id = 'traj_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
      
      // Цвет: свой — яркий, история — тусклая
      const color = isRed ? '#ef4444' : '#3b82f6';
      
      // Строим path
      const pathData = points.map((p, i) => 
        (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)
      ).join(' ');
      
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', pathData);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', color);
      path.setAttribute('stroke-width', '2');
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('opacity', '0.85');
      path.setAttribute('id', id);
      
      // Точка старта
      const startDot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      startDot.setAttribute('cx', START_X);
      startDot.setAttribute('cy', START_Y);
      startDot.setAttribute('r', '3');
      startDot.setAttribute('fill', color);
      
      trajectorySvg.appendChild(path);
      trajectorySvg.appendChild(startDot);
      
      // Добавляем в историю
      trajectoryHistory.push({ id, path, startDot, power, angle });
      
      // Анимация появления
      const length = path.getTotalLength();
      path.style.strokeDasharray = length;
      path.style.strokeDashoffset = length;
      path.style.transition = 'stroke-dashoffset 0.6s ease-out';
      requestAnimationFrame(() => {
        path.style.strokeDashoffset = '0';
      });
      
      // Ограничиваем историю 5 траекториями
      while (trajectoryHistory.length > 5) {
        const old = trajectoryHistory.shift();
        old.path.remove();
        old.startDot.remove();
      }
      
      // Приглушаем старые
      trajectoryHistory.forEach((t, idx) => {
        const age = trajectoryHistory.length - idx;
        t.path.setAttribute('opacity', String(0.2 + age * 0.1));
      });
      
      vibrate(20);
    }

    // ============================================================
    // БРОСОК
    // ============================================================
    document.getElementById('shoot-btn').onclick = async () => {
      if (!isMyTurn || isShooting || gameStatus !== 'playing') return;

      isShooting = true;
      vibrate([30, 30, 60]);

      const btn = document.getElementById('shoot-btn');
      btn.disabled = true;

      const shotData = {
        team,
        shooterId: playerId,
        power: currentPower,
        angle: currentAngle,
        time: Date.now()
      };

      // Добавляем траекторию в мини-карту
      addTrajectoryToMap(currentPower, currentAngle);

      await push(ref(db, 'games/battle_1/shots'), shotData);
      await set(ref(db, 'games/battle_1/last_shot'), shotData);

      // Передача хода
      const playersSnap = await get(ref(db, 'games/battle_1/players'));
      const players = playersSnap.val() || {};

      const myTeamPlayers = Object.entries(players[team] || {}).filter(([id, p]) => p.alive && p.lives > 0);
      const myIdx = myTeamPlayers.findIndex(([id]) => id === playerId);

      let nextPlayer = null;
      if (myIdx !== -1 && myIdx < myTeamPlayers.length - 1) {
        nextPlayer = myTeamPlayers[myIdx + 1];
      } else {
        const enemyTeam = Object.entries(players[isRed ? 'blue' : 'red'] || {}).filter(([id, p]) => p.alive && p.lives > 0);
        if (enemyTeam.length > 0) nextPlayer = enemyTeam[0];
      }

      if (nextPlayer) {
        await update(gameRef, {
          activePlayerId: nextPlayer[0],
          turn: { team: isRed ? 'blue' : 'red', name: nextPlayer[1].name }
        });
      }

      setTimeout(() => {
        isShooting = false;
        if (isMyTurn) btn.disabled = false;
      }, 1500);
    };

    // ============================================================
    // ОСНОВНОЙ СЛУШАТЕЛЬ
    // ============================================================
    onValue(gameRef, (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      const prevStatus = gameStatus;
      gameStatus = data.status || 'lobby';

      // ---------- РЕЗУЛЬТАТ ----------
      if (gameStatus === 'finished') {
        handleFinished(data);
        return;
      } else if (prevStatus === 'finished' && gameStatus !== 'finished') {
        hideOverlay('result-overlay');
        document.getElementById('result-emoji').innerText = '';
      }

      // ---------- ЛОББИ ----------
      if (gameStatus === 'lobby') {
        hideOverlay('wait-overlay');
        hideOverlay('preload-overlay');
        hideOverlay('result-overlay');
        document.getElementById('tv-timer').classList.add('hidden');
        
        const me = data.players?.[team]?.[playerId];
        if (me) {
          document.getElementById('info-lives').innerHTML = renderHearts(me.lives, me.alive);
        }
        return;
      }

      // ---------- ПРЕЛОУДИНГ ----------
      if (gameStatus === 'playing' && data.timer !== null && data.timer !== undefined) {
        showOverlay('preload-overlay');
        hideOverlay('wait-overlay');
        document.getElementById('preload-count').innerText = data.timer;
        if (data.timer !== lastPreloadValue) {
          vibrate(20);
          lastPreloadValue = data.timer;
        }
      } else {
        hideOverlay('preload-overlay');
      }

      // ---------- ИГРА ----------
      if (gameStatus === 'playing' && !data.timer) {
        const tvTimer = document.getElementById('tv-timer');
        if (data.timer) {
          tvTimer.classList.remove('hidden');
          tvTimer.innerText = data.timer;
        } else {
          tvTimer.classList.add('hidden');
        }

        const wasMyTurn = isMyTurn;
        isMyTurn = (data.activePlayerId === playerId);

        const btn = document.getElementById('shoot-btn');
        
        if (isMyTurn) {
          if (!wasMyTurn) {
            vibrate([40, 20, 40]);
            btn.classList.add('animate-shake');
            setTimeout(() => btn.classList.remove('animate-shake'), 500);
          }
          btn.disabled = false;
          aimWrapper.classList.add('my-turn');
          hideOverlay('wait-overlay');
        } else {
          btn.disabled = true;
          aimWrapper.classList.remove('my-turn');
          if (hasJoined && !isShooting) showOverlay('wait-overlay');
        }

        const me = data.players?.[team]?.[playerId];
        if (me) {
          document.getElementById('info-name').innerText = me.name;
          document.getElementById('info-lives').innerHTML = renderHearts(me.lives, me.alive);
        }
      }
    });

    // ============================================================
    // ФИНИШ
    // ============================================================
    function handleFinished(data) {
      hideOverlay('wait-overlay');
      hideOverlay('preload-overlay');
      document.getElementById('tv-timer').classList.add('hidden');

      const resultOverlay = document.getElementById('result-overlay');
      const titleEl = document.getElementById('result-title');
      const subtitleEl = document.getElementById('result-subtitle');
      const emojiEl = document.getElementById('result-emoji');

      if (!resultOverlay.classList.contains('hidden')) return;

      const winner = data.winner;
      const isWinner = winner === team;

      if (isWinner) {
        titleEl.innerText = 'ПОБЕДА!';
        titleEl.className = 'result-title win';
        emojiEl.innerText = '🏆';
        subtitleEl.innerText = 'Твоя команда победила! Отличная работа!';
        vibrate([100, 50, 100, 50, 200]);
        launchConfetti();
      } else if (winner === 'none' || !winner) {
        titleEl.innerText = 'ИГРА ОКОНЧЕНА';
        titleEl.className = 'result-title lose';
        emojiEl.innerText = '❄️';
        subtitleEl.innerText = 'Бой завершён ведущим';
        vibrate(100);
      } else {
        titleEl.innerText = 'ПОРАЖЕНИЕ';
        titleEl.className = 'result-title lose';
        emojiEl.innerText = '💀';
        subtitleEl.innerText = 'В следующий раз повезёт больше!';
        vibrate([200, 100, 200]);
        document.getElementById('main-body').classList.add('animate-shake');
        setTimeout(() => document.getElementById('main-body').classList.remove('animate-shake'), 500);
      }

      showOverlay('result-overlay');
    }

    document.getElementById('result-close-btn').onclick = () => {
      hideOverlay('result-overlay');
      document.getElementById('confetti-container').innerHTML = '';
      currentPower = 10;
      updatePowerUI();
      currentAngle = 45;
      updateAimVisual(currentAngle);
      document.getElementById('shoot-btn').disabled = true;
    };

    // ============================================================
    // СЕРДЕЧКИ
    // ============================================================
    function renderHearts(lives, alive) {
      if (!alive || lives <= 0) return '💀';
      return '❤️'.repeat(lives);
    }

    // ============================================================
    // КОНФЕТТИ
    // ============================================================
    function launchConfetti() {
      const container = document.getElementById('confetti-container');
      const colors = ['#fbbf24', '#f59e0b', '#22d3ee', '#3b82f6', '#ef4444', '#a855f7', '#22c55e'];
      
      for (let i = 0; i < 60; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + 'vw';
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        c.style.width = (Math.random() * 8 + 6) + 'px';
        c.style.height = (Math.random() * 8 + 6) + 'px';
        c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        c.style.animationDuration = (Math.random() * 2 + 2) + 's';
        c.style.animationDelay = (Math.random() * 0.5) + 's';
        container.appendChild(c);
      }
      
      setTimeout(() => {
        container.innerHTML = '';
      }, 5000);
    }

    // ============================================================
    // СТАРТ
    // ============================================================
    startPowerAnimation();
    updateAimVisual(currentAngle);
  </script>
</body>
</html>
