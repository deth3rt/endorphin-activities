<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#03080f">
  <title>ENDORPHIN | ПУЛЬТ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');

    :root {
      --red-team: #ef4444;
      --blue-team: #3b82f6;
      --cyan-glow: #22d3ee;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --team-color: #22d3ee;
    }

    * { -webkit-tap-highlight-color: transparent; }

    body {
      background: radial-gradient(circle at 50% 0%, #0a2540 0%, #03080f 100%);
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
      user-select: none;
      touch-action: none;
      overscroll-behavior: none;
      height: 100dvh;
    }

    body.team-red { --team-color: var(--red-team); }
    body.team-blue { --team-color: var(--blue-team); }

    .glass-panel {
      background: rgba(10, 37, 64, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(127, 227, 255, 0.25);
      box-shadow: 0 0 40px rgba(31, 143, 214, 0.2), inset 0 0 20px rgba(127, 227, 255, 0.05);
    }

    /* ============================================================
       АНИМАЦИИ
       ============================================================ */
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 20px rgba(34, 211, 238, 0.3); }
      50% { box-shadow: 0 0 50px rgba(34, 211, 238, 0.8); }
    }
    @keyframes floatHeart {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.1); }
    }
    @keyframes winPop {
      0% { transform: scale(0.3); opacity: 0; }
      60% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes confettiFall {
      0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
    @keyframes shake {
      0%, 100% { transform: translate(0,0); }
      25% { transform: translate(-4px, 2px); }
      50% { transform: translate(4px, -2px); }
      75% { transform: translate(-2px, 1px); }
    }
    @keyframes timerPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    @keyframes superPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 20px #fbbf24; }
      50% { transform: scale(1.05); box-shadow: 0 0 50px #fbbf24, 0 0 80px #f59e0b; }
    }
    .animate-shake { animation: shake 0.4s ease-in-out; }

    /* ============================================================
       ТАЙМЕР ХОДА
       ============================================================ */
    .turn-timer {
      position: fixed;
      top: calc(var(--safe-top) + 10px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .turn-timer.active { opacity: 1; }

    .turn-timer-ring {
      position: relative;
      width: 70px;
      height: 70px;
      margin: 0 auto;
    }

    .turn-timer-ring svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }

    .turn-timer-ring .bg {
      fill: none;
      stroke: rgba(255,255,255,0.1);
      stroke-width: 6;
    }

    .turn-timer-ring .progress {
      fill: none;
      stroke: var(--team-color);
      stroke-width: 6;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.1s linear, stroke 0.3s;
      filter: drop-shadow(0 0 8px var(--team-color));
    }

    .turn-timer-ring.danger .progress {
      stroke: #ef4444;
      filter: drop-shadow(0 0 12px #ef4444);
    }

    .turn-timer-value {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.8rem;
      font-weight: 900;
      color: #fff;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 20px var(--team-color);
    }

    .turn-timer-ring.danger .turn-timer-value {
      color: #ef4444;
      text-shadow: 0 0 30px #ef4444;
      animation: timerPulse 0.5s ease-in-out infinite;
    }

    .turn-timer-label {
      font-size: 0.6rem;
      font-weight: 900;
      letter-spacing: 0.2em;
      color: rgba(168, 230, 255, 0.6);
      margin-top: 4px;
    }

    /* ============================================================
       ИНФО-ПАНЕЛЬ
       ============================================================ */
    .player-info {
      position: fixed;
      top: calc(var(--safe-top) + 12px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.65);
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid rgba(127, 227, 255, 0.35);
      text-align: center;
      z-index: 50;
      backdrop-filter: blur(12px);
      min-width: 150px;
    }
    .player-info .name {
      font-size: 1rem;
      font-weight: 900;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }
    .player-info .lives {
      font-size: 1.3rem;
      margin-top: 2px;
      letter-spacing: 3px;
    }

    .game-screen-inner {
      padding-top: calc(var(--safe-top) + 12px);
      padding-bottom: calc(var(--safe-bottom) + 16px);
    }

    /* ============================================================
       КНОПКИ УПРАВЛЕНИЯ (НОВЫЙ UI)
       ============================================================ */
    .control-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 0 12px;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      max-width: 360px;
    }

    .control-btn {
      flex: 1;
      aspect-ratio: 1;
      max-width: 90px;
      border-radius: 20px;
      background: rgba(10, 37, 64, 0.85);
      border: 2px solid rgba(127, 227, 255, 0.35);
      color: #fff;
      font-size: 2.2rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      cursor: pointer;
      touch-action: manipulation;
    }
    .control-btn:active:not(:disabled) {
      transform: scale(0.92);
      background: rgba(34, 211, 238, 0.25);
      border-color: var(--team-color);
      box-shadow: 0 0 25px var(--team-color);
    }
    .control-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .control-btn.up { color: #22d3ee; }
    .control-btn.down { color: #22d3ee; }
    .control-btn.left { color: #fbbf24; }
    .control-btn.right { color: #fbbf24; }

    /* Центральный дисплей */
    .control-display {
      flex: 1.2;
      aspect-ratio: 1;
      max-width: 110px;
      border-radius: 24px;
      background: radial-gradient(circle at 50% 30%, rgba(34, 211, 238, 0.15), rgba(10, 37, 64, 0.95));
      border: 2px solid rgba(127, 227, 255, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .display-label {
      font-size: 0.55rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      color: rgba(168, 230, 255, 0.6);
      margin-bottom: 2px;
    }

    .display-value {
      font-size: 2rem;
      font-weight: 900;
      color: var(--team-color);
      text-shadow: 0 0 15px var(--team-color);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .display-unit {
      font-size: 0.8rem;
      color: rgba(168, 230, 255, 0.5);
      font-weight: 700;
    }

    /* Индикатор мощности */
    .power-bar {
      width: 100%;
      max-width: 360px;
      height: 14px;
      background: rgba(0,0,0,0.6);
      border-radius: 7px;
      overflow: hidden;
      border: 2px solid rgba(127, 227, 255, 0.2);
      position: relative;
    }
    .power-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #fbbf24, #ef4444);
      transition: width 0.15s ease;
      border-radius: 5px;
    }

    /* Кнопка БРОСОК */
    .shoot-btn {
      width: min(52vw, 180px);
      height: min(52vw, 180px);
      border-radius: 50%;
      font-size: 1.5rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 35% 35%, var(--team-color), rgba(0,0,0,0.6) 120%);
      border: 6px solid rgba(255,255,255,0.2);
      color: #fff;
      box-shadow: 0 0 40px var(--team-color), inset 0 0 20px rgba(0,0,0,0.3);
      position: relative;
      overflow: hidden;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    .shoot-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.4), transparent 60%);
      opacity: 0.6;
    }
    .shoot-btn:active:not(:disabled) {
      transform: scale(0.93);
      box-shadow: 0 0 70px var(--team-color), inset 0 0 30px rgba(0,0,0,0.5);
    }
    .shoot-btn:disabled {
      filter: grayscale(1);
      opacity: 0.25;
      transform: scale(0.85);
      box-shadow: none;
    }

    /* ============================================================
       СУПЕРСПОСОБНОСТИ
       ============================================================ */
    .super-panel {
      width: 100%;
      max-width: 360px;
      margin-top: 10px;
    }

    .super-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: rgba(251, 191, 36, 0.15);
      border: 1px solid rgba(251, 191, 36, 0.4);
      border-radius: 12px;
      margin-bottom: 8px;
    }

    .super-title {
      font-size: 0.7rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      color: #fbbf24;
      text-shadow: 0 0 10px #fbbf24;
    }

    .super-hearts {
      font-size: 0.8rem;
      font-weight: 700;
      color: rgba(251, 191, 36, 0.8);
    }

    .super-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .super-btn {
      padding: 12px 8px;
      border-radius: 14px;
      background: rgba(10, 37, 64, 0.85);
      border: 2px solid rgba(251, 191, 36, 0.4);
      color: #fff;
      font-weight: 900;
      font-size: 0.75rem;
      text-align: center;
      transition: all 0.15s;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .super-btn .super-emoji {
      font-size: 1.6rem;
      display: block;
      margin-bottom: 2px;
    }

    .super-btn .super-name {
      font-size: 0.7rem;
      letter-spacing: 0.08em;
    }

    .super-btn .super-cost {
      font-size: 0.6rem;
      color: rgba(251, 191, 36, 0.8);
      margin-top: 2px;
    }

    .super-btn:active:not(:disabled) {
      transform: scale(0.95);
      background: rgba(251, 191, 36, 0.2);
      border-color: #fbbf24;
      box-shadow: 0 0 25px #fbbf24;
    }

    .super-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .super-btn.can-use {
      animation: superPulse 2s ease-in-out infinite;
    }

    /* Модалка суперброска */
    .super-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 150;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 20px;
      backdrop-filter: blur(10px);
    }
    .super-modal.hidden { display: none; }

    /* ============================================================
       ОВЕРЛЕИ
       ============================================================ */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .overlay.hidden { display: none; }

    .wait-overlay {
      background: rgba(0,0,0,0.88);
    }
    .wait-overlay .pulse-dot {
      width: 20px; height: 20px;
      border-radius: 50%;
      background: #22d3ee;
      box-shadow: 0 0 20px #22d3ee;
      animation: pulseGlow 1.2s ease-in-out infinite;
      margin: 0 4px;
    }

    .result-overlay {
      background: rgba(0,0,0,0.92);
      z-index: 200;
    }
    .result-title {
      font-size: clamp(2.5rem, 12vw, 5rem);
      font-weight: 900;
      letter-spacing: 0.05em;
      animation: winPop 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-align: center;
      line-height: 1.1;
    }
    .result-title.win {
      background: linear-gradient(180deg, #fbbf24, #f59e0b);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 30px rgba(251, 191, 36, 0.8));
    }
    .result-title.lose {
      background: linear-gradient(180deg, #94a3b8, #475569);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 20px rgba(148, 163, 184, 0.4));
    }
    .result-subtitle {
      font-size: 1.1rem;
      color: rgba(168, 230, 255, 0.7);
      margin-top: 1rem;
    }
    .result-emoji {
      font-size: 5rem;
      margin-bottom: 1rem;
      animation: winPop 0.8s 0.1s both;
      filter: drop-shadow(0 0 40px rgba(251, 191, 36, 0.6));
    }

    .confetti {
      position: fixed;
      top: 0;
      width: 10px; height: 10px;
      z-index: 250;
      pointer-events: none;
      animation: confettiFall linear forwards;
    }

    /* ============================================================
       ВХОД
       ============================================================ */
    .join-card {
      animation: slideUp 0.5s ease-out;
    }
    .join-input {
      background: rgba(0,0,0,0.5);
      border: 2px solid rgba(34, 211, 238, 0.5);
      transition: all 0.2s;
    }
    .join-input:focus {
      border-color: #22d3ee;
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.4);
      outline: none;
    }

    /* ============================================================
       КОМПАКТНЫЙ ЛЭЙАУТ
       ============================================================ */
    @media (max-height: 720px) {
      .shoot-btn { width: min(42vw, 140px); height: min(42vw, 140px); font-size: 1.2rem; }
      .control-btn { font-size: 1.8rem; }
      .display-value { font-size: 1.6rem; }
      .game-screen-inner { padding-top: calc(var(--safe-top) + 8px); }
    }
  </style>
</head>
<body class="relative" id="main-body">

  <!-- ============================================================
       ЭКРАН ВХОДА
       ============================================================ -->
  <div id="join-screen" class="fixed inset-0 flex flex-col items-center justify-center p-6 z-10">
    <div class="glass-panel join-card p-8 rounded-3xl w-full max-w-sm flex flex-col items-center">
      <div class="text-5xl mb-4">❄️</div>
      <h1 class="text-3xl font-black text-cyan-300 mb-1 tracking-widest">ENDORPHIN</h1>
      <p class="text-cyan-100/50 text-xs tracking-[0.3em] mb-6">СНЕЖНЫЙ БАТТЛ</p>
      
      <div class="w-full mb-6">
        <label class="block text-xs font-bold text-cyan-300/70 mb-2 tracking-wider">ТВОЁ ИМЯ</label>
        <input 
          type="text" 
          id="input-name" 
          placeholder="ВВЕДИ ИМЯ" 
          maxlength="16"
          class="join-input w-full rounded-xl px-4 py-4 text-center text-xl font-bold text-white placeholder:text-white/30"
        >
      </div>

      <div id="team-badge" class="mb-6 px-6 py-2 rounded-full font-black text-sm tracking-wider"></div>

      <button 
        id="join-btn" 
        class="w-full py-5 text-white font-black text-xl rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 shadow-lg active:scale-95 transition-all"
      >
        ПОДКЛЮЧИТЬСЯ
      </button>
      <p id="join-error" class="text-red-400 text-xs mt-3 hidden"></p>
    </div>
  </div>

  <!-- ============================================================
       ЭКРАН ИГРЫ
       ============================================================ -->
  <div id="game-screen" class="hidden fixed inset-0 flex flex-col items-center z-10 game-screen-inner">

    <div class="tv-timer hidden" id="tv-timer"></div>

    <!-- Таймер хода -->
    <div class="turn-timer" id="turn-timer">
      <div class="turn-timer-ring" id="turn-timer-ring">
        <svg viewBox="0 0 70 70">
          <circle class="bg" cx="35" cy="35" r="30"></circle>
          <circle class="progress" cx="35" cy="35" r="30" id="turn-timer-progress"></circle>
        </svg>
        <div class="turn-timer-value" id="turn-timer-value">10</div>
      </div>
      <div class="turn-timer-label">СЕК</div>
    </div>

    <div class="player-info hidden" id="player-info">
      <div class="name" id="info-name">Игрок</div>
      <div class="lives" id="info-lives">❤️❤️❤️</div>
    </div>

    <div id="game-team-badge" class="mb-2 px-5 py-1.5 rounded-full font-black text-xs tracking-widest"></div>

    <!-- ========================================================
         ПАНЕЛЬ УПРАВЛЕНИЯ
         ======================================================== -->
    <div class="control-panel flex-1 justify-center">

      <!-- УГОЛ: верхний ряд -->
      <div class="control-row">
        <button class="control-btn up" id="angle-up" disabled>▲</button>
      </div>

      <!-- ЦЕНТР: дисплей + боковые кнопки -->
      <div class="control-row">
        <button class="control-btn left" id="power-down" disabled>◀</button>
        
        <div class="control-display">
          <div class="display-label">УГОЛ</div>
          <div class="display-value" id="angle-display">45°</div>
          <div class="display-unit" id="angle-hint">ВПЕРЁД</div>
        </div>

        <button class="control-btn right" id="power-up" disabled>▶</button>
      </div>

      <!-- УГОЛ: нижний ряд -->
      <div class="control-row">
        <button class="control-btn down" id="angle-down" disabled>▼</button>
      </div>

      <!-- Мощность: бар -->
      <div class="w-full flex flex-col items-center gap-1 mt-2">
        <div class="flex justify-between text-xs font-bold text-white/60 w-full max-w-[360px] px-1">
          <span>МОЩНОСТЬ</span>
          <span id="power-value" class="text-white">10%</span>
        </div>
        <div class="power-bar">
          <div class="power-bar-fill" id="power-bar-fill" style="width: 10%"></div>
        </div>
      </div>

      <!-- Суперспособности -->
      <div class="super-panel hidden" id="super-panel">
        <div class="super-header">
          <div class="super-title">⚡ СУПЕРСПОСОБНОСТИ</div>
          <div class="super-hearts" id="super-hearts-info">-1❤️ за приём</div>
        </div>
        <div class="super-grid" id="super-grid"></div>
      </div>

      <!-- Кнопка БРОСОК -->
      <button id="shoot-btn" class="shoot-btn mt-3" disabled>БРОСОК</button>
    </div>
  </div>

  <!-- ============================================================
       МОДАЛКА ВЫБОРА СУПЕРБРОСКА
       ============================================================ -->
  <div id="super-modal" class="super-modal hidden">
    <div class="glass-panel p-6 rounded-3xl w-full max-w-sm">
      <h2 class="text-xl font-black text-center mb-4 text-yellow-400 tracking-widest">ВЫБЕРИ СУПЕРБРОСОК</h2>
      <div id="super-modal-list" class="space-y-3"></div>
      <button id="super-cancel" class="w-full mt-4 py-3 rounded-xl bg-white/10 border border-white/20 font-bold text-white">ОТМЕНА</button>
    </div>
  </div>

  <!-- ============================================================
       ОВЕРЛЕИ
       ============================================================ -->
  <div id="wait-overlay" class="overlay wait-overlay hidden">
    <div class="text-6xl mb-6">⏳</div>
    <h1 class="text-3xl font-black text-white mb-3 text-center">ХОД СОПЕРНИКА</h1>
    <p class="text-base text-gray-400 text-center px-8">СМОТРИ НА ЭКРАН!</p>
    <div class="flex mt-6">
      <div class="pulse-dot"></div>
      <div class="pulse-dot" style="animation-delay:0.2s"></div>
      <div class="pulse-dot" style="animation-delay:0.4s"></div>
    </div>
  </div>

  <div id="preload-overlay" class="overlay wait-overlay hidden">
    <p class="text-cyan-300 font-bold tracking-[0.3em] text-sm mb-4">ПРИГОТОВЬСЯ</p>
    <div class="text-8xl font-black text-white" id="preload-count" style="text-shadow: 0 0 40px rgba(34,211,238,0.8); font-variant-numeric: tabular-nums;">10</div>
    <p class="text-gray-400 text-sm mt-4">ИГРА НАЧНЁТСЯ СЕЙЧАС</p>
  </div>

  <div id="result-overlay" class="overlay result-overlay hidden">
    <div class="result-emoji" id="result-emoji">🏆</div>
    <h1 class="result-title win" id="result-title">ПОБЕДА!</h1>
    <p class="result-subtitle" id="result-subtitle">Твоя команда победила</p>
    
    <div class="mt-10 px-8 text-center">
      <p class="text-white/40 text-xs tracking-wider mb-6">ИГРА ЗАВЕРШЕНА</p>
      <button 
        id="result-close-btn"
        class="px-10 py-4 rounded-xl bg-white/10 border border-white/20 font-bold text-white hover:bg-white/20 transition active:scale-95"
      >
        ЗАКРЫТЬ
      </button>
    </div>
  </div>

  <div id="confetti-container"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, onDisconnect, onValue, update, get, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { apiKey: "AIzaSyCXIR5Tv8lB6ivcGRC3yt1SC66MM6T5b_M", authDomain: "endorphin-battle.firebaseapp.com", databaseURL: "https://endorphin-battle-default-rtdb.europe-west1.firebasedatabase.app", projectId: "endorphin-battle", storageBucket: "endorphin-battle.firebasestorage.app", messagingSenderId: "185259733030", appId: "1:185259733030:web:d72a89a436880973e636e7" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const gameRef = ref(db, 'games/battle_1');

    // ============================================================
    // КОНТЕКСТ
    // ============================================================
    const urlParams = new URLSearchParams(window.location.search);
    const team = urlParams.get('team') || 'red';
    const isRed = team === 'red';

    document.body.classList.add(isRed ? 'team-red' : 'team-blue');

    const storageKey = `endorphin_playerId_${team}`;
    let playerId = localStorage.getItem(storageKey) || 'p_' + Math.random().toString(36).substr(2, 9);
    localStorage.setItem(storageKey, playerId);

    const playerRef = ref(db, `games/battle_1/players/${team}/${playerId}`);

    // ============================================================
    // КОНСТАНТЫ
    // ============================================================
    const TURN_TIME = 10;
    const FORM_TIME = 1500;
    const ANGLE_STEP = 5;
    const POWER_STEP = 10;

    // ============================================================
    // СУПЕРСПОСОБНОСТИ
    // ============================================================
    const SUPERS = {
      fan: {
        id: 'fan',
        emoji: '🌪',
        name: 'ВЕЕР',
        desc: '6 снежков ±30°',
        cost: 1,
        count: 6
      },
      shotgun: {
        id: 'shotgun',
        emoji: '💥',
        name: 'ДРОБОВИК',
        desc: '8 снежков ±10°',
        cost: 1,
        count: 8
      },
      chaos: {
        id: 'chaos',
        emoji: '🎲',
        name: 'ХАОС',
        desc: '6 снежков рандом',
        cost: 1,
        count: 6
      },
      nuke: {
        id: 'nuke',
        emoji: '☄️',
        name: 'ЯДЕРКА',
        desc: '1 снежок, 3❤️ урона',
        cost: 2,
        count: 1
      }
    };

    // ============================================================
    // СОСТОЯНИЕ
    // ============================================================
    let isMyTurn = false;
    let currentAngle = 45;
    let currentPower = 30;
    let isShooting = false;
    let hasJoined = false;
    let gameStatus = 'lobby';
    let lastPreloadValue = null;
    let myLives = 3;
    let isUnfairMode = false;
    let myTeamMax = 1;
    let enemyTeamMax = 1;
    let isSmallerTeam = false;
    let superModalOpen = false;

    // Таймер хода
    let turnTimerInterval = null;
    let turnDeadline = 0;

    // ============================================================
    // УТИЛИТЫ
    // ============================================================
    const vibrate = (pattern) => {
      if (navigator.vibrate) navigator.vibrate(pattern);
    };
    const showOverlay = (id) => document.getElementById(id).classList.remove('hidden');
    const hideOverlay = (id) => document.getElementById(id).classList.add('hidden');
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

    // ============================================================
    // ГЕНЕРАЦИЯ КООРДИНАТ (идеальная расстановка)
    // ============================================================
    async function ensureMyPosition() {
      const snap = await get(playerRef);
      const me = snap.val();
      
      if (!me) return;
      
      // Уже есть координаты — не трогаем
      if (me.posX !== undefined && me.posY !== undefined) return;

      // Генерируем с учётом других игроков команды
      const teamSnap = await get(ref(db, `games/battle_1/players/${team}`));
      const teamPlayers = teamSnap.val() || {};
      
      const usedY = [];
      Object.values(teamPlayers).forEach(p => {
        if (p.posY !== undefined && p.id !== playerId) usedY.push(p.posY);
      });

      let posX, posY, attempts = 0;
      do {
        posX = isRed ? (5 + Math.random() * 15) : (80 + Math.random() * 15);
        posY = 20 + Math.random() * 60;
        attempts++;
      } while (usedY.some(y => Math.abs(y - posY) < 10) && attempts < 50);

      await update(playerRef, { posX, posY });
    }

    // ============================================================
    // ВХОД
    // ============================================================
    async function joinGame() {
      const nameInput = document.getElementById('input-name');
      const name = nameInput.value.trim() || 'Игрок';
      const errorEl = document.getElementById('join-error');
      
      if (name.length < 2) {
        errorEl.innerText = 'Имя должно быть не короче 2 символов';
        errorEl.classList.remove('hidden');
        return;
      }

      const snapshot = await get(playerRef);
      const existing = snapshot.val();

      if (existing) {
        await update(playerRef, { name, connected: true });
      } else {
        await set(playerRef, { 
          name, lives: 3, alive: true, connected: true, joinedAt: Date.now()
        });
      }

      // ГАРАНТИРОВАННАЯ РАССТАНОВКА
      await ensureMyPosition();

      onDisconnect(playerRef).remove();

      hasJoined = true;
      vibrate(50);

      document.getElementById('join-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');
      document.getElementById('player-info').classList.remove('hidden');
      document.getElementById('info-name').innerText = name;

      updateTeamBadges();
      updateAngleDisplay();
      updatePowerDisplay();
    }

    document.getElementById('join-btn').onclick = joinGame;
    document.getElementById('input-name').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') joinGame();
    });

    function updateTeamBadges() {
      const color = isRed ? 'bg-red-500/20 text-red-300 border-red-500/50' : 'bg-blue-500/20 text-blue-300 border-blue-500/50';
      const label = isRed ? '🔴 КРАСНЫЕ' : '🔵 СИНИЕ';
      
      const joinBadge = document.getElementById('team-badge');
      joinBadge.className = `mb-6 px-6 py-2 rounded-full font-black text-sm tracking-wider border-2 ${color}`;
      joinBadge.innerText = label;

      const gameBadge = document.getElementById('game-team-badge');
      gameBadge.className = `mb-2 px-5 py-1.5 rounded-full font-black text-xs tracking-widest border-2 ${color}`;
      gameBadge.innerText = label;
    }
    updateTeamBadges();

    // ============================================================
    // УПРАВЛЕНИЕ: УГОЛ
    // ============================================================
    function angleUp() {
      if (!isMyTurn || isShooting) return;
      // Для красных: увеличение угла = вверх (к 180 → вверх-влево, но мы вправо смотрим)
      // Реально: 0 = горизонтально вправо, 180 = горизонтально влево, 90 = вверх
      // Кнопка ВВЕРХ должна увеличивать угол (к 90 = вверх)
      // Но если > 90, то уже вниз-влево. Ограничим 0-90 для красных?
      // Нет, оставим 0-180: 0 = вправо, 90 = вверх, 180 = влево
      // ВВЕРХ: к 90. Если < 90 → +step, если > 90 → -step (возврат к 90)
      // Проще: ВВЕРХ = +step, если <= 90, иначе -step (но это странно)
      // 
      // Альтернатива: ВВЕРХ = увеличить "высоту" = приблизить к 90
      // ВНИЗ = отдалить от 90
      
      if (currentAngle < 90) {
        currentAngle = Math.min(180, currentAngle + ANGLE_STEP);
      } else {
        currentAngle = Math.max(0, currentAngle - ANGLE_STEP);
      }
      currentAngle = clamp(currentAngle, 0, 180);
      updateAngleDisplay();
      vibrate(10);
    }

    function angleDown() {
      if (!isMyTurn || isShooting) return;
      // ВНИЗ = уменьшить угол (если < 90) или увеличить (если > 90)
      if (currentAngle < 90) {
        currentAngle = Math.max(0, currentAngle - ANGLE_STEP);
      } else {
        currentAngle = Math.min(180, currentAngle + ANGLE_STEP);
      }
      currentAngle = clamp(currentAngle, 0, 180);
      updateAngleDisplay();
      vibrate(10);
    }

    // Альтернативная логика: ВВЕРХ/ВНИЗ = просто +/-, 0 = вправо, 180 = влево
    // Но это сбивает. Давайте попробуем так:
    // ВВЕРХ = +step (0→180, вправо→влево через верх)
    // ВНИЗ = -step
    // И для синих: ВВЕРХ = -step (360→180, влево→вправо через верх)
    // 
    // Хм, но тогда "вверх" в смысле "поднять" работает только на 0-90.
    // 
    // Лучше: кнопки ▲▼ меняют угол от 0 до 180 (для красных) — это градусы наклона.
    // 0° = прямо, 90° = вверх, 180° = назад-вверх? Нет, 180 = влево.
    // 
    // Оставим линейно: ▲ = +5°, ▼ = -5°. Игрок сам поймёт.

    // Переопределим проще — линейно
    function angleUpLinear() {
      if (!isMyTurn || isShooting) return;
      currentAngle = clamp(currentAngle + ANGLE_STEP, 0, 180);
      updateAngleDisplay();
      vibrate(10);
    }

    function angleDownLinear() {
      if (!isMyTurn || isShooting) return;
      currentAngle = clamp(currentAngle - ANGLE_STEP, 0, 180);
      updateAngleDisplay();
      vibrate(10);
    }

    // ============================================================
    // УПРАВЛЕНИЕ: МОЩНОСТЬ
    // ============================================================
    function powerUp() {
      if (!isMyTurn || isShooting) return;
      currentPower = clamp(currentPower + POWER_STEP, 10, 100);
      updatePowerDisplay();
      vibrate(10);
    }

    function powerDown() {
      if (!isMyTurn || isShooting) return;
      currentPower = clamp(currentPower - POWER_STEP, 10, 100);
      updatePowerDisplay();
      vibrate(10);
    }

    // ============================================================
    // ОТОБРАЖЕНИЕ
    // ============================================================
    function updateAngleDisplay() {
      document.getElementById('angle-display').innerText = Math.round(currentAngle) + '°';
      
      let hint;
      if (currentAngle < 22) hint = 'ПРЯМО';
      else if (currentAngle < 67) hint = 'ВВЕРХ';
      else if (currentAngle < 112) hint = 'ВЫСОКО';
      else if (currentAngle < 157) hint = 'ВНИЗ';
      else hint = 'НАЗАД';
      
      document.getElementById('angle-hint').innerText = hint;
    }

    function updatePowerDisplay() {
      document.getElementById('power-value').innerText = currentPower + '%';
      document.getElementById('power-bar-fill').style.width = currentPower + '%';
    }

    // ============================================================
    // ТАЙМЕР ХОДА
    // ============================================================
    function startTurnTimer() {
      stopTurnTimer();
      turnDeadline = Date.now() + TURN_TIME * 1000;
      
      const timerEl = document.getElementById('turn-timer');
      const progressEl = document.getElementById('turn-timer-progress');
      const valueEl = document.getElementById('turn-timer-value');
      const ringEl = document.getElementById('turn-timer-ring');
      
      timerEl.classList.add('active');
      
      const CIRCUMFERENCE = 2 * Math.PI * 30;
      progressEl.style.strokeDasharray = CIRCUMFERENCE;
      progressEl.style.strokeDashoffset = 0;
      
      let lastSec = -1;
      
      turnTimerInterval = setInterval(() => {
        const remaining = Math.max(0, turnDeadline - Date.now());
        const sec = Math.ceil(remaining / 1000);
        const ratio = remaining / (TURN_TIME * 1000);
        
        progressEl.style.strokeDashoffset = CIRCUMFERENCE * (1 - ratio);
        
        if (sec !== lastSec) {
          valueEl.innerText = sec;
          lastSec = sec;
          
          if (sec <= 3 && sec > 0) {
            ringEl.classList.add('danger');
            vibrate(30);
          } else {
            ringEl.classList.remove('danger');
          }
        }
        
        if (remaining <= 0) {
          stopTurnTimer();
          if (isMyTurn && !isShooting) {
            autoShoot();
          }
        }
      }, 100);
    }

    function stopTurnTimer() {
      if (turnTimerInterval) {
        clearInterval(turnTimerInterval);
        turnTimerInterval = null;
      }
      document.getElementById('turn-timer').classList.remove('active');
      document.getElementById('turn-timer-ring').classList.remove('danger');
    }

    // ============================================================
    // АВТО-БРОСОК
    // ============================================================
    async function autoShoot() {
      if (!isMyTurn || isShooting) return;
      vibrate([100, 50, 100]);
      
      const notif = document.createElement('div');
      notif.className = 'fixed top-1/3 left-1/2 -translate-x-1/2 bg-red-500/90 text-white px-6 py-3 rounded-xl font-black text-lg z-[150] animate-shake';
      notif.innerText = '⏰ ВРЕМЯ ВЫШЛО!';
      document.body.appendChild(notif);
      setTimeout(() => notif.remove(), 1500);
      
      await executeShot();
    }

    // ============================================================
    // СУПЕРСПОСОБНОСТИ
    // ============================================================
    function updateSuperPanel() {
      const panel = document.getElementById('super-panel');
      
      if (!isUnfairMode || !isSmallerTeam) {
        panel.classList.add('hidden');
        return;
      }
      
      panel.classList.remove('hidden');
      document.getElementById('super-hearts-info').innerText = `У тебя ${myLives}❤️`;
      
      const grid = document.getElementById('super-grid');
      grid.innerHTML = '';
      
      Object.values(SUPERS).forEach(superItem => {
        const canUse = myLives > superItem.cost && isMyTurn && !isShooting;
        
        const btn = document.createElement('button');
        btn.className = 'super-btn' + (canUse ? ' can-use' : '');
        btn.disabled = !canUse;
        btn.innerHTML = `
          <span class="super-emoji">${superItem.emoji}</span>
          <span class="super-name">${superItem.name}</span>
          <span class="super-cost">-${superItem.cost}❤️</span>
        `;
        btn.onclick = () => openSuperModal(superItem);
        grid.appendChild(btn);
      });
    }

    function openSuperModal(superItem) {
      if (!isMyTurn || isShooting) return;
      if (myLives <= superItem.cost) return;
      
      superModalOpen = true;
      document.getElementById('super-modal').classList.remove('hidden');
      
      const list = document.getElementById('super-modal-list');
      list.innerHTML = `
        <div class="text-center mb-4">
          <div class="text-6xl mb-2">${superItem.emoji}</div>
          <div class="text-2xl font-black text-yellow-400">${superItem.name}</div>
          <div class="text-sm text-gray-300 mt-1">${superItem.desc}</div>
          <div class="text-yellow-400 font-bold mt-2">Стоимость: ${superItem.cost} ❤️</div>
        </div>
        <button id="super-confirm" class="w-full py-4 bg-gradient-to-r from-yellow-500 to-orange-500 rounded-xl font-black text-lg text-black">
          ПРИМЕНИТЬ
        </button>
      `;
      
      document.getElementById('super-confirm').onclick = () => {
        closeSuperModal();
        executeSuperShot(superItem);
      };
    }

    function closeSuperModal() {
      superModalOpen = false;
      document.getElementById('super-modal').classList.add('hidden');
    }

    document.getElementById('super-cancel').onclick = closeSuperModal;

    // ============================================================
    // ГЕНЕРАЦИЯ СУПЕРБРОСКА
    // ============================================================
    function generateSuperShots(superItem) {
      const shots = [];
      
      if (superItem.id === 'fan') {
        for (let i = 0; i < superItem.count; i++) {
          shots.push({
            angle: clamp(currentAngle + (Math.random() - 0.5) * 60, 0, 180),
            power: clamp(currentPower + (Math.random() - 0.5) * 40, 20, 100)
          });
        }
      } else if (superItem.id === 'shotgun') {
        for (let i = 0; i < superItem.count; i++) {
          shots.push({
            angle: clamp(currentAngle + (Math.random() - 0.5) * 20, 0, 180),
            power: clamp(currentPower + (Math.random() - 0.5) * 10, 20, 100)
          });
        }
      } else if (superItem.id === 'chaos') {
        const same = Math.random() < 0.1;
        const sameAngle = Math.random() * 180;
        const samePower = 20 + Math.random() * 80;
        
        for (let i = 0; i < superItem.count; i++) {
          shots.push({
            angle: same ? sameAngle : Math.random() * 180,
            power: same ? samePower : 20 + Math.random() * 80
          });
        }
      } else if (superItem.id === 'nuke') {
        shots.push({
          angle: currentAngle,
          power: currentPower,
          damage: 3
        });
      }
      
      return shots;
    }

    // ============================================================
    // БРОСОК
    // ============================================================
    async function executeShot() {
      if (isShooting) return;
      await doShot([{ angle: currentAngle, power: currentPower }], false, null);
    }

    async function executeSuperShot(superItem) {
      if (isShooting) return;
      if (myLives <= superItem.cost) return;
      
      const shots = generateSuperShots(superItem);
      
      vibrate([60, 30, 60, 30, 100]);
      
      // Списываем жизни
      const newLives = Math.max(1, myLives - superItem.cost);
      await update(playerRef, { lives: newLives });
      myLives = newLives;
      
      await doShot(shots, true, superItem.id);
    }

    async function doShot(shots, isSuper, superType) {
      isShooting = true;
      stopTurnTimer();
      vibrate([30, 30, 60]);

      const btn = document.getElementById('shoot-btn');
      btn.disabled = true;

      const now = Date.now();
      const shotData = {
        team,
        shooterId: playerId,
        shots: shots.map(s => ({
          angle: s.angle,
          power: s.power,
          damage: s.damage || 1
        })),
        time: now,
        state: 'forming',
        formTime: now,
        isSuper: isSuper || false,
        superType: superType || null
      };

      await push(ref(db, 'games/battle_1/shots'), shotData);
      await set(ref(db, 'games/battle_1/last_shot'), shotData);

      // Формирование завершено → полёт
      setTimeout(async () => {
        try {
          await update(ref(db, 'games/battle_1/last_shot'), {
            state: 'flying',
            flyTime: Date.now()
          });
        } catch {}
      }, FORM_TIME);

      // Передача хода
      setTimeout(async () => {
        const playersSnap = await get(ref(db, 'games/battle_1/players'));
        const players = playersSnap.val() || {};

        const myTeamPlayers = Object.entries(players[team] || {}).filter(([id, p]) => p.alive && p.lives > 0);
        const myIdx = myTeamPlayers.findIndex(([id]) => id === playerId);

        let nextPlayer = null;
        if (myIdx !== -1 && myIdx < myTeamPlayers.length - 1) {
          nextPlayer = myTeamPlayers[myIdx + 1];
        } else {
          const enemyTeam = Object.entries(players[isRed ? 'blue' : 'red'] || {}).filter(([id, p]) => p.alive && p.lives > 0);
          if (enemyTeam.length > 0) nextPlayer = enemyTeam[0];
        }

        if (nextPlayer) {
          await update(gameRef, {
            activePlayerId: nextPlayer[0],
            turn: { team: isRed ? 'blue' : 'red', name: nextPlayer[1].name }
          });
        }

        isShooting = false;
        if (isMyTurn) btn.disabled = false;
      }, FORM_TIME + 500);
    }

    document.getElementById('shoot-btn').onclick = async () => {
      if (!isMyTurn || isShooting || gameStatus !== 'playing') return;
      await executeShot();
    };

    // ============================================================
    // ОСНОВНОЙ СЛУШАТЕЛЬ
    // ============================================================
    onValue(gameRef, (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      const prevStatus = gameStatus;
      gameStatus = data.status || 'lobby';

      // Нечестный режим
      if (data.mode) {
        updateModeInfo(data.mode, data);
      }

      if (gameStatus === 'finished') {
        handleFinished(data);
        return;
      } else if (prevStatus === 'finished' && gameStatus !== 'finished') {
        hideOverlay('result-overlay');
        document.getElementById('result-emoji').innerText = '';
      }

      if (gameStatus === 'lobby') {
        hideOverlay('wait-overlay');
        hideOverlay('preload-overlay');
        hideOverlay('result-overlay');
        document.getElementById('tv-timer').classList.add('hidden');
        stopTurnTimer();
        
        const me = data.players?.[team]?.[playerId];
        if (me) {
          myLives = me.lives;
          document.getElementById('info-lives').innerHTML = renderHearts(me.lives, me.alive);
        }
        return;
      }

      // ПРЕЛОУДИНГ
      if (gameStatus === 'playing' && data.timer !== null && data.timer !== undefined) {
        showOverlay('preload-overlay');
        hideOverlay('wait-overlay');
        document.getElementById('preload-count').innerText = data.timer;
        if (data.timer !== lastPreloadValue) {
          vibrate(20);
          lastPreloadValue = data.timer;
        }
      } else {
        hideOverlay('preload-overlay');
      }

      // ИГРА
      if (gameStatus === 'playing' && !data.timer) {
        const tvTimer = document.getElementById('tv-timer');
        if (data.timer) {
          tvTimer.classList.remove('hidden');
          tvTimer.innerText = data.timer;
        } else {
          tvTimer.classList.add('hidden');
        }

        const wasMyTurn = isMyTurn;
        isMyTurn = (data.activePlayerId === playerId);

        const btn = document.getElementById('shoot-btn');
        const angleUpBtn = document.getElementById('angle-up');
        const angleDownBtn = document.getElementById('angle-down');
        const powerUpBtn = document.getElementById('power-up');
        const powerDownBtn = document.getElementById('power-down');
        
        if (isMyTurn) {
          if (!wasMyTurn) {
            vibrate([40, 20, 40]);
            btn.classList.add('animate-shake');
            setTimeout(() => btn.classList.remove('animate-shake'), 500);
            
            startTurnTimer();
            currentAngle = 45;
            currentPower = 30;
            updateAngleDisplay();
            updatePowerDisplay();
          }
          btn.disabled = false;
          angleUpBtn.disabled = false;
          angleDownBtn.disabled = false;
          powerUpBtn.disabled = false;
          powerDownBtn.disabled = false;
          hideOverlay('wait-overlay');
        } else {
          if (wasMyTurn) {
            stopTurnTimer();
          }
          btn.disabled = true;
          angleUpBtn.disabled = true;
          angleDownBtn.disabled = true;
          powerUpBtn.disabled = true;
          powerDownBtn.disabled = true;
          if (hasJoined && !isShooting) showOverlay('wait-overlay');
        }

        const me = data.players?.[team]?.[playerId];
        if (me) {
          myLives = me.lives;
          document.getElementById('info-name').innerText = me.name;
          document.getElementById('info-lives').innerHTML = renderHearts(me.lives, me.alive);
          updateSuperPanel();
        }
      }
    });

    // ============================================================
    // РЕЖИМ
    // ============================================================
    function updateModeInfo(mode, data) {
      if (typeof mode === 'string' && mode.includes('v')) {
        const parts = mode.split('v');
        myTeamMax = isRed ? parseInt(parts[0]) : parseInt(parts[1]);
        enemyTeamMax = isRed ? parseInt(parts[1]) : parseInt(parts[0]);
      } else {
        myTeamMax = 1;
        enemyTeamMax = 1;
      }
      
      isUnfairMode = myTeamMax !== enemyTeamMax;
      isSmallerTeam = isUnfairMode && myTeamMax < enemyTeamMax;
      
      updateSuperPanel();
    }

    // ============================================================
    // КНОПКИ УПРАВЛЕНИЯ (обработчики)
    // ============================================================
    document.getElementById('angle-up').onclick = angleUpLinear;
    document.getElementById('angle-down').onclick = angleDownLinear;
    document.getElementById('power-up').onclick = powerUp;
    document.getElementById('power-down').onclick = powerDown;

    // Долгое нажатие = ускорение
    function addHoldSupport(btnId, action) {
      const btn = document.getElementById(btnId);
      let holdInterval = null;
      
      const start = (e) => {
        e.preventDefault();
        action();
        holdInterval = setInterval(action, 80);
      };
      const stop = () => {
        if (holdInterval) {
          clearInterval(holdInterval);
          holdInterval = null;
        }
      };
      
      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', stop);
      btn.addEventListener('mouseleave', stop);
      btn.addEventListener('touchstart', start, { passive: false });
      btn.addEventListener('touchend', stop);
      btn.addEventListener('touchcancel', stop);
    }

    addHoldSupport('angle-up', angleUpLinear);
    addHoldSupport('angle-down', angleDownLinear);
    addHoldSupport('power-up', powerUp);
    addHoldSupport('power-down', powerDown);

    // ============================================================
    // ФИНИШ
    // ============================================================
    function handleFinished(data) {
      hideOverlay('wait-overlay');
      hideOverlay('preload-overlay');
      document.getElementById('tv-timer').classList.add('hidden');
      stopTurnTimer();

      const resultOverlay = document.getElementById('result-overlay');
      
      if (!resultOverlay.classList.contains('hidden')) return;

      const titleEl = document.getElementById('result-title');
      const subtitleEl = document.getElementById('result-subtitle');
      const emojiEl = document.getElementById('result-emoji');

      const winner = data.winner;
      const isWinner = winner === team;

      if (isWinner) {
        titleEl.innerText = 'ПОБЕДА!';
        titleEl.className = 'result-title win';
        emojiEl.innerText = '🏆';
        subtitleEl.innerText = 'Твоя команда победила!';
        vibrate([100, 50, 100, 50, 200]);
        launchConfetti();
      } else if (winner === 'none' || !winner) {
        titleEl.innerText = 'ИГРА ОКОНЧЕНА';
        titleEl.className = 'result-title lose';
        emojiEl.innerText = '❄️';
        subtitleEl.innerText = 'Бой завершён ведущим';
        vibrate(100);
      } else {
        titleEl.innerText = 'ПОРАЖЕНИЕ';
        titleEl.className = 'result-title lose';
        emojiEl.innerText = '💀';
        subtitleEl.innerText = 'В следующий раз повезёт больше!';
        vibrate([200, 100, 200]);
        document.getElementById('main-body').classList.add('animate-shake');
        setTimeout(() => document.getElementById('main-body').classList.remove('animate-shake'), 500);
      }

      showOverlay('result-overlay');
    }

    document.getElementById('result-close-btn').onclick = () => {
      hideOverlay('result-overlay');
      document.getElementById('confetti-container').innerHTML = '';
      currentPower = 30;
      currentAngle = 45;
      updateAngleDisplay();
      updatePowerDisplay();
      document.getElementById('shoot-btn').disabled = true;
    };

    // ============================================================
    // СЕРДЕЧКИ
    // ============================================================
    function renderHearts(lives, alive) {
      if (!alive || lives <= 0) return '💀';
      return '❤️'.repeat(lives);
    }

    // ============================================================
    // КОНФЕТТИ
    // ============================================================
    function launchConfetti() {
      const container = document.getElementById('confetti-container');
      const colors = ['#fbbf24', '#f59e0b', '#22d3ee', '#3b82f6', '#ef4444', '#a855f7', '#22c55e'];
      
      for (let i = 0; i < 60; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + 'vw';
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        c.style.width = (Math.random() * 8 + 6) + 'px';
        c.style.height = (Math.random() * 8 + 6) + 'px';
        c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        c.style.animationDuration = (Math.random() * 2 + 2) + 's';
        c.style.animationDelay = (Math.random() * 0.5) + 's';
        container.appendChild(c);
      }
      
      setTimeout(() => {
        container.innerHTML = '';
      }, 5000);
    }

    // ============================================================
    // СТАРТ
    // ============================================================
    updateAngleDisplay();
    updatePowerDisplay();
  </script>
</body>
</html>
