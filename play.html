<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ENDORPHIN | ПУЛЬТ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
    
    body {
      background: radial-gradient(circle at 50% 0%, #0a2540 0%, #03080f 100%);
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
      user-select: none;
      touch-action: none;
    }

    .glass-panel {
      background: rgba(10, 37, 64, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(127, 227, 255, 0.2);
    }

    /* ============================================================
       НОВАЯ СТРЕЛКА (ПОЛУКРУГ)
       ============================================================ */
    .aim-container {
      position: relative;
      width: 300px;
      height: 150px; /* Полукруг */
      margin: 0 auto;
      overflow: hidden;
    }
    .aim-bg {
      position: absolute;
      inset: 0;
      border-radius: 150px 150px 0 0; /* Верхний полукруг */
      border: 2px dashed rgba(255,255,255,0.2);
      border-bottom: none;
      background: radial-gradient(circle at 50% 100%, transparent 60%, rgba(34, 211, 238, 0.05) 100%);
    }
    .aim-arrow {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 4px;
      height: 130px;
      background: linear-gradient(to top, transparent, #22d3ee);
      transform-origin: bottom center;
      transform: translate(-50%, 0) rotate(0deg);
      transition: transform 0.1s linear;
      border-radius: 4px;
    }
    .aim-arrow::before {
      content: '';
      position: absolute;
      top: -12px;
      left: -10px;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-bottom: 24px solid #22d3ee;
      filter: drop-shadow(0 0 10px #22d3ee);
    }
    .aim-center-dot {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 20px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
      transform: translate(-50%, 50%);
      box-shadow: 0 0 15px #22d3ee;
    }
    
    /* Для синей команды переворачиваем контейнер */
    .aim-container.blue-team {
      transform: scaleX(-1);
    }
    .aim-container.blue-team .aim-arrow {
      /* Стрелка тоже должна смотреть влево (внутри перевернутого контейнера она будет смотреть вправо, но визуально влево) */
      /* Оставляем как есть, так как контейнер перевернут */
    }

    /* ============================================================
       ШКАЛА СИЛЫ
       ============================================================ */
    .power-track {
      position: relative;
      width: 100%;
      height: 32px;
      background: linear-gradient(90deg, #22c55e 0%, #fbbf24 50%, #ef4444 100%);
      border-radius: 16px;
      border: 3px solid rgba(255, 255, 255, 0.4);
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 0 15px rgba(34, 211, 238, 0.3);
      overflow: hidden;
    }
    .power-thumb {
      position: absolute;
      top: 50%;
      left: 10%;
      width: 44px;
      height: 44px;
      background: #ffffff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 25px rgba(255,255,255,0.9), inset 0 0 10px rgba(0,0,0,0.2);
      border: 2px solid #22d3ee;
      transition: left 0.05s linear;
      pointer-events: none;
    }

    /* ============================================================
       КНОПКА БРОСОК
       ============================================================ */
    .shoot-btn {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      font-size: 2rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ef4444, #7f1d1d);
      border: 8px solid rgba(255,255,255,0.2);
      color: #fff;
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.5);
    }
    .shoot-btn:active:not(:disabled) {
      transform: scale(0.95);
      box-shadow: 0 0 50px rgba(239, 68, 68, 0.8);
    }
    .shoot-btn:disabled {
      filter: grayscale(1);
      opacity: 0.3;
      transform: scale(0.9);
      box-shadow: none;
    }

    /* ============================================================
       ОВЕРЛЕЙ ОЖИДАНИЯ
       ============================================================ */
    .disabled-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      backdrop-filter: blur(5px);
      transition: opacity 0.3s ease;
    }

    /* ============================================================
       ИНФО-ПАНЕЛЬ ИГРОКА
       ============================================================ */
    .player-info {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      padding: 10px 20px;
      border-radius: 20px;
      border: 1px solid rgba(127, 227, 255, 0.3);
      text-align: center;
      z-index: 50;
      backdrop-filter: blur(10px);
    }
    .player-info .name {
      font-size: 1.2rem;
      font-weight: 900;
      color: #fff;
    }
    .player-info .lives {
      font-size: 1.5rem;
      margin-top: 5px;
      filter: drop-shadow(0 0 10px #ef4444);
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col relative" id="main-body">

  <!-- ИНФО-ПАНЕЛЬ -->
  <div class="player-info hidden" id="player-info">
    <div class="name" id="info-name">Игрок</div>
    <div class="lives" id="info-lives">❤️❤️❤️</div>
  </div>

  <!-- ЭКРАН ВХОДА -->
  <div id="join-screen" class="flex flex-col items-center justify-center h-full p-6 text-center z-10">
    <div class="glass-panel p-8 rounded-3xl w-full max-w-sm flex flex-col items-center">
      <h1 class="text-3xl font-black text-cyan-300 mb-6 tracking-widest">ВХОД</h1>
      <input type="text" id="input-name" placeholder="ТВОЁ ИМЯ" class="w-full bg-black/50 border-2 border-cyan-500 rounded-xl px-4 py-4 text-center text-xl font-bold mb-6 outline-none focus:border-cyan-400 transition">
      <button id="join-btn" class="w-full py-4 text-white font-black text-xl rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 shadow-lg active:scale-95 transition">ПОДКЛЮЧИТЬСЯ</button>
    </div>
  </div>
  
  <!-- ЭКРАН ИГРЫ -->
  <div id="game-screen" class="hidden w-full h-full flex flex-col items-center justify-center relative z-10">
    
    <!-- Угол (Стрелка 360) -->
    <div class="text-center mb-8">
      <p class="text-cyan-300/80 mb-2 font-bold tracking-[0.2em] text-sm">УГОЛ</p>
      <div class="aim-container" id="angle-container">
        <div class="aim-bg"></div>
        <div class="aim-center-dot"></div>
        <div class="aim-arrow" id="angle-arrow"></div>
      </div>
    </div>

    <!-- Ползунок Силы -->
    <div class="w-4/5 max-w-sm mb-12 glass-panel p-6 rounded-2xl">
      <div class="flex justify-between text-sm font-bold text-white/70 mb-4">
        <span>СИЛА БРОСКА</span>
        <span id="power-display" class="text-white text-lg">10%</span>
      </div>
      <div class="power-track" id="power-track">
        <div class="power-thumb" id="power-thumb"></div>
      </div>
      <p class="text-center text-[10px] text-cyan-300/50 mt-2">ЖМИ БРОСОК, ЧТОБЫ ЗАФИКСИРОВАТЬ СИЛУ</p>
    </div>

    <!-- Кнопка БРОСОК -->
    <button id="shoot-btn" class="shoot-btn" disabled>БРОСОК</button>
  </div>

  <!-- ОВЕРЛЕЙ ОЖИДАНИЯ -->
  <div id="wait-overlay" class="disabled-overlay hidden">
    <h1 class="text-4xl font-black text-white mb-4">ХОД СОПЕРНИКА</h1>
    <p class="text-xl text-gray-400">ЖДИ СВОЕГО ЧАСА...</p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, onDisconnect, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { apiKey: "AIzaSyCXIR5Tv8lB6ivcGRC3yt1SC66MM6T5b_M", authDomain: "endorphin-battle.firebaseapp.com", databaseURL: "https://endorphin-battle-default-rtdb.europe-west1.firebasedatabase.app", projectId: "endorphin-battle", storageBucket: "endorphin-battle.firebasestorage.app", messagingSenderId: "185259733030", appId: "1:185259733030:web:d72a89a436880973e636e7" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const team = urlParams.get('team') || 'red';
    const isRed = team === 'red';
    let playerId = localStorage.getItem('endorphin_playerId') || 'p_' + Math.random().toString(36).substr(2, 9);
    localStorage.setItem('endorphin_playerId', playerId);

    const playerRef = ref(db, `games/battle_1/players/${team}/${playerId}`);
    onDisconnect(playerRef).remove();

    // Вход
    window.joinGame = async () => {
      const name = document.getElementById('input-name').value.trim() || 'Игрок';
      set(playerRef, { name, lives: 3, alive: true });
      document.getElementById('join-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');
      document.getElementById('game-screen').classList.add('flex');
      document.getElementById('player-info').classList.remove('hidden');
      document.getElementById('info-name').innerText = name;
      startPowerAnimation();
    };
    document.getElementById('join-btn').onclick = window.joinGame;

    let isMyTurn = false;
    let currentAngle = 45;
    let currentPower = 10;
    let powerDirection = 1;
    let powerInterval = null;
    let isShooting = false;

    // Анимация ползунка
    function startPowerAnimation() {
      if (powerInterval) clearInterval(powerInterval);
      powerInterval = setInterval(() => {
        if (!isMyTurn || isShooting) return;
        
        currentPower += powerDirection * 2;
        if (currentPower >= 100) { currentPower = 100; powerDirection = -1; }
        if (currentPower <= 10) { currentPower = 10; powerDirection = 1; }
        
        document.getElementById('power-thumb').style.left = currentPower + '%';
        document.getElementById('power-display').innerText = currentPower + '%';
        
        if (currentPower > 80) document.getElementById('power-display').style.color = '#ef4444';
        else if (currentPower > 50) document.getElementById('power-display').style.color = '#fbbf24';
        else document.getElementById('power-display').style.color = '#22c55e';
      }, 30);
    }

    // Логика хода
    onValue(ref(db, 'games/battle_1'), (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      if (data.status === 'playing') {
        document.getElementById('join-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('game-screen').classList.add('flex');
        document.getElementById('player-info').classList.remove('hidden');
        
        isMyTurn = (data.activePlayerId === playerId);
        const btn = document.getElementById('shoot-btn');
        const overlay = document.getElementById('wait-overlay');
        
        if (isMyTurn) {
          btn.disabled = false;
          overlay.classList.add('hidden');
        } else {
          btn.disabled = true;
          overlay.classList.remove('hidden');
        }

        const me = data.players[team]?.[playerId];
        if (me) {
          document.getElementById('info-name').innerText = me.name;
          document.getElementById('info-lives').innerText = '❤️'.repeat(me.lives);
        }
      }
    });

    // ============================================================
    // УГОЛ (ПОЛУКРУГ)
    // ============================================================
    const container = document.getElementById('angle-container');
    const arrow = document.getElementById('angle-arrow');
    
    // Если команда синяя, переворачиваем контейнер (чтобы полукруг был справа)
    if (!isRed) {
      container.classList.add('blue-team');
    }
    
    const handleMove = (e) => {
      if (!isMyTurn || isShooting) return;
      if (e.touches) e.preventDefault();
      
      const rect = container.getBoundingClientRect();
      const clientX = e.clientX || e.touches[0].clientX;
      const clientY = e.clientY || e.touches[0].clientY;
      
      // Для красных (полукруг слева): центр внизу по центру.
      // Вычисляем угол от центра внизу.
      const centerX = rect.left + rect.width / 2;
      const bottomY = rect.bottom;
      
      let rad = Math.atan2(bottomY - clientY, clientX - centerX); // Инвертируем Y, чтобы 0 был справа
      let deg = (rad * 180) / Math.PI;
      
      // Ограничиваем 0..180
      if (isRed) {
        deg = Math.max(0, Math.min(180, deg));
      } else {
        // Для синих контейнер перевернут, поэтому визуально стрелка смотрит влево.
        // Но математика та же, только контейнер отзеркален.
        // Нам нужно, чтобы ползунок двигался в пределах 0..180.
        deg = Math.max(0, Math.min(180, deg));
      }
      
      currentAngle = deg;
      // Внутри контейнера стрелка всегда от 0 до 180
      arrow.style.transform = `translate(-50%, 0) rotate(${deg}deg)`;
    };
    
    container.addEventListener('touchmove', handleMove, { passive: false });
    container.addEventListener('touchstart', handleMove, { passive: false });
    container.addEventListener('mousemove', handleMove);

    // ============================================================
    // ВЫСТРЕЛ
    // ============================================================
    document.getElementById('shoot-btn').onclick = () => {
      if (!isMyTurn || isShooting) return;
      
      isShooting = true;
      const btn = document.getElementById('shoot-btn');
      btn.disabled = true;
      
      const power = currentPower;
      
      // Отправляем в Firebase
      const shotData = { 
        team, 
        shooterId: playerId,
        power: power, 
        angle: currentAngle,
        time: Date.now()
      };
      
      push(ref(db, 'games/battle_1/shots'), shotData);
      set(ref(db, 'games/battle_1/last_shot'), shotData);
      
      // Передача хода
      onValue(ref(db, 'games/battle_1/players'), (snap) => {
        const players = snap.val();
        const myTeamPlayers = Object.entries(players[team] || {}).filter(([id, p]) => p.alive);
        const myIdx = myTeamPlayers.findIndex(([id]) => id === playerId);
        
        let nextPlayer = null;
        if (myIdx !== -1 && myIdx < myTeamPlayers.length - 1) { nextPlayer = myTeamPlayers[myIdx + 1]; } 
        else {
          const enemyTeam = Object.entries(players[isRed ? 'blue' : 'red'] || {}).filter(([id, p]) => p.alive);
          if (enemyTeam.length > 0) nextPlayer = enemyTeam[0];
        }

        if (nextPlayer) {
          update(ref(db, 'games/battle_1'), { activePlayerId: nextPlayer[0], turn: { team: isRed ? 'blue' : 'red', name: nextPlayer[1].name } });
        }
        
        setTimeout(() => {
          isShooting = false;
          if (isMyTurn) btn.disabled = false;
        }, 1500);
      }, { onlyOnce: true });
    };
  </script>
</body>
</html>
