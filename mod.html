<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ENDORPHIN | ПУЛЬТ ВЕДУЩЕГО</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
    body { background: #03080f; color: #fff; font-family: 'Montserrat', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem; }
    .glass { background: rgba(10, 37, 64, 0.8); border: 1px solid rgba(127, 227, 255, 0.3); border-radius: 1.5rem; }
  </style>
</head>
<body>

  <div class="w-full max-w-4xl flex justify-between items-center mb-8">
    <h1 class="text-3xl font-black text-cyan-300 tracking-wider">ПУЛЬТ ВЕДУЩЕГО</h1>
    <a href="index.html" class="px-4 py-2 bg-gray-800 rounded-lg font-bold text-sm hover:bg-gray-700 transition">В МЕНЮ</a>
  </div>

  <div class="glass w-full max-w-4xl p-8 mb-8 flex flex-col items-center">
    <h2 class="text-xl font-bold mb-4 text-cyan-100">1. ВЫБЕРИ РЕЖИМ</h2>
    <div class="flex gap-4">
      <button onclick="setMode('1v1')" class="mode-btn px-8 py-4 rounded-xl border-2 font-bold text-lg" id="btn-1v1">1 на 1</button>
      <button onclick="setMode('2v2')" class="mode-btn px-8 py-4 rounded-xl border-2 font-bold text-lg" id="btn-2v2">2 на 2</button>
      <button onclick="setMode('3v3')" class="mode-btn px-8 py-4 rounded-xl border-2 font-bold text-lg" id="btn-3v3">3 на 3</button>
      <button onclick="setMode('4v4')" class="mode-btn px-8 py-4 rounded-xl border-2 font-bold text-lg" id="btn-4v4">4 на 4</button>
    </div>
  </div>

  <div class="glass w-full max-w-4xl p-8 mb-8">
    <h2 class="text-xl font-bold mb-4 text-cyan-100 text-center">2. КОМАНДЫ</h2>
    <div class="grid grid-cols-2 gap-8">
      <div class="bg-red-900/20 p-6 rounded-xl border border-red-500/30">
        <h3 class="font-bold text-red-400 mb-4 text-center text-xl">КРАСНЫЕ</h3>
        <ul id="list-red" class="space-y-2 text-sm"></ul>
      </div>
      <div class="bg-blue-900/20 p-6 rounded-xl border border-blue-500/30">
        <h3 class="font-bold text-blue-400 mb-4 text-center text-xl">СИНИЕ</h3>
        <ul id="list-blue" class="space-y-2 text-sm"></ul>
      </div>
    </div>
  </div>

  <button id="btn-start" disabled class="w-full max-w-4xl py-8 bg-gradient-to-r from-blue-600 to-cyan-500 rounded-2xl text-3xl font-black text-black shadow-[0_0_40px_rgba(6,182,212,0.6)] disabled:opacity-50 disabled:cursor-not-allowed transition-all">
    НАЧАТЬ БОЙ
  </button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { apiKey: "AIzaSyCXIR5Tv8lB6ivcGRC3yt1SC66MM6T5b_M", authDomain: "endorphin-battle.firebaseapp.com", databaseURL: "https://endorphin-battle-default-rtdb.europe-west1.firebasedatabase.app", projectId: "endorphin-battle", storageBucket: "endorphin-battle.firebasestorage.app", messagingSenderId: "185259733030", appId: "1:185259733030:web:d72a89a436880973e636e7" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const gameId = 'battle_1';
    const gameRef = ref(db, `games/${gameId}`);

    let currentData = null;

    set(gameRef, { status: 'lobby', mode: null, lives: { red: 3, blue: 3 }, players: { red: {}, blue: {} }, ticker: "ДОБРО ПОЖАЛОВАТЬ НА ENDORPHIN!" }).then(() => { setMode('1v1'); });

    window.setMode = (mode) => {
      update(gameRef, { mode });
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('border-cyan-400', 'bg-cyan-900/30', 'text-cyan-300'));
      document.getElementById(`btn-${mode}`).classList.add('border-cyan-400', 'bg-cyan-900/30', 'text-cyan-300');
    };

    onValue(gameRef, (snapshot) => {
      const data = snapshot.val();
      if (!data) return;
      currentData = data;

      if (data.mode) {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('border-cyan-400', 'bg-cyan-900/30', 'text-cyan-300'));
        document.getElementById(`btn-${data.mode}`)?.classList.add('border-cyan-400', 'bg-cyan-900/30', 'text-cyan-300');
      }

      const renderList = (team, listId) => {
        const players = Object.entries(data.players[team] || {});
        document.getElementById(listId).innerHTML = players.map(([id, p]) => `
          <li class="flex justify-between items-center bg-black/40 p-3 rounded-lg border border-white/10">
            <span class="font-bold">👤 ${p.name}</span>
            <button onclick="kickPlayer('${team}', '${id}')" class="text-red-400 hover:text-red-300 font-black px-2 text-lg">✖</button>
          </li>
        `).join('');
      };
      renderList('red', 'list-red');
      renderList('blue', 'list-blue');

      const maxP = parseInt(data.mode?.charAt(0) || 1);
      const redCount = Object.keys(data.players.red || {}).length;
      const blueCount = Object.keys(data.players.blue || {}).length;

      const btn = document.getElementById('btn-start');
      if (redCount >= maxP && blueCount >= maxP && data.status === 'lobby') {
        btn.disabled = false;
        btn.innerText = 'НАЧАТЬ БОЙ';
      } else {
        btn.disabled = true;
        btn.innerText = `ОЖИДАНИЕ (${redCount}/${maxP} vs ${blueCount}/${maxP})`;
      }
    });

    window.kickPlayer = (team, id) => {
      if(confirm('Удалить игрока?')) remove(ref(db, `games/${gameId}/players/${team}/${id}`));
    };

    document.getElementById('btn-start').onclick = () => {
      if (!currentData) return;
      
      const firstTeam = 'red';
      const firstPlayer = Object.values(currentData.players[firstTeam] || {})[0];
      if (!firstPlayer) return alert('Нет игроков в красной команде!');
      
      // Запуск игры
      update(gameRef, { status: 'playing', turn: { team: firstTeam, name: firstPlayer.name }, activePlayerId: Object.keys(currentData.players[firstTeam])[0] });
      
      // Простой отсчет на ТВ (можно расширить)
      let countdown = 3;
      const timerRef = ref(db, `games/${gameId}/timer`);
      set(timerRef, countdown);
      
      const interval = setInterval(() => {
        countdown--;
        if (countdown >= 0) {
          set(timerRef, countdown);
        } else {
          clearInterval(interval);
          set(timerRef, null);
        }
      }, 1000);
    };
  </script>
</body>
</html>
