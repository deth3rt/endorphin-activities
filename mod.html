<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ENDORPHIN | ПУЛЬТ ВЕДУЩЕГО</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
    body { background: radial-gradient(circle at 50% 0%, #0a2540 0%, #03080f 100%); color: #fff; font-family: 'Montserrat', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem; }
    .glass { background: rgba(10, 37, 64, 0.8); border: 1px solid rgba(127, 227, 255, 0.3); border-radius: 1.5rem; backdrop-filter: blur(16px); }
    .mode-btn { transition: all 0.3s ease; }
    .mode-btn.active { border-color: #22d3ee; background: rgba(34, 211, 238, 0.2); color: #22d3ee; box-shadow: 0 0 20px rgba(34, 211, 238, 0.5); }
    .team-btn { transition: all 0.3s ease; }
    .team-btn.active-red { border-color: #ef4444; background: rgba(239, 68, 68, 0.2); color: #ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.5); }
    .team-btn.active-blue { border-color: #3b82f6; background: rgba(59, 130, 246, 0.2); color: #3b82f6; box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
  </style>
</head>
<body>
  <div class="w-full max-w-4xl flex justify-between items-center mb-8">
    <h1 class="text-3xl font-black text-cyan-300 tracking-wider">ПУЛЬТ ВЕДУЩЕГО</h1>
    <a href="index.html" class="px-4 py-2 bg-gray-800 rounded-lg font-bold text-sm hover:bg-gray-700 transition">В МЕНЮ</a>
  </div>

  <div id="lobby-controls" class="w-full flex flex-col items-center">
    <div class="glass w-full max-w-4xl p-8 mb-8 flex flex-col items-center">
      <h2 class="text-xl font-bold mb-4 text-cyan-100">ВЫБЕРИ РЕЖИМ</h2>
      <div class="flex gap-4">
        <button onclick="setMode('1v1')" class="mode-btn px-8 py-4 rounded-xl border-2 font-bold text-lg" id="btn-1v1">1 на 1</button>
        <button onclick="setMode('2v2')" class="mode-btn px-8 py-4 rounded-xl border-2 font-bold text-lg" id="btn-2v2">2 на 2</button>
        <button onclick="setMode('3v3')" class="mode-btn px-8 py-4 rounded-xl border-2 font-bold text-lg" id="btn-3v3">3 на 3</button>
        <button onclick="setMode('4v4')" class="mode-btn px-8 py-4 rounded-xl border-2 font-bold text-lg" id="btn-4v4">4 на 4</button>
      </div>
    </div>

    <div class="glass w-full max-w-4xl p-8 mb-8">
      <h2 class="text-xl font-bold mb-4 text-cyan-100 text-center">КОМАНДЫ</h2>
      <div class="grid grid-cols-2 gap-8">
        <div class="bg-red-900/20 p-6 rounded-xl border border-red-500/30">
          <h3 class="font-bold text-red-400 mb-4 text-center text-xl">КРАСНЫЕ</h3>
          <ul id="list-red" class="space-y-2 text-sm"></ul>
        </div>
        <div class="bg-blue-900/20 p-6 rounded-xl border border-blue-500/30">
          <h3 class="font-bold text-blue-400 mb-4 text-center text-xl">СИНИЕ</h3>
          <ul id="list-blue" class="space-y-2 text-sm"></ul>
        </div>
      </div>
    </div>

    <!-- ВЫБОР ПЕРВОЙ КОМАНДЫ -->
    <div class="glass w-full max-w-4xl p-8 mb-8">
      <h2 class="text-xl font-bold mb-4 text-cyan-100 text-center">КАКАЯ КОМАНДА НАЧИНАЕТ?</h2>
      <div class="flex justify-center gap-6">
        <button onclick="setFirstTeam('red')" class="team-btn px-12 py-4 rounded-xl border-2 font-bold text-xl" id="btn-first-red">КРАСНЫЕ</button>
        <button onclick="setFirstTeam('blue')" class="team-btn px-12 py-4 rounded-xl border-2 font-bold text-xl" id="btn-first-blue">СИНИЕ</button>
      </div>
    </div>

    <button id="btn-start" disabled class="w-full max-w-4xl py-8 bg-gradient-to-r from-blue-600 to-cyan-500 rounded-2xl text-3xl font-black text-black shadow-[0_0_40px_rgba(6,182,212,0.6)] disabled:opacity-50 disabled:cursor-not-allowed transition-all">
      НАЧАТЬ БОЙ
    </button>
  </div>

  <div id="game-controls" class="hidden w-full max-w-4xl flex-col items-center">
    <div class="glass w-full p-8 mb-8 text-center border-green-500/50">
      <h2 class="text-4xl font-black text-green-400 mb-4 animate-pulse">ИГРА ИДЕТ</h2>
      <div class="text-2xl font-bold mb-8" id="mod-turn-info">ХОД: ...</div>
      <div class="grid grid-cols-2 gap-4">
        <div class="bg-red-900/20 p-6 rounded-xl border border-red-500/30 text-red-400 font-bold text-2xl" id="mod-hp-red">КРАСНЫЕ: 3</div>
        <div class="bg-blue-900/20 p-6 rounded-xl border border-blue-500/30 text-blue-400 font-bold text-2xl" id="mod-hp-blue">СИНИЕ: 3</div>
      </div>
    </div>
    <button onclick="endGame()" class="w-full py-6 bg-red-600 rounded-xl font-black text-xl hover:bg-red-500 transition">ЗАКОНЧИТЬ БОЙ</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    const firebaseConfig = { apiKey: "AIzaSyCXIR5Tv8lB6ivcGRC3yt1SC66MM6T5b_M", authDomain: "endorphin-battle.firebaseapp.com", databaseURL: "https://endorphin-battle-default-rtdb.europe-west1.firebasedatabase.app", projectId: "endorphin-battle", storageBucket: "endorphin-battle.firebasestorage.app", messagingSenderId: "185259733030", appId: "1:185259733030:web:d72a89a436880973e636e7" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const gameRef = ref(db, 'games/battle_1');

    let currentData = null;
    let timerInterval = null;
    let firstTeam = 'red'; // По умолчанию красные

    set(gameRef, { status: 'lobby', mode: null, lives: { red: 3, blue: 3 }, players: { red: {}, blue: {} }, firstTeam: 'red' }).then(() => { setMode('1v1'); });

    window.setMode = (mode) => { if(currentData?.status === 'playing') return; update(gameRef, { mode }); };

    // Выбор первой команды
    window.setFirstTeam = (team) => {
      firstTeam = team;
      update(gameRef, { firstTeam: team });
      
      document.getElementById('btn-first-red').classList.toggle('active-red', team === 'red');
      document.getElementById('btn-first-blue').classList.toggle('active-blue', team === 'blue');
    };

    onValue(gameRef, (snapshot) => {
      const data = snapshot.val();
      if (!data) return;
      currentData = data;

      if (data.firstTeam) {
        firstTeam = data.firstTeam;
        document.getElementById('btn-first-red').classList.toggle('active-red', firstTeam === 'red');
        document.getElementById('btn-first-blue').classList.toggle('active-blue', firstTeam === 'blue');
      }

      if (data.status === 'playing') {
        document.getElementById('lobby-controls').classList.add('hidden');
        document.getElementById('game-controls').classList.remove('hidden');
        document.getElementById('game-controls').classList.add('flex');
        if (data.turn) document.getElementById('mod-turn-info').innerText = `ХОД: ${data.turn.name.toUpperCase()}`;
        document.getElementById('mod-hp-red').innerText = `КРАСНЫЕ: ${data.lives.red}`;
        document.getElementById('mod-hp-blue').innerText = `СИНИЕ: ${data.lives.blue}`;
      } else {
        document.getElementById('lobby-controls').classList.remove('hidden');
        document.getElementById('game-controls').classList.add('hidden');
      }

      if (data.mode) {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${data.mode}`)?.classList.add('active');
      }

      const renderList = (team, listId) => {
        const players = Object.entries(data.players[team] || {});
        document.getElementById(listId).innerHTML = players.map(([id, p]) => `
          <li class="flex justify-between items-center bg-black/40 p-3 rounded-lg border border-white/10">
            <span class="font-bold">👤 ${p.name} (❤️${p.lives})</span>
            ${data.status === 'lobby' ? `<button onclick="kickPlayer('${team}', '${id}')" class="text-red-400 hover:text-red-300 font-black px-2 text-lg">✖</button>` : ''}
          </li>
        `).join('');
      };
      renderList('red', 'list-red'); renderList('blue', 'list-blue');

      const maxP = parseInt(data.mode?.charAt(0) || 1);
      const redCount = Object.keys(data.players.red || {}).length;
      const blueCount = Object.keys(data.players.blue || {}).length;

      const btn = document.getElementById('btn-start');
      if (redCount >= maxP && blueCount >= maxP && data.status === 'lobby') { btn.disabled = false; btn.innerText = 'НАЧАТЬ БОЙ'; } 
      else if (data.status === 'lobby') { btn.disabled = true; btn.innerText = `ОЖИДАНИЕ (${redCount}/${maxP} vs ${blueCount}/${maxP})`; }
    });

    window.kickPlayer = (team, id) => { if(confirm('Кикнуть игрока?')) remove(ref(db, `games/battle_1/players/${team}/${id}`)); };
    window.endGame = () => { update(gameRef, { status: 'finished', winner: 'none' }); };

    // ============================================================
    // СТАРТ ИГРЫ (с генерацией координат)
    // ============================================================
    document.getElementById('btn-start').onclick = () => {
      if (!currentData) return;
      
      // Генерируем координаты для каждого игрока на его базе
      const playersRed = currentData.players.red || {};
      const playersBlue = currentData.players.blue || {};
      
      // Красные (слева): X от 5% до 20%, Y от 20% до 80%
      const redKeys = Object.keys(playersRed);
      redKeys.forEach((id, index) => {
        const posX = 5 + Math.random() * 15; // 5-20%
        const posY = 20 + (index * 60 / Math.max(1, redKeys.length)) + Math.random() * 10; // Распределяем по Y
        update(ref(db, `games/battle_1/players/red/${id}`), { posX, posY });
      });

      // Синие (справа): X от 80% до 95%, Y от 20% до 80%
      const blueKeys = Object.keys(playersBlue);
      blueKeys.forEach((id, index) => {
        const posX = 80 + Math.random() * 15; // 80-95%
        const posY = 20 + (index * 60 / Math.max(1, blueKeys.length)) + Math.random() * 10;
        update(ref(db, `games/battle_1/players/blue/${id}`), { posX, posY });
      });

      // Определяем первого игрока
      const firstTeamPlayers = firstTeam === 'red' ? playersRed : playersBlue;
      const firstPlayerEntry = Object.entries(firstTeamPlayers)[0];
      if (!firstPlayerEntry) return alert('Нет игроков в выбранной команде!');

      // Обновляем статус игры
      update(gameRef, { 
        status: 'playing', 
        turn: { team: firstTeam, name: firstPlayerEntry[1].name }, 
        activePlayerId: firstPlayerEntry[0],
        timer: 3 
      });
      
      // Обратный отсчёт
      let countdown = 3;
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        countdown--;
        update(gameRef, { timer: countdown });
        if (countdown <= 0) { 
          clearInterval(timerInterval); 
          update(gameRef, { timer: null }); // Убираем цифру
        }
      }, 1000);
    };
  </script>
</body>
</html>
